# Generated from xtask::workflows::studio_architect (xtask/workflows/src/studio_architect.rs)
# Rebuild with `just workflows`; do not edit by hand (`just workflows-check` fails CI on drift).
# The reasons for every job and step are comments in that Rust source.
name: studio-architect
on:
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v26.11.0) for publish; any branch or sha for build-only
        required: true
        type: string
      mode:
        description: 'publish: attach to the tag''s Release. build-only: build, no Release.'
        required: false
        type: choice
        options:
        - publish
        - build-only
        default: publish
permissions:
  contents: read
concurrency:
  group: studio-architect-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  MODE: ${{ inputs.mode || 'publish' }}
jobs:
  resolve:
    name: Resolve the tag
    if: ${{ github.repository == 'FastTrackStudios/studio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version || steps.ref.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha || steps.ref.outputs.sha }}
    steps:
    - name: The tag is vX.Y.Z
      if: ${{ env.MODE != 'build-only' }}
      run: |
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::'$TAG' is not a release tag (^v[0-9]+\.[0-9]+\.[0-9]+$): installers are attached only to the studio release tag"
          exit 1
        fi
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.MODE == 'build-only' && env.TAG || format('refs/tags/{0}', env.TAG) }}
        fetch-depth: 0
    - name: Stamp the release version from the tag
      if: ${{ env.MODE != 'build-only' }}
      env:
        STAMP_TAG: ${{ env.TAG }}
      run: |
        set -euo pipefail
        if grep -q '^    stamp)' scripts/release.sh; then
          bash scripts/release.sh stamp "$STAMP_TAG"
        else
          echo "$STAMP_TAG predates the stamp: its commit carries its version ($(bash scripts/release.sh version))"
        fi
    - name: Version = tag version, on main or release/v*, CI passed
      id: resolve
      if: ${{ env.MODE != 'build-only' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash scripts/release.sh ios-resolve studio "$TAG"
    - name: Build-only ref
      id: ref
      if: ${{ env.MODE == 'build-only' }}
      run: |
        set -euo pipefail
        sha="$(git rev-parse HEAD)"
        git fetch -q origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/v*:refs/remotes/origin/release/v*'
        if [ -z "$(git branch -r --contains "$sha" --format='%(refname:short)' | grep -E '^origin/(main|release/v.*)$' || true)" ]; then
          echo "::error::build-only: $sha is on neither main nor a release/v* line: refused (the release runners build only reviewed commits)"
          exit 1
        fi
        echo "version=$(bash scripts/release.sh version)" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - name: A GitHub Release exists for the tag
      if: ${{ env.MODE == 'publish' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash scripts/release.sh ios-release "$TAG"
    - name: Summary
      env:
        VERSION: ${{ steps.resolve.outputs.version || steps.ref.outputs.version }}
        SHA: ${{ steps.resolve.outputs.sha || steps.ref.outputs.sha }}
      run: |
        {
          echo "### Studio desktop installers: $TAG ($MODE)"
          echo "- version: \`$VERSION\`"
          echo "- commit: \`${SHA:0:12}\`"
          if [ "$MODE" = validate ]; then echo "- **validate**: stopped before any build"; fi
          if [ "$MODE" = build-only ]; then echo "- **build-only**: nothing will be attached to a Release"; fi
        } >> "$GITHUB_STEP_SUMMARY"
  build:
    name: Node + web bundle (x86_64 Linux)
    needs: resolve
    if: ${{ inputs.mode != 'validate' }}
    runs-on:
    - self-hosted
    - thebattleship-release
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.resolve.outputs.sha }}
    - name: Shared runner tools
      uses: ./.github/actions/shared-tools
    - name: Stamp the release version from the tag
      if: ${{ env.MODE != 'build-only' }}
      env:
        STAMP_TAG: ${{ env.TAG }}
      run: |
        set -euo pipefail
        if grep -q '^    stamp)' scripts/release.sh; then
          bash scripts/release.sh stamp "$STAMP_TAG"
        else
          echo "$STAMP_TAG predates the stamp: its commit carries its version ($(bash scripts/release.sh version))"
        fi
    - name: Own target dir, size-capped
      run: |
        base="${CI_CACHE_DIR:?not a shared runner (no CI_CACHE_DIR)}"
        dir="$base/studio-architect/$RUNNER_NAME/target"
        cap_gb="${TARGET_CAP_GB-120}"
        mkdir -p "$dir"
        used_gb="$(du -s --block-size=1G "$dir" | cut -f1)"
        free_gb="$(df -BG --output=avail "$base" | tail -1 | tr -dc '0-9')"
        echo "target dir: $dir (${used_gb} GB used, cap ${cap_gb} GB; ${free_gb} GB free on its disk)"
        if [ "$used_gb" -gt "$cap_gb" ]; then
          echo "::warning::$dir is ${used_gb} GB, over the ${cap_gb} GB cap: emptying it (cold build)"
          rm -rf "$dir"; mkdir -p "$dir"
        fi
        if [ "$free_gb" -lt 60 ]; then
          echo "::error::under 60 GB free on the runner's disk ($base): clean it before building"
          exit 1
        fi
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
        echo "STUDIO_ARCHITECT_CACHE=$base/studio-architect/$RUNNER_NAME" >> "$GITHUB_ENV"
    - name: Studio's island (wasm32-wasip2, node >= 26)
      run: |
        set -euo pipefail
        # The wasi profile's shell expands these, not this one.
        # shellcheck disable=SC2016
        devenv --profile wasi shell -- bash -c '
          test -d "$(rustc --print sysroot)/lib/rustlib/wasm32-wasip2" || { echo "::error::no wasm32-wasip2 target in the wasi profile"; exit 1; }
          node -e "process.exit(Number(process.versions.node.split(\".\")[0]) >= 26 ? 0 : 1)" || { echo "::error::node $(node --version) is older than 26"; exit 1; }
          echo "rustc $(rustc --version), node $(node --version)"
        '
        devenv shell -- just island
    - name: Build the node and the web bundle
      run: |
        set -euo pipefail
        name="${TAG//\//-}"
        out="$RUNNER_TEMP/studio-architect"
        rm -rf "$out"
        devenv shell -- bash scripts/studio-architect.sh release "$name" "$out"
    - name: What the node links (DT_NEEDED), smoke test
      run: |
        set -euo pipefail
        name="${TAG//\//-}"
        out="$RUNNER_TEMP/studio-architect"
        tmp="$(mktemp -d)"
        tar -C "$tmp" -xzf "$out/studio-architect-node-$name-x86_64-linux.tar.gz"
        bin="$tmp/studio-architect-node-$name-x86_64-linux/studio-architect"
        "$bin" serve --help > /dev/null
        "$bin" distribution > "$tmp/distribution.json"
        island="$tmp/studio-architect-node-$name-x86_64-linux/studio-island"
        test -f "$island/architect.lock.json"
        test "$(cat "$island/BUILT_FROM")" = "$(git describe --always --dirty --abbrev=40)"
        python3 -c 'import json,sys; sys.exit(0 if "island.css" in json.load(open(sys.argv[1]))["files"] else "island.css is not in the lock")' "$island/architect.lock.json"
        {
          echo "### Studio Architect $TAG"
          echo '```'
          ls -l "$out"
          echo '```'
          echo "DT_NEEDED of \`studio-architect\`:"
          echo '```'
          readelf -d "$bin" | grep NEEDED || true
          echo "interpreter: $(readelf -l "$bin" | sed -n 's/.*Requesting program interpreter: \(.*\)]/\1/p')"
          echo '```'
          echo "compiled in: $(python3 -c 'import json,sys; print(", ".join(e["id"] for e in json.load(open(sys.argv[1]))["extensions"]))' "$tmp/distribution.json")"
        } >> "$GITHUB_STEP_SUMMARY"
        rm -rf "$tmp"
    - name: Bound the target dirs
      if: always()
      run: |
        cache="${STUDIO_ARCHITECT_CACHE:-}"
        [ -n "$cache" ] && [ -d "$cache" ] || exit 0
        used_gb="$(du -s --block-size=1G "$cache" | cut -f1)"
        if [ "$used_gb" -gt 120 ]; then
          echo "::warning::$cache is ${used_gb} GB after the build: dropping incremental/"
          rm -rf "$cache"/target/*/incremental "$cache"/architect-target/*/incremental
        fi
        echo "cache after: $(du -sh "$cache" | cut -f1)"
    - name: Keep the tarballs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: studio-architect
        path: |
          ${{ runner.temp }}/studio-architect/*.tar.gz*
        if-no-files-found: error
        retention-days: 14
  publish:
    name: Attach to the GitHub Release
    needs:
    - resolve
    - build
    if: ${{ inputs.mode != 'build-only' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      digests: ${{ steps.attach.outputs.digests }}
    steps:
    - name: The tarballs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: studio-architect
        path: dist
    - name: Verify, then attach to the one Release
      id: attach
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd dist
        ls -l
        files=("studio-architect-node-$TAG-x86_64-linux.tar.gz" "studio-architect-web-$TAG.tar.gz")
        for f in "${files[@]}"; do
          test -f "$f"
          sha256sum -c "$f.sha256"
        done
        gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.tar.gz ./*.tar.gz.sha256
        for f in "${files[@]}"; do
          want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
          # The Release is a draft until `sums` publishes it: find it in the list.
          got="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | select(.name == \"$f\") | .digest")"
          [ "$got" = "$want" ] || { echo "::error::$f: GitHub's digest is '$got', the file is $want"; exit 1; }
        done
        # What `sums` may sign for this workflow: exactly these files (and their sidecars).
        { echo "digests<<EOF"; sha256sum ./*.tar.gz ./*.tar.gz.sha256 | sed 's|  \./|  |'; echo "EOF"; } >> "$GITHUB_OUTPUT"
        {
          echo "### Attached to $TAG"
          for f in "${files[@]}"; do echo "- \`$f\` ($(du -h "$f" | cut -f1))"; done
        } >> "$GITHUB_STEP_SUMMARY"
  sums:
    name: SHA256SUMS (signed)
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.mode != 'build-only' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-sums-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    environment: release-signing
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: refs/tags/${{ inputs.tag || github.ref_name }}
        fetch-depth: 0
        persist-credentials: false
    - name: minisign (pinned)
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/minisign.tgz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
        echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/minisign.tgz" -C "$RUNNER_TEMP" --warning=no-unknown-keyword minisign-linux/x86_64/minisign
        echo "$RUNNER_TEMP/minisign-linux/x86_64" >> "$GITHUB_PATH"
    - name: Sum what this workflow built (and the signed sums), sign, publish
      env:
        GH_TOKEN: ${{ github.token }}
        ORG_RELEASE_KEY: RWRh9Gk9qaStQMhku4THMidEYrQsmAEsm2dDprUkZxShEtqfIcroM8Od
        SIGNED: 'true'
        OWN: ${{ needs.publish.outputs.digests }}
        MINISIGN_KEY: ${{ secrets.FTS_RELEASE_MINISIGN_KEY }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/sums"
        rm -rf "$dir" && mkdir -p "$dir"
        printf '%s\n' "$OWN" | sed 's/^[[:space:]]*//; /^$/d' > "$dir/own"
        # release-facts.json as the tag says it must be.
        bash scripts/release.sh facts "$TAG" > "$dir/release-facts.json"
        facts_sha="$(sha256sum < "$dir/release-facts.json" | cut -d' ' -f1)"
        printf '%s  release-facts.json\n' "$facts_sha" >> "$dir/own"
        id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | sort -n | head -1)"
        [ -n "$id" ] || { echo "::error::no release for $TAG (release.yml's publish job creates it)"; exit 1; }
        assets() { gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --jq '[.[] | {name, digest}]'; }
        assets > "$dir/assets.json"
        # Never over a signed release from a branch run: it would replace the signed
        # sums with this workflow's alone and drop the signature. Re-run a tag with
        # `gh workflow run <workflow> --ref vX.Y.Z` (a tag ref: the signed path).
        if [ "$SIGNED" != true ] && jq -e 'map(.name) | index("SHA256SUMS.minisig")' "$dir/assets.json" >/dev/null; then
          echo "::error::$TAG already has a signed SHA256SUMS: an unsigned (branch) run must not touch it; dispatch with --ref $TAG"
          exit 1
        fi
        # The facts on the release: put them there when the release job's upload
        # did not make it (re-running the release job cannot), refuse other ones.
        have="$(jq -r '.[] | select(.name == "release-facts.json") | .digest // ""' "$dir/assets.json")"
        if [ -z "$have" ]; then
          for _ in 1 2 3; do gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$dir/release-facts.json" && break; sleep 5; done
          assets > "$dir/assets.json"
        elif [ "$have" != "sha256:$facts_sha" ]; then
          echo "::error::release-facts.json on $TAG is $have, the tag says sha256:$facts_sha: refusing"
          exit 1
        fi
        # The workflows that signed before: trusted only through their signature.
        prev=/dev/null
        if jq -e 'map(.name) | index("SHA256SUMS")' "$dir/assets.json" >/dev/null; then
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir/prev" -p SHA256SUMS -p SHA256SUMS.minisig
          if [ "$SIGNED" = true ]; then
            sig="$dir/prev/SHA256SUMS.minisig"
            if [ ! -f "$sig" ] || [ "$(wc -l < "$sig")" -ne 4 ] \
               || [ "$(sed -n 3p "$sig")" != "trusted comment: studio $TAG SHA256SUMS" ] \
               || ! minisign -V -q -P "$ORG_RELEASE_KEY" -m "$dir/prev/SHA256SUMS" -x "$sig" >/dev/null; then
              echo "::error::the SHA256SUMS on the $TAG release does not verify with the org key for this tag: refusing to build on it"
              exit 1
            fi
            prev="$dir/prev/SHA256SUMS"
          fi
        fi
        bash scripts/release-sums.sh plan "$dir/own" "$dir/assets.json" "$prev" > "$dir/SHA256SUMS"
        cat "$dir/SHA256SUMS"
        upload=("$dir/SHA256SUMS")
        if [ -n "${MINISIGN_KEY:-}" ]; then
          key="$RUNNER_TEMP/release.key"
          ( umask 077; printf '%s\n' "$MINISIGN_KEY" > "$key" )
          minisign -S -s "$key" -m "$dir/SHA256SUMS" -x "$dir/SHA256SUMS.minisig" -t "studio $TAG SHA256SUMS"
          rm -f "$key"
          minisign -V -P "$ORG_RELEASE_KEY" -m "$dir/SHA256SUMS" -x "$dir/SHA256SUMS.minisig"
          upload+=("$dir/SHA256SUMS.minisig")
        elif [ "$SIGNED" = true ]; then
          echo "::warning::release-signing has no FTS_RELEASE_MINISIGN_KEY: SHA256SUMS goes out unsigned"
        fi
        gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${upload[@]}"
        if [ "${#upload[@]}" = 1 ] && jq -e 'map(.name) | index("SHA256SUMS.minisig")' "$dir/assets.json" >/dev/null; then
          gh release delete-asset "$TAG" SHA256SUMS.minisig --repo "$GITHUB_REPOSITORY" --yes
        fi
        # Nothing moved while signing; then publish (a signed run only): ONLY a
        # draft, and Latest only for the highest stable tag (scripts/release-publish.sh).
        assets > "$dir/assets.json"
        bash scripts/release-sums.sh plan "$dir/own" "$dir/assets.json" "$prev" > /dev/null
        if [ "$SIGNED" = true ] && [ "${#upload[@]}" = 2 ]; then
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .draft)"
          highest="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          case "$(bash scripts/release-publish.sh decide "$draft" "$TAG" "$highest")" in
            publish-latest) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest ;;
            publish) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false ;;
            leave) echo "$TAG is published already: Latest left where it is" ;;
          esac
        fi
        {
          echo "### SHA256SUMS of $TAG ($(wc -l < "$dir/SHA256SUMS") assets$( [ "${#upload[@]}" = 2 ] && echo ', signed, published'))"
          echo '```'
          cat "$dir/SHA256SUMS"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
  sums-unsigned:
    name: SHA256SUMS (unsigned)
    needs: publish
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.mode != 'build-only' && needs.publish.result == 'success' }}
