          minisign -S -s "$key" -m "$dir/SHA256SUMS" -x "$dir/SHA256SUMS.minisig" -t "studio $TAG SHA256SUMS"
          rm -f "$key"
          minisign -V -P "$ORG_RELEASE_KEY" -m "$dir/SHA256SUMS" -x "$dir/SHA256SUMS.minisig"
