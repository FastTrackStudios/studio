# Desktop installers — build Signal and Session for macOS (a signed, notarized
# .dmg each) and Linux (an AppImage each) and attach all four to the ONE
# GitHub Release of the studio tag `vX.Y.Z`. The same tag starts `signal-ios`
# and `session-ios` (TestFlight); a release is these three workflows on one tag
# (docs/agents/release-workflow.md, "Desktop installers").
#
#   main --release PR--> `just release-tag` pushes vX.Y.Z --> this workflow,
#   signal-ios, session-ios, deploy and the release publish all start on the
#   tag --> resolve (hosted: tag shape, both app crates' version == tag
#   version, changelog section, commit in main, Release exists) --> macos
#   (airlock) and linux (THEBATTLESHIP) build in parallel, upload the files
#   as workflow artifacts --> publish (hosted) attaches them to the Release.
#
# The signing identity and the notarization key never leave their machines:
# macos runs on the org-level self-hosted runner `airlock`, whose build
# keychain holds the Developer ID Application identity and whose
# ~/.appstoreconnect holds the App Store Connect key notarytool uses, so this
# workflow reads no GitHub secret. The jobs that touch them have a READ-ONLY
# token: only the hosted `publish` job can write to the Release.
#
# Triggers: a tag push (`just release-tag`, pushed as the fts-forge App or a
# person: a tag pushed with GITHUB_TOKEN starts no workflow), and
# workflow_dispatch with the tag (a re-run). Never a pull_request, so no fork
# or PR reaches the runners.
#
# workflow_dispatch `mode`:
#   publish     (default) the above.
#   validate    resolve only: the tag is a sound release, nothing is built.
#   build-only  build, sign, notarize and smoke-test every installer from ANY
#               ref (a branch, a sha) and keep them as workflow artifacts; the
#               Release is not touched. How a change to the installer scripts
#               is proven before there is a tag.

name: desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0) for publish/validate; any branch or sha for build-only"
        required: true
        type: string
      mode:
        description: "publish: attach to the tag's Release. validate: resolve only. build-only: build + notarize + smoke-test, no Release."
        required: false
        type: choice
        options: [publish, validate, build-only]
        default: publish

permissions:
  contents: read

# Per tag: a re-run of the same tag queues behind the first instead of
# cancelling it (artifacts and uploads are idempotent).
concurrency:
  group: desktop-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  MODE: ${{ inputs.mode || 'publish' }}

jobs:
  resolve:
    name: Resolve the tag
    # Never a fork: its tag is not this repo's release.
    if: ${{ github.repository == 'FastTrackStudios/studio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The GitHub Release is created here when the tag has none yet.
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version || steps.ref.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha || steps.ref.outputs.sha }}
    steps:
      - name: The tag is vX.Y.Z
        if: ${{ env.MODE != 'build-only' }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (^v[0-9]+\.[0-9]+\.[0-9]+$): installers are attached only to the studio release tag"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MODE == 'build-only' && env.TAG || format('refs/tags/{0}', env.TAG) }}
          fetch-depth: 0
      # The same checks TestFlight makes, for both apps: each app crate's
      # version is the tag's, the workspace's is, the changelog has the
      # section, and the commit is in main.
      - name: Both apps' version = tag version, tag in main, changelog section
        id: resolve
        if: ${{ env.MODE != 'build-only' }}
        run: |
          bash scripts/release.sh ios-resolve signal "$TAG"
          bash scripts/release.sh ios-resolve session "$TAG"
      - name: Build-only ref
        id: ref
        if: ${{ env.MODE == 'build-only' }}
        run: |
          echo "version=$(bash scripts/release.sh version)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: A GitHub Release exists for the tag
        if: ${{ env.MODE == 'publish' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh ios-release "$TAG"
      - name: Summary
        env:
          VERSION: ${{ steps.resolve.outputs.version || steps.ref.outputs.version }}
          SHA: ${{ steps.resolve.outputs.sha || steps.ref.outputs.sha }}
        run: |
          {
            echo "### Desktop installers: $TAG ($MODE)"
            echo "- version: \`$VERSION\` (Signal and Session alike)"
            echo "- commit: \`${SHA:0:12}\`"
            if [ "$MODE" = validate ]; then echo "- **validate**: stopped before any build"; fi
            if [ "$MODE" = build-only ]; then echo "- **build-only**: nothing will be attached to a Release"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS .dmg (Signal, Session)
    needs: resolve
    if: ${{ inputs.mode != 'validate' }}
    runs-on: [self-hosted, macos, airlock]
    # A missing runner becomes a red X within the time limit, not a job that
    # waits for hours and is cancelled.
    timeout-minutes: 150
    steps:
      - name: Preflight — build volume mounted, space free
        run: |
          if [ ! -d /Volumes/build-disk ]; then
            echo "ERROR: /Volumes/build-disk is not mounted on this runner." >&2
            exit 1
          fi
          df -h /Volumes/build-disk | tail -1
          avail_kb="$(df -k /Volumes/build-disk | awk 'NR==2 {print $4}')"
          if [ "$avail_kb" -lt $((50 * 1024 * 1024)) ]; then
            echo "ERROR: under 50 GB free on /Volumes/build-disk: sweep target/ before building" >&2
            exit 1
          fi
      # The commit `resolve` checked. clean:false keeps target/ between runs
      # so cargo builds incrementally (one shared target dir on airlock).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          clean: false
      # The guitar rig's release build refuses to compile without its captures
      # (features/rigs/guitar/build.rs); airlock keeps one clone of rig-models.
      - name: Rig captures (rig-models) linked into the tree
        run: bash scripts/ci/link-rig-models.sh /Volumes/build-disk/development/rig-models
      - name: Build, sign, notarize, staple
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          export NIX=/nix/var/nix/profiles/default/bin/nix
          BUILD_NO="$(date +%s)"
          export BUILD_NO
          rm -rf target/desktop
          for app in signal session; do
            bash scripts/desktop/macos.sh "$app"
          done
          ls -l target/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            target/desktop/*.dmg
            target/desktop/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Target dir size
        if: always()
        run: du -sh target || true
      - name: Summary
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### macOS installers: $TAG"
            echo "version \`$VERSION\`, $RESULT."
            for f in target/desktop/*.dmg; do [ -f "$f" ] && echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"; done
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux AppImage (Signal, Session)
    needs: resolve
    if: ${{ inputs.mode != 'validate' }}
    runs-on: [self-hosted, session]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      # Its OWN target dir, on the runner's big disk beside checks' (a
      # release-profile build has different fingerprints and must not churn
      # the check suite's cache), with a size cap: the studio target once
      # hit 800 GB. Over the cap before the build it is emptied (a cold
      # build); over it after, only `incremental/` is dropped.
      - name: Own target dir, size-capped
        run: |
          base="${CI_CACHE_DIR:-${CACHE_DIRECTORY:-$HOME/.cache}}"
          dir="$base/cargo-target-desktop"
          cap_gb="${TARGET_CAP_GB:-150}"
          mkdir -p "$dir"
          used_gb="$(du -s --block-size=1G "$dir" | cut -f1)"
          free_gb="$(df -BG --output=avail "$base" | tail -1 | tr -dc '0-9')"
          echo "target dir: $dir (${used_gb} GB used, cap ${cap_gb} GB; ${free_gb} GB free on its disk)"
          if [ "$used_gb" -gt "$cap_gb" ]; then
            echo "::warning::$dir is ${used_gb} GB, over the ${cap_gb} GB cap: emptying it (cold build)"
            rm -rf "$dir"; mkdir -p "$dir"
          fi
          if [ "$free_gb" -lt 100 ]; then
            echo "::error::under 100 GB free on the runner's disk ($base): clean it before building"
            exit 1
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "TARGET_CAP_GB=$cap_gb" >> "$GITHUB_ENV"
      # The guitar rig's release build refuses to compile without its captures
      # (features/rigs/guitar/build.rs); THEBATTLESHIP keeps one clone of
      # rig-models for CI beside the runners' work dirs.
      - name: Rig captures (rig-models) linked into the tree
        run: bash scripts/ci/link-rig-models.sh /run/media/Development/ci-assets/rig-models
      - name: Build both AppImages
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf target/desktop
          for app in signal session; do
            bash scripts/desktop/linux.sh "$app"
          done
          ls -l target/desktop
      # --version with no display: the claim is that the file starts on a
      # machine that has not got the app's libraries. appimage-run is the
      # FHS sandbox NixOS has for exactly this.
      - name: Smoke test, headless
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          export PATH="$PATH:/run/current-system/sw/bin"
          for app in signal session; do
            case "$app" in signal) t=Signal ;; session) t=Session ;; esac
            bash scripts/desktop/linux-smoke.sh "target/desktop/$t-$VERSION-linux-x86_64.AppImage" "$app" "$VERSION"
          done
      - name: Bound the target dir
        if: always()
        run: |
          dir="${CARGO_TARGET_DIR:-}"
          [ -n "$dir" ] && [ -d "$dir" ] || exit 0
          used_gb="$(du -s --block-size=1G "$dir" | cut -f1)"
          if [ "$used_gb" -gt "${TARGET_CAP_GB:-150}" ]; then
            echo "::warning::$dir is ${used_gb} GB after the build: dropping incremental/"
            rm -rf "$dir"/*/incremental
          fi
          echo "target dir after: $(du -sh "$dir" | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            target/desktop/*.AppImage
            target/desktop/*.AppImage.sha256
            target/desktop/*-glibc-floor.txt
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Linux installers: $TAG"
            echo "version \`$VERSION\`, $RESULT."
            for f in target/desktop/*.AppImage; do [ -f "$f" ] && echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"; done
            for f in target/desktop/*-glibc-floor.txt; do [ -f "$f" ] && echo "- $(basename "$f" -glibc-floor.txt) needs glibc >= $(cat "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Attach to the GitHub Release
    needs: [resolve, macos, linux]
    if: ${{ inputs.mode != 'validate' && inputs.mode != 'build-only' && needs.macos.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The only job with a write token. The jobs that held the signing
      # identity ran with a read-only one.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Verify, then attach to the one Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd installers
          ls -l
          # Exactly the four installers, named with the release's version.
          for t in Signal Session; do
            test -f "$t-$VERSION-macos-arm64.dmg"
            test -f "$t-$VERSION-linux-x86_64.AppImage"
          done
          for f in *.sha256; do sha256sum -c "$f"; done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            ./*.dmg ./*.AppImage ./*.sha256
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
          {
            echo "### Attached to $TAG"
            # shellcheck disable=SC2016 # the backticks are markdown, for jq's output
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "- `\(.name)` (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"
