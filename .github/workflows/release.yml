name: release
on:
  pull_request:
    branches:
    - main
    - release/**
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  push:
    tags:
    - v*
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  guard:
    name: Release guard
    if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: Is this release PR sound? (the base commit's script)
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        if ! git show "${BASE_SHA}:scripts/release.sh" > "${RUNNER_TEMP}/release-base.sh"; then
          echo "::notice::the base has no scripts/release.sh: nothing to guard"
          exit 0
        fi
        bash "${RUNNER_TEMP}/release-base.sh" guard
  publish:
    name: GitHub Release
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      checks: read
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: The tag is a green release commit on main or release/v*
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/release.sh tag-guard
    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/release.sh publish
