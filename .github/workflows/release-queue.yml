# Generated from xtask::workflows::release_queue (xtask/workflows/src/release_queue.rs)
# Rebuild with `just workflows`; do not edit by hand (`just workflows-check` fails CI on drift).
# The reasons for every job and step are comments in that Rust source.
name: release-queue
on:
  workflow_run:
    workflows:
    - CI
    types:
    - completed
    branches:
    - main
  workflow_dispatch: null
permissions: {}
concurrency:
  group: release-queue
  cancel-in-progress: false
jobs:
  release:
    name: Release a merged bump
    if: ${{ vars.STUDIO_RELEASE_QUEUE == 'on' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      actions: read
    environment: release-queue
    steps:
    - name: Runs in the release-queue environment, with its key
      env:
        BOT_ENVIRONMENT: ${{ vars.BOT_ENVIRONMENT }}
        KEY_SET: ${{ secrets.RELEASE_QUEUE_APP_KEY != '' }}
      run: |
        set -euo pipefail
        if [ "${BOT_ENVIRONMENT:-}" != "release-queue" ] || [ "$KEY_SET" != true ]; then
          echo "::error::this job must run in the 'release-queue' environment, whose variable BOT_ENVIRONMENT is 'release-queue' and which holds the secret RELEASE_QUEUE_APP_KEY (got BOT_ENVIRONMENT='${BOT_ENVIRONMENT:-}', key set: $KEY_SET)"
          exit 1
        fi
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: false
    - name: A bot bump since the last release?
      id: asked
      env:
        SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        git fetch -q --tags --force origin main
        if asked="$(bash scripts/release.sh bump-queued "$SHA")"; then
          echo "asked by $(git log -1 --format='%h %s' "$asked"): releasing $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "asked=true" >> "$GITHUB_OUTPUT"
        else
          echo "no bot bump on main since the last release: nothing to release" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "asked=false" >> "$GITHUB_OUTPUT"
        fi
    - name: fts-forge token (studio only)
      id: forge
      if: ${{ steps.asked.outputs.asked == 'true' }}
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
      with:
        app-id: ${{ vars.FORGE_APP_ID }}
        private-key: ${{ secrets.RELEASE_QUEUE_APP_KEY }}
        owner: FastTrackStudios
        repositories: studio
        permission-contents: write
    - name: just release <sha>
      if: ${{ steps.asked.outputs.asked == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        FORGE_TOKEN: ${{ steps.forge.outputs.token }}
        SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        auth="$(printf 'x-access-token:%s' "$FORGE_TOKEN" | base64 -w0)"
        echo "::add-mask::$auth"
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
        bash scripts/release.sh release --yes "$SHA"
