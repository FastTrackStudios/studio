# PR title — every PR is squash-merged, so the PR TITLE becomes the one
# commit subject on main (or on a release/v* hotfix line). This checks it
# is a conventional commit before the squash bakes it in (fleet flow v4,
# the `release-workflow` skill, conventions.md). Release notes come from
# the PR's cargo-rail change file (.changes/*.md), not from the title.
#
#   feat(editor): comp lanes swipe from a take
#   fix(signal): the tuner needle no longer jitters
#   chore(deps)!: architect v1.0 — the attach hooks take an EventSink
#
# Types: feat fix perf refactor docs test build ci chore revert style.
# `!` before the colon marks a breaking change (its change file is
# `--bump major` with a `Migration:` paragraph). At most 72 characters.
#
# A hosted runner, a regex, seconds; it compiles nothing.

name: pr-title

on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9][a-z0-9/_.-]*\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title is not a conventional commit: '$TITLE'"
            echo "::error::It becomes the squash commit on main. e.g. 'feat(editor): …', 'fix(signal): …'"
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title is ${#TITLE} characters; at most 72 (aim for 50)"
            exit 1
          fi
          echo "ok: $TITLE"
