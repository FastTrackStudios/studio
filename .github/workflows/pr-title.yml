# PR title — PRs into `dev` are squash-merged, so the PR TITLE becomes the
# one commit subject on dev, and git-cliff turns that subject into the
# release's changelog line (cliff.toml). This checks the title is a
# conventional commit before the squash bakes it in.
#
# It is the only thing that runs on a PR into dev, and it compiles
# nothing: a hosted runner, a regex, seconds. The build gate for a PR into
# dev is a local `just ci` on its head (docs/agents/release-workflow.md);
# the full checks run once per release, on the dev -> main PR.
#
#   feat(editor): comp lanes swipe from a take
#   fix: the meter on a track rendered ahead moves with what is heard
#   chore(deps)!: architect v1.0 — the attach hooks take an EventSink
#
# Types: feat fix perf refactor docs test build ci chore revert style.
# `!` before the colon marks a breaking change.

name: pr-title

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9][a-z0-9/_.-]*\))?!?: .+'
          if [[ "$TITLE" =~ $re ]]; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title is not a conventional commit: '$TITLE'"
            echo "::error::It becomes the squash commit and the changelog line. e.g. 'feat(editor): …', 'fix: …'"
            exit 1
          fi
