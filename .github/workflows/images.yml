# Generated from xtask::workflows::images (xtask/workflows/src/images.rs)
# Rebuild with `just workflows`; do not edit by hand (`just workflows-check` fails CI on drift).
# The reasons for every job and step are comments in that Rust source.
name: Images
on:
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish the image for, e.g. v26.10.4
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: images-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  plan:
    name: What to publish
    if: ${{ github.repository == 'FastTrackStudios/studio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
    - name: The image tag is the bare CalVer
      run: |
        set -euo pipefail
        v="${TAG#v}"
        if [ "$v" = "$TAG" ] || [[ ! "$v" =~ ^[1-9][0-9]\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error::'$TAG' is not vYY.M.MICRO CalVer: its image tag '$v' would not match the cluster's ^[1-9][0-9]\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)\$ and would sort wrong or be ignored"
          exit 1
        fi
        echo "image tag: $v"
    - uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ env.TAG }}
        fetch-depth: 0
    - name: Stamp the release version from the tag
      env:
        STAMP_TAG: ${{ env.TAG }}
      run: |
        set -euo pipefail
        if grep -q '^    stamp)' scripts/release.sh; then
          bash scripts/release.sh stamp "$STAMP_TAG"
        else
          echo "$STAMP_TAG predates the stamp: its commit carries its version ($(bash scripts/release.sh version))"
        fi
    - name: The tag is a green release on main or release/v*
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        GITHUB_REF="refs/tags/$TAG" bash scripts/release.sh tag-guard
    - name: Plan
      id: plan
      env:
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        sha="$(git rev-parse HEAD)"
        v="${TAG#v}"
        extra="latest"
        # A re-publish never moves `latest` (a newer release may own it).
        [ "$EVENT" != workflow_dispatch ] || extra=""
        tags="$(xargs <<<"$v sha-$(git rev-parse --short "$sha") $extra")"
        echo "publishing $sha as: $tags"
        {
          echo "sha=$sha"
          echo "tags=$tags"
        } >> "$GITHUB_OUTPUT"
        echo "### studio-web for $TAG: \`$tags\` from \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
  publish:
    name: Build + push to GHCR
    needs: plan
    runs-on:
    - self-hosted
    - studio-release
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      CONTAINERS_REGISTRIES_CONF: /dev/null
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.plan.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Stamp the release version from the tag
      env:
        STAMP_TAG: ${{ env.TAG }}
      run: |
        set -euo pipefail
        if grep -q '^    stamp)' scripts/release.sh; then
          bash scripts/release.sh stamp "$STAMP_TAG"
        else
          echo "$STAMP_TAG predates the stamp: its commit carries its version ($(bash scripts/release.sh version))"
        fi
    - name: Build and push studio-web
      env:
        TAGS: ${{ needs.plan.outputs.tags }}
        SHA: ${{ needs.plan.outputs.sha }}
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        export PATH="$PATH:/run/current-system/sw/bin"
        export REGISTRY_AUTH_FILE="$RUNNER_TEMP/ghcr-auth.json"
        skopeo() { nix run nixpkgs#skopeo -- "$@"; }
        printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io -u "$GHCR_USER" --password-stdin
        read -r -a tags <<<"$TAGS"
        dest="docker://ghcr.io/fasttrackstudios/studio-web"
        # The stamp left the tree dirty (no self.rev): the revision label is the
        # tagged commit, passed in (nix/modules/crane.nix `fts.buildRev`, read
        # only under --impure).
        streamer="$(FTS_BUILD_REV="$SHA" nix build --impure --accept-flake-config .#studio-web-image --no-link --print-out-paths)"
        "$streamer" | skopeo --insecure-policy copy docker-archive:/dev/stdin "$dest:${tags[0]}"
        for tag in "${tags[@]:1}"; do
          skopeo --insecure-policy copy "$dest:${tags[0]}" "$dest:$tag"
        done
        rm -f "$REGISTRY_AUTH_FILE"
        {
          echo "### Pushed ghcr.io/fasttrackstudios/studio-web"
          for tag in "${tags[@]}"; do echo "- \`$tag\`"; done
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Pullable without credentials, from this commit?
      env:
        TAGS: ${{ needs.plan.outputs.tags }}
        SHA: ${{ needs.plan.outputs.sha }}
      run: |
        set -euo pipefail
        first="${TAGS%% *}"
        bash scripts/ghcr-images.sh check "$first" "$SHA" \
          || { echo "::warning::not anonymously pullable yet: make ghcr.io/fasttrackstudios/studio-web PUBLIC (org package settings), then re-run this job"; exit 1; }
