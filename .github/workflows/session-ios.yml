# Session iOS TestFlight — build the Session iPhone/iPad app and upload it to
# TestFlight, ONLY for a release: the one studio tag `vX.Y.Z`, the same tag
# that drives Signal's upload (signal-ios.yml and session-ios.yml both
# trigger on it). Not on a push to main, not on a PR or a fork, not by path.
# The TestFlight marketing version (CFBundleShortVersionString) IS the tag's
# version, and the tag is a GitHub Release (docs/agents/release-workflow.md).
#
#   PRs --squash--> main           ships NOTHING
#   release PR merged --> `just release-tag` pushes vYY.M.MICRO (on main, or
#   on a release/v* hotfix line) --> this workflow AND signal-ios.yml start
#   on the tag --> resolve (hosted: tag shape, app crate version == tag
#   version, changelog section, commit on main or release/v*, `Build +
#   test` green, Release exists) --> testflight (airlock: build, sign, upload) -->
#   record (hosted: marketing version + build number written into the
#   Release notes, one line for this app; the other app writes its own line
#   into the same notes, so the edit re-reads and retries).
#
# Triggers: a tag push (`just release-tag`, pushed as the fts-forge App or a
# person: a tag pushed with GITHUB_TOKEN starts no workflow), and
# workflow_dispatch with the tag (a re-run). `dry_run` stops after resolve,
# before anything is built or uploaded. No pull_request trigger, so no fork
# or PR ever reaches the secrets or the runner.
#
# A thin caller: the jobs, the version rules (CalVer marketing version, the
# global build number) and the Release-notes line all live in the reusable
# apple-testflight.yml and scripts/release.sh; only Session's identity is
# here.

name: session-ios

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to ship to TestFlight (vYY.M.MICRO, e.g. v26.10.0): must be on main or release/v*"
        required: true
        type: string
      dry_run:
        description: "Validate the tag and stop before building or uploading"
        required: false
        type: boolean
        default: false

# Per tag, so two releases in a row are not collapsed into one pending run
# (a concurrency group holds only one pending run); a re-run of the same
# tag queues behind the first. NOT shared across products (github.workflow
# differs: the apps queue on airlock, they do not cancel each other).
concurrency:
  group: ios-testflight-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  testflight:
    # resolve creates the tag's GitHub Release if missing and reads the
    # tagged commit's `Build + test`; record edits the Release notes.
    permissions:
      contents: write
      checks: read
    uses: ./.github/workflows/apple-testflight.yml
    secrets: inherit
    with:
      app: session
      title: Session
      tag: ${{ inputs.tag || github.ref_name }}
      dry_run: ${{ inputs.dry_run || false }}
      deploy_script: apps/session/desktop/ios/deploy-testflight.sh
      # session-desktop (apps/session/desktop), the same Blitz app the Mac
      # runs, in the small-screen layout. NOT the crate defaults: `session`
      # implies `tts`, which pulls ort/ONNX Runtime, and ONNX publishes no
      # prebuilt binary for aarch64-apple-ios. `session-domain` is Session
      # without the TTS backend.
      dx_package: session-desktop
      dx_app_dir: apps/session/desktop
      dx_features: --no-default-features --features native,session-domain,charts
      # Must match apps/session/desktop/Dioxus.toml and scripts/release.sh IOS_TABLE.
      bundle_id: app.fasttrackstudio.session
      display_name: Session
      profile_name: FTS Session App Store
      icons_dir: apps/session/desktop/ios/Assets.xcassets
