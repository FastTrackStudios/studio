# Generated from xtask::workflows::pr (xtask/workflows/src/pr.rs)
# Rebuild with `just workflows`; do not edit by hand (`just workflows-check` fails CI on drift).
# The reasons for every job and step are comments in that Rust source.
name: PR
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Rust 1.99.1
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        components: rustfmt
    - name: cargo-rail 0.32.0
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-rail.zip" "https://github.com/loadingalias/cargo-rail/releases/download/v0.32.0/cargo-rail-x86_64-unknown-linux-gnu.zip"
        echo "5fcda1a62d36d51834ad49a5ef2ebc82777fd9d134d3d409f7021ce1a495dee4  $RUNNER_TEMP/cargo-rail.zip" | sha256sum -c -
        unzip -q -o "$RUNNER_TEMP/cargo-rail.zip" -d "$HOME/.local/share"
        echo "$HOME/.local/share/cargo-rail" >> "$GITHUB_PATH"
        "$HOME/.local/share/cargo-rail/cargo-rail" --version
    - name: Restore cargo's dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-deps-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-deps-${{ runner.os }}-
    - name: fmt
      run: cargo fmt --all --check
    - name: Change files
      if: ${{ !cancelled() }}
      run: cargo rail change check --since "$(git rev-parse HEAD^1)"
    - name: Manifests + lockfile
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        committed="$RUNNER_TEMP/Cargo.lock.committed"
        cp Cargo.lock "$committed"
        cargo metadata --format-version 1 > /dev/null
        packages() { sed '/^\[\[patch\.unused\]\]/,$d' "$1"; }
        unused() {
          awk '/^\[\[patch\.unused\]\]/ { f = 1; next }
               f && /^name = /    { n = $3 }
               f && /^version = / { print n "@" $3 }' "$1" | sort
        }
        ok=1
        diff -u <(packages "$committed") <(packages Cargo.lock) || ok=0
        diff -u <(unused "$committed") <(unused Cargo.lock) || ok=0
        if [ "$ok" = 0 ]; then
          echo "::error::Cargo.lock is out of date — run cargo metadata and commit the result"
          exit 1
        fi
    - name: rail config
      if: ${{ !cancelled() }}
      run: cargo rail config validate --strict
  studio-architect:
    name: Studio Architect node (cargo check, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Restore cargo's dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-deps-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-deps-${{ runner.os }}-
    - name: Does this PR reach the node?
      id: reach
      run: |
        set -euo pipefail
        changed="$(git diff --name-only HEAD^1 HEAD)"
        dirs="$(cargo tree --locked -p studio-architect --no-default-features -e normal,build,dev --prefix none -f '{p}' \
          | sed -n "s|.* (\($GITHUB_WORKSPACE/[^)]*\))\$|\1|p" | sed "s|^$GITHUB_WORKSPACE/||" | sort -u)"
        reach=false
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          case "$f" in
            Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|scripts/studio-architect.sh) reach=true ;;
          esac
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            case "$f" in "$d"/*) reach=true ;; esac
          done <<<"$dirs"
        done <<<"$changed"
        echo "reach=$reach" >> "$GITHUB_OUTPUT"
        echo "studio-architect: $(wc -l <<<"$dirs") crates of this repo in the node's tree; this PR reaches it: $reach"
    - name: Free disk (background)
      if: ${{ steps.reach.outputs.reach == 'true' }}
      run: |
        df -h / | tail -n 1
        nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
          /usr/local/share/powershell /usr/local/share/chromium \
          /usr/local/share/boost /opt/microsoft /opt/google \
          </dev/null >/dev/null 2>&1 &
    - name: Rust 1.99.1
      if: ${{ steps.reach.outputs.reach == 'true' }}
      uses: dtolnay/rust-toolchain@1.99.1
    - name: mold
      if: ${{ steps.reach.outputs.reach == 'true' }}
      run: |
        sudo apt-get install -y --no-install-recommends mold
    - name: CI cargo config
      if: ${{ steps.reach.outputs.reach == 'true' }}
      run: |
        mkdir -p ../.cargo
        cp .cargo/ci-config.toml ../.cargo/config.toml
    - name: cargo check the node
      if: ${{ steps.reach.outputs.reach == 'true' }}
      run: bash scripts/studio-architect.sh check
