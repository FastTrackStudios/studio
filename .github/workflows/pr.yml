# Generated from xtask::workflows::pr (xtask/workflows/src/pr.rs)
# Rebuild with `just workflows`; do not edit by hand (`just workflows-check` fails CI on drift).
# The reasons for every job and step are comments in that Rust source.
name: PR
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-checks:
    name: PR checks
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 2
    - name: Rust 1.99.1
      uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
      with:
        components: rustfmt
    - name: cargo-rail 0.32.0
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-rail.zip" "https://github.com/loadingalias/cargo-rail/releases/download/v0.32.0/cargo-rail-x86_64-unknown-linux-gnu.zip"
        echo "5fcda1a62d36d51834ad49a5ef2ebc82777fd9d134d3d409f7021ce1a495dee4  $RUNNER_TEMP/cargo-rail.zip" | sha256sum -c -
        unzip -q -o "$RUNNER_TEMP/cargo-rail.zip" -d "$HOME/.local/share"
        echo "$HOME/.local/share/cargo-rail" >> "$GITHUB_PATH"
        "$HOME/.local/share/cargo-rail/cargo-rail" --version
    - name: Restore cargo's dependencies
      id: deps
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-deps-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-deps-${{ runner.os }}-
    - name: fmt
      run: cargo fmt --all --check
    - name: Change files
      if: ${{ !cancelled() }}
      run: cargo rail change check --since "$(git rev-parse HEAD^1)"
    - name: Manifests + lockfile
      if: ${{ !cancelled() }}
      run: |
        bash scripts/check-lockfile.sh
    - name: rail config
      if: ${{ !cancelled() }}
      run: cargo rail config validate --strict
    - name: Group rules (boundaries.toml)
      if: ${{ !cancelled() }}
      run: python3 scripts/boundaries.py check --edges
    - name: Spec coverage (Ignition)
      if: ${{ !cancelled() }}
      run: python3 -I scripts/spec-coverage.py --scope lighting
    - name: 'Release bots: token mints, sums, facts, queue, bump dependents, www patch'
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        python3 scripts/check-token-mints.py --self-test
        python3 scripts/check-token-mints.py
        bash scripts/release-facts-test.sh
        bash scripts/release-sums-test.sh
        bash scripts/bump-verify-test.sh
        python3 scripts/bump-architect-deps-test.py
        python3 scripts/check-www-patch.py --self-test
        python3 scripts/check-www-patch.py
        bash scripts/lock-sources-test.sh
  affected:
    name: Affected crates
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","thebattleship"]') }}
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Hosted setup
      if: ${{ runner.environment == 'github-hosted' }}
      uses: ./.github/actions/hosted-nix
    - name: Shared runner tools
      if: ${{ runner.environment == 'self-hosted' }}
      uses: ./.github/actions/shared-tools
    - name: CI cargo config (the pool's cargo home)
      run: |
        # Public hotfix PRs run on hosted VMs; the protected-ref jobs use the gate's cache.
        if [ -z "${CI_CACHE_DIR:-}" ]; then
          export CI_CACHE_DIR="$RUNNER_TEMP/studio-ci"
          echo "CI_CACHE_DIR=$CI_CACHE_DIR" >> "$GITHUB_ENV"
        fi
        home="$CI_CACHE_DIR/cargo-home"
        mkdir -p "$home"
        echo "CARGO_HOME=$home" >> "$GITHUB_ENV"
        # The old per-checkout copy, which cargo would still find from the checkout.
        rm -f ../.cargo/config.toml
        tmp="$(mktemp "$home/config.toml.XXXXXX")"
        cp .cargo/ci-config.toml "$tmp"
        mv -f "$tmp" "$home/config.toml"
    - name: Target dir (affected, pool capped at 200 GB)
      run: |
        pool="${CI_CACHE_DIR:?not a shared runner (no CI_CACHE_DIR)}"
        dir="$pool/affected/$RUNNER_NAME/target"
        mkdir -p "$dir"
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
        used="$(du -s --block-size=1G "$pool" | cut -f1)"
        if [ "$used" -gt 200 ]; then
          echo "::warning::the pool cache is ${used} GB, over 200 GB: emptying $dir (a cold affected build)"
          rm -rf "$dir" && mkdir -p "$dir"
        fi
        echo "target dir: $dir; pool $(du -sh "$pool" | cut -f1) of 200 GB; $(df -h "$pool" | awk 'NR==2 {print $4}') free on the disk"
    - name: cargo rail plan (against the PR's base)
      id: plan
      run: |
        devenv shell -- bash -euo pipefail -s <<'EOF'
        base="$(git rev-parse HEAD^1)"
        plan="$RUNNER_TEMP/rail-plan.json"
        gates=""
        if cargo rail plan --from "$base" --to HEAD --json > "$plan"; then
          gates="$(python3 scripts/ci-rail-plan.py "$plan")" || gates=""
        fi
        [ -n "$gates" ] || { echo "plan: no plan; the full set"; gates=$'full=true\ncargo=true\ncheck=true\ncheck_packages=\ntests=true\ntest_filter=\ntest_packages=\nwasm=true'; }
        cargo rail plan --from "$base" --to HEAD --explain 2>&1 | head -n 40 || true
        printf '%s\n' "$gates" | tee -a "$GITHUB_OUTPUT"
        EOF
    - name: cargo check (the affected crates)
      if: ${{ !cancelled() && steps.plan.outcome == 'success' && (steps.plan.outputs.check == 'true' || steps.plan.outputs.cargo == 'true') }}
      env:
        CHECK_PACKAGES: ${{ steps.plan.outputs.check_packages }}
      run: |
        devenv shell -- bash -euo pipefail -s <<'EOF'
        pkgs=()
        # A member can share its name with a registry crate (vendor/wasm-streams-0.4 is
        # `wasm-streams` 0.4, beside 0.5 from crates.io): `-p name` is then ambiguous,
        # so pass each member as `name@version`.
        declare -A spec=()
        while read -r n v; do spec[$n]="$n@$v"; done < <(cargo metadata --no-deps --format-version 1 --offline 2>/dev/null | python3 -c 'import json,sys; [print(p["name"], p["version"]) for p in json.load(sys.stdin)["packages"]]')
        for p in ${CHECK_PACKAGES:-}; do pkgs+=(-p "${spec[$p]:-$p}"); done
        if [ "${#pkgs[@]}" = 0 ]; then cargo check --workspace; else cargo check "${pkgs[@]}"; fi
        EOF
    - name: Assets (studio-assets, rig-models, mic-models)
      if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.plan.outputs.tests == 'true' }}
      env:
        ASSETS_TOKEN: ''
      run: |
        store="${CI_CACHE_DIR:-${CACHE_DIRECTORY:-$HOME/.cache}}/assets"
        mkdir -p "$store"
        [ -L .assets ] || [ -e .assets ] || ln -s "$store" .assets
        if [ -n "${ASSETS_TOKEN}" ]; then
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${ASSETS_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          devenv shell -- just assets
        elif [ -d "$store/studio-assets/.git" ] && [ -d "$store/rig-models/.git" ] && [ -d "$store/mic-models/.git" ]; then
          echo "no asset credential on this run (only main's full runs fetch): linking the clones this runner holds"
          ASSETS_OFFLINE=1 devenv shell -- just assets
        else
          echo "::warning::no asset clones on this runner yet and no credential to fetch them (a main run fetches them): tests that need assets will fail"
        fi
    - name: cargo nextest (the affected crates' tests)
      if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.plan.outputs.tests == 'true' }}
      env:
        TEST_PACKAGES: ${{ steps.plan.outputs.test_packages }}
      run: |
        devenv shell -- bash -euo pipefail -s <<'EOF'
        pkgs=()
        # A member can share its name with a registry crate (vendor/wasm-streams-0.4 is
        # `wasm-streams` 0.4, beside 0.5 from crates.io): `-p name` is then ambiguous,
        # so pass each member as `name@version`.
        declare -A spec=()
        while read -r n v; do spec[$n]="$n@$v"; done < <(cargo metadata --no-deps --format-version 1 --offline 2>/dev/null | python3 -c 'import json,sys; [print(p["name"], p["version"]) for p in json.load(sys.stdin)["packages"]]')
        sel=" ${TEST_PACKAGES:-} "
        while read -r p; do
          if [ "$sel" = "  " ] || [[ "$sel" == *" $p "* ]]; then pkgs+=(-p "${spec[$p]:-$p}"); fi
        done < <(python3 scripts/boundaries.py packages all --tested)
        if [ "${#pkgs[@]}" = 0 ]; then echo "no tested package affected"; exit 0; fi
        cargo nextest run "${pkgs[@]}" --no-fail-fast --no-tests=pass
        EOF
    - name: Fixture sessions and a room over MCP (every PR)
      if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
      env:
        TEST_PACKAGES: ${{ steps.plan.outputs.test_packages }}
        TESTS_RAN: ${{ steps.plan.outputs.tests }}
      run: |
        devenv shell -- bash -euo pipefail -s <<'EOF'
        sel=" ${TEST_PACKAGES:-} "
        if [ "${TESTS_RAN:-}" = "true" ] && { [ "$sel" = "  " ] || [[ "$sel" == *" daw-extension "* ]]; }; then
          echo "daw-extension's tests ran above, the fixtures and the room with them"; exit 0
        fi
        cargo nextest run -p daw-extension --test fixtures --test room --no-fail-fast
        EOF
    - name: wasm check (just check-web)
      if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.plan.outputs.wasm == 'true' }}
      run: |
        devenv shell -- bash -euo pipefail -s <<'EOF'
        just check-web
        EOF
  architect-pin:
    name: 'Architect pin: main''s full set'
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 2
    - name: Does this PR move the Architect pin?
      id: pin
      run: |
        set -euo pipefail
        moved="$(git diff HEAD^1 HEAD -- Cargo.toml | grep -E '^[+-][^+-].*FastTrackStudios/architect' || true)"
        if [ -n "$moved" ]; then
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "architect-pin: this PR moves the Architect pin:"
          echo "$moved"
        else
          echo "moved=false" >> "$GITHUB_OUTPUT"
          echo "architect-pin: the Architect pin stays where it is"
        fi
    - name: Start CI on this branch
      if: ${{ steps.pin.outputs.moved == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_REF: ${{ github.head_ref }}
      run: |
        set -euo pipefail
        gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
        {
          echo "### The Architect pin moves: main's full set runs on this branch"
          echo
          echo "CI (checks.yml) was started on $HEAD_REF: its jobs report on this PR's head commit."
        } >> "$GITHUB_STEP_SUMMARY"
