# Generated from xtask::workflows::pr (xtask/workflows/src/pr.rs)
# Rebuild with `just workflows`; do not edit by hand (`just workflows-check` fails CI on drift).
# The reasons for every job and step are comments in that Rust source.
name: PR
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-checks:
    name: PR checks
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 2
    - name: Rust 1.99.1
      uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
      with:
        components: rustfmt
    - name: cargo-rail 0.32.0
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-rail.zip" "https://github.com/loadingalias/cargo-rail/releases/download/v0.32.0/cargo-rail-x86_64-unknown-linux-gnu.zip"
        echo "5fcda1a62d36d51834ad49a5ef2ebc82777fd9d134d3d409f7021ce1a495dee4  $RUNNER_TEMP/cargo-rail.zip" | sha256sum -c -
        unzip -q -o "$RUNNER_TEMP/cargo-rail.zip" -d "$HOME/.local/share"
        echo "$HOME/.local/share/cargo-rail" >> "$GITHUB_PATH"
        "$HOME/.local/share/cargo-rail/cargo-rail" --version
    - name: Restore cargo's dependencies
      id: deps
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-deps-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-deps-${{ runner.os }}-
    - name: fmt
      run: cargo fmt --all --check
    - name: Change files
      if: ${{ !cancelled() }}
      run: cargo rail change check --since "$(git rev-parse HEAD^1)"
    - name: Manifests + lockfile
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        committed="$RUNNER_TEMP/Cargo.lock.committed"
        cp Cargo.lock "$committed"
        cargo metadata --format-version 1 > /dev/null
        packages() { sed '/^\[\[patch\.unused\]\]/,$d' "$1"; }
        unused() {
          awk '/^\[\[patch\.unused\]\]/ { f = 1; next }
               f && /^name = /    { n = $3 }
               f && /^version = / { print n "@" $3 }' "$1" | sort
        }
        ok=1
        diff -u <(packages "$committed") <(packages Cargo.lock) || ok=0
        diff -u <(unused "$committed") <(unused Cargo.lock) || ok=0
        if [ "$ok" = 0 ]; then
          echo "::error::Cargo.lock is out of date — run cargo metadata and commit the result"
          exit 1
        fi
    - name: rail config
      if: ${{ !cancelled() }}
      run: cargo rail config validate --strict
    - name: 'Release bots: token mints, sums, facts, queue, bump dependents, www patch'
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        python3 scripts/check-token-mints.py --self-test
        python3 scripts/check-token-mints.py
        bash scripts/release-facts-test.sh
        bash scripts/release-sums-test.sh
        bash scripts/bump-verify-test.sh
        python3 scripts/bump-architect-deps-test.py
        python3 scripts/check-www-patch.py --self-test
        python3 scripts/check-www-patch.py
        bash scripts/lock-sources-test.sh
  architect-pin:
    name: 'Architect pin: main''s full set'
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 2
    - name: Does this PR move the Architect pin?
      id: pin
      run: |
        set -euo pipefail
        moved="$(git diff HEAD^1 HEAD -- Cargo.toml | grep -E '^[+-][^+-].*FastTrackStudios/architect' || true)"
        if [ -n "$moved" ]; then
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "architect-pin: this PR moves the Architect pin:"
          echo "$moved"
        else
          echo "moved=false" >> "$GITHUB_OUTPUT"
          echo "architect-pin: the Architect pin stays where it is"
        fi
    - name: Start CI on this branch
      if: ${{ steps.pin.outputs.moved == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_REF: ${{ github.head_ref }}
      run: |
        set -euo pipefail
        gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
        {
          echo "### The Architect pin moves: main's full set runs on this branch"
          echo
          echo "CI (checks.yml) was started on $HEAD_REF: its jobs report on this PR's head commit."
        } >> "$GITHUB_STEP_SUMMARY"
