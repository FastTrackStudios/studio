# Generated from xtask::workflows::deploy (xtask/workflows/src/deploy.rs)
# Rebuild with `just workflows`; do not edit by hand (`just workflows-check` fails CI on drift).
# The reasons for every job and step are comments in that Rust source.
name: deploy
on:
  push:
    tags:
    - v*
  workflow_dispatch: null
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
env:
  REGISTRY: registry.starcommand.live:30050
  CONTAINERS_REGISTRIES_CONF: /dev/null
jobs:
  deploy:
    name: deploy ${{ matrix.img }}
    runs-on:
    - self-hosted
    - studio-deploy
    permissions:
      contents: read
      checks: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - img: session-web
          env: session-production
          url: https://session.fasttrackstudio.app
        - img: signal-web
          env: signal-production
          url: https://signal.fasttrackstudio.app
    environment:
      name: ${{ matrix.env }}
      url: ${{ matrix.url }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Stamp the release version from the tag
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      env:
        STAMP_TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if grep -q '^    stamp)' scripts/release.sh; then
          bash scripts/release.sh stamp "$STAMP_TAG"
        else
          echo "$STAMP_TAG predates the stamp: its commit carries its version ($(bash scripts/release.sh version))"
        fi
    - name: The ref is a green release tag on main or release/v*
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/release.sh tag-guard
    - name: Compute tags
      id: tags
      run: |
        echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
    - name: Push image
      run: |
        set -euo pipefail
        img=${{ matrix.img }}
        echo "── $img ──"
        # The stamp left the tree dirty, so the flake has no self.rev: the image's
        # revision (version.json, which "Verify live" reads) is passed in instead
        # (nix/modules/crane.nix `fts.buildRev`, read only under --impure).
        streamer="$(FTS_BUILD_REV="$GITHUB_SHA" nix build --impure .#${img}-image --no-link --print-out-paths)"
        "$streamer" | nix run nixpkgs#skopeo -- --insecure-policy copy \
          --dest-tls-verify=false --dest-no-creds docker-archive:/dev/stdin \
          "docker://${REGISTRY}/${img}:latest"
        for tag in dev "${{ steps.tags.outputs.sha }}" "${{ steps.tags.outputs.version }}"; do
          nix run nixpkgs#skopeo -- --insecure-policy copy \
            --src-tls-verify=false --src-no-creds \
            --dest-tls-verify=false --dest-no-creds \
            "docker://${REGISTRY}/${img}:latest" \
            "docker://${REGISTRY}/${img}:${tag}"
        done
    - name: Verify live
      run: |
        url="${{ matrix.url }}"
        want="${GITHUB_SHA}"
        echo "waiting for $url to serve $want"
        for i in $(seq 1 60); do
          got="$(curl -sf --max-time 10 "$url/version.json" \
            | sed -n 's/.*"rev":"\([^"]*\)".*/\1/p' || true)"
          echo "  poll $i: ${got:-?}"
          if [ "$got" = "$want" ]; then
            echo "LIVE: $url serves $want"
            exit 0
          fi
          sleep 15
        done
        echo "TIMED OUT: $url never served $want — check argocd-image-updater / rollouts"
        exit 1
