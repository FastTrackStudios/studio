# Deploy — a pure-Nix OCI image pushed to the in-cluster registry, rolled
# out by ArgoCD + argocd-image-updater (digest strategy on the channel
# tag).
#
#   session-web -> registry.starcommand.live:30050/session-web  (session.fasttrackstudio.app)
#   signal-web  -> registry.starcommand.live:30050/signal-web   (signal.fasttrackstudio.app)
#
# One matrix leg per site; a failing leg does not stop the other.
#
# The in-cluster registry is NOT reachable from GitHub-hosted runners, so
# this runs on the org's SELF-HOSTED runner labelled `nix-host`
# (github-fts). That runner is registered on the FastTrackStudios org, so
# it reaches this repo; it does not reach personal-account repos.
#
# GitHub Deployments: the `environment:` block registers a real
# Deployment, so runs appear under the repo's Environments tab with a
# link to the live site. It only goes green after "Verify live" passes —
# so "Active" means the cluster is SERVING this sha, not merely that an
# image was pushed.
#
# Production is the latest `v*` TAG, not main (release flow v2,
# docs/agents/release-workflow.md): main holds finished features, promoted
# from dev, and a push to main deploys nothing. This runs only when a
# `vX.Y.Z` tag is pushed (`just release-tag`) or dispatched with a tag as
# its ref; the first step refuses a tag that is not a release commit on
# main. Both sites deploy the tagged commit, once per release.
#
# No path filtering. session-web's demo backend is the real in-process
# daw-standalone/session stack, so a change almost anywhere in the
# workspace can change what the site does — a path filter would either
# be wrong or be a list of everything.

name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Never cancel a deploy mid-push; queue instead. A cancelled deploy can
# leave the registry holding a tag the cluster never rolled.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.starcommand.live:30050
  # Newer skopeo rejects the host's v1 registries.conf; every registry is
  # named explicitly below, so an empty (valid) config is enough.
  CONTAINERS_REGISTRIES_CONF: /dev/null

jobs:
  deploy:
    name: deploy ${{ matrix.img }}
    runs-on: [self-hosted, session]
    strategy:
      fail-fast: false
      matrix:
        include:
          - img: session-web
            env: session-production
            url: https://session.fasttrackstudio.app
          - img: signal-web
            env: signal-production
            url: https://signal.fasttrackstudio.app
    environment:
      name: ${{ matrix.env }}
      url: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Production changes only by tag: refuse a branch ref, a tag whose
      # version is not Cargo.toml's, a commit that is not in main.
      - name: The ref is a release tag on main
        run: bash scripts/release.sh tag-guard

      # features/patchbay -> inferno-net is a git dep on the private
      # FastTrackStudios/inferno-control; the nix build vendors every git dep in Cargo.lock
      # (fetchGit runs git as this user, so the env config applies).
      - name: inferno-control read access
        uses: ./.github/actions/inferno-control-auth
        with:
          token: ${{ secrets.INFERNO_CONTROL_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Push image
        run: |
          set -euo pipefail
          img=${{ matrix.img }}
          echo "── $img ──"
          # streamLayeredImage builds an EXECUTABLE that streams a
          # docker-archive to stdout — there is no tarball on disk to
          # copy, which is what keeps a ~60 MB bundle out of the store
          # twice.
          streamer="$(nix build .#${img}-image --no-link --print-out-paths)"
          "$streamer" | nix run nixpkgs#skopeo -- --insecure-policy copy \
            --dest-tls-verify=false --dest-no-creds docker-archive:/dev/stdin \
            "docker://${REGISTRY}/${img}:latest"
          # Retag from the just-pushed :latest rather than re-streaming:
          # same digest by construction, and the image is built once.
          for tag in dev "${{ steps.tags.outputs.sha }}" "${{ steps.tags.outputs.version }}"; do
            nix run nixpkgs#skopeo -- --insecure-policy copy \
              --src-tls-verify=false --src-no-creds \
              --dest-tls-verify=false --dest-no-creds \
              "docker://${REGISTRY}/${img}:latest" \
              "docker://${REGISTRY}/${img}:${tag}"
          done

      # A green run must mean the cluster serves THIS commit. The bundle
      # reports the rev it was built from in version.json (written by
      # mkStaticSite), so this is the site answering, not the registry.
      - name: Verify live
        run: |
          url="${{ matrix.url }}"
          want="${GITHUB_SHA}"
          echo "waiting for $url to serve $want"
          for i in $(seq 1 60); do
            got="$(curl -sf --max-time 10 "$url/version.json" \
              | sed -n 's/.*"rev":"\([^"]*\)".*/\1/p' || true)"
            echo "  poll $i: ${got:-?}"
            if [ "$got" = "$want" ]; then
              echo "LIVE: $url serves $want"
              exit 0
            fi
            sleep 15
          done
          echo "TIMED OUT: $url never served $want — check argocd-image-updater / rollouts"
          exit 1
