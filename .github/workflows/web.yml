# Generated from xtask::workflows::web (xtask/workflows/src/web.rs)
# Rebuild with `just workflows`; do not edit by hand (`just workflows-check` fails CI on drift).
# The reasons for every job and step are comments in that Rust source.
name: web
on:
  push:
    tags:
    - studio-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. studio-v26.12.0) for publish/validate; any branch or sha for build-only
        required: true
        type: string
      mode:
        description: 'publish: attach to the tag''s Release. validate: resolve only. build-only: build the bundle, no Release.'
        required: false
        type: choice
        options:
        - publish
        - validate
        - build-only
        default: publish
permissions:
  contents: read
concurrency:
  group: web-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  MODE: ${{ inputs.mode || 'publish' }}
jobs:
  resolve:
    name: Resolve the tag
    if: ${{ github.repository == 'FastTrackStudios/studio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version || steps.ref.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha || steps.ref.outputs.sha }}
    steps:
    - name: The tag is studio-vX.Y.Z
      if: ${{ env.MODE != 'build-only' }}
      run: |
        if [[ ! "$TAG" =~ ^studio-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::'$TAG' is not a release tag (^studio-v[0-9]+\.[0-9]+\.[0-9]+$): installers are attached only to the studio release tag"
          exit 1
        fi
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.MODE == 'build-only' && env.TAG || format('refs/tags/{0}', env.TAG) }}
        fetch-depth: 0
    - name: Stamp the release version from the tag
      if: ${{ env.MODE != 'build-only' }}
      env:
        STAMP_TAG: ${{ env.TAG }}
      run: |
        set -euo pipefail
        if grep -q '^    stamp)' scripts/release.sh; then
          bash scripts/release.sh stamp "$STAMP_TAG"
        else
          echo "$STAMP_TAG predates the stamp: its commit carries its version ($(bash scripts/release.sh version))"
        fi
    - name: Version = tag version, on main or release/*, CI passed
      id: resolve
      if: ${{ env.MODE != 'build-only' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash scripts/release.sh ios-resolve studio "$TAG"
    - name: Build-only ref
      id: ref
      if: ${{ env.MODE == 'build-only' }}
      run: |
        set -euo pipefail
        sha="$(git rev-parse HEAD)"
        git fetch -q origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*'
        if [ -z "$(git branch -r --contains "$sha" --format='%(refname:short)' | grep -E '^origin/(main|release/.*)$' || true)" ]; then
          echo "::error::build-only: $sha is on neither main nor a release/* line: refused (the release runners build only reviewed commits)"
          exit 1
        fi
        echo "version=$(bash scripts/release.sh version)" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - name: A GitHub Release exists for the tag
      if: ${{ env.MODE == 'publish' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash scripts/release.sh ios-release "$TAG"
    - name: Summary
      env:
        VERSION: ${{ steps.resolve.outputs.version || steps.ref.outputs.version }}
        SHA: ${{ steps.resolve.outputs.sha || steps.ref.outputs.sha }}
      run: |
        {
          echo "### Studio $GITHUB_WORKFLOW: $TAG ($MODE)"
          echo "- version: \`$VERSION\`"
          echo "- commit: \`${SHA:0:12}\`"
          if [ "$MODE" = validate ]; then echo "- **validate**: stopped before any build"; fi
          if [ "$MODE" = build-only ]; then echo "- **build-only**: nothing will be attached to a Release"; fi
        } >> "$GITHUB_STEP_SUMMARY"
  build:
    name: Web bundle
    needs: resolve
    if: ${{ inputs.mode != 'validate' }}
    runs-on:
    - self-hosted
    - thebattleship-release
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.resolve.outputs.sha }}
    - name: Shared runner tools
      uses: ./.github/actions/shared-tools
    - name: Stamp the release version from the tag
      if: ${{ env.MODE != 'build-only' }}
      env:
        STAMP_TAG: ${{ env.TAG }}
      run: |
        set -euo pipefail
        if grep -q '^    stamp)' scripts/release.sh; then
          bash scripts/release.sh stamp "$STAMP_TAG"
        else
          echo "$STAMP_TAG predates the stamp: its commit carries its version ($(bash scripts/release.sh version))"
        fi
    - name: Own target dir
      run: |
        base="${CI_CACHE_DIR:?not a shared runner (no CI_CACHE_DIR)}"
        dir="$base/web/$RUNNER_NAME/target"
        mkdir -p "$dir"
        echo "target dir: $dir ($(du -sh "$dir" | cut -f1))"
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
    - name: Build the web bundle
      env:
        VERSION: ${{ needs.resolve.outputs.version }}
      run: |
        set -euo pipefail
        rm -rf target/web
        bash scripts/web/bundle.sh
    - name: Keep the bundle
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: web
        path: |
          target/web/*.tar.gz
        if-no-files-found: error
        retention-days: 14
