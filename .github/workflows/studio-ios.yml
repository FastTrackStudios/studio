# Studio iOS TestFlight — build the Studio iPhone/iPad app (Signal and
# Session in one app, apps/studio/desktop) and upload it to TestFlight, ONLY
# for a release: the one studio tag `vX.Y.Z`. Not on a push to main, not on
# a PR or a fork, not by path. The TestFlight marketing version
# (CFBundleShortVersionString) IS the tag's version, and the tag is a GitHub
# Release (docs/agents/release-workflow.md). Signal's and Session's own App
# Store records get no new builds: Studio replaced them.
#
#   PRs --squash--> main           ships NOTHING
#   release PR merged --> `just release-tag` pushes vYY.M.MICRO (on main, or
#   on a release/v* hotfix line) --> this workflow starts on the tag -->
#   resolve (hosted: tag shape, app crate version == tag version, changelog
#   section, commit on main or release/v*, `Build + test` green, Release
#   exists) --> testflight (airlock: build, sign, upload) --> record
#   (hosted: marketing version + build number written into the Release
#   notes; a re-run's edit re-reads and retries).
#
# Triggers: a tag push (`just release-tag`, pushed as the fts-forge App or a
# person: a tag pushed with GITHUB_TOKEN starts no workflow), and
# workflow_dispatch with the tag (a re-run). `dry_run` stops after `resolve`, before anything is built or
# uploaded. No pull_request trigger, so no fork or PR ever reaches the
# secrets or the runner.
#
# The upload runs on the org-level self-hosted macOS runner `airlock`, which
# holds its own credentials (~/.appstoreconnect + fts-build.keychain), so
# this needs no GitHub secrets.
#
# Reuses the same parameterized deploy-testflight.sh the other products use;
# only the DX_* env below differs. The build number (CFBundleVersion) is the
# unix time of the upload, so it keeps climbing across re-runs; it is
# recorded in the step summary and in the release notes.

name: studio-ios

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to ship to TestFlight (e.g. v26.10.3): must be on main or release/v*"
        required: true
        type: string
      dry_run:
        description: "Validate the tag and stop before building or uploading"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Per tag, so two releases in a row are not collapsed into one pending run
# (a concurrency group holds only one pending run); a re-run of the same
# tag queues behind the first. airlock is a single runner and takes one job
# at a time.
concurrency:
  group: ios-testflight-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  resolve:
    name: Resolve the tag
    # Never a fork: its tag is not this repo's release.
    if: ${{ github.repository == 'FastTrackStudios/studio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The GitHub Release is created here when the tag has none yet.
      contents: write
      # ios-resolve reads the tagged commit's `Build + test` check.
      checks: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: The tag is vX.Y.Z
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (^v[0-9]+\.[0-9]+\.[0-9]+$): TestFlight uploads only from the studio release tag"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: Marketing version = tag version, tag on main or release/v*, changelog section, green
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh ios-resolve studio "$TAG"
      - name: A GitHub Release exists for the tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh ios-release "$TAG"
      - name: Summary
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA: ${{ steps.resolve.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Studio iOS TestFlight: $TAG"
            echo "- marketing version: \`$VERSION\` (the tag's)"
            echo "- commit: \`${SHA:0:12}\` (in main)"
            if [ "$DRY_RUN" = true ]; then
              echo "- **dry run**: stopped before the build and the upload"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  testflight:
    name: Build, sign, upload
    needs: resolve
    if: ${{ !inputs.dry_run }}
    runs-on: [self-hosted, macos, airlock]
    # Turn a missing runner into a red X within the hour. Without it a job
    # with no available runner sits QUEUED and is eventually cancelled,
    # which reads as "cancelled" rather than "failed" and alerts nobody.
    timeout-minutes: 90
    outputs:
      build_no: ${{ steps.stamp.outputs.build_no }}
    steps:
      - name: Preflight — build volume mounted
        run: |
          if [ ! -d /Volumes/build-disk ]; then
            echo "ERROR: /Volumes/build-disk is not mounted on this runner." >&2
            exit 1
          fi
          df -h /Volumes/build-disk | tail -1

      # The commit `resolve` checked, not whatever the ref points at now.
      # clean:false keeps target/ between runs so cargo builds incrementally.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          clean: false

      # The guitar rig's release build refuses to compile without its captures
      # (features/rigs/guitar/build.rs). They are in the private rig-models repo,
      # which airlock keeps one clone of beside its other projects. The clone is
      # fast-forwarded to origin/main first, so a capture pushed to rig-models
      # ships in the next build; a failed fetch fails the job rather than
      # building with stale captures. https, so the fts-forge credential helper
      # authenticates (airlock has no GitHub ssh key).
      - name: Rig captures (rig-models) linked into the tree
        # Inline, not a script in the tree: a re-run of an older tag builds that
        # tag's sources, which do not have one.
        run: |
          set -euo pipefail
          src=/Volumes/build-disk/development/rig-models
          url=https://github.com/FastTrackStudios/rig-models.git
          if [ -d "$src/.git" ]; then
            before="$(git -C "$src" rev-parse --short HEAD)"
            git -C "$src" fetch --quiet origin \
              || { echo "::error::could not fetch rig-models into $src; not building with stale captures"; exit 1; }
            git -C "$src" merge --ff-only --quiet origin/main \
              || { echo "::error::$src cannot fast-forward to origin/main (local commits or changes?); not building with stale captures"; exit 1; }
            echo "rig-models $before -> $(git -C "$src" rev-parse --short HEAD)"
          else
            git clone --quiet "$url" "$src" \
              || { echo "::error::could not clone $url into $src"; exit 1; }
            echo "rig-models cloned at $(git -C "$src" rev-parse --short HEAD)"
          fi
          [ -d "$src/guitar" ] && [ -d "$src/bass" ] || { echo "::error::no rig-models clone at $src"; exit 1; }
          while read -r repo from to; do
            [[ -z $repo || $repo == \#* || $repo != rig-models ]] && continue
            to="${to:-$from}"
            n="$(find -L "$src/$from" -type f \( -name '*.nam' -o -name '*.wav' \) | wc -l | tr -d ' ')"
            [ "$n" -gt 0 ] || { echo "::error::$src/$from holds no captures"; exit 1; }
            mkdir -p "$(dirname "$to")"
            if [ -d "$to" ] && [ ! -L "$to" ]; then rmdir "$to"; fi
            ln -sfn "$src/$from" "$to"
            echo "linked $to -> $src/$from ($n captures)"
          done < assets.txt
          echo "rig-models at $(git -C "$src" rev-parse --short HEAD 2>/dev/null || echo unknown)"

      # CFBundleVersion has to climb with every upload: the unix time, taken
      # once, here, so the number built is the number recorded.
      - name: Build number
        id: stamp
        run: |
          build_no="$(date +%s)"
          echo "build_no=$build_no" >> "$GITHUB_OUTPUT"
          echo "Studio $TAG: marketing version ${{ needs.resolve.outputs.version }}, build $build_no"

      - name: Build, sign, and upload Studio to TestFlight
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
          # The tag's version, from `resolve`; deploy-testflight.sh refuses to
          # run without one. There is no default: a build is a release's.
          MARKETING_VER: ${{ needs.resolve.outputs.version }}
          BUILD_NO: ${{ steps.stamp.outputs.build_no }}
          # The release Xcode xcode-select points at (27, on macOS 27) builds,
          # compiles the icon catalog, signs and uploads: App Store Connect
          # refuses a beta SDK (90534), and actool must match the macOS.
          # ── Telemetry ────────────────────────────────────────────────
          # Baked at build time via option_env! in architect-telemetry: a
          # shipped app has nobody to set env vars for it, and the exporter
          # is built at process start -- before sign-in -- so a session
          # token cannot be the credential. Both empty => the app is
          # telemetry-free, which is the local-first default.
          TASK_OTLP_ENDPOINT: ${{ vars.TASK_OTLP_ENDPOINT }}
          TASK_OTLP_TOKEN: ${{ secrets.TASK_OTLP_TOKEN }}
          TASK_SENTRY_DSN: ${{ secrets.TASK_SENTRY_DSN }}
          # ── Studio product identity ──────────────────────────────────
          # The app crate (apps/studio/desktop): the front screen, Signal's
          # phone shell and Session's Blitz app, on one window.
          DX_PACKAGE: studio-desktop
          DX_APP_DIR: apps/studio/desktop
          # The same set as deploy-testflight.sh's default: the guitar and keys
          # rigs plus the embedded drum and e-kit rigs and tone3000 (the iPad
          # drum grid and the Libraries page assume them), and Session
          # (`session-app`). NOT the crate defaults: `tts` pulls ort/ONNX
          # Runtime, which publishes no prebuilt binary for aarch64-apple-ios
          # (ort-sys' build.rs panics); the guide runs on synthesized cues.
          DX_FEATURES: --no-default-features --features signal-guitar,signal-keys-rig,signal-drums-rig,signal-ekit-rig,tone3000,session-app
          # frame's faces ride in the bundle; frame is not checked out beside
          # the workspace on the runner, so say where it lives.
          FRAME_PLUGINS: /Volumes/build-disk/development/frame/examples/plugins
          # Bundle id must match apps/studio/desktop/Dioxus.toml.
          DX_BUNDLE_ID: app.fasttrackstudio.studio
          # Home-screen name; without it the device shows the crate name.
          APP_DISPLAY_NAME: Studio
          # Own profile, or each product's build revokes the last one's.
          PROFILE_NAME: FTS Studio App Store
          ICONS_DIR: ${{ github.workspace }}/apps/studio/desktop/ios/Assets.xcassets
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          export NIX=/nix/var/nix/profiles/default/bin/nix
          bash apps/studio/desktop/ios/deploy-testflight.sh

      - name: Summary
        if: always()
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_NO: ${{ steps.stamp.outputs.build_no }}
          RESULT: ${{ job.status }}
        run: |
          echo "### Studio iOS TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$TAG\` (\`$(git rev-parse --short HEAD)\`): marketing version \`$VERSION\`, build \`$BUILD_NO\`: $RESULT." >> "$GITHUB_STEP_SUMMARY"

  record:
    name: Record on the GitHub Release
    needs: [resolve, testflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      # So the Release and the TestFlight build can be traced to each other.
      - name: Marketing version + build number into the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_NO: ${{ needs.testflight.outputs.build_no }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/release.sh ios-record studio "$TAG" "$VERSION" "$BUILD_NO" "$RUN_URL"
