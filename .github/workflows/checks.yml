# studio — the promotion gate.
#
# WHEN THIS RUNS — the dev-first model, release flow v2
# (docs/agents/release-workflow.md):
#
#   PR -> dev           NOT here. The gate is a local `cargo check
#                       --workspace --all-targets` on the PR's head (or
#                       the full `just ci`: the same steps, in the same
#                       order, as below); pr-title.yml is the only job a
#                       PR into dev runs.
#   PROMOTION PR dev -> main (or hotfix/* -> main)   HERE, automatically,
#                       the FULL set (`Build + test`, required; plus the advisory
#                       job `Advisory: wasm + tests`, see below): main is "finished features", so this
#                       is the one place the whole workspace is checked
#                       and the Reviewer reads the diff. It runs once per
#                       promotion, not once per card.
#   RELEASE PR release/vX.Y.Z -> main   a one-commit version bump +
#                       changelog on top of main. The release guard proves
#                       it touches nothing else, so the `Plan` job below
#                       SKIPS the heavy job (a skipped job counts as
#                       passing for the required `Build + test` check):
#                       the content was checked when it was promoted.
#   by hand             `gh workflow run checks.yml --ref <branch>`.
#
# Never on push: a merge to main is the tree its PR already passed
# (release.yml's guard proves the merge commit's tree IS the head's tree),
# and nothing ships from a push to main. Production changes only when a v*
# tag is pushed.
#
# Runs on the org's self-hosted runner (THEBATTLESHIP, label `nix-host` —
# see fasttrackstudio/.flake modules/selfhost/services/github-runner.nix):
# nix and the toolchain live on the host already, so there is no installer
# step and no rust-cache action — CARGO_TARGET_DIR points at the runner
# instance's systemd CacheDirectory instead, which persists across runs
# (and across restarts/reboots) the way a hosted-runner cache never could.
#
# Toolchain comes from the repo flake: every step runs under
# `nix develop .#ci -c`. `--accept-flake-config` picks up the
# fasttrackstudio.cachix.org substituter from flake.nix nixConfig.
#
# Deliberately simple: no `cargo rail plan` to pick affected crates — the
# whole workspace is checked and tested, the same steps `just ci` runs
# locally, in the same order. Everything the workspace builds is in this
# repo (daw, processor, signal and patchbay were folded in), so there are
# no sibling checkouts.

name: checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_DEV: nix develop --accept-flake-config .#ci -c

jobs:
  # Is this PR only a release commit (version + changelog on top of main)?
  # Cheap, hosted; the heavy job below is skipped when it is.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_only: ${{ steps.plan.outputs.release_only }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Release commit only?
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && bash scripts/release.sh release-only; then
            echo "release_only=true" >> "$GITHUB_OUTPUT"
            echo "### Release commit only" >> "$GITHUB_STEP_SUMMARY"
            echo "This PR is one commit changing the version and CHANGELOG.md; its content was checked when it was promoted, so \`Build + test\` is skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release_only=false" >> "$GITHUB_OUTPUT"
          fi

  # REQUIRED by the ruleset `main (release only)` (25572127). Today it means:
  # manifests + lockfile, fmt, the flow gate, the tailwind sheet and
  # `cargo check --workspace`. The wasm check and the test run live in the
  # advisory job below until STA-184 makes them green.
  check:
    name: Build + test
    needs: plan
    runs-on: [self-hosted, session]
    timeout-minutes: 60
    # Fork PRs never run here: this is a public repo on a self-hosted runner,
    # and the job holds the inferno-control credential below. GitHub also
    # withholds secrets from fork PRs, so this is the second lock, and it
    # keeps fork code off the runner. (workflow_dispatch has no pull_request.)
    # A release-only PR skips it (Plan), as before.
    if: ${{ needs.plan.outputs.release_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v4
      # features/patchbay -> inferno-net is a git dep on the private
      # FastTrackStudios/inferno-control; give git/cargo a read-only token
      # for that one repo before anything resolves the workspace.
      - name: inferno-control read access
        uses: ./.github/actions/inferno-control-auth
        with:
          token: ${{ secrets.INFERNO_CONTROL_TOKEN }}
      - name: Persistent target dir
        run: |
          # On the runner's big disk ($CI_CACHE_DIR: the runner module's
          # per-instance dir on /run/media/Development), not /var/cache on
          # the root disk, which a 580 GB target dir filled until jobs died
          # mid-test. The fallbacks are for a runner without one.
          dir="${CI_CACHE_DIR:-${CACHE_DIRECTORY:-$HOME/.cache}}/cargo-target"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "target dir: $dir ($(du -sh "$dir" 2>/dev/null | cut -f1))"
      # Not `--locked`: cargo writes the lockfile's [[patch.unused]] trailer
      # in HashMap order — one group per patched source URL — so the same
      # inputs serialise differently from one run to the next and
      # `--locked` fails at random (observed
      # locally: four consecutive `cargo metadata` runs, three orderings).
      # Instead: resolve, then diff the committed lockfile against the
      # written one with the trailer compared as a sorted set. The whole
      # body runs inside the dev shell: the NixOS host has no `diff` on
      # the runner's PATH (sed/awk/sort happen to be there, diffutils is
      # not).
      - name: Manifests + lockfile
        run: |
          ${NIX_DEV} bash -euo pipefail -s <<'EOF'
          committed="$RUNNER_TEMP/Cargo.lock.committed"
          cp Cargo.lock "$committed"
          cargo metadata --format-version 1 > /dev/null
          packages() { sed '/^\[\[patch\.unused\]\]/,$d' "$1"; }
          unused() {
            awk '/^\[\[patch\.unused\]\]/ { f = 1; next }
                 f && /^name = /    { n = $3 }
                 f && /^version = / { print n "@" $3 }' "$1" | sort
          }
          ok=1
          diff -u <(packages "$committed") <(packages Cargo.lock) || ok=0
          diff -u <(unused "$committed") <(unused Cargo.lock) || ok=0
          if [ "$ok" = 0 ]; then
            echo "::error::Cargo.lock is out of date — run cargo metadata and commit the result"
            exit 1
          fi
          EOF
      - name: cargo fmt --check
        run: ${NIX_DEV} cargo fmt --all --check
      # Crate-layout boundaries (architect ADR layout.md, STA-268):
      # resolves graphs and scans sources, compiles nothing of studio's.
      # Layer table + ratcheted baselines in boundaries.toml.
      - name: Boundaries
        if: ${{ !cancelled() }}
        run: ${NIX_DEV} just ci-boundaries
      # The workflow-spec verification standard (#48): every `flow.*`
      # rule with an r[impl] has an r[verify], or the build is red.
      # Same recipe as local (`just daw-flows`); tracey is a store
      # binary in the ci shell. Cheap, so it runs before any cargo step.
      # `--own-daemon`: the script runs its own tracey daemon under a
      # short state dir — the runner's HOME pushes tracey's default
      # socket path past the 108-byte Unix limit — and stops it after.
      - name: Flow verification gate
        run: ${NIX_DEV} just daw-flows --own-daemon
      # apps/session/web/assets/tailwind.css is gitignored build output that
      # `asset!()` demands at compile time (see apps/session/web/tailwind.css) —
      # the sheet has to exist before any cargo step touches session-web.
      - name: Web tailwind sheet
        run: ${NIX_DEV} just web-tailwind
      - name: cargo check --workspace
        run: ${NIX_DEV} cargo check --workspace
      # Advisory only: the lint debt is being paid down crate by crate, so
      # this reports (grouped by lint and crate, .github/scripts/
      # clippy-report.py) without blocking the PR.
      - name: cargo clippy (advisory, does not block)
        continue-on-error: true
        run: |
          ${NIX_DEV} cargo clippy --workspace --no-deps --all-targets --keep-going \
            --message-format=json -- --cap-lints warn \
            | ${NIX_DEV} python3 .github/scripts/clippy-report.py

  # ADVISORY (not in the ruleset): the wasm check and the test run, which are
  # red on main for reasons that predate the dev-first workflow (STA-184: the
  # Signal browser build pulls tokio/mio into wasm; ~100 nextest failures).
  # Captain's call (STA-276, 2026-10-21): promote and cut v0.1.0 now, fix the
  # errors after. It goes BACK INTO `Build + test` (move the two steps up,
  # delete this job) once STA-184 makes it green. It still runs on every PR
  # into main and shows red/green on the PR, so the errors stay visible;
  # it is skipped, like `Build + test`, on a release-only PR.
  advisory:
    name: "Advisory: wasm + tests"
    needs: plan
    # Same locks as Build + test: no fork PRs on this runner, none on release-only.
    if: ${{ needs.plan.outputs.release_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, session]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: inferno-control read access
        uses: ./.github/actions/inferno-control-auth
        with:
          token: ${{ secrets.INFERNO_CONTROL_TOKEN }}
      - name: Persistent target dir
        run: |
          dir="${CI_CACHE_DIR:-${CACHE_DIRECTORY:-$HOME/.cache}}/cargo-target"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "target dir: $dir ($(du -sh "$dir" 2>/dev/null | cut -f1))"
      # apps/session/web/assets/tailwind.css is gitignored build output that
      # `asset!()` demands at compile time; the test run compiles session-web.
      - name: Web tailwind sheet
        run: ${NIX_DEV} just web-tailwind
      # The Signal browser remote: signal-desktop's web build, which the
      # workspace check (native) never compiles.
      - name: wasm check (Signal browser remote)
        run: |
          ${NIX_DEV} cargo check -p signal-desktop \
            --target wasm32-unknown-unknown --no-default-features --features signal
      - name: cargo nextest
        run: ${NIX_DEV} cargo nextest run --workspace --no-fail-fast --features session-desktop/cli,signal-desktop/cli,web-audio-worklet/guitar,web-audio-worklet/keys
