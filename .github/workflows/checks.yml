# Generated from xtask::workflows::checks (xtask/workflows/src/checks.rs)
# Rebuild with `just workflows`; do not edit by hand (`just workflows-check` fails CI on drift).
# The reasons for every job and step are comments in that Rust source.
name: CI
on:
  pull_request:
    branches:
    - release/**
  push:
    branches:
    - main
    - release/v*
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Plan
      id: plan
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -u
        case "${GITHUB_EVENT_NAME:-}" in
          pull_request)
            if [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
              echo "::error::fork PR into ${BASE_REF}: the full set runs on the org's paid runners; re-push it from a branch of this repo"
              exit 1
            fi
            echo "plan: PR into ${BASE_REF} (hotfix): the full set" ;;
          workflow_dispatch)
            echo "plan: dispatch on ${GITHUB_REF_NAME}: the full set" ;;
          *) echo "plan: ${GITHUB_EVENT_NAME:-?} on ${GITHUB_REF_NAME}: the full set" ;;
        esac
  rail:
    name: Rail plan
    needs: plan
    runs-on:
    - self-hosted
    - studio-main
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      full: ${{ steps.rail.outputs.full }}
      check: ${{ steps.rail.outputs.check }}
      cargo: ${{ steps.rail.outputs.cargo }}
      tests: ${{ steps.rail.outputs.tests }}
      test_filter: ${{ steps.rail.outputs.test_filter }}
      wasm: ${{ steps.rail.outputs.wasm }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 64
    - name: CI cargo config
      run: |
        mkdir -p ../.cargo
        cp .cargo/ci-config.toml ../.cargo/config.toml
    - name: cargo rail plan
      id: rail
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        nix develop --accept-flake-config .#ci --command bash -euo pipefail -s <<'EOF'
        store="${STUDIO_CACHE_DIR:?not a studio pool runner (no STUDIO_CACHE_DIR)}/rail-evidence"
        mkdir -p "$store/$GITHUB_SHA"
        gates_out() {
          printf '%s\n' "$1" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$1" > "$store/$GITHUB_SHA/gates"
        }
        full() {
          echo "plan: $1 -> the full set"
          gates_out $'full=true\ncargo=true\ncheck=true\ntests=true\ntest_filter=\nwasm=true'
          exit 0
        }
        if [ "$EVENT" != push ] || [ "$REF" != refs/heads/main ]; then
          full "$EVENT on $REF, not a push to main"
        fi
        # Keep the newest 40 commits' evidence (a few hundred KB each).
        find "$store" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -rn | tail -n +41 \
          | cut -d' ' -f2- | while read -r old; do rm -rf "$old"; done
        base=""
        for sha in $(git rev-list --first-parent --max-count=50 HEAD~1); do
          d="$store/$sha"
          [ -f "$d/cargo.build.json" ] && [ -f "$d/cargo.test.json" ] && [ -f "$d/gates" ] || continue
          green=1
          for job in check tests wasm; do
            if grep -qx "$job=true" "$d/gates" && [ ! -f "$d/$job.ok" ]; then green=0; fi
          done
          if [ "$green" = 1 ]; then base="$sha"; break; fi
        done
        [ -n "$base" ] || full "no green ancestor with rail evidence in the last 50 commits"
        ev=()
        for f in "$store/$base"/*.json; do ev+=(--evidence "$f"); done
        plan="$RUNNER_TEMP/rail-plan.json"
        cargo rail plan --from "$base" --to HEAD "${ev[@]}" --json > "$plan" \
          || full "cargo rail plan failed"
        gates="$(python3 scripts/ci-rail-plan.py "$plan")" || full "the plan could not be read"
        echo "plan: from $base (${#ev[@]} evidence file(s))"
        printf '%s\n' "$gates"
        gates_out "$gates"
        EOF
  deps-cache:
    name: Dependency cache
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Rust 1.94.0
      uses: dtolnay/rust-toolchain@1.94.0
    - name: Restore cargo's dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-deps-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-deps-${{ runner.os }}-
    - name: Fetch cargo's dependencies
      if: ${{ steps.deps.outputs.cache-hit != 'true' }}
      run: cargo fetch
    - name: Save cargo's dependencies
      if: ${{ steps.deps.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-deps-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
  gates:
    name: Gates
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@v4
    - name: Rust 1.94.0
      uses: dtolnay/rust-toolchain@1.94.0
      with:
        components: rustfmt
    - name: mold
      run: |
        sudo apt-get install -y --no-install-recommends mold
    - name: just
      uses: taiki-e/install-action@v2
      with:
        tool: just@1.48.1
    - name: cargo-rail 0.32.0
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-rail.zip" "https://github.com/loadingalias/cargo-rail/releases/download/v0.32.0/cargo-rail-x86_64-unknown-linux-gnu.zip"
        echo "5fcda1a62d36d51834ad49a5ef2ebc82777fd9d134d3d409f7021ce1a495dee4  $RUNNER_TEMP/cargo-rail.zip" | sha256sum -c -
        unzip -q -o "$RUNNER_TEMP/cargo-rail.zip" -d "$HOME/.local/share"
        echo "$HOME/.local/share/cargo-rail" >> "$GITHUB_PATH"
        "$HOME/.local/share/cargo-rail/cargo-rail" --version
    - name: actionlint 1.7.12
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$HOME/.local/bin" actionlint
        "$HOME/.local/bin/actionlint" -version
    - name: CI cargo config
      run: |
        mkdir -p ../.cargo
        cp .cargo/ci-config.toml ../.cargo/config.toml
    - name: Rust cache (gates, main saves)
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: gates
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
        cache-bin: false
    - name: Prune unused units before the cache is saved
      uses: ./.github/actions/prune-cargo-target
      with:
        target-dir: target
    - name: Manifests + lockfile
      run: |
        set -euo pipefail
        committed="$RUNNER_TEMP/Cargo.lock.committed"
        cp Cargo.lock "$committed"
        cargo metadata --format-version 1 > /dev/null
        packages() { sed '/^\[\[patch\.unused\]\]/,$d' "$1"; }
        unused() {
          awk '/^\[\[patch\.unused\]\]/ { f = 1; next }
               f && /^name = /    { n = $3 }
               f && /^version = / { print n "@" $3 }' "$1" | sort
        }
        ok=1
        diff -u <(packages "$committed") <(packages Cargo.lock) || ok=0
        diff -u <(unused "$committed") <(unused Cargo.lock) || ok=0
        if [ "$ok" = 0 ]; then
          echo "::error::Cargo.lock is out of date — run cargo metadata and commit the result"
          exit 1
        fi
    - name: Duplicate crate versions
      if: ${{ !cancelled() }}
      run: python3 scripts/check-duplicate-deps.py
    - name: cargo fmt --check
      if: ${{ !cancelled() }}
      run: cargo fmt --all --check
    - name: Workflows are generated (xtask-workflows check)
      if: ${{ !cancelled() }}
      run: cargo run -q -p xtask-workflows -- check
    - name: actionlint
      if: ${{ !cancelled() }}
      run: actionlint -color
    - name: cargo rail change check
      if: ${{ github.event_name == 'pull_request' }}
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git fetch --quiet --no-tags --depth=1 origin "${BASE_SHA}"
        cargo rail change check --since "${BASE_SHA}"
    - name: rail config
      if: ${{ !cancelled() }}
      run: cargo rail config validate --strict
    - name: Release tooling (sandbox)
      if: ${{ !cancelled() }}
      run: bash scripts/release-sandbox.sh
  check:
    name: Check
    needs:
    - plan
    - rail
    if: ${{ needs.rail.outputs.check == 'true' || needs.rail.outputs.cargo == 'true' }}
    runs-on:
    - self-hosted
    - studio-main
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: CI cargo config
      run: |
        mkdir -p ../.cargo
        cp .cargo/ci-config.toml ../.cargo/config.toml
    - name: Target dir (check, pool capped at 200 GB)
      run: |
        pool="${STUDIO_CACHE_DIR:?not a studio pool runner (no STUDIO_CACHE_DIR)}"
        dir="$pool/check"
        mkdir -p "$dir"
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
        used="$(du -s --block-size=1G "$pool" | cut -f1)"
        if [ "$used" -gt 200 ]; then
          echo "::warning::the pool cache is ${used} GB, over 200 GB: emptying $dir (a cold check build)"
          rm -rf "$dir" && mkdir -p "$dir"
        fi
        echo "target dir: $dir; pool $(du -sh "$pool" | cut -f1) of 200 GB; $(df -h "$pool" | awk 'NR==2 {print $4}') free on the disk"
    - name: cargo check --workspace
      env:
        RECORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
        nix develop --accept-flake-config .#ci --command bash -euo pipefail -s <<'EOF'
        if [ "$RECORD" = true ]; then
          ev="$STUDIO_CACHE_DIR/rail-evidence/$GITHUB_SHA"
          mkdir -p "$ev"
          cargo rail plan evidence --work cargo.build --output "$ev/cargo.build.json" -- check --workspace
          cargo rail plan evidence --work cargo.test --output "$ev/cargo.test.json" -- check --workspace --all-targets
        else
          cargo check --workspace
        fi
        EOF
    - name: Mark check green for rail
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
        mkdir -p "$STUDIO_CACHE_DIR/rail-evidence/$GITHUB_SHA"
        touch "$STUDIO_CACHE_DIR/rail-evidence/$GITHUB_SHA/check.ok"
    - name: cargo clippy (advisory, does not block)
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |
        nix develop --accept-flake-config .#ci --command bash -euo pipefail -s <<'EOF'
        cargo clippy --workspace --no-deps --all-targets --keep-going \
          --message-format=json -- --cap-lints warn \
          | python3 .github/scripts/clippy-report.py
        EOF
  wasm:
    name: Wasm
    needs:
    - plan
    - rail
    if: ${{ needs.rail.outputs.wasm == 'true' }}
    runs-on:
    - self-hosted
    - studio-main
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: CI cargo config
      run: |
        mkdir -p ../.cargo
        cp .cargo/ci-config.toml ../.cargo/config.toml
    - name: Target dir (wasm, pool capped at 200 GB)
      run: |
        pool="${STUDIO_CACHE_DIR:?not a studio pool runner (no STUDIO_CACHE_DIR)}"
        dir="$pool/wasm"
        mkdir -p "$dir"
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
        used="$(du -s --block-size=1G "$pool" | cut -f1)"
        if [ "$used" -gt 200 ]; then
          echo "::warning::the pool cache is ${used} GB, over 200 GB: emptying $dir (a cold wasm build)"
          rm -rf "$dir" && mkdir -p "$dir"
        fi
        echo "target dir: $dir; pool $(du -sh "$pool" | cut -f1) of 200 GB; $(df -h "$pool" | awk 'NR==2 {print $4}') free on the disk"
    - name: wasm check (web bundles)
      run: |
        nix develop --accept-flake-config .#ci --command bash -euo pipefail -s <<'EOF'
        just web-wasm-check
        EOF
    - name: wasm check (Signal browser remote)
      if: ${{ !cancelled() }}
      run: |
        nix develop --accept-flake-config .#ci --command bash -euo pipefail -s <<'EOF'
        just signal-wasm-check
        EOF
    - name: Mark wasm green for rail
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
        mkdir -p "$STUDIO_CACHE_DIR/rail-evidence/$GITHUB_SHA"
        touch "$STUDIO_CACHE_DIR/rail-evidence/$GITHUB_SHA/wasm.ok"
  tests:
    name: Tests
    needs:
    - plan
    - rail
    if: ${{ needs.rail.outputs.tests == 'true' }}
    runs-on:
    - self-hosted
    - studio-main
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: CI cargo config
      run: |
        mkdir -p ../.cargo
        cp .cargo/ci-config.toml ../.cargo/config.toml
    - name: Target dir (tests, pool capped at 200 GB)
      run: |
        pool="${STUDIO_CACHE_DIR:?not a studio pool runner (no STUDIO_CACHE_DIR)}"
        dir="$pool/tests"
        mkdir -p "$dir"
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
        used="$(du -s --block-size=1G "$pool" | cut -f1)"
        if [ "$used" -gt 200 ]; then
          echo "::warning::the pool cache is ${used} GB, over 200 GB: emptying $dir (a cold tests build)"
          rm -rf "$dir" && mkdir -p "$dir"
        fi
        echo "target dir: $dir; pool $(du -sh "$pool" | cut -f1) of 200 GB; $(df -h "$pool" | awk 'NR==2 {print $4}') free on the disk"
    - name: Asset repo token (main runs only)
      id: assets-token
      if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.FORGE_APP_ID }}
        private-key: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
        owner: FastTrackStudios
        repositories: studio-assets,rig-models,mic-models
        permission-contents: read
    - name: Assets (studio-assets, rig-models, mic-models)
      env:
        ASSETS_TOKEN: ${{ steps.assets-token.outputs.token }}
      run: |
        store="${STUDIO_CACHE_DIR:-${CI_CACHE_DIR:-${CACHE_DIRECTORY:-$HOME/.cache}}}/assets"
        mkdir -p "$store"
        [ -L .assets ] || [ -e .assets ] || ln -s "$store" .assets
        if [ -n "${ASSETS_TOKEN}" ]; then
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${ASSETS_TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          nix develop --accept-flake-config .#ci --command just assets
        elif [ -d "$store/studio-assets/.git" ] && [ -d "$store/rig-models/.git" ] && [ -d "$store/mic-models/.git" ]; then
          echo "no asset credential on this run (only main's full runs fetch): linking the clones this runner holds"
          ASSETS_OFFLINE=1 nix develop --accept-flake-config .#ci --command just assets
        else
          echo "::warning::no asset clones on this runner yet and no credential to fetch them (a main run fetches them): tests that need assets will fail"
        fi
    - name: cargo nextest
      id: nextest
      env:
        TEST_LOG: ${{ runner.temp }}/nextest-ci.log
        TEST_FILTER: ${{ needs.rail.outputs.test_filter }}
      run: |
        nix develop --accept-flake-config .#ci --command bash -euo pipefail -s <<'EOF'
        pkgs=()
        for p in $(just --evaluate test_packages); do pkgs+=(-p "$p"); done
        echo "packages: ${pkgs[*]}"
        t0=$(date +%s)
        cargo nextest run "${pkgs[@]}" --no-run >"${TEST_LOG}" 2>&1
        rc=$?
        t1=$(date +%s)
        # The rail plan's filter: only the tests of the packages the change
        # reaches (empty: all of them). The build above is the whole set either way
        # (warm, it rebuilds only what changed).
        filter=()
        [ -n "${TEST_FILTER:-}" ] && filter=(-E "${TEST_FILTER}" --no-tests=pass)
        echo "filter: ${TEST_FILTER:-<all>}"
        if [ "$rc" = 0 ]; then
          cargo nextest run "${pkgs[@]}" --no-fail-fast ${filter[@]+"${filter[@]}"} >>"${TEST_LOG}" 2>&1
          rc=$?
        fi
        t2=$(date +%s)
        { echo "### tests: timing"
          echo "| phase | seconds |"
          echo "|---|---|"
          echo "| build (nextest --no-run) | $((t1 - t0)) |"
          echo "| tests | $((t2 - t1)) |"
          echo
          echo "exit ${rc}"; } >> "${GITHUB_STEP_SUMMARY}"
        { grep -E '^ *(FAIL|TRY [0-9]+ (FAIL|TMT)|SIGSEGV|SIGABRT|LEAK|TIMEOUT)|Summary \[|tests were not run|^error' "${TEST_LOG}" | head -n 200
          echo "── tail of the nextest log (full log: the nextest-ci artifact) ──"; tail -n 60 "${TEST_LOG}"; } || true
        exit "$rc"
        EOF
    - name: Test log
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: nextest-ci
        path: ${{ runner.temp }}/nextest-ci.log
        if-no-files-found: ignore
        retention-days: 7
    - name: Mark tests green for rail
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: |
        mkdir -p "$STUDIO_CACHE_DIR/rail-evidence/$GITHUB_SHA"
        touch "$STUDIO_CACHE_DIR/rail-evidence/$GITHUB_SHA/tests.ok"
  release-macos:
    name: Release tooling (macOS)
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Release tooling (sandbox, macOS system tools only)
      run: |
        env -i HOME="$HOME" TMPDIR="$RUNNER_TEMP" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
          /bin/bash scripts/release-sandbox.sh
  ci-passed:
    name: CI passed
    needs:
    - plan
    - rail
    - gates
    - check
    - wasm
    - tests
    - release-macos
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
    - name: Every required job succeeded
      env:
        PLAN: ${{ needs.plan.result }}
        RAIL: ${{ needs.rail.result }}
        GATES: ${{ needs.gates.result }}
        CHECK: ${{ needs.check.result }}
        WASM: ${{ needs.wasm.result }}
        TESTS: ${{ needs.tests.result }}
        RELEASE_MACOS: ${{ needs.release-macos.result }}
      run: |
        set -u
        fail=0
        bad() { echo "::error::$1"; fail=1; }
        [ "$PLAN" = success ] || { bad "plan: $PLAN"; exit 1; }
        [ "$RAIL" = success ] || { bad "rail plan: $RAIL"; exit 1; }
        for job in "gates:$GATES" "release-macos:$RELEASE_MACOS"; do
          [ "${job#*:}" = success ] || bad "${job%%:*}: ${job#*:}"
          echo "$job"
        done
        # The builds: skipped is fine when the rail plan skipped them (nothing they
        # cover changed since a green base); anything else must have succeeded.
        for job in "check:$CHECK" "wasm:$WASM" "tests:$TESTS"; do
          case "${job#*:}" in
            success | skipped) ;;
            *) bad "${job%%:*}: ${job#*:}" ;;
          esac
          echo "$job"
        done
        exit "$fail"
    - name: Post Local CI for a green dispatched run
      if: ${{ success() && github.event_name == 'workflow_dispatch' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --silent \
          -f state=success -f context="Local CI" \
          -f description="full run on GitHub (${GITHUB_RUN_ID})" \
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        echo "Local CI posted on ${GITHUB_SHA}"
