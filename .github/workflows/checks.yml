# studio — the fast checks on every PR, the full set after every merge.
#
# WHEN THIS RUNS — fleet flow v4, trunk-based (the `release-workflow`
# skill; docs/agents/release-workflow.md):
#
#   PR -> main          HERE, the AFFECTED set (rail plan against the PR's
#                       base commit, see CHANGE SELECTION), plus `cargo
#                       rail change check` (every changed crate has a
#                       change file in .changes/). The required check is
#                       `Build + test` (the aggregator at the end). PRs
#                       squash-merge into main.
#   PR -> release/**    a hotfix onto a release line (just release-hotfix):
#                       the FULL set, never narrowed.
#   RELEASE PR release/pending -> main (or -> release/v*)   one commit: the
#                       CalVer bump + the changelog built from .changes/.
#                       The plan runs the release guard from the BASE
#                       commit's scripts/release.sh: a sound release PR
#                       SKIPS every heavy job (`Build + test` still runs
#                       and passes: its content was checked when it merged
#                       into main); a release PR the guard refuses FAILS
#                       `Build + test`.
#   push to main        the FULL set, once per merge, and records rail
#   (and release/**)    EVIDENCE for that commit (main only): it is the
#                       base the next PRs plan against, and a green
#                       `Build + test` on a release merge commit is what
#                       `just release-tag` requires. Nothing ships from a
#                       push: production changes only when a v* tag is
#                       pushed.
#   nightly             the FULL set on main.
#   by hand             `gh workflow run checks.yml --ref <branch>` runs
#                       everything; add `-f base=main` to check only what the
#                       branch changed against main.
#
# RUNNERS: light and parallel work on GitHub-HOSTED runners (public repo:
# free, ~20 concurrent Linux jobs org-wide); only the heavy test build on
# the self-hosted Mac Pro VM, whose warm target dir it needs:
#
#   ubuntu-latest  plan (nix + cargo metadata), lint (fmt, manifests,
#                  Boundaries, flow gate, tailwind, `cargo check
#                  --workspace`, clippy: check mode, no codegen), wasm
#                  (the wasm32 checks), and the `Build + test` aggregator
#   studio-tests   (self-hosted) the nextest build + rail evidence: ~1460
#                  crates and 814 test binaries at full codegen, 20 min
#                  on the warm Mac Pro; cold on a 4-vCPU hosted runner it
#                  would not fit the disk or the 10 GB cache budget.
#
# The three build kinds share NO artifacts except build scripts and proc
# macros (check-mode units are not the test build's units, and wasm32
# units are another triple), so they run as separate jobs side by side.
#
# HOSTED jobs (.github/actions/hosted-nix): free the image's disk, install
# nix, pull the ci shell from fasttrackstudio.cachix.org (cache-devshell.yml
# seeds it), then Swatinem/rust-cache with ONE shared key per build kind
# (`lint`, `wasm`). Only main SAVES (`save-if`): PRs restore main's entry
# and never write their own, so the repo's 10 GB cache budget holds one
# lint set + one wasm set + the small rail-evidence and architect-xtask
# entries instead of being evicted by every open PR. `cache-on-failure`:
# the cache holds compiled dependencies, not results. Debuginfo is
# line-tables-only (as [profile.dev] already sets) and incremental is off.
#
# The SELF-HOSTED tests job has nix and the toolchain on the runner already,
# so there is no installer step and no rust-cache action — CARGO_TARGET_DIR
# points at the runner instance's own cache dir instead, which persists
# across runs (and across restarts/reboots).
#
# Toolchain comes from the repo flake: every step runs under
# `nix develop .#ci -c`. `--accept-flake-config` picks up the
# fasttrackstudio.cachix.org substituter from flake.nix nixConfig.
# Everything the workspace builds is in this repo (daw, processor, signal
# and patchbay were folded in), so there are no sibling checkouts.
#
# CHANGE SELECTION: the `plan` job asks `cargo rail plan` (0.32, built in
# nix/modules/cargo-rail.nix) which workspace packages a change affects,
# through cargo's resolved reverse-dependency graph, and
# scripts/ci-rail-plan.py turns that into gates plus a nextest filterset.
# Only which tests RUN narrows; the test BUILD stays --workspace so the
# warm target dir keeps one artifact set. Full runs (push to main, the
# nightly, a dispatch without `base`) record rail's observed-input
# evidence for their commit (dep-info of every unit, no extra compiling)
# into the Actions cache; a later plan against that commit restores it,
# which is what lets a docs/fixture change narrow instead of widening to
# the whole workspace. Workflow, Justfile, nix, scripts or nextest-config
# changes (.config/rail.toml [plan.work.*]), workspace scope, or any rail
# failure FAIL OPEN to the full set.

name: checks

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      base:
        description: "Only check crates affected since this ref (e.g. main). Empty = everything."
        required: false
        default: ""
  schedule:
    - cron: "47 10 * * *"

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'run' }}
  cancel-in-progress: true

env:
  NIX_DEV: nix develop --accept-flake-config .#ci -c

jobs:
  # Which jobs have work: a sound release PR skips them all (a refused one
  # fails here); otherwise rail decides (or the run is full). Hosted, with
  # the nix ci shell for cargo-rail.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork PRs never run here: the tests job runs on a self-hosted runner,
    # and fork code must not run on it. GitHub also withholds secrets from
    # fork PRs. Every other job needs this one, so
    # they skip with it, and `Build + test` fails the fork PR rather than
    # passing it unchecked. (push/schedule/workflow_dispatch have no
    # pull_request.)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      full: ${{ steps.filter.outputs.full }}
      cargo: ${{ steps.filter.outputs.cargo }}
      tests: ${{ steps.filter.outputs.tests }}
      test_filter: ${{ steps.filter.outputs.test_filter }}
      wasm: ${{ steps.filter.outputs.wasm }}
      skip: ${{ steps.filter.outputs.skip }}
      record: ${{ steps.filter.outputs.record }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the plan needs both diff endpoints' ancestry, and
          # the release guard the PR's base and head.
          fetch-depth: 0
      - uses: ./.github/actions/hosted-nix
      # Which commit to plan against, decided before the evidence restore
      # (its cache key is that commit).
      - name: Choose the comparison base
        id: base
        env:
          DISPATCH_BASE: ${{ inputs.base }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          base=""
          case "${GITHUB_EVENT_NAME:-}" in
            pull_request) base="${BASE_SHA}" ;;
            workflow_dispatch)
              if [ -n "${DISPATCH_BASE}" ]; then
                git fetch --quiet origin "${DISPATCH_BASE}" || true
                base="$(git merge-base "origin/${DISPATCH_BASE}" HEAD 2>/dev/null || true)"
              fi ;;
          esac
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
          echo "base: ${base:-<none: full run>}"
      - name: Restore rail evidence for the base
        if: ${{ steps.base.outputs.sha != '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rail-evidence
          key: rail-evidence-${{ runner.os }}-${{ runner.arch }}-cargo.test-${{ steps.base.outputs.sha }}
      - name: Plan affected crates
        id: filter
        env:
          BASE: ${{ steps.base.outputs.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVIDENCE: ${{ runner.temp }}/rail-evidence/cargo.test.json
        run: |
          set -u

          # Fail open: if we cannot compute an honest plan, run everything.
          run_all() {
            echo "plan: $1 — running EVERYTHING"
            printf 'full=true\ncargo=true\ntests=true\ntest_filter=\nwasm=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          skip_all() {
            echo "plan: $1 — nothing to run"
            printf 'skip=true\nfull=false\ncargo=false\ntests=false\ntest_filter=\nwasm=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Full runs record evidence for the commit they check, so later
          # plans against it can narrow.
          record() { echo "record=true" >> "$GITHUB_OUTPUT"; }

          case "${GITHUB_EVENT_NAME:-}" in
            pull_request)
              # A release PR (release/pending): the release guard, run from
              # the BASE commit's copy of the script (never the PR's, which
              # could exempt itself). 0 = sound: version + changelog only,
              # its content was checked when it merged, skip the heavy
              # jobs. 3 = refused: fail, which fails `Build + test`.
              # 1 = not a release PR: plan as usual.
              rc=1
              if git show "${BASE_SHA}:scripts/release.sh" > "${RUNNER_TEMP}/release-base.sh" 2>/dev/null; then
                bash "${RUNNER_TEMP}/release-base.sh" release-only || rc=$?
                [ "$rc" = 0 ] || [ "$rc" = 1 ] || rc=3
              fi
              case "$rc" in
                0)
                  {
                    echo "### Release commit only"
                    echo "This PR is one commit changing the version, CHANGELOG.md and consumed change files; its content was checked when it merged, so the heavy jobs are skipped."
                  } >> "$GITHUB_STEP_SUMMARY"
                  skip_all "release commit only (${HEAD_REF} -> ${BASE_REF})" ;;
                3)
                  echo "::error::${HEAD_REF} -> ${BASE_REF} is a release PR the release guard refuses (see above)"
                  exit 1 ;;
              esac
              # A hotfix onto a release line ships on its own: never narrowed.
              case "${BASE_REF}" in
                release/*) run_all "PR into ${BASE_REF}: a hotfix line runs the full set" ;;
              esac ;;
            push)
              # Evidence is only visible to other branches' PRs when saved
              # on main (cargo-rail.md), so release lines don't record it.
              [ "${GITHUB_REF_NAME}" != main ] || record
              run_all "push to ${GITHUB_REF_NAME}: full set after every merge" ;;
            schedule)
              record; run_all "nightly (main)" ;;
            workflow_dispatch)
              [ -n "${BASE}" ] || { record; run_all "manual dispatch"; } ;;
            *) run_all "event ${GITHUB_EVENT_NAME:-?}" ;;
          esac
          [ -n "${BASE}" ] || run_all "no comparison base"

          ev=()
          if [ -f "${EVIDENCE}" ]; then
            ev=(--evidence "${EVIDENCE}")
            echo "plan: using rail evidence for ${BASE}"
          else
            echo "plan: no rail evidence for ${BASE} (non-Rust changes will widen)"
          fi
          # rail reads .config/rail.toml from the commits it compares: a base
          # with the pre-0.32 config fails here, which runs everything.
          plan="${RUNNER_TEMP}/rail-plan.json"
          ${NIX_DEV} cargo rail plan --from "${BASE}" --to HEAD "${ev[@]}" --json > "${plan}" \
            || run_all "cargo rail plan failed"
          ${NIX_DEV} cargo rail plan --from "${BASE}" --to HEAD "${ev[@]}" --explain-work cargo.test || true

          gates="$(${NIX_DEV} python3 scripts/ci-rail-plan.py "${plan}")" \
            || run_all "plan parse failed"
          [ -n "${gates}" ] || run_all "plan parse produced no gates"
          echo "${gates}" >> "$GITHUB_OUTPUT"
          echo "${gates}"

  # REQUIRED (through `Build + test`): manifests + lockfile, fmt, the
  # boundaries and flow gates, the tailwind sheet and `cargo check
  # --workspace`. Clippy reports here too, advisory.
  lint:
    name: "Lint (fmt + manifests + gates + check + clippy)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    env: &hosted-cargo-env
      # [profile.dev] already says line-tables-only; pinned here too so a
      # profile edit cannot silently fatten the cached target dir.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      # The event's own ref: a PR's merge ref, the pushed commit, main for
      # the nightly, a dispatched branch.
      - &checkout
        uses: actions/checkout@v4
      - &hosted-nix
        uses: ./.github/actions/hosted-nix
      # One shared key per build kind, saved by main only (see RUNNERS).
      # `key: flake.lock` because the toolchain is nix's, not the rustc on
      # the image's PATH that rust-cache fingerprints by default.
      - name: Rust cache (lint, main saves)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          cache-bin: false
      # Not `--locked`: cargo writes the lockfile's [[patch.unused]] trailer
      # in HashMap order — one group per patched source URL — so the same
      # inputs serialise differently from one run to the next and
      # `--locked` fails at random (observed
      # locally: four consecutive `cargo metadata` runs, three orderings).
      # Instead: resolve, then diff the committed lockfile against the
      # written one with the trailer compared as a sorted set. The whole
      # body runs inside the dev shell: the NixOS host has no `diff` on
      # the runner's PATH (sed/awk/sort happen to be there, diffutils is
      # not).
      - name: Manifests + lockfile
        run: |
          ${NIX_DEV} bash -euo pipefail -s <<'EOF'
          committed="$RUNNER_TEMP/Cargo.lock.committed"
          cp Cargo.lock "$committed"
          cargo metadata --format-version 1 > /dev/null
          packages() { sed '/^\[\[patch\.unused\]\]/,$d' "$1"; }
          unused() {
            awk '/^\[\[patch\.unused\]\]/ { f = 1; next }
                 f && /^name = /    { n = $3 }
                 f && /^version = / { print n "@" $3 }' "$1" | sort
          }
          ok=1
          diff -u <(packages "$committed") <(packages Cargo.lock) || ok=0
          diff -u <(unused "$committed") <(unused Cargo.lock) || ok=0
          if [ "$ok" = 0 ]; then
            echo "::error::Cargo.lock is out of date — run cargo metadata and commit the result"
            exit 1
          fi
          EOF
      # fmt is ungated: it compiles nothing, so change selection would
      # save nothing.
      - name: cargo fmt --check
        run: ${NIX_DEV} cargo fmt --all --check
      # Release intent (fleet flow v4): every crate a PR changes needs a
      # change file in .changes/ (`cargo rail change add <crates> --bump
      # <none|patch|minor|major> -m "<note>"`); the release builds the
      # changelog from them. PRs only: a push or the nightly has no
      # "change" to describe, and a release PR never reaches this job.
      # `--since <the PR's base commit>` rather than `--merge-base`: the
      # checkout is shallow (no default-branch ref to find a merge-base
      # with), and for a PR into a release/v* line the merge-base with main
      # would count the line's earlier, already-consumed hotfixes.
      - name: cargo rail change check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --no-tags --depth=1 origin "${BASE_SHA}"
          ${NIX_DEV} cargo rail change check --since "${BASE_SHA}"
      # Crate-layout boundaries (architect ADR layout.md, STA-268):
      # resolves graphs and scans sources, compiles nothing of studio's.
      # Layer table + ratcheted baselines in boundaries.toml.
      # architect's xtask, `cargo install`ed by `just ci-boundaries` into
      # ~/.cache/architect-xtask/<tag> (4+ minutes cold). Keyed on the
      # pinned tag, so an entry never changes and is saved once.
      - name: architect xtask tag
        id: xtask
        if: ${{ !cancelled() }}
        run: echo "tag=$(sed -n 's/^architect_xtask_tag := "\(.*\)"$/\1/p' Justfile)" >> "$GITHUB_OUTPUT"
      - name: Restore architect xtask
        id: xtask-cache
        if: ${{ !cancelled() && steps.xtask.outputs.tag != '' }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/architect-xtask/${{ steps.xtask.outputs.tag }}
          key: architect-xtask-${{ runner.os }}-${{ steps.xtask.outputs.tag }}-${{ hashFiles('flake.lock') }}
      - name: Boundaries
        if: ${{ !cancelled() }}
        run: ${NIX_DEV} just ci-boundaries
      # Saved even when Boundaries reports violations: the binary is fine.
      - name: architect xtask built?
        id: xtask-built
        if: ${{ !cancelled() && steps.xtask.outputs.tag != '' && steps.xtask-cache.outputs.cache-hit != 'true' }}
        env:
          TAG: ${{ steps.xtask.outputs.tag }}
        run: |
          if [ -x "$HOME/.cache/architect-xtask/${TAG}/bin/xtask" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save architect xtask
        if: ${{ !cancelled() && steps.xtask-built.outputs.yes == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/architect-xtask/${{ steps.xtask.outputs.tag }}
          key: architect-xtask-${{ runner.os }}-${{ steps.xtask.outputs.tag }}-${{ hashFiles('flake.lock') }}
      # The workflow-spec verification standard (#48): every `flow.*`
      # rule with an r[impl] has an r[verify], or the build is red.
      # Same recipe as local (`just daw-flows`); tracey is a store
      # binary in the ci shell. Cheap, so it runs before any cargo step.
      # `--own-daemon`: the script runs its own tracey daemon under a
      # short state dir — the runner's HOME pushes tracey's default
      # socket path past the 108-byte Unix limit — and stops it after.
      - name: Flow verification gate
        if: ${{ !cancelled() }}
        run: ${NIX_DEV} just daw-flows --own-daemon
      # apps/session/web/assets/tailwind.css is gitignored build output that
      # `asset!()` demands at compile time (see apps/session/web/tailwind.css) —
      # the sheet has to exist before any cargo step touches session-web.
      # Every job that compiles session-web runs this itself: the jobs share
      # no checkout.
      - &tailwind
        name: Web tailwind sheet
        if: ${{ !cancelled() }}
        run: ${NIX_DEV} just web-tailwind
      # Gated on the plan: a change that touches no crate (docs, with
      # evidence for the base) compiles nothing. From here on every step
      # runs even when an earlier gate failed (`!cancelled()`), so one run
      # reports fmt AND Boundaries AND check instead of one at a time; the
      # job still fails.
      - name: cargo check --workspace
        if: ${{ !cancelled() && needs.plan.outputs.cargo == 'true' }}
        run: ${NIX_DEV} cargo check --workspace
      # Advisory only: the lint debt is being paid down crate by crate, so
      # this reports (grouped by lint and crate, .github/scripts/
      # clippy-report.py) without blocking the PR. Same check-mode
      # dependency metadata as `cargo check`, so it lives in this job.
      - name: cargo clippy (advisory, does not block)
        if: ${{ !cancelled() && needs.plan.outputs.cargo == 'true' }}
        continue-on-error: true
        run: |
          ${NIX_DEV} cargo clippy --workspace --no-deps --all-targets --keep-going \
            --message-format=json -- --cap-lints warn \
            | ${NIX_DEV} python3 .github/scripts/clippy-report.py
      # What this kind would put in the Actions cache (rust-cache trims
      # the workspace crates before saving, so the entry is smaller), and
      # the disk left: the numbers to watch against the 10 GB budget.
      - &footprint
        name: Cache footprint
        if: ${{ always() }}
        run: |
          du -sh target ~/.cargo/registry ~/.cargo/git 2>/dev/null || true
          df -h / | tail -n 1

  # The browser builds, which the workspace check (native) never compiles.
  # REQUIRED part: the web bundles. ADVISORY part: the Signal browser remote
  # (red since STA-184: it pulls tokio/mio into wasm), which reports but
  # cannot fail the job.
  wasm:
    name: wasm checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' && needs.plan.outputs.wasm == 'true' }}
    env: *hosted-cargo-env
    steps:
      - *checkout
      - *hosted-nix
      - name: Rust cache (wasm, main saves)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          cache-bin: false
      - *tailwind
      # The three web bundles deploy.yml ships (STA-366). The workspace check
      # is native, so it never compiles them: a native-only dep (tokio `net`,
      # an engine, an X11/HID crate) leaking into their graph stayed hidden
      # until the deploy itself failed. Same targets and features as
      # nix/modules/packages/web-bundles.nix builds (`just web-wasm-check`).
      - name: wasm check (web bundles)
        run: ${NIX_DEV} just web-wasm-check
      # The Signal browser remote: studio-desktop's web build. Advisory
      # until STA-184 makes it green; then drop continue-on-error and it is
      # required like the bundles.
      - name: wasm check (Signal browser remote, advisory)
        id: signal
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          ${NIX_DEV} cargo check -p studio-desktop \
            --target wasm32-unknown-unknown --no-default-features --features signal
      - name: Advisory result
        if: ${{ !cancelled() && steps.signal.outcome == 'failure' }}
        run: |
          echo "::warning::wasm check (Signal browser remote) failed — advisory (STA-184), does not block"
          echo "### Signal browser remote wasm check failed (advisory, STA-184)" >> "$GITHUB_STEP_SUMMARY"
      - *footprint

  # ADVISORY (not part of `Build + test`): the test run, red on main for
  # reasons that predate the release flow (STA-184: ~100 nextest
  # failures). Captain's call (STA-276, 2026-10-21): release now, fix the
  # errors after. It shows red/green on the PR, so the errors stay
  # visible; once STA-184 makes it green, add it to the aggregator's
  # required set. It is skipped on a release-only PR.
  #
  # SELF-HOSTED on purpose (the one heavy job): ~1460 crates at full codegen
  # into 814 test binaries took 20 min to build on the warm Mac Pro
  # (run 39654183163); the tests themselves ran in 4.5 min. Cold on a
  # hosted runner that build would cost well over an hour every PR and a
  # target dir larger than the whole 10 GB cache budget.
  tests:
    name: "Advisory: tests"
    runs-on: [self-hosted, studio-tests]
    timeout-minutes: 90
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' && needs.plan.outputs.tests == 'true' }}
    env:
      # The app CLIs and the worklet rigs sit behind features: name them, or
      # their tests never build (an app crate has no lib to dev-depend on).
      # Same list as `just test` / `just ci`; the evidence recording below
      # uses it too, so both builds are the same units.
      TEST_FEATURES: session-desktop/cli,studio-desktop/cli,web-audio-worklet/guitar,web-audio-worklet/keys
    steps:
      - *checkout
      - name: Persistent target dir
        run: |
          # On the runner's big disk ($CI_CACHE_DIR: the runner module's
          # per-instance dir), not /var/cache on the root disk, which a
          # 580 GB target dir filled until jobs died mid-test. Per instance,
          # so instances never share a cargo lock. The fallbacks are for a
          # runner without one.
          dir="${CI_CACHE_DIR:-${CACHE_DIRECTORY:-$HOME/.cache}}/cargo-target"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "target dir: $dir ($(du -sh "$dir" 2>/dev/null | cut -f1))"
      # The test run compiles session-web.
      - *tailwind
      # Full runs first record rail evidence for this commit: the recorder
      # wraps rustc for one `cargo test --no-run` (units already fresh keep
      # their dep-info, so this compiles nothing nextest wouldn't), and the
      # nextest run after it finds every unit fresh. Best effort: a failure
      # only means later plans against this commit widen. Not `--locked`,
      # for the [[patch.unused]] ordering reason in the lint job.
      - name: Record rail evidence
        if: ${{ needs.plan.outputs.record == 'true' }}
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/rail-evidence
        run: |
          mkdir -p "${EVIDENCE_DIR}"
          ${NIX_DEV} cargo rail plan evidence --work cargo.test \
            --output "${EVIDENCE_DIR}/cargo.test.json" \
            -- test --workspace --no-run --features "${TEST_FEATURES}" \
            || echo "::warning::rail evidence not recorded; later plans against this commit widen"
      # TEST_FILTER: a nextest filterset from the plan job (only the packages
      # a PR affects, scripts/ci-rail-plan.py). Empty = every test. The BUILD
      # stays --workspace either way so the warm target dir keeps one
      # artifact set; only which tests run narrows.
      #
      # nextest's report goes to a FILE, then a digest to the step's log. On
      # the Mac Pro VM runners Task's nextest died with exit 110, "error
      # writing to output", at the first failing test's captured output:
      # writing to the runner's stdout pipe failed. A regular file cannot do
      # that. The full log is the `nextest-ci` artifact.
      - name: cargo nextest
        env:
          TEST_FILTER: ${{ needs.plan.outputs.test_filter }}
          TEST_LOG: ${{ runner.temp }}/nextest-ci.log
        run: |
          ${NIX_DEV} bash -uo pipefail -s <<'EOF'
          filter=()
          [ -n "${TEST_FILTER}" ] && filter=(-E "${TEST_FILTER}" --no-tests=pass)
          cargo nextest run --workspace --no-fail-fast --features "${TEST_FEATURES}" "${filter[@]}" >"${TEST_LOG}" 2>&1
          rc=$?
          { grep -E '^ *(FAIL|TRY [0-9]+ (FAIL|TMT)|SIGSEGV|SIGABRT|LEAK|TIMEOUT)|Summary \[|tests were not run|^error' "${TEST_LOG}" | head -n 200
            echo "── tail of the nextest log (full log: the nextest-ci artifact) ──"; tail -n 60 "${TEST_LOG}"; } || true
          exit "$rc"
          EOF
      - name: Evidence key
        id: evidence
        if: ${{ always() && needs.plan.outputs.record == 'true' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [ -f "${RUNNER_TEMP}/rail-evidence/cargo.test.json" ] && echo "have=true" >> "$GITHUB_OUTPUT" || true
      # Saved even when tests are red: evidence describes the build, not the
      # results. Only saves on main (and the nightly's default-branch scope)
      # are visible to other branches' PRs.
      - name: Save rail evidence
        if: ${{ always() && steps.evidence.outputs.have == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rail-evidence
          key: rail-evidence-${{ runner.os }}-${{ runner.arch }}-cargo.test-${{ steps.evidence.outputs.sha }}
      - name: Test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-ci
          path: ${{ runner.temp }}/nextest-ci.log
          if-no-files-found: ignore
          retention-days: 7

  # The REQUIRED check: its name is what the `main` ruleset (25572127)
  # requires, unchanged from the single-job days, and what `just
  # release-tag` and the tag guards require green on a release. A required
  # check that is skipped counts as passing, so this never skips: it fails
  # unless every REQUIRED job the plan asked for succeeded (lint, and wasm
  # when the plan gave it work). A job may only be skipped when the plan
  # said it had no work. The advisory work (clippy, the Signal browser
  # remote, the tests job) cannot fail it.
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, lint, wasm, tests]
    if: ${{ always() }}
    steps:
      - name: Every required job succeeded
        env:
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          LINT: ${{ needs.lint.result }}
          WASM: ${{ needs.wasm.result }}
          WANT_WASM: ${{ needs.plan.outputs.wasm }}
          TESTS: ${{ needs.tests.result }}
          WANT_TESTS: ${{ needs.plan.outputs.tests }}
        run: |
          set -u
          fail=0
          bad() { echo "::error::$1"; fail=1; }
          if [ "$FORK" = "true" ]; then
            bad "fork PR: not run (the tests job is self-hosted); a maintainer must re-push it from a branch of this repo"
            exit 1
          fi
          [ "$PLAN" = success ] || bad "plan: $PLAN"
          if [ "$SKIP" = "true" ]; then
            echo "plan: nothing to run (release commit)"; exit "$fail"
          fi
          check() { # name result wanted
            if [ "$3" = "true" ]; then
              [ "$2" = success ] || bad "$1: $2"
            else
              case "$2" in success|skipped) ;; *) bad "$1: $2" ;; esac
            fi
            echo "$1: $2 (wanted=$3)"
          }
          check lint "$LINT" true
          check wasm "$WASM" "$WANT_WASM"
          # Advisory (STA-184): reported, never fails this check.
          echo "tests (advisory): $TESTS (wanted=$WANT_TESTS)"
          case "$TESTS" in success|skipped) ;; *) echo "::warning::tests (advisory): $TESTS" ;; esac
          exit "$fail"
