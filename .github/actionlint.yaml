# Runner labels used by this repo's workflows that actionlint does not know,
# so it does not flag them as unknown. Everything else runs on GitHub-hosted
# ubuntu-latest (checks.yml plan/lint/wasm/aggregator, cache-devshell.yml,
# release.yml, studio-ios.yml resolve/record). The workflows are generated
# (xtask/workflows); the lint job runs actionlint over them.
self-hosted-runner:
  labels:
    # The Mac Pro VM: the heavy nextest build (checks.yml `tests`, warm
    # target dir) and the deploy (deploy.yml, needs the LAN registry).
    - studio-tests
    - studio-deploy
    # The iOS build (studio-ios.yml) and the macOS .dmg (desktop.yml).
    - airlock
    - macos
    # THEBATTLESHIP: the Linux AppImage (desktop.yml), beside its rig-models
    # clone, and CI's build jobs (checks.yml): the studio-main pool for merges,
    # studio-release for release commits and hotfix PRs.
    - session
    - studio-main
    - studio-release
