# Self-hosted runner labels used by this repo's workflows, so actionlint
# does not flag them as unknown. Everything else runs on GitHub-hosted
# ubuntu-latest (checks.yml plan/lint/wasm/aggregator, cache-devshell.yml,
# pr-title.yml, release.yml).
self-hosted-runner:
  labels:
    # The Mac Pro VM: the heavy nextest build (checks.yml `tests`, warm
    # target dir) and the deploy (deploy.yml, needs the LAN registry).
    - studio-tests
    - studio-deploy
    # The iOS build (studio-ios.yml).
    - airlock
    - macos
