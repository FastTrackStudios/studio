# Setup for a job on a GitHub-HOSTED runner (ubuntu-latest) that needs nix:
# free the image's disk, install nix, trust fasttrackstudio.cachix.org, and
# (optionally) realise a dev shell up front so its download shows as its own
# step.
#
# Only cache-devshell.yml uses it now. The hosted checks.yml jobs stopped
# using nix (October 2026): they install the pinned rustc, apt headers and
# release binaries directly (xtask/workflows/src/steps.rs), which is faster
# than pulling the ~1.5 GiB (7.7 GiB unpacked) ci shell. The self-hosted
# jobs (tests, deploy) never used this: nix lives on those hosts already.

name: hosted nix
description: Free disk, install nix + the fasttrackstudio cachix, realise the ci dev shell.

inputs:
  cachix-auth-token:
    description: >-
      A write token for fasttrackstudio.cachix.org. Empty (the default) =
      read only: nothing this job builds is pushed. Only cache-devshell.yml
      passes one.
    required: false
    default: ""
  shell:
    description: The dev shell to realise (empty = none).
    required: false
    default: ci

runs:
  using: composite
  steps:
    # The image's preinstalled SDKs we never use (the toolchain comes from
    # nix): ~25 GB back. In the background, so nothing waits on it; it is
    # done long before the target dir grows.
    - name: Free disk (background)
      shell: bash
      run: |
        df -h / | tail -n 1
        nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
          /usr/local/share/powershell /usr/local/share/chromium \
          /usr/local/share/boost /opt/microsoft /opt/google \
          </dev/null >/dev/null 2>&1 &
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        # Flake inputs come from the GitHub API; unauthenticated, 60/h per IP.
        github_access_token: ${{ github.token }}
        extra_nix_config: |
          accept-flake-config = true
    - name: fasttrackstudio cachix
      uses: cachix/cachix-action@v17
      with:
        name: fasttrackstudio
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: ${{ inputs.cachix-auth-token == '' }}
    - name: Realise the ${{ inputs.shell }} dev shell
      if: ${{ inputs.shell != '' }}
      shell: bash
      env:
        SHELL_NAME: ${{ inputs.shell }}
      run: nix develop --accept-flake-config ".#${SHELL_NAME}" -c true
