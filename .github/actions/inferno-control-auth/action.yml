name: inferno-control auth
description: >
  Let git (and so cargo and nix) fetch the PRIVATE FastTrackStudios/inferno-control
  repo (git dep `inferno-net`, used by features/patchbay). Exports, for the rest of
  the job only, a git config that rewrites that one URL to carry a read-only token.
  Every other URL is untouched, so the token is never offered to another repo.

inputs:
  token:
    description: >
      Read-only credential for inferno-control (contents:read, that repo only):
      secrets.INFERNO_CONTROL_TOKEN. Never grant it more than that.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        INFERNO_CONTROL_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [ -z "$INFERNO_CONTROL_TOKEN" ]; then
          echo "::error::INFERNO_CONTROL_TOKEN is empty: the secret is missing, or this run came from a fork (secrets are withheld from forks)"
          exit 1
        fi
        echo "::add-mask::$INFERNO_CONTROL_TOKEN"
        repo=https://github.com/FastTrackStudios/inferno-control
        {
          # Env-scoped git config: nothing is written to ~/.gitconfig, so a
          # persistent runner keeps no credential between jobs.
          echo "GIT_CONFIG_COUNT=1"
          echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${INFERNO_CONTROL_TOKEN}@github.com/FastTrackStudios/inferno-control.insteadOf"
          echo "GIT_CONFIG_VALUE_0=${repo}"
          echo "GIT_TERMINAL_PROMPT=0"
          # Make cargo shell out to the git CLI, which reads the env config
          # above, instead of its built-in libgit2 fetch.
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
        } >> "$GITHUB_ENV"
