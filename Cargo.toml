[package]
name = "studio-proto"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Studio, remade from the launcher prototype as a plain Dioxus app"

[dependencies]
dioxus = { version = "=0.8.0-alpha.3", features = ["router"] }
# Drive, the local-first sync: live sets, presence and the spine. Its
# client is the browser's (web-sys), so only the web build has it.
drive-dioxus = { path = "../drive/crates/drive-dioxus", optional = true }
drive-spine = { path = "../drive/crates/drive-spine", optional = true }
serde_json = { version = "1", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = []
web = ["dioxus/web", "dep:drive-dioxus", "dep:drive-spine", "dep:serde_json", "dep:js-sys"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

# A timer for the moving playheads: the browser's on the web, tokio's
# (which the desktop and mobile renderers already run) elsewhere.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }
