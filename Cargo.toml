architect = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-derive = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-rpc-derive = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-action-derive = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-mcp = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-control = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-scripting = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-atom = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-form = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-permissions = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-permissions-proto = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
# Auth is FastTrackStudios/auth (out of architect since architect#995),
# every crate of it at one rev.
architect-auth = { git = "https://github.com/FastTrackStudios/auth", rev = "39f4bf2d8eb438fe4773a753314d643603885374" }
auth = { git = "https://github.com/FastTrackStudios/auth", rev = "39f4bf2d8eb438fe4773a753314d643603885374" }
auth-proto = { git = "https://github.com/FastTrackStudios/auth", rev = "39f4bf2d8eb438fe4773a753314d643603885374" }
auth-db = { git = "https://github.com/FastTrackStudios/auth", rev = "39f4bf2d8eb438fe4773a753314d643603885374" }
# auth-client (`auth_client::device`, sign-in from another device).
auth-client = { git = "https://github.com/FastTrackStudios/auth", rev = "39f4bf2d8eb438fe4773a753314d643603885374" }
# The Dioxus primitive library (was libs/ui/fts-ui, renamed on the split).
architect-ui = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
# Architect extensions: Studio's features are linked extensions, compiled
# into Studio's app and served as process extensions the Architect app
