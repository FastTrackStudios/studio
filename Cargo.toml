architect-views = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-process-view = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
# A WASI component's guest side (Studio's island, features/island).
architect-extension-wasi = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-navigator-api = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
# The media list (`architect_media::ui::MediaList`): the launcher's song list.
architect-workspace = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
architect-scene = { git = "https://github.com/FastTrackStudios/architect", rev = "7e366566fba79c27b832b9cfeeffd5bd08fdf0f3" }
# The app's theme as data (`use_resolved`): what a Studio view in Architect
