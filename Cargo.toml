[workspace.package]
version = "26.10.3"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FastTrackStudios/session"

[workspace.dependencies]
# Drum hit detection (fts-fx's `dsp::hits`, now FastTrackStudios/rhythm).
rhythm-hits = {path = "crates/studio-engine/analysis/rhythm-hits"}
# Studio, the app (apps/studio): Drive (FastTrackStudios/drive, every crate
# at one rev; no tags yet) and app-shell (the window, by tag, declared in
# apps/studio's manifest: its package name is the same as
# features/app/shell's, so it cannot have a key here). Both are on
# crates.io's dioxus 0.8.0-alpha.3, handed this workspace's dioxus revision
# by the dioxus lines of [patch.crates-io]. To work on Drive beside this
# repo, patch `[patch."https://github.com/FastTrackStudios/drive"]` with
# paths (never committed).
session-sync = {path = "crates/studio-core/session/session-sync"}
live-doc = {path = "crates/studio-core/session/live-doc"}
# A room: an organization's lasting place to play together (ADR 0003).
room = {path = "crates/studio-core/session/room"}
studio-proto = {path = "crates/studio-core/proto/studio-proto"}
drive-dioxus = { git = "https://github.com/FastTrackStudios/drive", rev = "2d07bee" }
drive-client = { git = "https://github.com/FastTrackStudios/drive", rev = "2d07bee" }
drive-spine = { git = "https://github.com/FastTrackStudios/drive", rev = "2d07bee" }
drive-files = { git = "https://github.com/FastTrackStudios/drive", rev = "2d07bee", default-features = false }
drive-sidecars = { git = "https://github.com/FastTrackStudios/drive", rev = "2d07bee" }
drive-local = { git = "https://github.com/FastTrackStudios/drive", rev = "2d07bee" }
# FastTrackStudios/session's `session` (the session primitive: its document
# file, its fts.session service, its transport led as presence), as the
# `daw` extension uses it; renamed because Studio's own `features/session`
# is `session` too. session `main` (#189 merged: the shared clock is
# Architect's presence clock; it pins Architect by tag, and Studio's patch table moves that to Studio's own, as it
# does).
fts-session = {path = "crates/studio-core/session/session", package = "session", default-features = false, features = ["architect", "extension", "lead"]}
signal-space = {path = "crates/studio-engine/signal/signal/space"}
signal-tone3000 = {path = "crates/studio-connect/views/rig/tone3000"}
# The effects live in FastTrackStudios/fts-fx (studio#510): `dsp-core`,
# `dsp`, `fts-audio-ui`, `plugin-core`, `preset-browser` and the plugin
# crates `builtin` runs in-process, all at ONE rev (move every line
# together). Working on both at once: a local [patch], never committed
# (docs/fts-fx.md has the table).
fts-audio-ui = {path = "crates/studio-connect/plugin-ui/fts-audio-ui"}
timeline = {path = "crates/studio-connect/kit/timeline"}
editing = {path = "crates/studio-engine/analysis/editing"}
dock = {path = "crates/studio-connect/kit/dock"}
transport-ui = {path = "crates/studio-connect/kit/transport-ui"}
studio-ui = {path = "crates/studio-connect/kit/studio-ui"}
lyrics-ui = {path = "crates/studio-connect/views/lyrics/lyrics-ui", default-features = false}
lyrics = {path = "crates/studio-core/music/lyrics"}
# Frame, the design and control-surface engine, from its own repo
# (FastTrackStudios/frame), pinned by rev: the core crate, which has no
# architect, vox or Dioxus dependency. A local checkout goes under the build
# as a never-committed [patch] (docs/frame.md).
frame = {path = "crates/studio-core/frame/frame"}
web-audio-worklet = {path = "crates/studio-engine/web/worklet"}
editor = {path = "crates/studio-connect/views/midi/expression-editor"}
# The MIDI editor as a Studio view (expression, the Editor panel), over
# daw-view-kit and editor.
midi-editor = {path = "crates/studio-connect/views/midi/view", default-features = false}
engine-domain = { path = "crates/studio-engine/engine/engine-domain" }
synth = {path = "crates/studio-engine/signal/rigs/synth"}
synth-ui = {path = "crates/studio-connect/views/rig/synth-ui"}
sampler = {path = "crates/studio-engine/signal/sampler"}
guitar = {path = "crates/studio-engine/signal/rigs/guitar"}
guitar-ui = {path = "crates/studio-connect/views/rig/guitar-ui"}
protools = {path = "crates/studio-engine/adapters/protools"}
ableton = {path = "crates/studio-engine/adapters/ableton"}
logic = {path = "crates/studio-engine/adapters/logic"}
daw-ui = {path = "crates/studio-connect/kit/daw-ui"}
dynamic-template = {path = "crates/studio-engine/adapters/dynamic-template", default-features = false}
dsp-core = {path = "crates/studio-engine/dsp/dsp-core"}
keys = {path = "crates/studio-engine/signal/rigs/keys"}
keys-ui = {path = "crates/studio-connect/views/rig/keys-ui"}
ekit = {path = "crates/studio-engine/signal/rigs/ekit"}
drums = {path = "crates/studio-engine/signal/rigs/drums"}
# Each rig's editor, apart from the rig so the engine never links Dioxus.
drums-ui = {path = "crates/studio-connect/views/rig/drums-ui"}
keybinds = {path = "crates/studio-connect/features/keybinds"}
themer = {path = "crates/studio-connect/theme/themer", default-features = false}
preset-browser = {path = "crates/studio-connect/plugin-ui/preset-browser"}
control-surfaces = {path = "crates/studio-engine/adapters/control-surfaces"}
# The effects and their faces: plugins' `plugin-ui`, which re-exports
# FastTrackStudios/dsp with each module's `ui` at the paths fts-fx had.
dsp = { path = "crates/studio-engine/dsp/dsp" }
# Razor edit areas: a rectangle of time by row, and the set algebra over
# it. Dependency-free and shared by the expression editor and the
# arrangement, so the two cannot disagree about what an area is.
# ── Internal — every moved crate, path declared ONCE here ─────────────
# These two moved from `daw` to `processor` on the September 2026 FX
# split and have diverged since — `../daw` still carries an older copy,
# and taking that one puts two different `fts-audio-ui v0.1.0` in one
# lockfile, which cargo refuses outright.
# nice-plug lives in its own fork repo (upstream RustAudio/nice-plug's
# baseview-03 branch + the FTS delta: nice-plug-dioxus, embedded editors,
# rich track-info, param rescan). The ONE sanctioned exception to
# path-deps-only — it left the tree so it can track upstream.
nice-plug = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-xtask = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
studio-shell = {path = "crates/studio-connect/kit/studio-shell"}
# The release version a shipped binary reports (FTS_RELEASE_VERSION at build
# time). Binaries only: see its Cargo.toml.
fts-version = {path = "crates/studio-core/util/fts-version"}
library = {path = "crates/studio-connect/features/library"}
fts-account = {path = "crates/studio-core/util/fts-account"}
# Spans over OTLP on plain tracing + OpenTelemetry, and the crash report.
studio-otel = {path = "crates/studio-core/util/studio-otel"}
# Canonical MIDI facade. Defaults OFF at the root: daw-proto re-exports
# `midicore::MidiEvent` and must not drag midicore's `vox` service traits
# (nor the `midir` feature — midicore-midir pins midir 0.10/alsa-sys 0.3,
# colliding with daw's midir 0.11/alsa-sys 0.4 via `links = "alsa"`).
# Consumers that want the vox surface set `features = ["vox"]` themselves.
arborium ={ version = "2.16.0", default-features = false }
arborium-theme = "2.16.0"
arborium-tree-sitter = "2.16.0"
ropey = "1.6"
# ── frame themes ──────────────────────────────────────────────────────
# The mixer (then the TCP, then the arrangement) drawn from frame
# documents — runtime-swappable, hot-reloaded themes. See
# docs/frame-themes.md. Frame is the git dependency declared above.
# A frame face running live: a control surface designed in frame (the
# rig's pedals, amps and Time blocks, a reverb's machine), painted into
# the host's scene and played by its pointer — the FX view's devices.

# ── The base and the engine, from the daw repo ────────────────────────
# (FastTrackStudios/daw: the eleven crates that depend on nothing else in
# Studio, then the engine that plays a session, moved there with their
# history; studio#510.) One revision for all of them, so they move
# together; a tag once that repo cuts one. Its
# root manifest declares the same versions, git pins and patches as this
# one: bump a pin there and here together, or Cargo.lock grows a second
# copy. Working on both at once: AGENTS.md, "Co-developing across repos".
daw-proto = {path = "crates/studio-core/proto/daw-proto"}
daw-control = {path = "crates/studio-engine/daw/control"}
# The DAW's editing contract and its built-in algorithms (hit placement):
# what Studio's engine asks an edit algorithm, and answers without one.
daw-edit = {path = "crates/studio-core/proto/daw-edit"}
# The timeline state every view and the engine share (the cursors, the
# time selection, what is selected, the clipboard).
daw-timeline = {path = "crates/studio-core/proto/daw-timeline"}
# The contract the views are built on (daw#51): the EngineView protocol and
# a window's link, the song model, transport, selection and overlays. Each
# consumer picks native or web (and the engine's app, local).
daw-view = {path = "crates/studio-core/proto/daw-view", default-features = false}
dock-model = {path = "crates/studio-core/proto/dock-model"}
daw-module = {path = "crates/studio-core/proto/daw-module"}
daw-transport-sync = {path = "crates/studio-engine/daw/transport-sync"}
daw-audio-graph = {path = "crates/studio-engine/daw/audio-graph"}
# The theme spec the views implement and the packs' loader (daw#52): a
# commit of its own until the daw lines above move to one that has it.
daw-theme = {path = "crates/studio-connect/theme/daw-theme"}
# The device layer (enumeration, opening), for the audio settings (DAW_AUDIO).
audio = {path = "crates/studio-engine/daw/audio"}
daw-test-macro = {path = "crates/studio-engine/daw/test-macro"}
utils = {path = "crates/studio-core/util/utils"}
midi = {path = "crates/studio-engine/daw/midi"}
# The MIDI monitor panel, apart from `midi` so the engine never links Dioxus.
midi-ui = {path = "crates/studio-connect/kit/midi-ui"}
# Defaults OFF at the root so lean consumers (probe-only scanners, the
# iOS-clean session-guide) don't drag the pack engine in; each consumer
# names the features it needs ("load" / "write" / "engine").
fts-sample = {path = "crates/studio-engine/daw/audio/sample", default-features = false}
# The engine: `daw` is the facade (its engine is opt-in, `standalone`),
# `daw-standalone` the engine, `session-format` the session document,
# `dawfile-reaper` the `.rpp` reader the engine loads and saves with,
# `signal-plugin-host` CLAP/VST3 hosting, `builtin` the effects as engine
# blocks, `daw-sync` DAWs kept in step (network, Ableton Link). The engine
# takes the effects from fts-fx at the rev above.
daw = {path = "crates/studio-engine/daw/daw"}
daw-standalone = {path = "crates/studio-engine/daw/standalone"}
session-format = {path = "crates/studio-core/session/session-format"}
dawfile-reaper = {path = "crates/studio-engine/adapters/reaper/dawfile-reaper"}
signal-plugin-host = {path = "crates/studio-engine/daw/plugin-host", default-features = false}
# The effects Studio runs in-process: Signal's signal-effects (daw has none).
builtin = {path = "crates/studio-engine/dsp/effects", package = "signal-effects"}
daw-sync = {path = "crates/studio-engine/daw/sync"}

# ── daw domain (wave 2) ───────────────────────────────────────────────
# The `daw` facade is the public API surface for the daw domain (above,
# from the daw repo); daw-proto, daw-control, daw-standalone, dawfile-* are
# internal to it, and consumers outside the domain go through the facade.
studio = { path = "crates/studio-engine/adapters/studio" }
daw-actions = {path = "crates/studio-engine/adapters/daw-actions"}
fts-devtools = { path = "xtask/devtools" }
xtask-workflows = { path = "xtask/workflows" }
audio-controls = {path = "crates/studio-connect/kit/audio-controls"}
# default = all-formats; the daw facade opts into formats individually,
# so the root entry keeps defaults OFF and consumers that want every
# importer set `default-features = true`.
daw-reaper = {path = "crates/studio-engine/adapters/reaper/adapters/daw-reaper", default-features = false}
# Extension runtime — integrated REAPER extension helpers
daw-extension-runtime = {path = "crates/studio-engine/adapters/reaper/adapters/daw-extension-runtime"}
reaper-dioxus = {path = "crates/studio-engine/adapters/reaper/adapters/reaper-dioxus"}
daw-reaper-dioxus-ext = {path = "crates/studio-engine/adapters/reaper/studio/daw-reaper-dioxus-ext"}

# ── session domain (wave 3) ───────────────────────────────────────────
# `session` is the facade — the only public API surface for the session
# domain. session-proto is INTERNAL (daw-view-kit and session-guide are the
# documented exceptions: Dioxus components / the guide engine).
# Portable guide engine (click / count-in / section guide). Optional `tts`
# feature adds local Chatterbox TTS (its ort/chatterbox pins live in the
# crate's own manifest, not here).
# Durable Song + Arrangement vault-folder schema (stored counterpart to
# session_proto::Song). Keyflow-agnostic: charts are stored as references
# (relative paths / attachment ids), never embedded keyflow::Chart types.
song = {path = "crates/studio-core/session/song"}
# Song libraries and setlists as notes of an Architect vault project, shared
# by an Architect share link (studio#386).
# Productions in other DAWs (Ableton sets, Pro Tools sessions, REAPER and
# Logic projects) as project notes with a stage, found by a scan (studio#396).
studio-views = {path = "crates/studio-connect/features/studio-views"}

# ── keyflow domain — its own repo since the 2026-08 split ─────────────
# (FastTrackStudios/keyflow: the chart language, its formats, the LSP and
# tree-sitter grammar, and Engraver.) One tag pin shared by every entry so
# the whole domain moves together.
#
# keyflow v0.5.4 is on Architect v0.12.6 by tag, as here (a rev of the
# same commit would be a second source).
#
# `keyflow` and `engraver` are the facades — depend on those. The rest are
# listed only because in-tree consumers still name them directly; new code
# should go through a facade.
#
# Since v0.2.8 keyflow is four crates, not twenty: `keyflow-proto` (the
# model, with the lexer/parser as its `syntax` module), `keyflow-lang`
# (every format as a module behind a feature of its name: `text`,
# `chordpro`, `midi`, `orchestra`, `sync`, …), `engraver` (layout +
# render, `score` included) and the `keyflow` facade. `keyflow-lang`
# defaults OFF here; consumers name the formats they use.
# The facade defaults OFF too: each consumer names its tier (`text`,
# `svg` for wasm, `engraver` for the full engraver with the GPU renderer).
keyflow = {path = "crates/studio-core/music/keyflow", default-features = false}
keyflow-proto = {path = "crates/studio-core/music/keyflow-proto"}
keyflow-lang = {path = "crates/studio-core/music/keyflow-lang", default-features = false}
keyflow-daw-analysis = {path = "crates/studio-engine/analysis/keyflow-daw-analysis"}
keyflow-ui = {path = "crates/studio-connect/views/chart/keyflow-ui"}
keyflow-cli = {path = "xtask/kf"}
tree-sitter-keyflow = {path = "crates/studio-core/music/tree-sitter-keyflow"}
# Engraver — defaults OFF at the root (the full `engraver` feature drags
# wgpu/vello + PDF export); consumers opt into `svg`/`wgpu`/`engraver`.
engraver = {path = "crates/studio-core/music/engraver", default-features = false}

# ── signal domain (wave 4) ────────────────────────────────────────────
# `signal` is the facade — the only public API surface for the signal
# domain. Apps depend on `signal` or `signal-sampler`;
# never on the internal domain crates (proto/live/storage/controller/
# import/daw-bridge/nam-manager).
# `default-features = false` must be declared here, not just at the use
# site: cargo ignores a member's `default-features = false` on a
# workspace dependency unless the workspace entry sets it too. Consumers
# that need the filesystem scanner opt in with `features = ["native"]`.

# ── features/fx — built-in FX (wave 4) ────────────────────────────────
# Facade crates — the public FX deps (downstream uses these, not `*-dsp`).
# The trigger plugin editor. Core (waveform/threshold SVG math) is portable;
# the nice-plug/Blitz editor is behind its `native` feature.
# The full Pro-Q EQ editor. Core (graph model / response / SVG / interaction)
# is wasm-portable; the vello/nice-plug editor is behind its `native` feature.
# The comp plugin editor. Core (profile view data model) is portable; the
# nice-plug/Blitz editor is behind its `native` feature.
world-sys = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.6.1" }
# ── The built-in FX, from the processor repo ──────────────────────────
# The mixer's Tone rack draws a real EQ, compressor and saturator, and
# it draws them from the SAME functions the plugins' own editors do:
# `eq_graph_response::calculate_combined_response`,
# `comp_graph_svg::compress_transfer`, `preamp::transfer_curve`. A curve
# in a strip that disagreed with the curve in the plugin window would be
# worse than no curve at all, so the strip owns no response math.
#
# Core only — `default-features = false` drops the nice-plug/Blitz
# editors, which is what keeps this to response math rather than a
# second plugin host inside the mixer.
# The Depth units draw the plugins' own machines: the delay's style
# family decides how a repeat is drawn, and the reverb's envelope is
# the algorithm's actual impulse response, rendered by `reverb-dsp`'s
# analysis probe rather than an exponential drawn from the decay knob.
# The effects' own painted pictures — every reverb family, every delay
# family, and the six modulation engines — which the FX view's devices
# draw (`paint_reverb`, `paint_delay`, `paint_mod`, behind `viz`).
# The saturator's five circuits and their profiles — what its selector
# picks from, applied through the plugin's own `apply`.
# signal's rigs in the session engine: the bass rig, the kit's voices.
signal-fx = {path = "crates/studio-engine/signal/rigs/fx"}
# signal's in-process rig engine (NAM, convolver, the sampler), from the
# sibling checkout as daw is: both resolve daw to ../daw, so its
# processors are the session engine's `PluginInstance`s.
# signal's rig library — its profiles, scenes and how a profile becomes the
# chains a scene plays (the bass rig's profile mode, signal-fx).
# Internal DSP cores (behind the facades).

# ── Facet reflection + vox RPC — the rc.5 fleet pins ──────────────────
facet = { version = "0.50.0-rc.5", features = ["reflect", "chrono", "uuid"] }
facet-json = { version = "0.50.0-rc.7" }
facet-postcard = { version = "0.50.0-rc.5" }
facet-styx = { version = "5.0.0-rc.7" }
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime"] }
vox-types = { version = "0.10.0-rc.5" }
vox-phon = { version = "0.10.0-rc.5" }
vox-stream = { version = "0.10.0-rc.5" }
vox-core = { version = "0.10.0-rc.5" }
vox-websocket = { version = "0.10.0-rc.5" }
# The WebSocket under vox-websocket's native link, for a dial that presents
# a bearer at its handshake (engine-host's `remote`: the engine's token).
tokio-tungstenite = { version = "0.29" }
iroh = { version = "1" }
# Files CAS chunk store (issue #256): streaming FastCDC content-defined
# chunking, blake3 content addressing, iroh-blobs as the local blob store.
fastcdc = { version = "4", features = ["tokio"] }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
blake3 = { version = "1.8" }
# Whole-file placement: reflink where the filesystem clones extents,
# hardlink otherwise (see ChunkStore::write_path). Already in the tree as
# an iroh-blobs dependency; named here so the chunk store can use it
# directly rather than only through iroh-blobs' import path, which offers
# no hardlink fallback.
reflink-copy = { version = "0.1" }
# Files version-store engine (issue #257/ADR 0001): jj-lib's `Backend` trait,
# implemented over the chunk store above. Pinned (jj-lib is pre-1.0 per the
# ADR); vendor-patch here if/when we need to carry a local fix.
jj-lib = { version = "=0.44.0" }
# Software File Roots (issue #273) are colocated git: the `files` feature
# talks to the root's real `.git` directly (branch refs, index) alongside
# jj-lib's `GitBackend`. Same version jj-lib itself pins, so there is one
# gix in the tree; features are a subset of jj-lib's own.
gix = { version = "0.85", default-features = false, features = [
    "index",
    "max-performance-safe",
    "sha1",
] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
# Embeds the staged engine-host web bundle into the native binary
# (apps/desktop feature `embed-web`).
include_dir = "0.7"
# Dante/AoIP ARC control (FastTrackStudios/inferno-control workspace) —
# discovery, channel lists, subscriptions. Pinned to the
# hardware-dante-fixes rev (parser guards + pagination + status
# semantics, found by patchbay against the live network); bump the
# ~/.flake input to match when it merges.
inferno-net = { git = "https://github.com/FastTrackStudios/inferno-control", rev = "d3b048941df55dae12c7b9f8c4b776681b8679d3" }

