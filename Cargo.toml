# ── UI framework ──────────────────────────────────────────────────────
# dioxus 0.8 line — git rev pinned: DioxusLabs/dioxus main 430cfb56
# (0.8.0-alpha.3), architect v0.12.6's. Bump it deliberately and in
# lockstep across every dioxus-* entry below AND the FTS fork tags of
# primitives/lumen/lucide/sdk, which pin the same rev.
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false, features = ["lib"] }
# Dioxus's wasm splitting (`#[wasm_split]`): studio-web's window's
# extensions, each a chunk fetched when it is first used
# (features/distribution `deferred`).
wasm-splitter = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
# Direct, and only apps/web takes it: it is how the site turns on
# `hydrate` for static generation without `dioxus/fullstack`, whose
# reqwest would be a second major in the wasm binary. Same rev as the
# meta-crate above — they are one repo and must not drift.
dioxus-web = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false }
# Blitz native renderer — dioxus-native(-dom) moved into the dioxus repo
# on the 0.8 line; blitz-* are `=0.3.0-beta.4`, matching dioxus git's
# own pins, patched below to the FTS blitz fork. Feature union of the
# wave-1 UI libs (prelude, system-fonts) and reaper-dioxus (svg,
# autofocus, data-uri theme-skin PNGs).
# `vello` — the compute-shader renderer — because dioxus-native's own
# default is `vello-hybrid`, which does much of its path work on the CPU.
# Hybrid exists for WebGL-class targets; on a desktop GPU it is what
# stands between the expression editor and its frame budget (35 fps at
# 5120x1440 with five notes on screen, where the whole scene was 69 draw
# commands and 0.04 ms to build — the cost was all in rasterising it).
#
# Both features can be on at once: the renderer is chosen by a `cfg_if`
# chain that tests `vello` first, so this wins over the default without
# having to turn defaults off and re-list them.
# `default-features = false` with every default re-listed, so that this
# list is the whole truth: dropping a feature from a `features = [...]`
# while defaults are on does NOTHING, which cost a day of chasing
# `incremental` that was never actually off.
#
# `incremental` is gone: dioxus-native has no such feature on the 0.8
# line (architect#211).
# The vendored copy (see its UPSTREAM.md) by path, not the git URL the
# [patch] below redirects: a member's dep on a patched git crate leaves
# nothing in the lockfile to match it, so cargo re-queries the git source
# — which a vendored, offline build (nix, crane) refuses. daw's crates
# still name the git URL; the patch covers them.
dioxus-native = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1", default-features = false, features = ["prelude", "system-fonts", "svg", "autofocus", "data-uri", "vello", "accessibility", "hot-reload", "net", "html", "clipboard", "file-dialog", "vello-hybrid", "woff", "apple-font-embolden"] }
# The `hit_inner` panic this comment used to chase (a pointer event
# hit-testing a node removed before the next resolve) is what Blitz's
# versioned `NodeId` (upstream #1244) answers: a stale id now misses.
blitz-dom = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
blitz-shell = "=0.3.0-beta.4"
blitz-html = "=0.3.0-beta.4"
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
# Runtime telemetry the `dioxus-mcp` server reads back: renders, signal
# writes and PANICS, as JSONL under target/dioxus-mcp/. `dx serve` owns
# the child's console, so a panic in the window otherwise reaches nobody
# — this is how it becomes something an agent can be pointed at. A no-op
# in release builds unless the `force` feature is on. Not on crates.io.
dioxus-mcp-probe = { git = "https://github.com/tonybierman/dioxus-mcp" }
# Vendored DioxusLabs/dioxus-test on the pins above — headless component
# tests on blitz-dom (no browser), from FastTrackStudios/vendor. Pinned to
# the commit of vendor#5 (dioxus-test moves there from this repo's old
# vendor folder); moves to that repo's tag once vendor#5 is released.
dioxus-test = { git = "https://github.com/FastTrackStudios/vendor", rev = "c892de83e77b3d51e9c3dd17d9f9e8471d01e112" }
dioxus-primitives = { git = "https://github.com/FastTrackStudios/dioxus-components", package = "dioxus-primitives", tag = "fts-upstream-2026-11", default-features = false }
lucide-dioxus = { git = "https://github.com/FastTrackStudios/lucide", tag = "fts-upstream-2026-11", features = ["all-icons"] }
clsx = "0.1.1"
tw_merge = "0.1.21"
nucleo-matcher = "0.3"
# fff's fuzzy scorer (SIMD Smith-Waterman, scalar fallback on wasm) —
# the everything-search window's matcher.
neo_frizbee = { version = "0.11", features = ["match_end_col"] }
palette = "0.7.6"
linkme = "0.3"

# ── REAPER bindings (FTS fork with v7.63 ruler lane APIs) ─────────────
reaper-low = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-medium = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-high = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
reaper-macros = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }

# ── Plugin frameworks / hosting (daw) ─────────────────────────────────
nih_plug = { git = "https://github.com/FastTrackStudios/nih-plug.git", branch = "reaper-embed-ui" }

# ── GPU rendering stack (reaper-embed / reaper-dioxus) ────────
# One stack for the whole tree, the one architect v0.12.6's Blitz tag
# (`fts-upstream-2026-11`) builds on: vello 0.11 / wgpu 30, anyrender 0.14
# (from the blitz tag, patched below) with anyrender_vello 0.15 and
# anyrender_vello_hybrid 0.11 (vendor v0.7.0), parley 0.12. frame and
# nice-plug-dioxus are on it too, so a texture a host renderer hands over
# (`wgpu_context::DeviceHandle`) is the type every painter downcasts to.
wgpu = { version = "30", features = ["wgsl"] }
skrifa = "0.44"
anyrender_vello = "0.15"
anyrender = "0.14"
anyrender_vello_hybrid = "0.11"
# vello_hybrid's successor; anyrender_vello_hybrid 0.11 paints into its
# Scene (the browser's WebGL2 path).
vello_gpu = "0.3"
vello_common = "0.3"
peniko = "0.6"
kurbo = "0.13"
# Text shaping for the painted expression-editor roll. Same version blitz
# shapes DOM text with, so a label drawn into a scene and a label drawn
# by the DOM come out of the same shaper.
parley = "0.12"
# Deterministic CPU rendering for the ui-snapshot regression gate.
anyrender_vello_cpu = "0.18"

# The session bus, for Session's global app menu (com.canonical.dbusmenu,
# what the Loft top bar reads). On tokio, the runtime the app already runs.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

# ── Async runtime ─────────────────────────────────────────────────────
tokio = { version = "1.48", default-features = false }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# ── Filesystem watching ───────────────────────────────────────────────
# crates.io `notify` — the cross-platform filesystem watcher, used by the
# Files cadence engine (issue #260) for activity *hints* (a full stat-scan
# is what certifies a checkpoint). Renamed: `notify` the workspace-
# dependency name is already taken by the in-tree `features/task/notify`
# member (the notifications feature), and one name can only mean one crate
# in `[workspace.dependencies]`.
notify-fs = { package = "notify", version = "8" }
# Glob matching for a File Root's Ignore set (issue #260 / glossary
# "Ignore set" — shared verbatim by versioning and selective sync).
globset = "0.4"

# ── Serialization ─────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The `script` tool's JavaScript (features/agent-mcp): QuickJS, built from C.
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
num-traits = "0.2"
thiserror = "2.0"
anyhow = "1.0"

# ── Observability ─────────────────────────────────────────────────────
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# ── OpenTelemetry (opt-in via OTEL_EXPORTER_OTLP_ENDPOINT; see
# crates/task/telemetry) — http/protobuf OTLP to the cluster collector.
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = [
  "http-proto",
  # BLOCKING is deliberate: the SDK's batch processors run on their own
  # dedicated OS threads, which have no Tokio reactor — the async client
  # panics them with "there is no reactor running" on first flush.
  "reqwest-blocking-client",
  "reqwest-rustls",
  "trace",
  "logs",
  "metrics",
] }
opentelemetry-appender-tracing = "0.30"
# OTLP's messages, decoded by a test's own receiver (daw-extension's
# tests/unbreakable): the features the exporter above already builds.
opentelemetry-proto = { version = "0.30", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics"] }
prost = "0.13"
opentelemetry-semantic-conventions = "0.30"
tracing-opentelemetry = "0.31"

# ── Proc-macro plumbing ───────────────────────────────────────────────
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# ── fts-story tooling ─────────────────────────────────────────────────
dssim-core = "3"
png = "0.17"
tempfile = "3.8"

atomic_refcell = "0.1"
raw-window-handle = "0.6"
realfft = "3.0"
# Pure-Rust ONNX inference (no C onnxruntime dep) — Basic Pitch polyphonic
# note transcription in tune-dsp, behind the `basic-pitch` feature.
tract-onnx = "0.21"
approx = "0.5.1"
crossbeam-channel = "0.5"
rayon = "1.12"
open = "5.3.3"
triple_buffer = "9.0.0"
rtrb = "0.3.3"
semver = "1.0.27"
pollster = "0.4.0"
parking_lot = "0.12"
egui = { version = "0.34.1", default-features = false, features = ["bytemuck"] }
symphonium = { version = "0.6", default-features = false, features = ["wav", "pcm", "fft-resampler"] }

# ── Utilities ─────────────────────────────────────────────────────────
eyre = "0.6"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
futures-timer = "3"
clap = { version = "4", features = ["derive"] }
# Fuzzy PNG diffing (ui-snapshot; same lib Blitz's WPT runner uses).
dify = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
fragile = "2"
# Hardware MIDI I/O — 0.11 to share one alsa-sys across the stack.
midir = "0.11"
# Audio I/O host abstraction — the signal rigs run on cpal's native
# pipewire host (via daw-audio-io); the `pipewire`/`jack` backends are
# feature-gated per consumer.
cpal = "0.18"
# Unix process supervision: the desktop app spawns the signal engine as a
# child and must reap it (and its group) on exit — kill(pid,0) liveness probe
# (engine watchdog) + process-group teardown. See apps/desktop.
libc = "0.2"

# ── The editor ────────────────────────────────────────────────────
# The editor itself, from its own repo — what the Organize view's keyflow
# editor is built on (Blitz-native: `editor-view/native`). The core only:
# no Typst / Mermaid fence renderers (`default-features = false`).
# At architect v0.12.6's own editor revision (architect and keyflow pin
# this rev, not a tag); the editor [patch] at the foot of this file makes
# it one editor source.
editor-view = { git = "https://github.com/FastTrackStudios/editor", rev = "6817dc2c709fbb5a7858229592bbbc85eed49528", default-features = false }
editor-state = { git = "https://github.com/FastTrackStudios/editor", rev = "6817dc2c709fbb5a7858229592bbbc85eed49528", default-features = false }
# Remote edits into the editor as changes (the caret stays put).
editor-crdt = { git = "https://github.com/FastTrackStudios/editor", rev = "6817dc2c709fbb5a7858229592bbbc85eed49528" }
# Keyflow's language support for it (syntax colours, live diagnostics) —
# keyflow's `editor-keyflow` (its `lang` module; `editor-keyflow-lang`
# folded into it at keyflow v0.2.8). Defaults off: no `.kf` fence
# renderer, so no engraver.
keyflow-editor-lang = {path = "crates/studio-connect/views/chart/editor-keyflow", package = "editor-keyflow", default-features = false}
editor-keyflow = { path = "crates/studio-connect/views/chart/editor-keyflow" }

# Externals the tree shares (root pins win everywhere a key already
# existed — dioxus, serde, tokio, facet/vox rc.5 fleet, loro).
keybindings = "0.0.2"
editor-types = "0.0.2"
rrule = "0.11"
octocrab = "0.46"
indexmap = "2"
regex = "1"
serde_yaml = "0.9"
cooklang = "0.18"
pulldown-cmark = { version = "0.10", default-features = false }
dioxus-router = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false }
dioxus-icons = { git = "https://github.com/FastTrackStudios/dioxus-icons", tag = "v0.1.0" }
web-sys = "0.3.98"
# Pinned exactly, and low: `dx build` refuses to run when the crate version
# and the wasm-bindgen-cli in the dev shell disagree, and the CLI comes from
# the pinned nixpkgs (nix/modules/dx.nix, nix/modules/shells/default.nix). A
# floating "0.2" silently resolves past the CLI and breaks every web build
# with "Incorrect wasm-bindgen-cli version". Bump this only together with
# that pin.
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = "1.39"
# `cargo xtask` TS-type generation (crates/task/xtask).
vox-codegen = "0.10.0-rc.5"

