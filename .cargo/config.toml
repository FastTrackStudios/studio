# Frame pointers: originally for the (now retired) moire fork's trace
# capture, kept because samply/perf profiling of the audio path on NixOS
# glibc needs intact frame-pointer chains to unwind. Cheap; keep it.
#
# NOTE ON PRECEDENCE: `target.<triple>.rustflags` REPLACES `build.rustflags`
# — cargo does not merge them. So the linux table below must repeat the
# frame-pointer flag. This `[build]` table is what darwin/wasm/iOS get.
[build]
rustflags = ["-C", "force-frame-pointers=yes"]

# No linker override: since Rust 1.90 x86_64-unknown-linux-gnu links with
# the bundled rust-lld by default, which is multi-threaded and fast enough
# for these huge binaries (multi-hundred-MB desktop/plugin artifacts, the
# REAPER extension .so) and needs nothing from the devshell. This table
# exists for the frame pointers and the CPU level.
[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "force-frame-pointers=yes",
  "-C", "target-cpu=x86-64-v3",
]

# x86-64-v3 (AVX2, FMA, BMI2 — Haswell, 2013, and later) on every x86-64
# desktop target, for the DSP: the amps, the sampler and the FX vectorise
# to 256 bits. A machine older than that cannot run these builds. Apple
# Silicon (aarch64) is unaffected.
[target.x86_64-apple-darwin]
rustflags = [
  "-C", "force-frame-pointers=yes",
  "-C", "target-cpu=x86-64-v3",
]

# Carried over from the dissolved session/keyflow workspaces: git deps and
# patched git sources fetch via the git CLI so SSH / credentials work the
# same way `git` does outside cargo.
[net]
git-fetch-with-cli = true
