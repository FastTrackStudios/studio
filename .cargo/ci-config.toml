# CI-only cargo settings, for checks.yml's cargo jobs. NOT read where it
# lies: cargo only reads `.cargo/config.toml`. The hosted jobs copy it to
# `../.cargo/config.toml` (the PARENT of the checkout); the pool jobs (Rail
# plan, Check, Wasm, Tests) to `$CARGO_HOME/config.toml`, one cargo home
# shared by the pool's instances so rail's evidence matches from one
# instance to the next. Either way cargo MERGES it with this repo's
# .cargo/config.toml: on a conflict the repo's file wins, and arrays such as
# rustflags are joined (https://doc.rust-lang.org/cargo/reference/config.html#hierarchical-structure).
# An env var would not do: RUSTFLAGS REPLACES every rustflag in the config
# files (rust-lang/cargo#5376), mold and target-cpu included. The trick is
# Zed's (.cargo/ci-config.toml there).
#
# The self-hosted tests job does not use it: its warm target dir was built
# with the repo config alone, and a rustflags change would rebuild it.

# A `target.*` table, not `[build]`: every matching `target.*` table is
# joined (so x86_64-linux keeps mold + x86-64-v3 from the repo config), while
# `build.rustflags` is IGNORED as soon as any target table sets rustflags.
# So the targets with no table of their own in the repo config (wasm32,
# aarch64-darwin) would lose the repo's `[build]` frame-pointer flag — this
# table gives it back to exactly those.
#
# NOT `cfg(all())`: on x86_64 linux/macOS that would join a SECOND
# `-C force-frame-pointers=yes` after the repo table's, and kache hashes
# `-C` flags in order without de-duplicating them, so every CI key would
# differ from the same build on a developer's machine and the shared store
# (hosts/THEBATTLESHIP/kache.nix in nix-config) would never hit across them.
#
# TODO: add "-D", "warnings" (to a `cfg(all())` table) once the workspace is
# warning-clean, so CI fails on a new warning without making developers'
# builds fail — accepting that CI's keys then differ from local ones.
[target.'cfg(not(all(target_arch = "x86_64", any(target_os = "linux", target_os = "macos"))))']
rustflags = ["-C", "force-frame-pointers=yes"]

# [profile.dev] in Cargo.toml already says line-tables-only; pinned here too
# (it used to be the CARGO_PROFILE_DEV_DEBUG env) so a profile edit cannot
# silently fatten the cached target dir. Config-file profiles override the
# manifest's.
[profile.dev]
debug = "line-tables-only"

# frame and plugin-faces at opt-level 3 in CI only. Their tests build and
# lint frame documents and render them: 5-22 s each in a dev build on an
# idle Mac, past 120 s on the loaded CI runner (PR #184, October 2026). A
# developer edits frame constantly, so the workspace's dev profile keeps it
# fast to compile; CI builds it once into a warm target and runs it a lot.
[profile.dev.package.frame]
opt-level = 3

[profile.dev.package.plugin-faces]
opt-level = 3
