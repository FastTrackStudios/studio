[package]
name = "dioxus-test"
version = "0.1.0"
edition = "2024"
description = "Vendored DioxusLabs/dioxus-test on the workspace dioxus 0.8 git + blitz beta.4 pins. Headless component testing on blitz-dom."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus-test/"
publish = false

[dependencies]
# `custom-widget` because dioxus-native enables it, and a harness that
# did not would lay a custom widget out and then paint nothing where it
# is — the failure would look like a bug in the widget rather than a
# missing feature in the test build. Features unify per build graph, and
# dioxus-native is not in the graph when a UI crate runs its own tests.
blitz-dom = { workspace = true, features = ["autofocus", "custom-widget"] }
# HTML parser provider so `dangerous_inner_html` works in tests exactly
# as under dioxus-native (which registers the same provider).
blitz-html = { workspace = true }
# dioxus-vdom is the old dioxus-core (renamed upstream on the 0.8 line).
dioxus-core = { package = "dioxus-vdom", git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-native-dom = { workspace = true }
test-that = { version = "0.5.2", default-features = false, features = ["regex", "num-traits"] }
tokio = { workspace = true }
tracing = { workspace = true }
# ── FTS keyboard extension (src/keyboard.rs) ──────────────────────────
blitz-traits = { workspace = true }
keyboard-types = "0.8"
smol_str = "0.3"
# ── FTS screenshot extension (src/screenshot.rs) ──────────────────────
# Rasterize the laid-out headless document to a PNG for visual inspection
# — the same anyrender_vello_cpu path blitz's own screenshot tests use.
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true }
blitz-paint = { workspace = true, features = ["custom-widget"] }
peniko = { workspace = true }
png = "0.17"

[dev-dependencies]
dioxus = { workspace = true }
indoc = "2.0.7"
