[package]
name = "daw-extension"
description = "Studio's engine as an Architect extension: the same engine `studio engine` runs (session-engine, its daw, its Action List), in the extension's process, the song it is asked to open playing. Studio's views (studio.arrangement, studio.mixer) attach to it the way studio-desktop's window does."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "daw-extension"
path = "src/main.rs"

[dependencies]
architect-extensions = { workspace = true, features = ["linked-core"] }
serde_json = { workspace = true }
tracing = { workspace = true }

# The browser (studio-web): the engine in the page (`src/web.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
studio-view-link = { workspace = true }
architect-playhead = { workspace = true }
session-engine = { workspace = true, features = ["web"] }
session-ui = { workspace = true, features = ["web"] }
session-runtime = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Location", "Document", "Element", "Performance"] }
wasm-bindgen-futures = { workspace = true }
gloo-timers = { workspace = true, features = ["futures"] }

# The native process: the engine and its launcher (`src/owner.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
architect-extensions = { workspace = true, features = ["guest", "linked-core"] }
session-desktop = { workspace = true, features = ["native"] }
session-engine = { workspace = true, features = ["native"] }
fts-session = { workspace = true }
# The song as one file: its session a part of the store (studio one-file).
song-file = { workspace = true }
session-format = { workspace = true }
daw-ui = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }
# The engine's own log (engine.log): src/owner.rs.
tracing-subscriber = { workspace = true }
# flock (one engine) and setsid (it outlives the window): src/owner.rs.
libc = { workspace = true }
architect-scene = { workspace = true }
daw = { workspace = true }
daw-proto = { workspace = true }
# The output devices this machine has, for DAW_AUDIO (the audio settings).
audio = { workspace = true, features = ["io"] }

# Spoken section cues (`session`: the domain and its TTS, ONNX Runtime)
# where ONNX Runtime has binaries; on a phone or tablet the engine runs
# without them (`native` is the domain), its cues the guide's samples.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
session-desktop = { workspace = true, features = ["session", "native"] }

[lints]
workspace = true
