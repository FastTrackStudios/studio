[package]
name = "studio-lyrics"
description = "Studio's lyrics panel as an extension: the song's words following the song (Audience, Performer and Confidence Monitor views, daw-view-kit's lyrics panel), in an Architect pane, attached to Studio's engine (the daw extension) as the arrangement and mixer are."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "studio-lyrics"
path = "src/main.rs"

[dependencies]
studio-view-link = { workspace = true }
architect-extensions = { workspace = true, features = ["linked-core"] }
architect-extensions-dioxus = { workspace = true }
dioxus = { workspace = true }
serde_json = { workspace = true }

# The native process: attached to the engine's socket.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
architect-extensions = { workspace = true, features = ["guest", "linked-core"] }
architect-extensions-dioxus = { workspace = true, features = ["guest"] }
daw-view-kit = { workspace = true, features = ["native"] }
studio-panels = { workspace = true, features = ["native"] }
# Studio's session as it reads a song (`song_model::StudioSession`).
session-engine-client = { workspace = true, features = ["native"] }

# The browser: the same panel over the page's own engine.
[target.'cfg(target_arch = "wasm32")'.dependencies]
daw-view-kit = { workspace = true, features = ["web"] }
studio-panels = { workspace = true, features = ["web"] }
session-engine-client = { workspace = true, features = ["web"] }

[lints]
workspace = true
