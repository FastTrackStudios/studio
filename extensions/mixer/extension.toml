# studio.mixer (src/lib.rs): Studio's mixer and track control panel,
# installed into a stock Architect as a process. It reads the engine's
# tracks (fts.daw) and writes their mixer state back through it; it names
# no other view (docs/design/arrangement-mixer-extensions.md).
id = "studio.mixer"
name = "Mixer"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "A strip (mixer) or a row (track panel) per track: faders and pans the host moves under the pointer and the engine follows while they are held, mute and solo, meters drawn from the engine's values."
authors = ["FastTrackStudios"]

[entry]
path = "studio-mixer"

[uses]
"fts.daw" = "^0.1"

# Meters are the engine's values, read at compose; faders write the
# host's values into the engine's table.
[capabilities]
effect = "mutating"
ui = ["engine"]

[[views]]
id = "mixer"
title = "Mixer"
icon = "sliders-vertical"

[[views]]
id = "tcp"
title = "Track panel"
icon = "sliders-horizontal"

[[actions]]
id = "STUDIO_MIXER_STATE"
name = "Mixer: state"
description = "Every open mixer and track panel: tracks, scroll, layers, the region events and drag values the view heard, the sets it sent, and its frame times."
group = "Mixer"
effect = "read_only"

[[actions]]
id = "STUDIO_MIXER_FIXTURE"
name = "Mixer: show a fixture"
description = "Shows `tracks` synthetic tracks (a measurement's size); with none, the engine's again."
group = "Mixer"
effect = "mutating"
params = '{"type":"object","properties":{"tracks":{"type":"integer"}}}'
