[package]
name = "studio-mixer"
description = "Studio's mixer and its selected-track strip as a runtime extension: the mixer studio-desktop docks under its arrangement and the inspector strip beside it (daw-view-kit's mixer widget), in Architect panes, attached to Studio's engine (the daw extension) as studio-desktop's window attaches to `studio engine`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "studio-mixer"
path = "src/main.rs"

[dependencies]
studio-view-link = { workspace = true }
architect-extensions = { workspace = true, features = ["linked-core"] }
architect-extensions-dioxus = { workspace = true }
dioxus = { workspace = true }
serde_json = { workspace = true }

# The native process: panes painted from the engine attached over its
# socket (`src/host.rs`), the window actions it claims (`src/claim.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
architect-extensions = { workspace = true, features = ["guest", "linked-core"] }
architect-extensions-dioxus = { workspace = true, features = ["guest", "paint"] }
mixer-view = { workspace = true, features = ["native"] }
daw-view-kit = { workspace = true, features = ["native"] }
arrangement-view = { workspace = true, features = ["native"] }
session-engine-client = { workspace = true, features = ["native"] }
blitz-traits = { workspace = true }
architect-scene = { workspace = true, features = ["paint-ui"] }
anyrender = { workspace = true }
web-time = { workspace = true }
architect = { workspace = true, features = ["action-list"] }
tracing = { workspace = true }

# The browser: the widget over the page's own engine (`src/web.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
mixer-view = { workspace = true, features = ["web"] }
daw-view-kit = { workspace = true, features = ["web"] }
arrangement-view = { workspace = true, features = ["web"] }
session-engine-client = { workspace = true, features = ["web"] }

[dev-dependencies]
# The tests open a song on an engine in the test's own process.
session-engine = { workspace = true, features = ["native"] }
mixer-view = { workspace = true, features = ["native", "engine"] }
daw-view-kit = { workspace = true, features = ["native", "engine"] }
arrangement-view = { workspace = true, features = ["native", "engine"] }
# The tests stand a pane up as the workspace does (`ViewHost`, `Placement`).
architect-workspace = { workspace = true, features = ["paint-ui"] }
anyrender_vello_cpu = { workspace = true }
peniko = { workspace = true }
png = { workspace = true }
session = { workspace = true }
daw-proto = { workspace = true }
daw-ui = { workspace = true }

[lints]
workspace = true
