[package]
name = "studio-mixer"
description = "Studio's mixer and its selected-track strip as a runtime extension: the mixer studio-desktop docks under its arrangement and the inspector strip beside it (session-ui's mixer widget), in Architect panes, attached to Studio's engine (the daw extension) as studio-desktop's window attaches to `studio engine`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "studio-mixer"
path = "src/main.rs"

[dependencies]
studio-view-link = { workspace = true }
architect-extensions = { workspace = true, features = ["linked-core"] }
dioxus = { workspace = true }
serde_json = { workspace = true }

# The native process: panes painted from the engine attached over its
# socket (`src/host.rs`), the window actions it claims (`src/claim.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
architect-extensions = { workspace = true, features = ["guest", "linked-core", "paint-pane"] }
architect-workspace = { workspace = true, features = ["paint-ui"] }
session-ui = { workspace = true, features = ["native"] }
session-engine = { workspace = true, features = ["native"] }
blitz-traits = { workspace = true }
architect-scene = { workspace = true }
anyrender = { workspace = true }
web-time = { workspace = true }
architect = { workspace = true, features = ["action-list"] }
tracing = { workspace = true }

# The browser: the widget over the page's own engine (`src/web.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
session-ui = { workspace = true, features = ["web"] }

[dev-dependencies]
anyrender_vello_cpu = { workspace = true }
peniko = { workspace = true }
png = { workspace = true }
session = { workspace = true }
daw-proto = { workspace = true }
daw-ui = { workspace = true }

[lints]
workspace = true
