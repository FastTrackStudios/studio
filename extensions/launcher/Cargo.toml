[package]
name = "studio-launcher"
description = "Studio's project launcher as an extension: the vault's setlists and their songs, what each song is ready with, what was opened lately and the rigs, with a press that opens a setlist or a song in Studio's engine (the daw extension). Reads notes through the host and draws with nothing of Session's, so it builds in seconds (docs/design/project-launcher.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "studio-launcher"
path = "src/main.rs"

[dependencies]
# The trait (`linked-core`): linked into an app, a browser's too; its
# process copy (`guest`) off the browser.
architect-extensions = { workspace = true, features = ["linked-core"] }
# The provider it adds to Architect's navigator (`src/nav.rs`).
architect-navigator-api = { workspace = true }
# A song's tile colour, the setlists extension's rule (`setlists::row::tile_hue`),
# so a song is the same colour here as on its setlist's page.
setlists = { workspace = true }
# The song list: Architect's media list (`architect_media::ui::MediaList`),
# given the launcher's press and each song's tile.
architect-media = { workspace = true, features = ["ui"] }
# A song's cover as a `data:` URL the list's image shows.
base64 = { workspace = true }
dioxus = { workspace = true }
serde_json = { workspace = true }
futures-timer = { workspace = true }
# A clock that reads in a browser too (std's `Instant` panics there).
web-time = { workspace = true }

# Off the browser: its process copy, the machine's folders (the rigs, the
# setlist file it writes), and the runtime its host calls are polled in
# (`host::runtime`): a linked action run from a hook is not on Tokio, and
# some actions need it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
architect-extensions = { workspace = true, features = ["guest"] }
dirs = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }

# In a browser: its timers on the page's (`futures-timer` without it
# waits on a thread a browser does not have).
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
# The page's origin: a setlist's share link for the page's engine.
web-sys = { workspace = true, features = ["Window", "Location"] }

[lints]
workspace = true
