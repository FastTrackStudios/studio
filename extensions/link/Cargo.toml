[package]
name = "studio-view-link"
description = "What every Studio view extension's process is: a Studio window attached to Studio's engine (the daw extension), reading the song through the window protocol, with Architect's pane input handed on as Blitz's. Shared by studio.arrangement and studio.mixer at build time; neither needs the other at run time."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
architect-workspace = { workspace = true, features = ["paint-ui"] }
session-ui = { workspace = true, features = ["native"] }
session-engine = { workspace = true, features = ["native"] }
session = { workspace = true }
daw-ui = { workspace = true }
dioxus = { workspace = true }
blitz-traits = { workspace = true }
anyrender = { workspace = true }
serde_json = { workspace = true }
futures-timer = { workspace = true }
web-time = { workspace = true }
architect-scene = { workspace = true }

[lints]
workspace = true
