[package]
name = "studio-rig-switches"
description = "The rig's footswitch scenes: the ten switches (the hold layer over the switches under the feet), a press plays what the pedal's would. A pane of Studio, a vox client of the rig engine (the studio.rig extension); linked into apps/architect, or its own process as a development copy."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "studio-rig-switches"
path = "src/main.rs"

[dependencies]
studio-rig-link = { workspace = true }
architect-extensions = { workspace = true, features = ["guest", "linked-core"] }
guitar = { workspace = true, features = ["ui"] }
dioxus = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
