# studio.rig.switches (src/lib.rs): the footswitch scenes (`guitar::ui::panels::Switches`, the iPad layout's `TouchSwitches`), in an Architect pane: a vox client of
# the rig engine (the studio.rig extension runs it), as every Signal GUI
# is. It names no other view (docs/design/signal-extensions.md).
id = "studio.rig.switches"
name = "Rig switches"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "The rig's footswitch scenes: the ten switches (the hold layer over the switches under the feet), a press plays what the pedal's would."
authors = ["FastTrackStudios"]

[entry]
path = "studio-rig-switches"

# What a press asks of the app: another rig view brought up beside this
# one (the browser on a block's presets, Setup from a status light).
[capabilities]
effect = "mutating"
actions = ["EXT_VIEW_OPEN"]

[[views]]
id = "switches"
title = "Switches"
icon = "footprints"

[[actions]]
id = "STUDIO_RIG_SWITCHES_STATE"
name = "Rig switches: state"
description = "Whether this window's process is connected to the rig engine and where it is, why not when it is not, and what the rig's panes share (the grid's selection, the browser's focus, the part being built)."
group = "Rig"
effect = "read_only"
