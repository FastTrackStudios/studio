# studio.keys (src/lib.rs): the keys rig's screens in Architect panes, vox
# clients of the rig engine (the studio.rig extension runs it). Opening one
# starts the keys rig, as Signal's keys screen does. One extension: the
# screens share one keys view state and have no panel seam yet
# (docs/design/signal-extensions.md).
id = "studio.keys"
name = "Keys rig"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "The keys rig's screens: the engine rack (every engine, its layers, the master and the macro band), the keyboard visualiser (the keys, the wheels beside them, the patch's stack over them), an engine's or a layer's page, routing, the MIDI monitor, the rig's macros, the browser and the switches."
authors = ["FastTrackStudios"]

[entry]
path = "studio-keys"

[capabilities]
effect = "mutating"
actions = ["EXT_VIEW_OPEN"]

[[views]]
id = "rack"
title = "Engine rack"
icon = "sliders-vertical"

# The keys with the notes held lit, the wheels and pedals to their left,
# the patch's stack (each layer's span) over them.
[[views]]
id = "keyboard"
title = "Keyboard"
icon = "piano"

[[views]]
id = "layers"
title = "Keys engine & layer"
icon = "layers"

[[views]]
id = "routing"
title = "Keys routing"
icon = "workflow"

[[views]]
id = "midi"
title = "Keys MIDI"
icon = "cable"

[[views]]
id = "macros"
title = "Keys macros"
icon = "gauge"

[[views]]
id = "browser"
title = "Keys browser"
icon = "library"

[[views]]
id = "switches"
title = "Keys switches"
icon = "footprints"

[[actions]]
id = "STUDIO_KEYS_STATE"
name = "Keys rig: state"
description = "Whether this window's process is connected to the rig engine, what is open in the keys panes (`open`: the rack, an engine or a layer) and what the browser is pointed at."
group = "Keys"
effect = "read_only"

[[actions]]
id = "STUDIO_KEYS_OPEN"
name = "Keys rig: open an engine or a layer"
description = "Opens `layer` or `engine` (by name) in the keys panes' engine-and-layer view; with neither, back to the list of engines."
group = "Keys"
effect = "mutating"
params = '{"type":"object","properties":{"engine":{"type":"string"},"layer":{"type":"string"}}}'
