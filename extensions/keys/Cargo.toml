[package]
name = "studio-keys"
description = "The keys rig's screens as panes of Studio: the mixer (engines, layers, master, its macro band and keyboard), an engine's or a layer's page, the routing, the MIDI monitor, the rig's macros, the controller strip, the on-screen piano, the browser and the switches. Vox clients of the rig engine (the studio.rig extension); linked into apps/architect, or its own process as a development copy."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "studio-keys"
path = "src/main.rs"

[dependencies]
studio-rig-link = { workspace = true }
architect-extensions = { workspace = true, features = ["guest", "linked-core"] }
keys = { workspace = true, features = ["ui"] }
signal-widgets = { workspace = true, features = ["piano"] }
dioxus = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
