[package]
name = "studio-rig-setlist"
description = "The rig's sidebar: the setlist, its songs, their sections and the stacks in them; the profile's stacks or the presets in the other footswitch modes. A pane of Studio, a vox client of the rig engine (the studio.rig extension); linked into apps/architect, or its own process as a development copy."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "studio-rig-setlist"
path = "src/main.rs"

[dependencies]
studio-rig-link = { workspace = true }
architect-extensions = { workspace = true, features = ["guest", "linked-core"] }
guitar = { workspace = true, features = ["ui"] }
dioxus = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
