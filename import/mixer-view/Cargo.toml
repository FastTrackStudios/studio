# mixer-view: the mixer (strips, racks, the FX view, close-ups), a view on
# daw-view (FastTrackStudios/daw), the session primitive and daw-view-kit
# alone. Versions and patches are Studio's.

[workspace]
resolver = "3"
members = ["crates/mixer-view"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FastTrackStudios/mixer-view"

[workspace.dependencies]
# Across repos (pinned by rev; a local checkout patches them in with paths,
# never committed).
daw-view = { git = "https://github.com/FastTrackStudios/daw", rev = "d7262bea41d40b8c5c38a44266ecdc57a9f92ca0", default-features = false }
fts-session = { package = "session", git = "https://github.com/FastTrackStudios/session", rev = "04e90dace4724ac6d49a60c59ce14237e9f8261e", default-features = false }
daw-view-kit = { git = "https://github.com/FastTrackStudios/daw-view-kit", rev = "a7217417048b836dc09595d699f4a15ce915ea6d", default-features = false }
daw-ui = { git = "https://github.com/FastTrackStudios/daw-view-kit", rev = "a7217417048b836dc09595d699f4a15ce915ea6d" }
fts-audio-ui = { git = "https://github.com/FastTrackStudios/plugins", rev = "8a3abfe4639b4db9f64a452bf90b64ec96f5c577" }
frame = { git = "https://github.com/FastTrackStudios/frame", rev = "1f6311abc5eeef87c5226155a4838a6f58984410" }
# The effects and their faces: plugins' `plugin-ui`, which re-exports
# FastTrackStudios/dsp with each module's `ui` at the paths fts-fx had.
dsp = { package = "plugin-ui", git = "https://github.com/FastTrackStudios/plugins", rev = "8a3abfe4639b4db9f64a452bf90b64ec96f5c577" }
daw-proto = { git = "https://github.com/FastTrackStudios/daw", rev = "d7262bea41d40b8c5c38a44266ecdc57a9f92ca0" }
utils = { git = "https://github.com/FastTrackStudios/daw", rev = "d7262bea41d40b8c5c38a44266ecdc57a9f92ca0" }
# The effects Studio runs in-process: Signal's signal-effects (daw has none).
builtin = { package = "signal-effects", git = "https://github.com/FastTrackStudios/signal", rev = "81defbda9bd1b2739ab7f89160f0f1d719126a03" }
facet = { version = "0.50.0-rc.5", features = ["reflect", "chrono", "uuid"] }
facet-json = { version = "0.50.0-rc.7" }
architect = { git = "https://github.com/FastTrackStudios/architect", rev = "eaa969f150b4c558b4722c09e7cf619d9fa4bede" }
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false, features = ["lib"] }
dioxus-native = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1", default-features = false, features = ["prelude", "system-fonts", "svg", "autofocus", "data-uri", "vello", "accessibility", "hot-reload", "net", "html", "clipboard", "file-dialog", "vello-hybrid", "woff", "apple-font-embolden"] }
blitz-dom = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
lucide-dioxus = { git = "https://github.com/FastTrackStudios/lucide", tag = "fts-upstream-2026-11", features = ["all-icons"] }
anyrender = "0.14"
tokio = { version = "1.48", features = ["full"] }
serde_json = "1.0"
num-traits = "0.2"
tracing = { version = "0.1", features = ["std"] }
web-sys = "0.3.98"
web-time = "1"
wgpu_context = "0.10"

[workspace.lints.rust]
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"fake\"))"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

