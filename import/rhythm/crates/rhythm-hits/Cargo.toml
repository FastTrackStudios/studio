[package]
name = "rhythm-hits"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Swappable drum hit and rhythm detection library (DSP + optional ONNX)"

[features]
default = []
onnx = ["dep:ort"]

[dependencies]
num-traits.workspace = true
ort = { version = "2.0.0-rc.15", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23"] }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
