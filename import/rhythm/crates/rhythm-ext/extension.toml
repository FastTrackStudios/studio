id = "rhythm"
name = "Rhythm"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "Swappable drum hit detection and hybrid slip/stretch per-hit rhythm editing as a process extension."
authors = ["FastTrackStudios"]

[entry]
path = "fts-rhythm"

# Where its crate is, for a development copy built from source (the
# engine's ENGINE_EXT_DEV): built with `cargo build --bin fts-rhythm`.
[source]
git = "https://github.com/FastTrackStudios/rhythm"
rev = "main"
path = "crates/rhythm-ext"
bin = "fts-rhythm"

# The DAW's editing contract (daw-edit): Studio's engine asks the chosen
# provider where a performance's hits play once moved (`PLACE` →
# RHYTHM_PLACE) and where a kit's played hits should go (`PLAN` →
# RHYTHM_PLAN).
[provides]
"daw.edit" = "0.3.0"

[uses]
"fts.session" = "^0.1"

[capabilities]
effect = "mutating"

[[actions]]
id = "RHYTHM_STATE"
name = "Rhythm: state and available detectors"
description = "Lists registered hit-detection algorithms and editing strategies provided by this process."
group = "Rhythm"
effect = "read_only"

[[actions]]
id = "RHYTHM_PLACE"
name = "Rhythm: place moved hits"
description = "daw.edit's PLACE: where a recorded performance's audio plays once its hits are moved (`hits`: each `at` and `shift` in seconds; `span`; `cut`: `lead` and `guard`; `bounds`; `takes`: each take's `from`/`to` in recording time; `fill`: `least_rate`, `crossfade`, `most_crossfade`, `keep`). Answers the pieces of the recording to lay on the timeline, in the order they play: each `start`, `end`, `shift`, `crossfade` (how long it sounds over the piece before) and, where its last span is stretched over what is left of a gap, `drawn_from` and `drawn_to`. Each gap is filled without moving a hit: the piece before plays on to just before the next attack in its recording, the piece after reaches back into its own take, the two crossfade, only what is left is stretched (the shortest last span, never slower than `least_rate`), the rest left silent; `fills` says each (gap, extended, reached_back, crossfade, stretched {from, over, rate}, left, take_switch)."
group = "Rhythm"
effect = "read_only"
params = '{"type":"object","properties":{"hits":{"type":"array"},"span":{"type":"array"},"cut":{"type":"object"},"bounds":{"type":"array"},"takes":{"type":"array"},"fill":{"type":"object"}},"required":["hits","span"]}'

[[actions]]
id = "RHYTHM_PLAN"
name = "Rhythm: plan a drum edit"
description = "daw.edit's PLAN: where each of a kit's played hits should go. Takes `hits` (id, piece, take, time, peak_db, heard, flags), `notes` (the drum MIDI, mapped to pieces), `bars` (each bar's start, meter and beat length), `sections`, `zones` and `settings` (grid_hint per section, anchors, lock_runs, prefer, plan_fills). Answers every hit's target, reason and confidence; `targets`, `remove`, `delete` and `rides` in an apply's shape; `doubts` (only the hits worth a look, each with two candidates and why); and the lean per half bar."
group = "Rhythm"
effect = "read_only"
params = '{"type":"object","properties":{"hits":{"type":"array"},"notes":{"type":"array"},"bars":{"type":"array"},"sections":{"type":"array"},"zones":{"type":"array"},"settings":{"type":"object"}},"required":["hits","bars"]}'

[[actions]]
id = "RHYTHM_DETECT"
name = "Rhythm: detect hits on WAV tracks"
description = "Runs the selected hit detector (`detector`: `fts.hits.kit-fusion` or `fts.hits.envelope-gate`) over close-mic and optional trigger WAV files and returns canonical hit markers."
group = "Rhythm"
effect = "read_only"
params = '{"type":"object","properties":{"detector":{"type":"string"},"pieces":{"type":"array"},"threshold_db":{"type":"number"},"crest_db":{"type":"number"},"retrig_ms":{"type":"number"}},"required":["pieces"]}'

[[actions]]
id = "RHYTHM_PLACE_HITS"
name = "Rhythm: plan individual hit placements"
description = "Deterministically plans phase-locked slip+crossfade, transient-protected tail-stretch, or warp segments from recorded hits and per-hit moves (from UI drags or agent calls)."
group = "Rhythm"
effect = "read_only"
params = '{"type":"object","properties":{"hits":{"type":"array"},"moves":{"type":"array"},"span":{"type":"array"},"policy":{"type":"object"}},"required":["hits","moves","span"]}'

[[actions]]
id = "RHYTHM_QUANTIZE_PLAN"
name = "Rhythm: quantize hits with manual pins"
description = "Quantizes recorded hits to a grid while preserving manual per-hit pins, returning a hybrid slip/stretch edit plan."
group = "Rhythm"
effect = "read_only"
params = '{"type":"object","properties":{"hits":{"type":"array"},"bpm":{"type":"number"},"subdivision":{"type":"integer"},"strength":{"type":"number"},"tolerance_ms":{"type":"number"},"grid_origin_s":{"type":"number"},"group_window_ms":{"type":"number"},"pinned_moves":{"type":"array"},"span":{"type":"array"},"policy":{"type":"object"}},"required":["hits","bpm","span"]}'

[[actions]]
id = "RHYTHM_RENDER_PLAN"
name = "Rhythm: render a phase group to WAV"
description = "Applies one hybrid edit plan to every channel in an aligned interleaved WAV and writes a new float WAV."
group = "Rhythm"
effect = "mutating"
params = '{"type":"object","properties":{"plan":{"type":"object"},"input_wav":{"type":"string"},"output_wav":{"type":"string"}},"required":["plan","input_wav","output_wav"]}'
