[workspace]
resolver = "3"
members = [
    "crates/rhythm-hits",
    "crates/rhythm-editing",
    "crates/rhythm-ext",
    "crates/rhythm-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["FastTrackStudios"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
num-traits = "0.2"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rhythm-hits = { path = "crates/rhythm-hits" }
rhythm-editing = { path = "crates/rhythm-editing" }
