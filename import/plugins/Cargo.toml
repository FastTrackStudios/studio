# FastTrackStudio audio plugin UIs, shared UI kit, and CLAP/VST3/standalone targets.
#
# Pure DSP engines live in FastTrackStudios/dsp. Every UI/renderer/plugin-shell
# version, git pin, feature list, and [patch] below matches Studio so lockfiles
# stay aligned.

[workspace]
resolver = "3"

members = [
    "apps/plugins/comp",
    "apps/plugins/delay",
    "apps/plugins/eq",
    "apps/plugins/eq-standalone",
    "apps/plugins/gate",
    "apps/plugins/level",
    "apps/plugins/limiter",
    "apps/plugins/meter",
    "apps/plugins/mic",
    "apps/plugins/modulation",
    "apps/plugins/pitch",
    "apps/plugins/reverb",
    "apps/plugins/saturate",
    "apps/plugins/trigger",
    "apps/plugins/tune",
    "apps/plugins/unison",
    "crates/family-clap",
    "crates/fts-audio-ui",
    "crates/plugin-core",
    "crates/plugin-processors",
    "crates/plugin-ui",
    "crates/preset-browser",
    "xtask/plugins",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrackStudio"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FastTrackStudios/plugins"

[workspace.dependencies]
# ── This repo's crates ────────────────────────────────────────────────
fts-audio-ui = { path = "crates/fts-audio-ui" }
plugin-core = { path = "crates/plugin-core" }
family-clap = { path = "crates/family-clap" }
plugin-processors = { path = "crates/plugin-processors", default-features = false }
plugin-ui = { path = "crates/plugin-ui" }
preset-browser = { path = "crates/preset-browser" }

# ── Pure DSP engines (FastTrackStudios/dsp) ───────────────────────────
# For simultaneous local editing of dsp + plugins, uncomment:
# [patch."https://github.com/FastTrackStudios/dsp"]
# dsp = { path = "../dsp/crates/dsp" }
# dsp-core = { path = "../dsp/crates/dsp-core" }
# Pinned by rev, the one Signal and Studio take: a branch here and a rev
# there are two sources to cargo, and two copies of every dsp crate.
dsp = { git = "https://github.com/FastTrackStudios/dsp", rev = "75d475b01e96eed4a5ddad8ad6799396f220dd82" }
pitch-core = { git = "https://github.com/FastTrackStudios/pitch", rev = "94f8ecba5c83fff581df65707d9adf984f2cd137" }
dsp-core = { git = "https://github.com/FastTrackStudios/dsp", rev = "75d475b01e96eed4a5ddad8ad6799396f220dd82" }

# FastTrackStudio's CLAP extensions (signal/1 for the family CLAPs), from
# the daw repo.
daw-clap-ext = { git = "https://github.com/FastTrackStudios/daw", rev = "acd3f395e06fd6090593e5bbc7dd8af630ac3fd3" }

# ── Other repos, pinned as Studio pins them ───────────────────────────
architect-ui = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.12.6" }
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false, features = ["lib"] }
dioxus-core = { package = "dioxus-vdom", git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-native = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1", default-features = false, features = ["prelude", "system-fonts", "svg", "autofocus", "data-uri", "vello", "accessibility", "hot-reload", "net", "html", "clipboard", "file-dialog", "vello-hybrid", "woff", "apple-font-embolden"] }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-signals = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false }
manganis = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
nice-plug = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-dioxus = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-xtask = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }

# ── crates.io ─────────────────────────────────────────────────────────
# Algorithm files (plugin-processors), at the fleet's pins.
facet = { version = "0.50.0-rc.5" }
facet-styx = { version = "5.0.0-rc.7" }
# Float maths without `std` (plugin-processors).
libm = { version = "0.2", default-features = false }
anyhow = "1.0"
anyrender = "0.14"
anyrender_vello = "0.15"
anyrender_vello_cpu = "0.18"
atomic_float = "1.1"
blitz-dom = "=0.3.0-beta.4"
blitz-shell = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
bytemuck = "1"
cpal = "0.18"
crossbeam-channel = "0.5"
futures-timer = "3"
gloo-timers = { version = "0.3", features = ["futures"] }
kurbo = "0.13"
naga = "30"
parking_lot = "0.12"
peniko = "0.6"
pipewire = "0.10"
pollster = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
tracing = { version = "0.1", features = ["std"] }
vello = { version = "0.11", features = ["wgpu"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = "0.3.98"
web-time = "1"
wgpu = { version = "30", features = ["wgsl"] }
wgpu_context = "0.10"
winit = "0.30"

[patch.crates-io]
vox-phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.3.0" }
baseview = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.6.1" }
libspa-sys = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs.git", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
pipewire-sys = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs.git", rev = "9b54509e848e53ffa971ace15d7adf4908c09358" }
blitz-dom = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-traits = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-paint = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-shell = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-net = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-html = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
anyrender = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
anyrender_vello = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
anyrender_vello_hybrid = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
winit-uikit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
wgpu-hal = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
raw-window-metal = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
styx-format = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.1.0" }
phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.4.1" }
facet-core = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.4.1" }
phon-jit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.2.3" }

[patch."https://github.com/DioxusLabs/dioxus"]
dioxus-native = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
dioxus-native-dom = { git = "https://www.github.com/FastTrackStudios/vendor", rev = "25bf4bcdfd0b6acb268ca91a93bc8ff8da683a96" }
dioxus-vdom = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }

# ── Lints: Studio's policy ────────────────────────────────────────────
[workspace.lints.rust]
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("fake"))'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.build-override]
opt-level = 3
debug = false
[profile.dev.package."*"]
opt-level = 1
debug = false
[profile.dev.package.dsp-core]
opt-level = 3
[profile.dev.package.dsp]
opt-level = 3
[profile.dev.package.blitz-dom]
opt-level = 3
[profile.dev.package.blitz-paint]
opt-level = 3
[profile.dev.package.blitz-shell]
opt-level = 3
[profile.dev.package.blitz-traits]
opt-level = 3
[profile.dev.package.anyrender]
opt-level = 3
[profile.dev.package.anyrender_vello]
opt-level = 3
[profile.dev.package.vello]
opt-level = 3
[profile.dev.package.vello_encoding]
opt-level = 3
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.stylo]
opt-level = 3
[profile.dev.package.selectors]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.parley]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.fontique]
opt-level = 3
[profile.dev.package.peniko]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.dioxus-core]
opt-level = 3
[profile.dev.package.dioxus-native-dom]
opt-level = 3

[profile.release-fast]
inherits = "release"
incremental = true
codegen-units = 256

[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 16
