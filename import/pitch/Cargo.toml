[workspace]
resolver = "3"
members = [
    "crates/pitch-core",
    "crates/pitch-ext",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["FastTrackStudios"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
realfft = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
pitch-core = { path = "crates/pitch-core" }
