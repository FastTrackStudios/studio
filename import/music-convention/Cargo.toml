[workspace]
resolver = "2"
members = [
    "color-palette",
    "monarchy",
    "monarchy-derive",
    "music-catalog",
    "music-convention",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/FastTrackStudios/music-catalog"

[workspace.dependencies]
color-palette = { path = "color-palette" }
monarchy = { path = "monarchy" }
monarchy_derive = { path = "monarchy-derive" }
music-catalog = { path = "music-catalog" }
music-convention = { path = "music-convention" }

facet = { version = "0.50.0-rc.5", features = ["reflect", "chrono", "uuid"] }
proc-macro2 = "1"
quote = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2", features = ["full", "extra-traits"] }
thiserror = "2.0"

[workspace.lints.rust]
unused = "warn"

[workspace.lints.clippy]
all = "warn"
