[package]
name = "ignition-daslight"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Lighting: read and write Daslight 5 / myDMX 5 showfiles (.dvc) — patch, fixture profiles, groups"

# A `.dvc` is XML with zlib payloads packed into attributes
# (features/lighting/daslight/README.md). roxmltree reads it; the writer is
# ours, so attribute order and the desk's own spelling survive a round trip.
[dependencies]
roxmltree = "0.21"
flate2 = "1"
base64 = "0.22"
uuid = { workspace = true, features = ["v5"] }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
