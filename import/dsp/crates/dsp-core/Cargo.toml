[package]
name = "dsp-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Rust DSP building blocks: filters, buffers, smoothing, modulation, metering, musical time, and golden-master harness"

[lints]
workspace = true

[features]
default = ["loudness"]
golden = ["std"]
loudness = ["ebur128"]
std = []
audio = ["std"]
modulation = ["audio"]
meter = ["std"]

[dependencies]
atomic_float = { workspace = true }
ebur128 = { workspace = true, optional = true }
parking_lot = { workspace = true }
realfft = { workspace = true }

[dev-dependencies]
dsp-core = { path = ".", features = ["audio"] }

[[test]]
name = "loudness"
path = "tests/loudness.rs"
required-features = ["audio"]

[[test]]
name = "oversampling"
path = "tests/oversampling.rs"
required-features = ["audio"]
