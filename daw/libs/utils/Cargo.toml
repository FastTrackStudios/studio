[package]
name = "utils"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
uuid.workspace = true
facet-styx.workspace = true
serde.workspace = true
facet.workspace = true

# The web build keeps its preferences in localStorage, which is the half
# of this that is easy to drop when moving code between crates.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Window", "Storage"] }
# uuid refuses to build for wasm32-unknown-unknown without a source of
# randomness. `utils` is now reachable from the browser build (the
# editor reads preferences through it), so this is required, not
# cosmetic.
uuid = { workspace = true, features = ["js"] }
