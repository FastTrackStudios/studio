[package]
name = "daw-control"
version = "0.1.0"
edition = "2024"
license.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
daw-proto = { workspace = true }
# `platform` gives the portable async-runtime seam (`architect::platform::spawn`
# — tokio on native, `spawn_local` on wasm), replacing the retired moire.
architect = { workspace = true, features = ["vox", "platform"] }
vox = { workspace = true }
eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
facet-json = { workspace = true }
# Used by the lock-poisoning recovery helpers in `lock.rs` so callers
# get a structured warning when a Mutex/RwLock is recovered.
tracing = { workspace = true }
# Stream subscriptions: `architect::platform::spawn` drives each in-flight
# `#[subscribe]` call + client-side filter pump (tokio on native,
# `spawn_local` on wasm32). `futures` supplies the `select` that ties the
# call's lifetime to the consumer's Rx.
futures = { workspace = true }
facet = { workspace = true }
vox-types = { workspace = true }
# `transport_sync::TransportLeader` feeds the sync core's ClockEstimator
# and hands its Follower positions. Dependency-free and wasm-clean.
daw-transport-sync = { workspace = true }
# Note: No tokio - this crate is WASM-compatible for use in web apps

[lints]
workspace = true
