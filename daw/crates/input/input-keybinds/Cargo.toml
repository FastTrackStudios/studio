[package]
name = "input-keybinds"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "App-agnostic bridge from keybind-config (input-config-proto) to input's KeymapConfig, plus a styx profile loader"

# Wasm-clean: the bridge is pure (input + input-config-proto), the styx loader
# uses facet-styx (a pure parser) and std::fs — no reaper, no tokio, no
# threads. Web editors and general Dioxus apps depend on this crate to turn
# styx keybind profiles into an `input::KeymapConfig`.

[dependencies]
input = { workspace = true }
input-config-proto = { workspace = true }
facet-styx = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true
