[package]
name = "input-dioxus"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Dioxus event conversion bridge for input"

[dependencies]
input = { workspace = true }
dioxus = { workspace = true }
architect-ui = { workspace = true }

# The chord-sequence timeout uses a timer. Native: tokio (the workspace dep is
# `features=["full"]`, which pulls mio's net stack — unsupported on wasm — so
# tokio is native-only here). Wasm: gloo-timers' browser timer. See `sleep` in
# hook.rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[lib]
test = false
doctest = false

[lints]
workspace = true
