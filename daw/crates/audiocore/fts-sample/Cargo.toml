[package]
name = "fts-sample"
version.workspace = true
authors.workspace = true
license.workspace = true
edition = "2021"          # kept on 2021 — matches signal-sampler (the engine's home crate); migrate the pair together
description = "Shared audio sample loading utilities for FTS plugins"

[features]
default = ["load", "write", "engine"]
# Resident symphonium loads (`load_audio`, `load_mono_f32`, `load_planar_f32`,
# `decode_bytes`). `probe` needs no feature — it is header-only std I/O.
load = ["dep:symphonium", "dep:crossbeam-channel"]
# Extra symphonium codecs/containers for `load`/`decode_bytes` beyond the
# workspace baseline (wav/pcm): mp3, ogg/vorbis, flac, aac — the DAW's
# resident-decode format set.
decode-compressed = [
    "load",
    "symphonium/mp3",
    "symphonium/ogg",
    "symphonium/vorbis",
    "symphonium/flac",
    "symphonium/aac",
]
# The shared 32-bit-float WAV writer (`write_wav_f32`).
write = ["dep:hound"]
# The process-wide preload RAM budget (`budget::*`) — std-only, no deps.
budget = []
# Memory-mapped PCM file source (`mapped::PcmFile`) — memmap2 only, none of
# the `engine` codecs. The DAW's streaming WAV path.
mapped = ["dep:memmap2"]
# The wasm-clean half of the pack engine: open a pack from bytes
# (`SignalPcmPack::open_bytes`) and decode its samples (FLAC via
# symphonia/claxon, Ogg Vorbis via symphonia, raw PCM straight from the
# buffer). No mmap, no threads, no encoders.
engine-core = [
    "budget",
    "dep:arc-swap",
    "dep:hound",
    "dep:claxon",
    "dep:symphonia",
    "dep:symphonia-bundle-flac",
    "dep:symphonia-core",
    "dep:symphonia-format-ogg",
    "dep:symphonia-codec-vorbis",
]
# The native half on top: mmap'd pack open, rayon-parallel preload, the
# background streamer/warm threads, the on-disk stream cache, and pack
# WRITING (flacenc / vorbis_rs encoders).
engine-native = [
    "engine-core",
    "dep:memmap2",
    "dep:rayon",
    "dep:flacenc",
    "dep:vorbis_rs",
]
# The pack/cache/stream engine — the heavy half. Alias for `engine-native`
# so existing consumers (signal-sampler et al.) are untouched. Lean
# consumers (e.g. the iOS-clean session-guide) take only `load`/`write`;
# wasm consumers take `engine-core`.
engine = ["engine-native"]

[dependencies]
symphonium = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# ── Sample-engine file layer (moved from signal-sampler) ──────────────────────
arc-swap    = { version = "1.7", optional = true }
hound       = { version = "3.5", optional = true }
# FLAC decode for .signalpack samples. Primary path is symphonia (faster on
# 24-bit); claxon is kept as a correctness fallback. See `load_flac_bytes`:
# symphonia rejects our streams' short final block (STREAMINFO min<max read as
# variable-blocksize), so we normalize STREAMINFO min:=max in the copy we feed
# it. claxon decodes the raw bytes regardless and backstops any oddball pack.
claxon      = { version = "0.4", optional = true }
symphonia   = { version = "0.5", default-features = false, features = ["flac"], optional = true }
symphonia-bundle-flac = { version = "0.5", optional = true }
symphonia-core = { version = "0.5", optional = true }
# Ogg Vorbis proxy packs (kind 6): pure-Rust decode via symphonia (runtime,
# wasm-clean); encode via vorbis_rs (vendored aoTuV libvorbis — builder-side
# only, `create_signal_pack_with(PackCodec::OggVorbis)`).
symphonia-format-ogg  = { version = "0.5", optional = true }
symphonia-codec-vorbis = { version = "0.5", optional = true }
vorbis_rs   = { version = "0.5", optional = true }
memmap2     = { workspace = true, optional = true }
flacenc     = { version = "0.5.1", optional = true }
rayon       = { version = "1", optional = true }
