[package]
name = "audiocore-core"
version.workspace = true
authors.workspace = true
license.workspace = true
edition = "2021"          # kept on 2021 — pre-move workspace edition; migrate deliberately
description = "Core abstraction layer for FTS audio plugins (nih_plug + dioxus)"

[features]
default = ["gui"]
gui = ["nice-plug-dioxus", "audiocore-gui"]

[dependencies]
nice-plug = { workspace = true }
nice-plug-dioxus = { workspace = true, optional = true }
audiocore-gui = { workspace = true, optional = true }
atomic_float = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
