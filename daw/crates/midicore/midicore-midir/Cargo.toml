[package]
name = "midicore-midir"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move workspace edition; migrate deliberately
authors.workspace = true
license.workspace = true
description = "midir-backed OS MIDI input backend for midicore — enumerate ports, open a PortSelector (device/all/virtual), decode bytes into midicore::MidiEvent."

[features]
default = []
# Route MIDI through JACK instead of ALSA. This is a COMPILE-TIME backend
# swap in midir (backend/mod.rs selects alsa XOR jack on Linux), so it flips
# the whole binary's midir — never a per-port choice. On a PipeWire host the
# JACK API is served by the `pipewire-jack` shim (the same one cpal's audio
# uses), so our input ports become PipeWire graph nodes: routable in
# qpwgraph, non-exclusive, and NOT a raw ALSA-seq/hw device grab. Needs
# libjack at link + run time (pipewire-jack; provided by the flake dev shell).
jack = ["midir/jack"]
# Intent alias — on this stack "pipewire MIDI" means the JACK backend over
# the pipewire-jack shim. Same switch, clearer name at the call site.
pipewire = ["jack"]

[dependencies]
midicore-proto.workspace = true
midir = "0.11"
crossbeam-channel = "0.5"
eyre = "0.6"
tracing = "0.1"
