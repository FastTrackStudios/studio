[package]
name = "midicore-pipewire"
version.workspace = true
edition = "2021"          # matches the rest of midicore
authors.workspace = true
license.workspace = true
description = "Native PipeWire MIDI input backend for midicore — ONE graph node with ONE merged MIDI port, no JACK shim."

# PipeWire is Linux-only. Other platforms get an empty crate so the
# workspace still builds there; `midicore::pipewire` is Linux-only too.
[target.'cfg(target_os = "linux")'.dependencies]
midicore-proto.workspace = true
pipewire = "0.10"
libspa = "0.10"
libspa-sys = "0.10"
eyre = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tracing-subscriber.workspace = true
