[package]
name = "midicore"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move workspace edition; migrate deliberately
authors.workspace = true
license.workspace = true
description = "Ergonomic, backend-agnostic MIDI — the single app-facing facade. Re-exports the wire types + codec + services (midicore-proto) and, behind features, concrete I/O backends (midir). Consumers depend ONLY on this crate."
repository = "https://codeberg.org/FastTrackStudios/midicore"

[features]
default = ["vox"]
# The #[architect::rpc] service surface (client + dispatcher + streaming).
vox = ["midicore-proto/vox"]
# The midir OS backend, exposed as `midicore::midir` (native only), plus the
# `midicore::attach` lifecycle helpers built on it.
midir = ["dep:midicore-midir", "dep:eyre", "dep:tracing"]
# The midir backend, routed through JACK/pipewire-jack instead of ALSA.
# Implies `midir`. Compile-time, whole-binary swap (see midicore-midir).
midir-jack = ["midir", "midicore-midir/jack"]
# Intent alias for the deployed live rig, kept for callers that still name it.
# Prefer `pipewire` below: it talks to PipeWire directly instead of routing
# through the JACK shim, and costs ONE graph node instead of one per port.
midir-pipewire = ["midir-jack"]
# The native PipeWire backend, exposed as `midicore::pipewire`. One graph node
# with one merged MIDI port, registry-driven hot-plug, and no libjack. Can be
# enabled alongside `midir` — they are separate modules, not a compile-time
# swap of one another.
pipewire = ["dep:midicore-pipewire", "dep:eyre", "dep:tracing"]
# The platform's native input, exposed as `midicore::MidiInput` (and the
# backend itself as `midicore::native::Backend`): PipeWire on Linux, CoreMIDI
# on macOS, Web MIDI on wasm32. Each backend crate is empty off its platform,
# so enabling all three costs nothing. Anywhere else, add `midir` and the
# midir adapter stands in.
native = [
    "dep:midicore-pipewire", "dep:midicore-macos", "dep:midicore-wasm",
    "dep:eyre", "dep:tracing",
]

[dependencies]
midicore-proto.workspace = true
midicore-midir = { workspace = true, optional = true }
midicore-pipewire = { workspace = true, optional = true }
midicore-macos = { workspace = true, optional = true }
midicore-wasm = { workspace = true, optional = true }
# `midicore::attach` only (midir feature).
eyre = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
