[package]
name = "dawfile-standalone"
version = "0.1.0"
edition = "2024"
description = "The native `.daw` project format — styx on the inside, daw_proto via Facet"
license = "GPL-3.0-or-later"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
loro.workspace = true
dawfile-dawproject.workspace = true
# The document model *is* the daw facade's model. See #155 decision 2.
daw-proto = { workspace = true }
# Styx is the on-disk syntax; facet (not serde) is the reflection layer.
facet = { workspace = true }
facet-styx = { workspace = true }
# `FormatOptions` — needed for `omit_none`; see src/styx.rs.
styx-format = { workspace = true }
# Content addressing for `objects/`. The store proper (GC, `compact`,
# placeholder tolerance) is #172; this crate only needs put/get.
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# REAPER interop: `rpp_tree` is the lossless layer and is *not* rebuilt here.
dawfile-reaper = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
loro.workspace = true
dawfile-dawproject.workspace = true
# The corpus test tokenizes raw `.rpp` lines to compare content through the
# tree's quoting normalisation.
dawfile-reaper = { workspace = true }
daw-proto = { workspace = true }
uuid = { workspace = true }
