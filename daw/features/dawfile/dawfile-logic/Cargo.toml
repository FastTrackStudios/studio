[package]
name = "dawfile-logic"
version = "0.1.0"
edition = "2024"
description = "Logic Pro session file parser (.logicx) — pure Rust, no C dependencies"
license = "GPL-3.0-or-later"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
thiserror = { workspace = true }
daw-proto = { workspace = true }

# Binary plist parsing (Logic uses bplist00 throughout)
plist = "1"

[dev-dependencies]

[lints]
workspace = true
