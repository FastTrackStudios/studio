[package]
name = "reaper-dioxus"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Dioxus-native overlay rendering for REAPER extensions"

[dependencies]
reaper-embed = { path = "../reaper-embed" }

# DAW module system (for PanelDef type)
daw.workspace = true

# REAPER API access
reaper-low.workspace = true
reaper-medium.workspace = true
reaper-high.workspace = true

# Dioxus-native with blitz rendering — workspace-pinned rev (one blitz
# tree-wide; `links = servo_style_crate` forbids a second rev).
dioxus-native.workspace = true
blitz-dom.workspace = true
blitz-paint.workspace = true
blitz-traits.workspace = true

# Rendering pipeline
anyrender_vello.workspace = true
vello.workspace = true
wgpu.workspace = true

# Hot reload (enabled by default for dev, disable for release)
dioxus-devtools = { workspace = true, optional = true }

# Event types for forwarding input to Blitz
keyboard-types = "0.7"

# Utilities
futures-util = "0.3"
crossbeam = "0.8"
raw-window-handle = "0.6"
tracing.workspace = true
# The upstream `desktop-renderer` feature (dioxus-embedded + gtk) is
# dropped in the vendored copy: it hung off dioxus-embedded.git (dead
# starcommand URL) and nothing in-tree consumes it.

[features]
default = ["hot-reload"]
hot-reload = ["dep:dioxus-devtools"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11-dl = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa.workspace = true
objc.workspace = true

[lints]
workspace = true
