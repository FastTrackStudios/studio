# Track-creation icons for the Empty TCP area toolbar — instrument glyph on
# the canonical FTS instrument color (music-catalog instruments.rs).
#   fts-icons build examples/tracks.toml --install

[settings]
resource_paths = ["~/.fts-dev"]

[defaults.all]
icon_size = 22
bg_size = 28
corner_radius = 6

[defaults.normal]
icon = "#ffffff"

[defaults.hover]
border = "#ffffffaa"
border_width = 1.5

[defaults.clicked]
border = "#ffffff"
border_width = 2.5

[[icon]]
file = "fts_trk_insert"
source = "mdi:plus-thick"
assign = "40702"            # Insert track
  [icon.normal]
  bg = "#475569"            # slate-600

[[icon]]
file = "fts_trk_drums"
source = "game-icons:drum-kit"
assign = "_FTS_SESSION_CREATE_NEW_DRUM_KIT"
  [icon.normal]
  bg = "#EF4444"            # drums::DRUM_KIT red-500

[[icon]]
file = "fts_trk_edrums"
