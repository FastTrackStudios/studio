[package]
name = "fts-icons"
description = "REAPER toolbar icon generator — search Iconify, render 3-state strips, install into resource paths"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
autoexamples = false

[features]
default = []
# Emit `daw_proto::ToolbarIcon` values so generated icons can be assigned
# through the live `Toolbar` RPC service instead of patching reaper-menu.ini.
toolbar = ["dep:daw-proto"]

[lib]
name = "fts_icons"
path = "src/lib.rs"

[[bin]]
name = "fts-icons"
path = "src/bin/fts-icons.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
daw-proto = { workspace = true, optional = true }

# SVG rendering — same major as the rest of the tree (keyflow-cli, engraver).
resvg = "0.45"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
dirs = "6"

[lints]
workspace = true
