apiVersion: v2
name: studio
description: >-
  studio.fasttrackstudio.app — Studio's web front end: the front door,
  Signal at /signal/ and Session at /session/. Static files and a static
  file server, nothing else: Task and fts-auth do every connection, and
  the container finds them from TASK_URL / AUTH_URL (values taskUrl /
  authUrl), written to /config.json when it starts.
type: application
home: https://github.com/FastTrackStudios/studio
sources:
  - https://github.com/FastTrackStudios/studio
# Static: a release changes neither. The chart does not pin its image: it
# renders `image.tag`, `latest` by default, and on starcommand
# argocd-image-updater writes the release into image.repository /
# image.tag (the highest X.Y.Z studio-web image on GHCR, which the release
# tag's Images job pushes). Bump `version` by hand when the chart itself
# changes.
version: 26.10.3
appVersion: "26.10.3"
