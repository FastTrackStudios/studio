# Self-hosted Studio web next to a Task of your own, behind one origin.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   open http://localhost:8090         # Studio: /, /signal/, /session/
#   open http://localhost:8091         # Task's own web app
#
# Both ports are bound to 127.0.0.1: the edge also routes Task's API, so
# the quickstart is reachable from this machine only. To serve other
# machines, change the bindings (EDGE_BIND=0.0.0.0) behind TLS and
# whatever access control you put in front of Task, and set
# TASK_SERVER_PUBLIC_URL to the address they use.
#
# Settings come from the environment or an --env-file (all optional):
#   TASK_URL / AUTH_URL       Task and fts-auth elsewhere (empty = this edge)
#   TASK_SERVER_PUBLIC_URL    where browsers reach this Task (default
#                             http://localhost:8090)
#   EDGE_BIND                 the address the ports bind to (127.0.0.1)
#
# studio-web is static files and nothing else: the browser talks to Task.
# With TASK_URL / AUTH_URL unset the apps dial their OWN origin (the
# same-origin setup), so the edge below routes Task's API prefixes to
# task-server on the same host and port as studio-web, the way task's own
# deploy/docker-compose.yml does for task-web. Point the apps at a Task
# elsewhere instead with TASK_URL (and drop `server` / `task-web`).
#
# Images: ghcr.io/fasttrackstudios/studio-web (tags: <version>,
# sha-<short>, latest = the last release), or build it with Nix (no
# Dockerfile, Linux):
#
#   $(nix build --no-link --print-out-paths .#studio-web-image) | docker load

services:
  studio:
    image: ghcr.io/fasttrackstudios/studio-web:latest
    restart: unless-stopped
    environment:
      # Empty = same origin (this edge). E.g. https://task.fasttrackstudio.app
      TASK_URL: ${TASK_URL:-}
      # fts-auth, the OIDC issuer. Empty = same origin.
      AUTH_URL: ${AUTH_URL:-}
    # The start step writes /srv/config/config.json (served as
    # /config.json); the rest of the filesystem can stay read-only.
    read_only: true
    tmpfs:
      - /srv/config:mode=1777

  # Task, as task's deploy/docker-compose.yml runs it.
  server:
    image: ghcr.io/fasttrackstudios/task-server:latest
    restart: unless-stopped
    environment:
      TASK_DATA_ROOT: /data
      TASK_SERVER_BIND: 0.0.0.0:8080
      # Where users reach Task's API: Studio's origin here (signed
      # attachment URLs are minted against it). Set it to the address other
      # machines use when they reach this stack.
      TASK_SERVER_PUBLIC_URL: ${TASK_SERVER_PUBLIC_URL:-http://localhost:8090}
      # Production: `openssl rand -hex 32`, e.g. via --env-file.
      # TASK_SERVER_SEALING_KEY: ${TASK_SERVER_SEALING_KEY}
    volumes:
      - task-data:/data

  task-web:
    image: ghcr.io/fasttrackstudios/task-web:latest
    restart: unless-stopped

  # Same-origin edge: Task's API prefixes -> task-server; everything else
  # -> studio-web on :8090, task-web on :8091.
  edge:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${EDGE_BIND:-127.0.0.1}:8090:80"
      - "${EDGE_BIND:-127.0.0.1}:8091:81"
    depends_on:
      - studio
      - server
      - task-web
    configs:
      - source: edge-nginx
        target: /etc/nginx/conf.d/default.conf

configs:
  edge-nginx:
    content: |
      # Docker's embedded DNS, asked per request (proxy_pass to a variable):
      # a backend recreated with a new address is found without
      # restarting the edge.
      resolver 127.0.0.11 valid=10s ipv6=off;

      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
      }

      # Task's API (as task's chart and compose route it), then the site:
      # studio-web on :80, task-web on :81.
      server {
          listen 80;
          client_max_body_size 1g;
          set $$task_server http://server:8080;
          set $$site http://studio:8080;
          location ~ ^/(vox|org|server|blobs|\.well-known) {
              proxy_pass $$task_server;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_read_timeout 1h;
              proxy_send_timeout 1h;
          }
          location / {
              proxy_pass $$site;
              proxy_set_header Host $$host;
          }
      }

      server {
          listen 81;
          client_max_body_size 1g;
          set $$task_server http://server:8080;
          set $$site http://task-web:8080;
          location ~ ^/(vox|org|server|blobs|\.well-known) {
              proxy_pass $$task_server;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_read_timeout 1h;
              proxy_send_timeout 1h;
          }
          location / {
              proxy_pass $$site;
              proxy_set_header Host $$host;
          }
      }

volumes:
  task-data:
