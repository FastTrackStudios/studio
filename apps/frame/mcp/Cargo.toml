[package]
name = "frame-mcp"
description = "MCP server: lets any MCP client (Claude, …) design frame control surfaces."
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "frame-mcp"
path = "src/main.rs"

[dependencies]
design-session = { path = "../../../crates/frame/design/design-session" }
document-proto = { path = "../../../crates/frame/document/document-proto", default-features = false }
document-io = { path = "../../../crates/frame/document/document-io" }
surface-memory = { path = "../../../crates/frame/surface/surface-memory" }
surface-proto = { path = "../../../crates/frame/surface/surface-proto" }
surface-runtime = { path = "../../../crates/frame/surface/surface-runtime", features = ["remote"] }
library-link = { path = "../../../crates/frame/library/library-link" }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
library-fs = { path = "../../../crates/frame/library/library-fs" }
architect = { workspace = true, features = ["vox", "local"] }

[lints]
workspace = true
