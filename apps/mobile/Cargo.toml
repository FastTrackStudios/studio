[package]
name = "studio-mobile"
description = "Studio on an iPhone or iPad: Architect's iOS app (`architect_mobile::run`, Blitz on UIKit) with Studio's distribution (`studio_extensions::distribution`: the same name, bundle id, extensions and launcher home as the desktop app and studio-web). Its bundle is `app.fasttrackstudio.studio`, the TestFlight record the old rig app (apps/studio/desktop) shipped to."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "studio-mobile"
path = "src/main.rs"

# Only an Apple phone or tablet builds the app; anywhere else (a
# workspace-wide build) the crate is its `main` saying so.
[target.'cfg(target_os = "ios")'.dependencies]
architect-mobile = { workspace = true }
# Studio's distribution with the window's views (`stage`): the launcher,
# the arrangement, the mixer, the lyrics, the navigator, Keyflow's chart.
studio-extensions = { workspace = true, features = ["mobile"] }

[lints]
workspace = true
