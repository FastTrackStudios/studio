[package]
name = "patchbay-web"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "patchbay-web"
path = "src/main.rs"

[dependencies]
patchbay = { workspace = true, features = ["ui"] }
dioxus = { workspace = true, default-features = true, features = ["web", "launch"] }
vox.workspace = true
vox-core.workspace = true
vox-websocket.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }

[lints]
workspace = true
