[package]
name = "meter-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FTS Meter — LUFS / true-peak / correlation / goniometer / spectrum metering plugin"

[lib]
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
nice-plug = { workspace = true, features = ["vst3"] }
nice-plug-dioxus.workspace = true
dioxus = { workspace = true }
dsp-core = { workspace = true, features = ["meter"] }
plugin-core = { workspace = true, features = ["meters"] }
parking_lot = { workspace = true }

[features]
default = []
# The CLAP / VST3 entry points, on only for the bundle build (`just
# plugins-bundle` passes `--features export`): every plugin exports the
# same `clap_entry` / `GetPluginFactory` symbols, so two in one binary —
# the session engine's built-in FX, or a workspace test build, where cargo
# unifies features — collide.
export = []
