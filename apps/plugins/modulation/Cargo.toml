[package]
name = "modulation-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FTS Modulation — CLAP/VST3 multi-mode modulation plugin (chorus / flanger / vibrato / tremolo / wah) over the modulation facade"

[lib]
# cdylib → the loadable CLAP/VST3 binary; lib → tests + a future standalone host.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
audiocore-core = { workspace = true }
# What each circuit IS, and the only place that knows how a knob reaches the
# DSP — the shell deliberately carries no engine table of its own.
modulation = { workspace = true, features = ["native", "profiles", "ui", "viz"] }
# The Blitz/nice-plug editor: the five circuits and their panels.
# The meters the editor reads.
atomic_float = { workspace = true }
# Plugin framework. `nice_plug` must be a DIRECT dep: `#[derive(Params)]` and
# `nice_export_clap!`/`nice_export_vst3!` expand to absolute `::nice_plug::…`
# paths, so the crate has to be nameable here. `vst3` is on by default.
nice-plug = { workspace = true, features = ["vst3"] }

# The DSP facade (re-exports chorus-dsp / trem-dsp / wah-dsp as
# `chorus` / `trem` / `wah`). Never depend on the `*-dsp` crates directly.

# The `Processor` trait + `AudioConfig` the modulation chains implement.
audiocore-dsp.workspace = true

[features]
default = []
# The CLAP / VST3 entry points, on only for the bundle build (`just
# plugins-bundle` passes `--features export`): every plugin exports the
# same `clap_entry` / `GetPluginFactory` symbols, so two in one binary —
# the session engine's built-in FX, or a workspace test build, where cargo
# unifies features — collide.
export = []
