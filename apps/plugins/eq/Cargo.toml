[package]
name = "eq-plugin"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "FTS EQ — CLAP/VST3 audio plugin entry point"

[lib]
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
plugin-core = { workspace = true }
eq = { workspace = true, features = ["native", "profiles", "ui"] }
# The full Dioxus plugin editor (control view, EQ graph, spectrum) —
# `native` pulls nice-plug-dioxus/Blitz.
dsp-core = { workspace = true, features = ["audio"] }
nice-plug = { workspace = true, features = ["vst3"] }

[features]
default = []
# The CLAP / VST3 entry points, on only for the bundle build (`just
# plugins-bundle` passes `--features export`): every plugin exports the
# same `clap_entry` / `GetPluginFactory` symbols, so two in one binary —
# the session engine's built-in FX, or a workspace test build, where cargo
# unifies features — collide.
export = []
