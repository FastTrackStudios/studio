[package]
name = "tune-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FTS Tune — CLAP/VST3 monophonic pitch-correction plugin (YIN detect → scale snap → pitch-dsp shift)"

[lib]
# cdylib → the loadable CLAP/VST3 binary; lib → tests + a future standalone host.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
# Plugin framework (`vst3` on by default). Must be a direct dep — the export
# macros expand to absolute `::nice_plug::…` paths.
nice-plug = { workspace = true, features = ["vst3"] }

# DSP facade (re-exports tune-dsp, which re-exports the pitch-dsp shifter).
tune.workspace = true

# The `Processor` trait + `AudioConfig` used to drive the pitch-shift chain.
dsp-core = { workspace = true, features = ["audio"] }

[features]
default = []
# The CLAP / VST3 entry points, on only for the bundle build (`just
# plugins-bundle` passes `--features export`): every plugin exports the
# same `clap_entry` / `GetPluginFactory` symbols, so two in one binary —
# the session engine's built-in FX, or a workspace test build, where cargo
# unifies features — collide.
export = []
