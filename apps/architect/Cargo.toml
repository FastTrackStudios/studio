[package]
name = "studio-architect"
description = "Studio's distribution of Architect: the Architect app with Studio's extensions compiled in (setlists and its share-page chart renderer, productions), under a name, bundle id and config folder of its own. Its node (`studio-architect serve`, built without `gui`) is what a hosted Architect runs, so share links draw Studio's charts; built and released by scripts/studio-architect.sh (docs/architect-distribution.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "studio-architect"
path = "src/main.rs"

[features]
# The window, as the Architect app has it. Off (`--no-default-features`),
# the binary is the headless node alone: no Blitz, wgpu or wayland in it.
default = ["gui"]
gui = [
    "architect-desktop/gui",
    "dep:studio-arrangement",
    "dep:session-engine",
    "dep:studio-mixer",
    "dep:studio-lyrics",
    "dep:studio-navigator",
    "dep:studio-launcher",
    "dep:keyflow-extension",
    "dep:ignition-pane",
    "dep:studio-rig-switches",
    "dep:studio-rig-setlist",
    "dep:studio-rig-browser",
    "dep:studio-rig-grid",
    "dep:studio-rig-macros",
    "dep:studio-rig-status",
    "dep:studio-audio-settings",
    "dep:studio-keys",
]

[dependencies]
# `vox` (the node's services) and no window, from the workspace entry.
architect-desktop = { workspace = true }
# Song libraries and setlists, linked in (`setlists::ext::Setlists`), and
# `share`: the renderer that draws a song's chart as Keyflow's follow SVG
# on a share link (`setlists::share::blocks`, studio#406).
setlists = { workspace = true, features = ["extension", "share"] }
# Productions in other DAWs, linked in (`productions::ext::Productions`).
productions = { workspace = true, features = ["extension"] }
# Studio's views and the Views toolbar that opens them, linked in
# (`studio_views::ext::StudioViews`, studio#409).
studio-views = { workspace = true, features = ["extension"] }

# The window's extensions, linked in with `gui` only (a headless node
# draws no panes): Studio's arrangement and mixer views, Keyflow's chart,
# Ignition's lighting. Studio's engine (`daw`) stays a process of its own:
# a process has one audio mode, and these views attach to an engine as
# studio-desktop's window does.
studio-arrangement = { workspace = true, optional = true }
session-engine = { workspace = true, optional = true, features = ["native"] }
studio-mixer = { workspace = true, optional = true }
studio-lyrics = { workspace = true, optional = true }
studio-navigator = { workspace = true, optional = true }
studio-launcher = { workspace = true, optional = true }
keyflow-extension = { workspace = true, optional = true }
ignition-pane = { workspace = true, optional = true }
# Signal's rig views (docs/design/signal-extensions.md), vox clients of the
# rig engine (`studio.rig`, a process of its own as `daw` is).
studio-rig-switches = { workspace = true, optional = true }
studio-rig-setlist = { workspace = true, optional = true }
studio-rig-browser = { workspace = true, optional = true }
studio-rig-grid = { workspace = true, optional = true }
studio-rig-macros = { workspace = true, optional = true }
studio-rig-status = { workspace = true, optional = true }
# One settings surface for both engines (the daw engine and the rig engine).
studio-audio-settings = { workspace = true, optional = true }
# The keys rig's screens, clients of the same rig engine.
studio-keys = { workspace = true, optional = true }

# Its island (#445): `SiteIsland`, the node serves it; its folder is
# checked against its lock (sha256, base64) before it is (src/island.rs).
architect-sites = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# tests/node.rs: a real node on loopback, serving a setlist's share link.
tokio = { workspace = true }
tempfile = { workspace = true }
architect-spaces = { workspace = true, features = ["server"] }

[lints]
workspace = true
