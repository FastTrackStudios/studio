[package]
name = "studio-island"
description = "Studio's island on a share link's now-playing view (studio#445): Session's progress bar and transport (transport-ui) as a WASI component the node runs in the page's sandbox, given where the song is and asking only the page's playhead intents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The setlist view's contract with the app (src/queue.rs): built for every
# target, so its tests run on the host. `setlists` without features: its
# setlist fence reader and its rows' keys, nothing of a vault or a chart.
[dependencies]
serde_json = { workspace = true }
setlists = { workspace = true }

# The component (wasm32-wasip2): drawn by Architect's web runtime, which
# needs JS Promise Integration.
[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
architect-extension-wasi = { workspace = true }
dioxus = { workspace = true }
transport-ui = { workspace = true }
serde_json = { workspace = true }

# The same views as a web bundle (wasm32-unknown-unknown, wasm-bindgen's
# `--target web`: `just island-web`), for a share page's web view frame
# (Architect's `SiteIsland::web`): any browser, Safari before 27 and iOS
# included. Given where the song is by the frame's `architectPage`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
dioxus = { workspace = true, features = ["web", "launch"] }
transport-ui = { workspace = true }
lyrics-ui = { workspace = true, features = ["view"] }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
futures-channel = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true
