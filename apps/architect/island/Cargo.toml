[package]
name = "studio-island"
description = "Studio's island on a share link's now-playing view (studio#445): Session's progress bar and transport (transport-ui) as a WASI component the node runs in the page's sandbox, given where the song is and asking only the page's playhead intents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
architect-extension-wasi = { workspace = true }
dioxus = { workspace = true }
transport-ui = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
