# Studio's island (studio#445): Session's progress bar and transport on a
# share link's now-playing view, a WASI component built for wasm32-wasip2
# (`just island`) and linked into Studio Architect's node
# (`Distribution::island`). It is given where the song is and may ask the
# page only to seek, play, pause, or go to the previous or next song.
# Its web bundle also draws a setlist note in Architect's web app (the
# `setlist.playlist` view, claimed by note type below), whose list it puts
# in the app's playhead as its source (`architect.playhead`, architect#589),
# and declares a setlist's favourites. The step toward one Studio
# extension: the view, its claim and the favourites that open it are this
# one manifest's (a favourite opens only its own extension's views,
# architect#658), never split across two.
id = "studio.transport"
name = "Studio transport"
version = "0.1.0"
kind = "wasm"
api = "0.1"
description = "Session's song progress bar and transport controls on a song's now-playing view, and a setlist as a streaming app's playlist beside a setlist note."
authors = ["FastTrackStudios"]

[wasm]
component = "studio_island.wasm"

# The playhead's actions on its own source (architect#589): the frame
# host lets a view ask seven of them; a favourite's round button runs
# `PLAYHEAD_TOGGLE` (architect#660), which a favourite may name only when
# the capabilities name `PLAYHEAD_`. `mutating`: `architect-playhead`
# declares SET, ITEM and TOGGLE so (they move the playhead, never a vault).
[capabilities]
actions = ["PLAYHEAD_"]
effect = "mutating"
# Its views read the note they are drawn beside: a claimed view is handed
# the note's text only when its extension says it reads the app's
# documents (architect#659 as revised), and the note's images and synced
# lyrics only when it reads `files` too (architect#669, #673: images as
# `data:` URLs, `.lrc` as text, at most 2 MiB a file, 8 MiB and 32 files a
# note; a share link's guest only what the link shares). The setlist view
# draws each song's cover and sends its timed lines; the song view its
# chart and lyrics.
reads = ["documents", "files"]

# The setlist view sets its own source in the app's playhead and plays its
# items (architect#589, `architect.playhead` v0.1).
[uses]
"architect.playhead" = "^0.1"

[[views]]
id = "progress"
title = "Progress"
icon = "music"

[[views]]
id = "transport"
title = "Transport"
icon = "play"

# The Lyrics tab's view (web bundle only): Session's lyrics panel as its
# Confidence Monitor, over the song playing (its timed lines as props).
[[views]]
id = "lyrics"
title = "Lyrics"
icon = "mic-vocal"

# One setlist as a streaming app's playlist (web bundle only): each set a
# label, each song a row (number, its key's tile, title over artist,
# length), the song playing marked, a row pressed plays it. Given the note
# and the playhead's state as props (src/queue.rs). Not `setlist`:
# `studio-setlists` has that view (every setlist), and one Studio
# extension will hold both.
[[views]]
id = "setlist.playlist"
title = "Setlist"
icon = "list-music"

# A song note's chart and lyrics (web bundle only, studio#491): its `kf`
# fence engraved in the frame (`setlists::follow`), the bar being played
# marked and kept in view, a bar pressed plays from there; its `.lrc` (or
# its `lrc` fence) as timed lines, the one sung marked, a line pressed
# plays from there. Follows this extension's source while its item is the
# song's recording (the one the note embeds). What a share link's guest
# saw on the retired share page (studio#406), in the web app.
[[views]]
id = "song"
title = "Song"
icon = "music"

# Drawn at the head of a note of type `setlist` in the web app's frame
# host (the node lists the claim: `SiteIsland::embed`).
#
# The claim reads the note (`reads`, with `[capabilities] reads` above:
# the node's `SiteIsland::embed_note` and `SiteIsland::reads`). A member
# is handed the note (its `%%comments%%` removed) and the images and
# lyrics it and its songs reference; a share link's guest its text as the
# link's build wrote it (architect#669: no frontmatter, no path), the
# `properties` below, and the link's images and lyrics, the note's own
# first.
[[embeds]]
id = "setlist.playlist"
title = "Setlist"
view = "setlist.playlist"
claims = { note_type = ["setlist"] }
reads = ["documents"]
properties = ["date"]

# Drawn at the head of a note of type `song` (`setlists::song`): its chart
# and lyrics, from its text and the files handed with it.
[[embeds]]
id = "song"
title = "Song"
view = "song"
claims = { note_type = ["song"] }
reads = ["documents"]

# A setlist's favourites (architect#607, #658): the bottom slots while a
# setlist note is open, each a view of this extension's own. Its playlist,
# the lyrics of the song playing, and the round button plays and pauses
# (`PLAYHEAD_TOGGLE`, its Pause face while the app's runtime state
# `playing` is on: architect#660). No Charts: no view of a song's chart
# opens in the web bundle yet (`studio-setlists`' `song` is a process
# extension's).
[[favourites]]
note_type = "setlist"

[[favourites.tabs]]
id = "setlist"
label = "Setlist"
icon = "list-music"
target = { view = "setlist.playlist" }

[[favourites.tabs]]
id = "lyrics"
label = "Lyrics"
icon = "mic-vocal"
target = { view = "lyrics" }

[favourites.primary]
id = "play"
label = "Play"
icon = "play"
target = { action = "PLAYHEAD_TOGGLE" }
state = "playing"
on = { label = "Pause", icon = "pause" }
