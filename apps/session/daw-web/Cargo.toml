[package]
name = "session-daw-web"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "The Session DAW view in a browser — the web demo's bundle (see session-ui's web_host)"
publish = false

# Only the browser build takes the page's dependencies: on native (a
# workspace-wide build) session-ui's `web` feature would unify into the
# desktop's and compile the browser-only host there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
session-engine = { workspace = true, features = ["web"] }
session-ui = { workspace = true, features = ["web"] }
# What the address opens, and the "open a set" page when it names nothing
# (`session::open_link`).
session = { workspace = true, features = ["ui"] }
dioxus = { workspace = true, features = ["web", "launch"] }
tracing = { workspace = true }
tracing-wasm = { workspace = true }
tracing-subscriber = { workspace = true }
console_error_panic_hook = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
# /config.json at boot: where this deployment's Task is (studio-web).
app-shell = { workspace = true, features = ["web-config"] }
# The page's query: which share link to open (`main::source`).
web-sys = { workspace = true, features = ["Window", "Location", "UrlSearchParams"] }
js-sys = { workspace = true }

[lints]
workspace = true
