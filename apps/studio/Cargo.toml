[package]
name = "studio-app"
description = "Studio, the app: a plain Dioxus app on Drive and app-shell (orgs, setlists, each song's files), growing into the session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The program is Studio (what the platform shows: its process, its window's
# app id); the package stays studio-app.
[[bin]]
name = "Studio"
path = "src/main.rs"

[dependencies]
# The release version `--version` prints (FTS_RELEASE_VERSION at build
# time, else the workspace version). Binaries only depend on it.
fts-version.workspace = true
# The app's spans over OTLP and its crash reports (src/telemetry.rs), and in
# a browser the same build attributes and crash span (src/trace.rs).
studio-otel.workspace = true
# The running version for library code (utils::version), set in `main`.
utils.workspace = true
session-sync.workspace = true
# A one-file song read from its bytes (its session part, its id): pure Rust,
# for the browser too.
session-format = { workspace = true, features = ["read"] }
web-time = "1"
# Several of Drive's answers awaited at once (a setlist's song folders).
futures-util = "0.3"
dioxus = { version = "=0.8.0-alpha.3", features = ["router"] }
# Drive, the local-first sync: live sets, presence and the spine, in the
# browser and natively (its client keeps copies in Studio's folder and
# works without a node; src/storage.rs).
drive-dioxus = { workspace = true, optional = true }
drive-client = { workspace = true, optional = true }
drive-spine.workspace = true
# Drive's registry (projects shared with other orgs): the tree and the
# registry only, no blob store.
drive-files.workspace = true
loro = "1.18"
# The window: the sidebar and top bar on a desktop, the tab pill, round
# button, accessory, drawer and sheets on a phone.
# FastTrackStudios/app-shell, not features/app/shell (the old apps' log
# ring and update check), which has the same package name: say
# `-p studio-app`, never `-p app-shell`.
app-shell = { git = "https://github.com/FastTrackStudios/app-shell", rev = "46a0d04a9bde95deac00745fa996313c874e9be8" }
# app-shell's native side: the Blitz window without a system frame, the
# shell's title bar drawing the window's buttons (and dragging it).
app-shell-native = { git = "https://github.com/FastTrackStudios/app-shell", rev = "46a0d04a9bde95deac00745fa996313c874e9be8", optional = true }
# Architect's extensions in app-shell's panes and windows: the session's
# arrangement, the mixer's window and the engine are the real extensions
# (extensions/*), hosted here.
app-shell-extensions = { git = "https://github.com/FastTrackStudios/app-shell", rev = "46a0d04a9bde95deac00745fa996313c874e9be8", optional = true }
# Every build: the New session sheet (src/new_session.rs) builds its
# SESSION_NEW arguments with it.
serde_json = "1"
js-sys = { version = "0.3", optional = true }
# The browser's fetch, for bytes (waveforms, uploads).
web-sys = { version = "0.3", optional = true, features = ["Window", "Request", "RequestInit", "Response", "Headers", "Blob", "BlobPropertyBag", "Url", "Performance", "Location", "UrlSearchParams", "Document", "Element"] }
# The engine in the page (src/engine_web.rs): daw-standalone in-process,
# out through an AudioWorklet, the same first-party FX as the desktop's.
studio-engine = { workspace = true, optional = true, features = ["web"] }
eyre = { workspace = true, optional = true }
# A panic in the page said on its console from the first line of `main`
# (the crash span, src/trace.rs, comes only once the app renders).
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# Charts: a song's .kf parsed and engraved to SVG in the page, each bar
# timed to the recording (CPU-only `svg` tier: no wgpu, builds for wasm).
keyflow = { workspace = true, features = ["text", "svg"] }
# The Action List and its doors (native): what agents drive the app with
# (src/actions.rs).
architect = { workspace = true, optional = true, features = ["action-list"] }
architect-mcp = { workspace = true, optional = true, features = ["http"] }
architect-control = { workspace = true, optional = true, features = ["server"] }
architect-scripting = { workspace = true, optional = true, features = ["luau"] }
facet = { workspace = true, optional = true }
facet-json = { workspace = true, optional = true }
futures-channel = { version = "0.3", optional = true }
tracing = { workspace = true, optional = true }
# The session's views are the real extensions, linked in and hosted in
# app-shell's panes (src/hosted.rs): the arrangement, the mixer (in a
# window of its own), the lyrics and the navigator, each a Studio window
# on the engine (studio-view-link), and daw-view-kit's own top and bottom
# bars around them, fed from the same engine link.
studio-arrangement = { workspace = true, optional = true }
studio-mixer = { workspace = true, optional = true }
studio-lyrics = { workspace = true, optional = true }
studio-navigator = { workspace = true, optional = true }
# Keyflow's chart view (the live editor and its note-input toolbar, on the
# song's chart in its one file) and Ignition's room, the real extensions.
keyflow-extension = { workspace = true, optional = true }
ignition-pane = { workspace = true, optional = true }
studio-view-link = { workspace = true, optional = true }
mixer-view = { workspace = true, optional = true, features = ["native"] }
daw-view-kit = { workspace = true, optional = true, features = ["native"] }
# The views' theme packs: the spec, installs from a link, the check
# (`THEME_*`, src/themes.rs); the arrangement's declaration of what it uses.
daw-theme = { workspace = true, optional = true }
arrangement-view = { workspace = true, optional = true, features = ["native"] }
# The app's panels around the views (the top and bottom bars, Setup, the
# transport bar, the lyrics choice).
studio-panels = { workspace = true, optional = true, features = ["native"] }
# The Editor view.
midi-editor = { workspace = true, optional = true, features = ["native"] }
engine-client = { workspace = true, optional = true, features = ["native"] }
# The window's modes (`SESSION_MODE`, this client's own).
engine-domain = { workspace = true, optional = true }
architect-extensions = { workspace = true, optional = true, features = ["host", "linked", "process"] }
architect-extensions-dioxus = { workspace = true, optional = true }
architect-settings = { workspace = true, optional = true }
# Process extensions (the engine's `daw`) and process views (Ignition's
# room, drawn by its renderer).
architect-views = { workspace = true, optional = true }
architect-process-view = { workspace = true, optional = true, features = ["extension"] }
# Waveform peaks (the sidecar format; no producers in the app).
drive-sidecars.workspace = true
# A room's link (`room_link`): what it names, and the Rooms folder the
# engine linked into a phone's app keeps rooms in.
room = { workspace = true, optional = true }
# Drive's agent on this computer: any Drive file as a real local path,
# warmed ahead of a set (desktop builds; docs/app-files.md in Drive).
drive-local = { workspace = true, optional = true }

[features]
default = []
# Drive's code (the live sets, setlist files, songs' files), in every
# build that has a renderer.
drive = ["dep:drive-dioxus", "dep:drive-client", "dep:tracing"]
web = ["dioxus/web", "drive", "dep:js-sys", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:studio-engine", "dep:eyre", "dep:console_error_panic_hook"]
desktop = ["dioxus/desktop", "local"]
# The same app drawn by Blitz (the GPU renderer Signal's panes and the
# engine's views use), on a desktop and on iOS: what the one app runs on
# outside a browser.
native = [
    "dioxus/native",
    "local",
    "drive",
    # The app's spans and crash reports over OTLP (src/telemetry.rs,
    # src/trace.rs).
    "dep:opentelemetry",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:app-shell-native",
    "dep:app-shell-extensions",
    # The app's Action List served to agents: MCP on loopback with a
    # token, the control socket, Luau scripts over every action.
    "dep:architect",
    "dep:architect-mcp",
    "dep:architect-control",
    "dep:architect-scripting",
    "dep:facet",
    "dep:facet-json",
    "dep:futures-channel",
    "dep:tracing",
    "dep:studio-arrangement",
    "dep:studio-mixer",
    "dep:studio-lyrics",
    "dep:studio-navigator",
    "dep:keyflow-extension",
    "dep:ignition-pane",
    "dep:studio-view-link",
    "dep:daw-view-kit",
    "dep:daw-theme",
    "dep:arrangement-view",
    "dep:studio-panels",
    "dep:midi-editor",
    "dep:mixer-view",
    "dep:engine-client",
    "dep:engine-domain",
    "dep:architect-extensions",
    "dep:architect-extensions-dioxus",
    "dep:architect-settings",
    "dep:architect-views",
    "dep:architect-process-view",
    "dep:room",
    # On iPhone and iPad: the engine linked into the app (no second
    # process there; src/engine.rs). A no-op on every other target.
    "dep:daw-extension",
    # On iPhone and iPad: the UIScene lifecycle iOS 27 requires (winit's
    # window handed to the app's scene, studio-shell's `ios_scene`).
    "dep:studio-shell",
    "dep:raw-window-handle",
]
local = ["dep:drive-local"]
mobile = ["dioxus/mobile"]

# A timer for the moving playheads: the browser's on the web, tokio's
# (which the desktop and mobile renderers already run) elsewhere.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
# The browser's crypto for getrandom 0.3 (Loro's ids).
getrandom = { version = "0.3", features = ["wasm_js"] }

# The engine on iPhone and iPad, linked in: the daw extension (the same
# one a desktop runs as a process), its engine started in the app's own
# process (`native` turns it on).
[target.'cfg(target_os = "ios")'.dependencies]
daw-extension = { workspace = true, optional = true }
# The scene delegate (`StudioSceneDelegate`, named in Info.plist by
# ios/build.sh) and winit's view handed to it.
studio-shell = { workspace = true, optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }
# The app's telemetry (src/telemetry.rs, src/trace.rs), on every native
# target, iOS too.
opentelemetry = { version = "0.30", optional = true }
tracing-opentelemetry = { version = "0.31", optional = true }
tracing-subscriber = { workspace = true, optional = true }

# Desktop Studio updating itself from its signed releases (src/self_update.rs):
# macOS and Linux; iOS updates through TestFlight, the web is its deploy.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
studio-shell.workspace = true

[dev-dependencies]
# song_ids' tests write one-file songs.
session-format = { workspace = true, features = ["read", "store"] }
uuid = { workspace = true }
# org_create's tests: a new org made through the real issuer's routes
# (FastTrackStudios/auth's organization service over HTTP, in-memory).
auth = { workspace = true, features = ["backend-db", "axum"] }
auth-proto = { workspace = true, features = ["http", "vox"] }
axum.workspace = true
reqwest.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net"] }
# The browser boot test (tests/web_boot.rs): the fixture session's proxies
# encoded where it runs, served from a folder of its own.
fts-sample = { workspace = true, features = ["engine-native"] }
tempfile = { workspace = true }
