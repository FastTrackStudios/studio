[package]
name = "studio-desktop"
# One version for the whole studio: [workspace.package] version in the root
# Cargo.toml (one release tag drives both iOS apps; docs/agents/release-workflow.md).
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["FastTrackStudio"]

# Studio: FastTrackStudio's one app. Signal (the live rig: guitar, keys,
# drums, e-kit, the gig page) and Session (setlists, songs, charts, the DAW)
# in one binary; its front screen (src/front.rs) chooses which one a launch
# goes into. This crate is Signal's app (it moved here from
# apps/signal/desktop); Session comes in as a library, `session-desktop`
# (feature `session-app`), and draws in the same window. The two are one
# app on the outside first and grow together from here.
#
# One launch is one of the two: a process runs ONE engine
# (docs/design/one-engine.md), so the side not chosen never starts its own.
#
#   cargo run -p studio-desktop                                   # both
#   cargo run -p studio-desktop --no-default-features --features signal
#
# `studio-desktop --engine` runs the HEADLESS signal engine instead of
# the GUI (src/engine_main.rs, the former apps/signal-engine): rig core +
# vox router on ws://:4040/vox (+iroh), serving the web remote — embedded
# into the binary with `--features embed-web`.

[[bin]]
name = "studio-desktop"
path = "src/main.rs"

# The command lines (`--features cli`): `signal`, the rig and its tone
# library without a GUI, and `fts-convert`, which swaps third-party plugin
# instances in a REAPER project for FTS equivalents.
[[bin]]
name = "signal"
path = "src/bin/signal/main.rs"
required-features = ["cli"]

[[bin]]
name = "fts-convert"
path = "src/bin/fts-convert/main.rs"
required-features = ["cli"]

[lints]
workspace = true

[features]
# Signal (`signal`) and Session (`session-app`, plus `tts` for its spoken
# cues) are on by default. Drop one for fast iteration; e.g.
# `cargo run -p studio-desktop --no-default-features --features session-app`
# skips the heavy `signal` rig (nam C++, lucide icons, webkit engine deps),
# and `--no-default-features --features signal` leaves Session out.
default = ["signal", "session-app", "tts", "doc-sync"]
# The command-line tools (src/bin/): native only.
cli = [
    "dep:builtin",
    "dep:clap",
    "dep:guitar",
    "dep:serde_json",
    "dep:signal-tone3000",
    "signal-tone3000?/client",
    "dep:dsp", "dsp/analyzer",
    "dep:signal-import",
    "dep:signal-nam",
    "dep:signal-plugin-host",
    "dep:tokio",
    "tokio?/macros",
    "tokio?/rt-multi-thread",
    "tokio?/time"
]
# Render the desktop window with WebKit/WRY instead of Blitz.
#
# The old path, kept as an escape hatch while the Blitz migration settles —
# Blitz supports less CSS than a WebView, so a surface that has not been
# brought under the inline-style rules may still need it. Nothing painted can
# be mounted under this: see `dioxus-native` in the native dependency table.
webview = []
# signal also force-enables session-ui/desktop: signal-guitar-ui pulls
# session-ui (default-features off), which only compiles with its dioxus
# renderer feature on (dock-dioxus needs "web" for its prelude).
# The guitar rig alone — what the iPhone build ships: the in-process rig
# engine (rig_engine.rs) + the mobile shell (mobile_view.rs). Kept separate
# from `signal` because the drums/keys/synth rig UIs pull signal-ui's
# Vello/baseview surfaces, which don't build for iOS.
signal-guitar = ["gig", "dep:guitar", "guitar?/ui", "dep:signal-content-proto", "dep:signal-content-client", "dep:signal-tone3000", "signal-tone3000?/ui", "dep:sampler", "dep:session", "session?/ui", "dep:vox-core", "dep:vox-websocket", "dep:architect", "architect/iroh", "architect/local", "architect/connect", "dep:tokio", "dep:vox", "dep:facet-json", "dep:futures-util", "dep:futures-channel", "dep:sha2", "dep:reqwest", "dep:facet", "dep:eyre"]
# The gig page (src/gig/): a band's set in order, each song's chart and its
# practice track on a small player of its own (cpal out, decoded by
# fts-sample, speed without pitch through the `stretch` phase vocoder).
# Part of every rig build, desktop and iPad; native only (the deps are in
# the cfg(not wasm) table, so this is a no-op on the web build).
gig = ["dep:chrono", "dep:cpal", "dep:dsp", "dsp/stretch", "dep:fts-sample", "fts-sample?/decode-compressed", "dep:serde_json", "dep:architect"]
# The keys rig on the phone: the in-process sampler engine (signal-keys →
# signal-sampler over CoreAudio, MIDI via midir/CoreMIDI) + the wire types
# for the mobile keys view + pack downloads. iOS-clean by construction: the
# phone view speaks signal-keys-proto directly and never pulls
# signal-keys-ui (whose signal-ui Vello/baseview surfaces don't build for
# iOS). Packs stream in via pack_client.rs and land in
# Documents/FastTrackStudio/Packs/Keys.
signal-keys-rig = ["signal-guitar", "dep:keys"]
# The drum rig in the app itself (the iPad's embedded engine): its backend,
# its own profiles / songs / setlists, and the iPad drum screen's clients.
signal-drums-rig = ["signal-guitar", "dep:drums"]
# The e-kit in the app itself, as the drums.
signal-ekit-rig = ["signal-guitar", "dep:ekit"]
signal = ["signal-guitar", "guitar?/mcp", "signal-drums-rig", "signal-ekit-rig", "dep:signal-content-library", "dep:drums", "dep:keys", "dep:midi", "dep:synth", "synth?/ui", "dep:launcher", "dep:signal-synth-rig", "dep:sampler", "dep:signal-space", "dep:ekit", "tone3000", "dep:axum", "dep:tower-http"]
# TONE3000 and the FastTrackStudio account in the app itself (the iPad's
# embedded engine): search, download and import captures, signing in
# through the account. Part of `signal`; the iOS build adds it on its own.
tone3000 = ["dep:signal-tone3000", "signal-tone3000?/ui", "dep:signal-nam", "dep:url", "dep:axum", "dep:tower-http"]
# Session in the app: the front screen's second door. `session-desktop`'s
# Blitz app (its `native` shell) as a library, with the session domain and
# chart writing. Native only (the dep is in the cfg(not wasm) table, so this
# is a no-op on the web build). iOS-clean: no TTS backend (see `tts`).
session-app = ["dep:session-desktop"]
# Sync after sign-in (sync.rs): the rig books kept in step with the
# account's other devices through Task (architect's crdt::docs). On by
# default, and in every iOS build's feature list.
doc-sync = ["signal-guitar", "dep:async-trait", "dep:crdt", "dep:org-proto", "dep:session-format", "dep:task-dial", "dep:uuid"]
# Session's spoken section cues (Chatterbox TTS over ONNX Runtime). ort has
# no prebuilt binary for aarch64-apple-ios, so the iOS build leaves this off
# and the guide falls back to its synthesized cues, as Session's own did.
tts = ["session-app", "session-desktop?/tts"]
# Embed the staged web bundle (`web-dist/`, copied from the dx web build
# by `just rig-install`) into the native binary — engine mode then serves
# the browser remote from memory, ONE deployable artifact. Off by default
# so a plain `cargo build -p studio-desktop` needs no staged dir.
embed-web = ["dep:include_dir"]
# Session on the web build is a REMOTE: the wasm target compiles only the
# wire surface (session-proto's SetlistService clients + session-ui) and
# talks to the network engine's SetlistService over the shared `/vox` link
# (src/session_remote_view.rs). The in-process player (session facade,
# daw-standalone, the guide) is native-only — those optional deps live
# exclusively in the `cfg(not(target_arch = "wasm32"))` table below, so
# enabling them here is a no-op on the web build (the same trick the
# `signal` feature uses for engine mode).
# Charts: keyflow chart writing (the Charts workspace). Keyflow is also pulled
# by Session (chart parsing), so this is additive; a charts-only build gets it
# independently.
# Built-in FX DSP (EQ/comp/reverb/…) linked into the in-process standalone
# render path, so `Effects::add("Reverb")` on a session track instantiates
# real fx-blocks. Deliberately NOT part of `session`: Session coordinates
# Signal over the wire rather than linking the engine, and fx-blocks sits a
# layer above the session domain. The Signal-side build turns this on; a
# Session-only build renders without built-in FX and gets them from the
# Signal engine instead.
# Chatterbox TTS backend for the guide's spoken cues. Auto-enabled by Session.
# Models are NEVER downloaded implicitly; TTS only *activates* at runtime when
# FTS_TTS=1 and a voice wav exists at ~/.config/fts/tts-voice.wav (the flake
# provides onnxruntime + ORT_DYLIB_PATH). Cached cues keep loading regardless;
# without it, cues fall back to the synthesized guide samples.

# Network probe for the engine's SetlistService (the browser remote's wire
# path, natively): `cargo run -p studio-desktop --example setlist_probe`.

[[example]]
name = "pack_probe"
required-features = ["signal-guitar"]

# Minimal cross-machine iroh transport check (raw framed echo, no vox).
[[example]]
name = "iroh_echo"
required-features = ["signal-guitar"]

# Author the browser keys rig's bundled demo SMFs (assets/demo-midi/*.mid)
# with daw-proto's codec. `test = true` so its #[test] (parse the committed
# assets back) runs under `cargo test -p studio-desktop --example
# demo_midi_gen --no-default-features` without building the whole app.
[[example]]
name = "demo_midi_gen"
test = true

# KeysRig service probe (the browser remote's establish, verbosely).
[[example]]
name = "keys_probe"
required-features = ["signal"]

[dependencies]
utils.workspace = true
# The front screen's one-frame pause before a side starts (front.rs): a
# timer that needs no runtime.
futures-timer.workspace = true
# `ui`: the shared studio shell the window is drawn in (app_shell::ui).
app-shell = { workspace = true, features = ["ui"] }
# Sample-space + Electronic Kit WIRE CONTRACTS (#77). Wasm-clean — the
# browser remote renders the map and the pad grid from these; their
# backends (signal-space / signal-ekit) stay native-only below.
signal-space = { workspace = true, optional = true }
ekit = { workspace = true, optional = true }
signal-rigs-proto.workspace = true
# The performance screens every rig shares — the clients they play through.
signal-rig-perform-ui.workspace = true
# Standard-MIDI-file codec (daw-proto's `midi::smf`) — the browser keys
# rig's demo MIDI player parses the bundled .mid presets with it, and the
# `demo_midi_gen` example authors them. Wasm-clean, deliberately
# unconditional so the example builds with --no-default-features.
daw-proto.workspace = true
tracing.workspace = true

# Signal domain (the rig)
guitar = { workspace = true, optional = true, features = ["ui"] }
# TONE3000: the wire contract and the tone browser. Both wasm-clean, so
# the browser remote gets the same page the desktop app does.
signal-tone3000 = { workspace = true, optional = true, features = ["ui"] }
fts-audio-ui = { workspace = true }
drums = { workspace = true, optional = true, features = ["ui"] }
keys = { workspace = true, optional = true, features = ["ui"] }
# MidiEvent — the in-tab keys backend (web_keys_backend.rs) decodes the raw
# 3-byte messages it forwards into the monitor's wire events.
midi = { workspace = true, optional = true }
synth = { workspace = true, optional = true, features = ["ui"] }
sampler = { workspace = true, optional = true }
# Libraries: any kit, pack or rig library from a studio, onto this device.
# The client (a tokio runtime, HTTPS mirror) is native-only; see the
# cfg(not wasm) table. The wire contract compiles everywhere.
signal-content-proto = { workspace = true, optional = true }

# Session domain, wire surface — the SetlistService types + generated
# clients (session-proto) compile everywhere, including the wasm remote.
# The in-process player crates (session facade, daw-standalone, the guide)
# are native-only and live in the cfg(not wasm) table below.
# Ordered-collection wire contract (song Library / Setlist / …). Only the
# wasm build uses it (the /{org}/{collection} browser dials the task-server's
# per-org CollectionService), so the actual optional dep lives in the wasm
# target table below; `dep:collection-proto` in the `session` feature is a
# no-op on native (dep absent there) — the same trick daw-standalone uses.

# Service framework — the root workspace's architect + vox (patched to the
# sibling ../architect checkout at the root) so the whole graph shares one
# architect + one vox.
architect = { workspace = true, features = ["vox", "platform"], optional = true }
vox = { workspace = true, optional = true }
vox-core = { workspace = true, optional = true }
vox-websocket = { workspace = true, optional = true }

eyre = { workspace = true, optional = true }

# The same app on every surface: the desktop binary gets the dioxus
# desktop renderer; the web build (dx build --platform web) is the SAME
# UI served over the network — no desktop-only pages. Native extras:
# the engine supervisor (child processes), file prefs, iroh key file.
# The dioxus renderer splits by platform: desktop (wry window chrome) vs
# mobile (the same wry renderer with iOS launch glue, in the ios table
# further down).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
dioxus = { workspace = true, default-features = true, features = ["desktop", "launch"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Session, the front screen's other door (feature `session-app`).
session-desktop = { workspace = true, optional = true, features = ["native", "session-domain", "charts"] }
# The FastTrackStudio account (STA-361): device-code sign-in and the one
# session file Signal and Session share, with its sign-in UI.
fts-account = { workspace = true, features = ["ui"] }
# The command-line tools' own (feature `cli`).
clap = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
signal-import = { workspace = true, optional = true }
signal-plugin-host = { workspace = true, features = ["clap-host"], optional = true }
dsp = { workspace = true, optional = true }
# The rig's store and config dir: rig_engine.rs (native, and its TONE3000
# session on every desktop, not only macOS); its `book`, the rig libraries
# as synced Loro docs (books.rs).
signal-rig-host = { workspace = true, features = ["book"] }
# Sync after sign-in (sync.rs, feature `doc-sync`): the doc driver and its
# device index, a rig book's `.session` as its replica, the dial to Task
# and the org lane.
async-trait = { workspace = true, optional = true }
crdt = { workspace = true, features = ["vox", "turso"], optional = true }
org-proto = { workspace = true, optional = true }
session-format = { workspace = true, features = ["store", "sync"], optional = true }
task-dial = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# The Blitz native renderer — the desktop path and the iPhone's.
#
# `dioxus::desktop` puts WebKit/WRY behind the same components, and a WebView
# cannot be handed a painted scene: `CustomWidgetAttr` is an `Any` attribute,
# and dioxus does not ignore it but panics on the first mutation carrying one
# ("Any attributes are not supported by the current renderer") and takes the
# window with it. Every processor effect editor — the EQ's vello graph first —
# is such a widget, so the real editors can only be mounted here. See the
# `webview` feature for the old path.
dioxus-native = { workspace = true }
dioxus-native-dom = { workspace = true }
# Blitz's shell with custom widgets on: dioxus-native enables them in
# blitz-dom only, which compiled out freeing a dropped widget's textures
# and drawing frame faces as composited layers.
blitz-shell = { workspace = true, features = ["custom-widget"] }

tracing-subscriber.workspace = true
# Telemetry: fmt console logs + optional Sentry + OTLP export (traces,
# logs, metrics). Doubly opt-in — the `otel` cargo feature carries the
# dependency weight, and at runtime nothing exports unless
# OTEL_EXPORTER_OTLP_ENDPOINT is set (http/protobuf, port 4318).
architect-telemetry = { workspace = true, features = ["otel"] }
session = { workspace = true, features = ["desktop", "ui"], optional = true }
# The real DAW panels (MixerPanel / ArrangementView) — self-contained,
# wired to the in-process daw facade. `web` = the dioxus (WebView) renderer
# the desktop app uses.
# REAPER-project (.rpp) export for the "Open in REAPER" button — the
# standalone project round-trips through dawfile. Native-only.
# Engine supervisor (spawn/stop/probe the engine) — shared with fts-cli.
launcher = { workspace = true, optional = true }
# Async runtime: session's in-process engine AND engine mode's server.
tokio = { workspace = true, optional = true }

# ── Session domain, in-process player (feature `session`, native only) ──
# The session facade + the daw-standalone backend that PLAYS the setlist,
# plus the guide engine — all native-only (audio, threads, filesystem).
# The wasm build gets only session-proto + session-ui and drives a
# network engine instead (session_remote_view.rs).
# Guide engine: click / count-in / section cues rendered into the audio
# output through daw-standalone's aux post-render hook. On iOS the
# session-demo feature drives it with default features (no tts/ONNX) into a
# small cpal stream instead.
# Session-demo audio out (iOS): a small cpal output stream for the click,
# independent of the rig's engine.
# Engine supervision: the desktop app's watchdog polls its supervisor pid
# (kill(pid,0)) and reaps the engine's process group on exit (engine_main.rs,
# engines.rs). Unix-only usage is cfg-gated in code.
libc = { workspace = true }
# When a gig is played (feature `gig`): its schedule, in the venue's offset.
chrono = { workspace = true, optional = true }
# The gig page's practice player (feature `gig`).
cpal = { workspace = true, optional = true }
fts-sample = { workspace = true, optional = true, features = ["load"] }
# DAW domain — facade (daw::get / init_from_parts / LayerRouter) + the
# standalone backend that plays the setlist without REAPER. "audio" is
# required by daw-standalone's unconditional `sync` module (same
# workaround session's dev-deps carry) and drives real cpal output.
# Built-in FX (EQ/comp/reverb/…) for session mixer tracks — installed as
# the standalone backend's FxFactory in session_engine.rs.
builtin = { workspace = true, optional = true }

# ── Engine mode (`--engine`, feature `signal`) — the former
#    apps/signal-engine, native only ─────────────────────────────────────
guitar = { workspace = true, optional = true }
drums = { workspace = true, optional = true }
keys = { workspace = true, optional = true }
signal-synth-rig = { workspace = true, optional = true }
sampler = { workspace = true, optional = true, features = ["library"] }
# Content transfer: everything this engine can give another device.
signal-content-library = { workspace = true, optional = true }
# ... and the client that fetches it (libraries_view.rs, native only).
signal-content-client = { workspace = true, optional = true }
signal-space = { workspace = true, optional = true, features = ["engine"] }
ekit = { workspace = true, optional = true }
signal-tone3000 = { workspace = true, optional = true, features = ["client"] }
signal-nam = { workspace = true, optional = true }
url = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
# Watch bridge (engine_watch.rs): facet-json for the WatchState wire form,
# futures-util for the SSE stream adapter.
facet-json = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
futures-channel = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# HTTPS pack-mirror fallback (rustls — no system TLS needed on iOS).
reqwest = { workspace = true, optional = true }
facet = { workspace = true, optional = true }
# Engine mode serves the vox router over axum ws (+ iroh, from the
# `signal` feature). Native-only extra features on the same architect dep.
# `host` = the engine-binary bootstrap (architect::host) — runtime + tracing +
# panic logger + /health + /vox + iroh + SPA fallback. Native-only (server-axum
# isn't wasm-legal), so it lives on this cfg(not wasm) dep line, NOT the shared
# `signal` feature which the wasm browser build also enables.
architect = { workspace = true, features = ["server-axum", "host"], optional = true }
# The staged web bundle, embedded (feature `embed-web`).
include_dir = { workspace = true, optional = true }

# The native PipeWire duplex backend is Linux-only (cpal's pipewire host);
# on macOS/other platforms the sampler core falls back to plain cpal
# (CoreAudio), keeping engine mode buildable on darwin (voyager).
# ── macOS — the native menu bar (mac_menu.rs): audio stats in the bar,
# Settings… ⌘, in the app menu. The same objc2 line winit already links.
[target.'cfg(target_os = "macos")'.dependencies]
# `midi_hub::init_platform` — the CoreMIDI run-loop thread, first in `main`.
signal-rig-host = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["std", "NSString"] }
# + the status item for `--menubar` (menubar.rs).
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSImage", "NSCell", "NSButtonCell"] }

# ── iPhone (dx build --platform ios) — the in-process rig + phone shell ──
[target.'cfg(target_os = "ios")'.dependencies]
dioxus = { workspace = true, default-features = true, features = ["mobile", "launch"] }
# The objc2 winit itself is built on: the AVAudioSession bootstrap
# (ios_audio.rs) and the orientation / pasteboard / Bonjour calls
# (ios_orientation.rs). The UIScene delegate is app-shell's (ios_scene).
objc2 = { workspace = true }
# The record-permission request's completion handler (ios_audio.rs).
block2 = { workspace = true }
# The config dir the TONE3000 and account sessions live in (rig_engine.rs).
signal-rig-host = { workspace = true }
objc2-ui-kit = { workspace = true, features = ["UIApplication", "UIResponder", "UIScene", "UISceneOptions", "UISceneSession", "UIWindowScene", "UIWindow", "UIView", "UIViewController", "UIScreen", "UIOrientation", "block2"] }
objc2-foundation = { workspace = true, features = ["default", "NSArray", "NSSet", "NSString", "NSURL"] }

# PipeWire (audio + MIDI) is the Linux DEFAULT via target-gated deps inside
# daw-audio-io and the rig crates themselves — no per-app feature plumbing.

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, default-features = true, features = ["web", "launch"] }
# /config.json at boot: where Task and fts-auth are (studio-web). Not the
# rig engine: remote.rs keeps its own same-origin rule.
app-shell = { workspace = true, features = ["ui", "web-config"] }
session = { workspace = true, features = ["ui", "web"], optional = true }
# NO daw-ui here: its daw-control backend is not wasm-clean, and the daw
# panels (Arrangement / Mixer) are native-only workspaces anyway — the
# session feature's "dep:daw-ui" is a no-op on the web build.
web-sys = { workspace = true, features = ["Window", "Storage", "Location", "AudioContext", "AudioContextOptions", "BaseAudioContext", "AudioWorklet", "AudioWorkletNode", "AudioWorkletNodeOptions", "AudioNode", "AudioDestinationNode", "MessagePort", "MessageEvent", "MessageChannel", "Event", "EventTarget", "Response", "Worker", "WorkerOptions", "WorkerType", "Navigator", "StorageManager", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemGetDirectoryOptions", "FileSystemGetFileOptions", "FileSystemCreateWritableOptions", "FileSystemWritableFileStream", "File", "Blob", "IdbFactory", "IdbOpenDbRequest", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "IdbRequest", "MidiAccess", "MidiInput", "MidiInputMap", "MidiMessageEvent", "MidiOptions", "MidiPort"] }
# The keys-rig page's async browser plumbing: js promises, transferable
# pack bytes, oneshot replies from the worklet port, sha256 verify of
# streamed packs, and the facet-json ledger/cache rows in IndexedDB.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
futures-channel = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
facet = { workspace = true }
facet-json = { workspace = true }
# Chart pane: @font-face data URIs for the engraver's embedded fonts.
base64 = { workspace = true }
# getrandom 0.3 (transitive via iroh) needs its js backend on wasm32.
getrandom = { version = "0.3", features = ["wasm_js"] }

# Headless tests of the performer mount (gig/shell.rs): Blitz layout and a
# PNG of the screen at 1194 x 834 (STA-359).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dioxus-test.workspace = true
# Sync's two-device test (sync.rs): Task's doc host in process, temp books.
architect = { workspace = true, features = ["local"] }
tempfile.workspace = true
