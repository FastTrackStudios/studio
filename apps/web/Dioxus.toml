# dx config for studio-web. Dev: `dx serve --platform web` from this
# folder, as the local stack's `web` runs it (scripts/local-stack.sh
# `run_web`), after it wrote the dev page (`index.html`, from Architect's
# web app's `app/index.html`) and the public folder (`dev/public`); both
# are git-ignored. No proxies here: the stack's front puts the dev server
# and the Architect server's paths on one origin, on whatever ports the
# stack runs (scripts/local-stack-front.py).
[application]
name = "studio-web"
public_dir = "dev/public"

[web.app]
# The page has its title; dx would add this one to it.
title = ""
