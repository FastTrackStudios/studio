<!doctype html>
<!-- studio-web's page: the one the browser loads before the wasm, Studio's
     from the first frame (its name, black, its splash). The local stack
     writes it to index.html (scripts/local-stack.sh `prepare_web`), the
     icon put in for {{ICON}} (features/distribution/icon.svg). The splash
     is the one the app draws while it signs in and opens the org
     (architect-web's `splash`), so nothing flashes between them. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Studio">
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/app/icon.svg">
  <link rel="stylesheet" href="/app/style.css">
  <style>
    html, body:not([data-mode="app"]) { background: #000; color: #f4f4f5; }
    body:not([data-mode="app"]) { margin: 0; font-family: "Instrument Sans", -apple-system, system-ui, sans-serif; }
    .splash-icon svg { width: 100%; height: 100%; display: block; }
    @keyframes splash-run { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
  </style>
</head>
<body>
  <main id="app">
    <div class="splash" role="status" aria-label="Studio is starting"
         style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
      <div class="splash-icon" style="width:84px;height:84px;border-radius:20px;overflow:hidden">{{ICON}}</div>
      <div style="font-size:28px;font-weight:700;letter-spacing:-0.02em">Studio</div>
      <div style="width:96px;height:3px;border-radius:2px;overflow:hidden;background:rgba(127,127,127,0.18)">
        <div style="width:40%;height:100%;border-radius:2px;background:currentColor;opacity:0.55;animation:splash-run 1.1s ease-in-out infinite"></div>
      </div>
    </div>
  </main>
</body>
</html>
