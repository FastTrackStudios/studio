[package]
name = "dock-model"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "The dock's model with no UI: the dockspace, its screensets and the intents a dock control asks for (`DockIntent`), so the engine can carry an intent as an action's argument"

# `dock` (studio-connect) re-exports every module from its old path
# (`dock::dockspace`, `dock::screenset`, `dock::intent`, `dock::DockIntent`).

[dependencies]
facet = { workspace = true, features = ["uuid"] }
facet-json = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }

[lints]
workspace = true
