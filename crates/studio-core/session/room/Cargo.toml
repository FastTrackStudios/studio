[package]
name = "room"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "A room: an organization's lasting place to play together, its one link, what its leader has loaded, and its shared state over live-doc"

[features]
default = ["net"]
# The room over vox (`net`): its leader hosts the room's doc and presence
# behind its door (`gate`), a member follows them on one held-open
# connection, over iroh from a desktop or a browser.
net = ["dep:architect", "dep:architect-permissions", "dep:eyre", "dep:tokio", "dep:vox", "dep:vox-core", "session-sync/net"]

[dependencies]
# The room's shared state (`state`): one Loro doc, and the presence its
# people and the leader's transport ride.
live-doc = { workspace = true }
loro = { workspace = true }
# The shared transport's entry and its follower (`lead`): the same one a
# live session plays together by.
session-sync = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# `iroh`: a member dials the leader, natively and in a browser (relay-only
# there); serving is native.
architect = { workspace = true, features = ["vox", "platform", "local", "iroh"], optional = true }
# A member's calls carrying the pass (`net::Presents`), and its dial.
vox = { workspace = true, optional = true }
vox-core = { workspace = true, optional = true }
eyre = { workspace = true, optional = true }
# The member's loop: its stop and its `select!` (no runtime: the
# platform's, as live-doc).
tokio = { version = "1", default-features = false, features = ["sync", "macros"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

# The leader's door (`gate`): who presented the room's pass. A device's.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
architect-permissions = { workspace = true, optional = true }

[dev-dependencies]
architect = { workspace = true, features = ["vox", "platform", "local", "iroh"] }
architect-permissions = { workspace = true }
vox = { workspace = true }
live-doc = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
