[package]
name = "live-doc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "A Loro document shared live over vox: its sync (a joiner seeded with a shallow snapshot, sent in pieces), presence and the host's clock"

[dependencies]
# `PubSub` (snapshot-then-changes fan-out) and the platform's timers and
# clocks (tokio natively, the browser's on wasm). Not architect's crdt.
architect = { workspace = true, features = ["vox", "platform"] }
vox = { workspace = true }
facet = { workspace = true }
loro = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Without the workspace's `full`: `sync` for the outboxes, `macros` for
# the drivers' `select!`; both build for wasm.
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
architect = { workspace = true, features = ["vox", "platform", "local"] }
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
