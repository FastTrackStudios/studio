[package]
name = "library-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The song library in the org (songs, setlists and their sessions as files), pulled to and published from a device"

[lints]
workspace = true

[features]
# Putting songs into the library (`publish`, the `studio ingest` side):
# their roots, files, lists, projects and links.
publish = ["dep:project-proto", "dep:share-proto"]

[dependencies]
session-sync = { workspace = true }
architect = { workspace = true, features = ["local", "platform", "vox"] }
collection-proto = { workspace = true, features = ["vox"] }
eyre = { workspace = true }
files-client = { workspace = true }
files-proto = { workspace = true }
futures-util = { workspace = true }
links-proto = { workspace = true }
loro = { workspace = true }
project-proto = { workspace = true, optional = true, features = ["vox"] }
resources-proto = { workspace = true }
serde = { workspace = true, features = ["derive"] }
share-proto = { workspace = true, optional = true }
task-dial = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { version = "1", features = ["js", "serde", "v4", "v7"] }
vox = { workspace = true }
vox-core = { workspace = true }

[dev-dependencies]
architect = { workspace = true, features = ["local", "platform", "vox"] }
chrono = "0.4"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
