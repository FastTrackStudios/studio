[package]
name = "song-file"
description = "A song as one file, `<Title>.session`: the engine's project, the session's timing, charts, cues and patch changes, and arrangements as branches, in one Turso store; and the converter that folds the old pair (`.session` + `.fts-session`) into it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
# `song-file convert <folder>…`, `song-file inspect <file>`.
name = "song-file"
path = "src/main.rs"

[dependencies]
session-format = { workspace = true, features = ["store", "read"] }
fts-session = { workspace = true }
# The live document (session-sync): the engine project's doc, read for its timing
# when a store-only song is seeded.
session-sync = { workspace = true }
loro = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The old pair goes to the desktop's Trash (freedesktop on Linux), never
# deleted. iOS has no Trash an app can use (src/convert.rs: `Replaced`
# beside the song there).
[target.'cfg(not(target_os = "ios"))'.dependencies]
trash = "5"

[lints]
workspace = true
