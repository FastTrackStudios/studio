[package]
name = "keyflow-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keyflow in a session: a chart as Keyflow's data in a `.session` (a Loro document), synced, and served to the chart view as `fts.session`"
publish = false

[dependencies]
# The session primitive (FastTrackStudios/session): its document and the
# extension service. Pinned by rev until it is tagged (session#179, #181,
# #182).
session = { path = "../session", package = "session", features = ["architect", "service", "extension"] }
# Its live sync (a joiner's `SyncedDoc`) and the Loro it is made of.
live-doc = { workspace = true }
# The chart as typed data in the session (`typed`): the chart model it is
# made from and read back to.
keyflow-lang = { workspace = true }
keyflow-proto = { workspace = true }
facet-json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
architect = { workspace = true, features = ["vox", "local"] }
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread", "time"] }
tempfile = { workspace = true }

[lints]
workspace = true
