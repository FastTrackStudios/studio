[package]
name = "daw-link"
description = "Ableton Link adapter — host-agnostic puppet/master sync engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

# Port of ReaBlink's Link integration. Engine is host-agnostic via the
# `LinkCallbacks` trait so it can be driven by REAPER, another DAW, or a
# test harness. Apps that don't want Link simply don't depend on this crate.

[lib]
path = "src/lib.rs"

[dependencies]
rusty_link = "0.4"
tracing.workspace = true

[lints]
workspace = true
