[package]
name = "engine-domain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Studio's domain over the DAW facade: setlists and songs, Keyflow charts in a project, the guide, keys, modes, playback, routing and the track manager, and their REAPER actions"

[lints]
workspace = true

[features]
# Task vault notes and live-setlist projects from the Song Library
# (vault_sync; native only).
vault-sync = ["dep:serde_json"]
default = ["vox"]
# The live document's network lanes and shared clock.
net = ["engine-sync/net"]
collab = ["net"]
reaper = ["studio/reaper", "dep:daw-actions", "dep:daw-reaper", "dep:daw-sync", "dep:reaper-high", "dep:reaper-low", "dep:reaper-medium"]
# Spoken guide cues (Chatterbox, ONNX Runtime). Opt-in: turning it back on
# is deferred (docs/MONOREPO-MIGRATION.md).
tts = ["dep:chatterbox-rs", "chatterbox-rs/load-dynamic", "dep:ort", "ort/load-dynamic"]
vox = []

[dependencies]
studio-proto = { workspace = true }
engine-sync = { workspace = true }
# The lyrics model (studio-core): one source with the lyrics panel and Studio's share-page island.
lyrics = { workspace = true, features = ["lrc"] }
# The progress bar and transport (`ui`): one source with Studio's share-page island.
serde_json = { workspace = true, optional = true }
architect = { workspace = true, features = ["local", "platform", "vox"] }
chatterbox-rs = { workspace = true, optional = true }
chrono = { version = "0.4" }
color-palette = { workspace = true }
daw = { workspace = true }
daw-control = { workspace = true, optional = true }
daw-proto = { workspace = true }
daw-standalone = { workspace = true, optional = true }
daw-transport-sync = { workspace = true }
dawfile-reaper = { workspace = true }
eyre = { workspace = true }
facet = { workspace = true }
fts-sample = { workspace = true, features = ["load"] }
hound = { workspace = true }
keyflow = { workspace = true, features = ["text", "engraver"] }
keyflow-daw-analysis = { workspace = true }
loro = { workspace = true }
# The session primitive: presence and the section and marker kinds are its.
fts-session = { workspace = true }
monarchy = { workspace = true }
music-catalog = { workspace = true }
num-traits = { workspace = true }
ort = { workspace = true, optional = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.48", features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
utils = { workspace = true }
uuid = { version = "1", features = ["js", "serde", "v4", "v7"] }
vox = { workspace = true }
vox-types = { workspace = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
engine-domain = { path = ".", features = ["net"] }
architect = { workspace = true, features = ["local", "platform", "vox"] }
crdt = { workspace = true, features = ["vox"] }
daw = { workspace = true, features = ["standalone"] }
studio = { workspace = true, features = ["file", "test-harness"] }
daw-control = { workspace = true }
daw-proto = { workspace = true }
daw-standalone = { workspace = true, features = ["audio", "bootstrap", "decode", "rpp-project", "session-file"] }
daw-sync = { workspace = true }
dioxus-test = { workspace = true }
# `open_link`'s empty-state test renders the component to HTML.
dioxus-ssr = { workspace = true }
eyre = { workspace = true }
facet-postcard = { workspace = true }
session-format = { workspace = true, features = ["store"] }
serde = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
vox = { workspace = true }
vox-stream = { workspace = true }
vox-websocket = { workspace = true }
zstd = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
daw = { workspace = true }
studio = { workspace = true, features = ["file"] }
daw-actions = { workspace = true, optional = true }
daw-reaper = { workspace = true, optional = true }
daw-sync = { workspace = true, optional = true }
dynamic-template = { workspace = true, features = ["reaper"] }
reaper-high = { workspace = true, optional = true }
reaper-low = { workspace = true, optional = true }
reaper-medium = { workspace = true, optional = true }
vox = { workspace = true, features = ["transport-local"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Performance"] }

[[example]]
name = "tts_smoke"
required-features = ["tts"]

[[test]]
name = "lock_merge"
path = "tests/lock_merge.rs"

[[example]]
name = "doc_edit"
path = "examples/doc_edit.rs"

[[example]]
name = "doc_scale"
path = "examples/doc_scale.rs"
