[package]
name = "engine-runtime"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Session's host-neutral runtime: where a song's files come from, how deep a listener may go, its reference, the guide instrument and the browser's audio out — no window, no shell, no Dioxus"

# What this is, and what it is not.
#
# The part of Session's engine every run mode needs — the native app, the
# web bundle (`session-daw-web`), and later an Architect-hosted extension —
# moved out of `studio-engine` (which re-exports it from the old paths).
# Nothing here draws, and nothing reaches the app's shell, its window or
# its tokio runtime: the embedding host passes in what it decides (the
# listening cap, `Listen`). See FastTrackStudios/studio#400 and
# FastTrackStudios/architect#528.

[dependencies]
# `decode`: the streamed sources a reference plays from; `session-file`:
# a project file read from a folder (`folder`).
daw = { workspace = true, features = ["standalone-decode", "standalone-session-file"] }
daw-proto = { workspace = true }
# `stream-ogg`: a proxy streamed as it arrives; `reapeaks`: its waveform
# cache (`song_stream`).
daw-standalone = { workspace = true, features = ["stream-ogg", "reapeaks", "bootstrap"] }
# The guide engine the Click / Count / Guide MIDI tracks play through
# (`guide_instrument`).
engine-domain = { workspace = true }
eyre = { workspace = true }
# A clock that also runs in a browser (`open_core`'s load timings).
web-time = { workspace = true }
tracing = { workspace = true }
# The host's clock on native fetch retries (`song_stream::fetch_proxy`);
# already in the tree through `daw`.
architect = { workspace = true, features = ["vox", "platform", "action-list", "local"] }
# A streamed proxy's bytes and page index (`song_stream`).
fts-sample = { workspace = true, features = ["engine-core"] }
# A song's documents fetched side by side (`song_stream::mirror`).
futures-util = { workspace = true }
# A Task share link's listing (`source::ShareSource`).
reqwest = { workspace = true }
serde_json = { workspace = true }

# The half a window shares in-process (`client`, what was `engine-client`):
# the views' contract, the session's presence and sync, the template's
# plans, the drum editing's settings, the leveler's math, the dock's
# intents as action arguments.
daw-view = { workspace = true }
daw-control = { workspace = true }
fts-session = { workspace = true, features = ["store"] }
session-sync = { workspace = true }
studio-proto = { workspace = true }
keyflow = { workspace = true, features = ["text", "engraver"] }
dynamic-template = { workspace = true }
dsp = { workspace = true, features = ["level"] }
dsp-core = { workspace = true, features = ["audio"] }
studio = { workspace = true }
utils = { workspace = true }
editing = { workspace = true }
dock-model = { workspace = true }
num-traits = { workspace = true }
facet = { workspace = true }
facet-json = { workspace = true }
vox = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
rayon = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
# The FTS processors as built-in FX beside the guide (`builtin`), and
# signal's rigs (`signal`): the desktop's factory chain.
builtin = { workspace = true, optional = true, features = ["engine"] }
signal-fx = { workspace = true, optional = true }

# The browser's audio out (`web_audio`).
web-sys = { workspace = true, optional = true, features = [
    "Window", "Document", "Event", "EventTarget", "AddEventListenerOptions",
    "AudioContext", "AudioContextOptions", "BaseAudioContext", "AudioContextState",
    "AudioWorklet", "AudioWorkletNode", "AudioWorkletNodeOptions",
    "AudioNode", "AudioDestinationNode", "MessagePort", "MessageEvent",
    "Blob", "BlobPropertyBag", "Url", "Worklet", "WorkletOptions",
    # A streamed song's proxies kept in the browser's cache (`song_stream`).
    "CacheStorage", "Cache", "Response",
    # The window's half (`client`): the page's preferences and pointer.
    "Element", "HtmlElement", "Storage", "MediaQueryList",
] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }

# Natively, the DAW's audio engine: the post-render hook a song's reference
# is mixed in by (`reference_play`). A browser mixes it in its own loop
# (`web_audio`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.48", default-features = false, features = ["sync", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
daw-standalone = { workspace = true, features = ["audio"] }

[features]
default = []
# The FTS processors built in beside the guide (`guide_instrument::install`).
builtin = ["dep:builtin"]
# signal's rigs too.
signal = ["builtin", "dep:signal-fx"]
# The browser: the page's audio loop and its AudioWorklet (`web_audio`),
# and the window's half in a page (`client`).
web = ["dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:gloo-timers", "daw-view/web", "daw-view/standalone", "vox"]
# The window's half in a native process (`client`): its link on a tokio
# runtime, the engine in this process, the app's data folder.
native = ["daw-view/native", "daw-view/local", "session-sync/net", "dep:rayon", "dep:dirs", "dep:tokio", "builtin", "daw/standalone-rpp", "daw/standalone-bootstrap", "studio/cli", "dynamic-template/reaper", "vox"]
# What `#[architect::rpc]` checks in the crate that uses it.
vox = []

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
# The reference-mode test: a reference encoded in memory, and the set's
# block loop driven with no device (`render_set_block`).
fts-sample = { workspace = true, features = ["engine-native"] }
daw = { workspace = true, features = ["standalone-audio"] }
