[package]
name = "control-surfaces"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Control surfaces: Mackie Control / X-Touch"

[lints]
workspace = true

[features]
default = ["midi-hardware"]
midi-hardware = ["dep:midir"]

[dependencies]
daw-control = { workspace = true }
daw-proto = { workspace = true }
eyre = { workspace = true }
facet = { workspace = true }
facet-styx = { workspace = true }
midir = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
vox = { workspace = true }

[dev-dependencies]
daw-standalone = { workspace = true, features = ["bootstrap", "clap-host", "decode"] }
tracing-subscriber = { workspace = true }
