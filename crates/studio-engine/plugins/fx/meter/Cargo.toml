[package]
name = "meter-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FTS Meter — LUFS / true-peak / correlation / goniometer / spectrum metering plugin"

[lib]
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
nice-plug = { workspace = true, features = ["vst3"] }
nice-plug-dioxus = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true }
dsp-core = { workspace = true, features = ["meter"] }
# The editor's painters (feature gui).
plugin-core = { workspace = true, optional = true, features = ["meters"] }
parking_lot = { workspace = true }

[features]
default = []
# The editor: the Dioxus face (plugin-ui) on nice-plug-dioxus. Off, the
# plugin is its DSP and parameters only, as the engine runs it in-process.
gui = ["dep:dioxus", "dep:nice-plug-dioxus", "dep:plugin-core"]
# The CLAP / VST3 entry points, on only for the bundle build (`just
# plugins-bundle` passes `--features export`): every plugin exports the
# same `clap_entry` / `GetPluginFactory` symbols, so two in one binary —
# the session engine's built-in FX, or a workspace test build, where cargo
# unifies features — collide.
# A bundle has its editor.
export = ["gui"]
