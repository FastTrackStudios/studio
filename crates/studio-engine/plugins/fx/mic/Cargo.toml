[package]
name = "mic-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FTS Mic — CLAP/VST3 dual-capsule microphone modeller: a front/rear capsule recording rendered as one of forty modelled mics"

[lib]
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
nice-plug = { workspace = true, features = ["vst3"] }
dsp = { workspace = true, features = ["mic"] }
# The params and the mic list (no editor).
plugin-core = { workspace = true, features = ["fx-mic"] }
# The editor (feature gui).
plugin-ui = { workspace = true, optional = true, features = ["mic", "mic-ui"] }
nice-plug-dioxus = { workspace = true, optional = true }
dsp-core = { workspace = true }
crossbeam-channel = { workspace = true }

[features]
default = []
# The editor: the Dioxus face (plugin-ui) on nice-plug-dioxus. Off, the
# plugin is its DSP and parameters only, as the engine runs it in-process.
gui = ["dep:plugin-ui", "dep:nice-plug-dioxus"]
# The CLAP / VST3 entry points, on only for the bundle build (`just
# plugins-bundle` passes `--features export`): every plugin exports the
# same `clap_entry` / `GetPluginFactory` symbols, so two in one binary —
# the session engine's built-in FX, or a workspace test build, where cargo
# unifies features — collide.
# A bundle has its editor.
export = ["gui"]

