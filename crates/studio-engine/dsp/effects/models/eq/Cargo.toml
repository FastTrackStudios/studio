[package]
name = "fts-model-eq"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "The FTS EQ model (from fts-fx), run by signal-effects so songs sound as they did: FTS EQ — CLAP/VST3 audio plugin entry point"

[lib]
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
plugin-core = { workspace = true, features = ["fx-eq"] }
# The effect and its parameters' faces: plugins' `plugin-ui`, which re-exports
# `dsp` with each module's `ui` at the paths fts-fx had.
dsp = { workspace = true, features = ["eq", "eq-analyzer", "eq-profiles", "stack"] }
# The editor (feature gui).
plugin-ui = { workspace = true, optional = true, features = ["eq", "eq-native", "eq-profiles", "eq-ui"] }
# The full Dioxus plugin editor (control view, EQ graph, spectrum) —
# `native` pulls nice-plug-dioxus/Blitz.
dsp-core = { workspace = true, features = ["audio"] }
nice-plug = { workspace = true, features = ["vst3"] }

[features]
default = []
# The editor: the Dioxus face (plugin-ui) on nice-plug-dioxus. Off, the
# plugin is its DSP and parameters only, as the engine runs it in-process.
gui = ["dep:plugin-ui", "plugin-core/gui"]
# The CLAP / VST3 entry points, on only for the bundle build (`just
# plugins-bundle` passes `--features export`): every plugin exports the
# same `clap_entry` / `GetPluginFactory` symbols, so two in one binary —
# the session engine's built-in FX, or a workspace test build, where cargo
# unifies features — collide.
# A bundle has its editor.
export = ["gui"]

