[package]
name = "fts-model-reverb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The FTS Reverb model (from fts-fx), run by signal-effects so songs sound as they did: FTS Reverb — CLAP/VST3 reverb plugin (15 algorithms) over the reverb engine"

[lib]
# cdylib → the loadable CLAP/VST3 binary; lib → tests + a future standalone host.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
# Plugin framework. `nice_plug` must be a DIRECT dep: `#[derive(Params)]` and
# `nice_export_clap!`/`nice_export_vst3!` expand to absolute `::nice_plug::…`
# paths, so the crate has to be nameable here. `vst3` is on by default.
nice-plug = { workspace = true, features = ["vst3"] }

# The DSP facade (re-exports reverb-dsp). Never depend on reverb-dsp directly.
# The effect and its parameters' faces: plugins' `plugin-ui`, which re-exports
# `dsp` with each module's `ui` at the paths fts-fx had.
dsp = { workspace = true, features = ["reverb", "reverb-profiles", "stack"] }
# The editor (feature gui).
plugin-ui = { workspace = true, optional = true, features = ["reverb", "reverb-native", "reverb-profiles", "reverb-ui", "reverb-viz"] }

# The chain's lifecycle trait (`Processor`) + `AudioConfig` live here.
dsp-core = { workspace = true, features = ["audio"] }

# The Blitz/nice-plug editor: the seven families and their panels. `native`
# pulls nice-plug-dioxus.
plugin-core = { workspace = true, features = ["fx-reverb"] }
# The IR hand-off channel: the editor's worker sends, the chain receives.
crossbeam-channel = { workspace = true }

[features]
default = []
# The editor: the Dioxus face (plugin-ui) on nice-plug-dioxus. Off, the
# plugin is its DSP and parameters only, as the engine runs it in-process.
gui = ["dep:plugin-ui", "plugin-core/gui"]
# The CLAP / VST3 entry points, on only for the bundle build (`just
# plugins-bundle` passes `--features export`): every plugin exports the
# same `clap_entry` / `GetPluginFactory` symbols, so two in one binary —
# the session engine's built-in FX, or a workspace test build, where cargo
# unifies features — collide.
# A bundle has its editor.
export = ["gui"]

