[package]
name = "synth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The synth rig: its engines (its editor is `synth-ui`)"

[lints]
workspace = true

[features]
default = ["vox"]
vox = ["architect/vox", "dep:vox"]

[dependencies]
architect = { workspace = true }
facet = { workspace = true }
facet-styx = { workspace = true }
flate2 = { workspace = true }
midi = { workspace = true }
sampler = { workspace = true }
signal-proto = { workspace = true }
tracing = { workspace = true }
vox = { workspace = true, optional = true }

[dev-dependencies]
daw = { workspace = true }
facet-styx = { workspace = true }
signal-plugin-host = { workspace = true }
tracing-subscriber = { workspace = true }
