[package]
name = "keys"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The keys rig: pianos, organs and keyboards (its editor is `keys-ui`)"

[lints]
workspace = true

[features]
default = ["vox"]
pipewire = []
vox = ["architect/vox", "dep:vox"]

[dependencies]
architect = { workspace = true, features = ["rig", "vox"] }
daw = { workspace = true }
audio = { workspace = true, features = ["io", "monitor"] }
eyre = { workspace = true }
facet = { workspace = true }
facet-json = { workspace = true }
facet-styx = { workspace = true }
midi = { workspace = true, features = ["midir", "vox"] }
signal-plugin-host = { workspace = true }
signal-proto = { workspace = true }
signal-rig-host = { workspace = true }
signal-rigs-proto = { workspace = true }
studio-otel = { workspace = true }
sampler = { workspace = true }
synth = { workspace = true }
tracing = { workspace = true }
vox = { workspace = true, optional = true }

# The workspace tokio is `full`; on wasm only sync/macros/io-util/rt/time
# exist (mio has no wasm backend), so the browser keys rig gets its own line.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.48", default-features = false, features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
eyre = { workspace = true }
fts-sample = { workspace = true }
libc = { workspace = true }
ratatui = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { workspace = true }
vox-core = { workspace = true }
vox-websocket = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
midi = { workspace = true, features = ["midir", "pipewire", "vox"] }
