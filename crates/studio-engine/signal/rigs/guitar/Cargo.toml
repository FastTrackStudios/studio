[package]
name = "guitar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The guitar and bass rigs: amps, cabs, pedals and the Time block (their editors are `guitar-ui`)"

[lints]
workspace = true

[features]
default = ["vox"]
pipewire = []
vox = ["architect/vox", "dep:vox"]
# Serve Signal's Action List over MCP (signal_commands::serve_mcp): only
# the engine binary turns it on, so the `ui` build never reaches axum.
mcp = ["dep:architect-mcp"]

[dependencies]
# `utils::paths::checkout_root`: the checkout found at run time, not baked in.
utils.workspace = true
architect = { workspace = true, features = ["rig", "vox"] }
blake3 = { workspace = true }
builtin = { workspace = true }
chrono = { workspace = true }
# The effects' DSP (the reverb's algorithm table, for the Time block); their faces are guitar-ui's.
dsp = { workspace = true, features = ["reverb"] }
facet = { workspace = true }
facet-json = { workspace = true }
facet-styx = { workspace = true }
hound = { workspace = true }
libc = { workspace = true }
memmap2 = { workspace = true }
midi = { workspace = true, features = ["midir", "vox"] }
signal-macromod = { workspace = true }
signal-nam = { workspace = true }
signal-proto = { workspace = true }
signal-rig-host = { workspace = true }
signal-rigs-proto = { workspace = true }
sampler = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
vox = { workspace = true, optional = true }

[dev-dependencies]
# Its own tests and examples, with the features they need: a plain
# `cargo test` of the workspace builds them all.
guitar = { path = ".", features = ["mcp"] }
architect = { workspace = true, features = ["vox", "local"] }
neural-amp-modeler = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
loro = { workspace = true }
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros", "time"] }
tracing-subscriber = { workspace = true }
vox = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The rig library as a synced Loro doc (signal_rig_host::book): native only.
signal-rig-host = { workspace = true, features = ["book"] }
# Signal's Action List served to a model over MCP (src/signal_commands.rs),
# feature `mcp`.
architect-mcp = { workspace = true, features = ["http"], optional = true }
audio = { workspace = true, features = ["io"] }
# Natively all of tokio (`full`); on wasm only sync/macros/io-util/rt/time
# exist (mio has no wasm backend), so the browser remote gets its own line.
tokio = { workspace = true, features = ["full", "rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
architect = { workspace = true, features = ["atom", "vox", "platform", "local"] }
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.48", default-features = false, features = ["rt", "sync", "macros", "time"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
midi = { workspace = true, features = ["midir", "pipewire", "vox"] }

[[bin]]
name = "signal-phones"
path = "src/bin/signal-phones.rs"

