# Two recordings with the same file name in different folders: each
# track must play its own, 30 dB apart. This is the song opened from its
# own files; studio#289's collision is in the streamed path
# (engine-runtime's song_stream: proxies, peaks, fetched originals),
# which a local fixture does not reach, so passing here does not close it.
about = "two recordings with the same file name"

[[media]]
file = "Media/bass.wav"
kind = "tone"
hz = 55
db = -6
seconds = 8

[[media]]
file = "Samples/Imported/bass.wav"
kind = "tone"
hz = 110
db = -36
seconds = 8

[[listen]]
track = "Bass DI"
from = "Verse 1"
to = "Verse 1 end"
lufs_min = -18
lufs_max = -4

[[listen]]
track = "Bass Amp"
from = "Verse 1"
to = "Verse 1 end"
lufs_min = -48
lufs_max = -30
