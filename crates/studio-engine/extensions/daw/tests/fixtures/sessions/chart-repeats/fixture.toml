# A written chart with a repeat (studio#450): the verse's first two bars
# play twice, so 6 written bars play as 8. 120 bpm, 2 s bars: written,
# the chart ends at 12 s; played, at 16 s. The song is built from the
# chart beside it, its click the guide's.
about = "a written chart with a repeat"
# The regions the chart builds, named as it writes them.
sections = ["VS", "CH"]

[[media]]
file = "Media/bass.wav"
kind = "tone"
hz = 55
db = -12
seconds = 16

[[chart]]
at = 0.5
bar = 1
written = 1
pass = 1
section = "VS"

# The repeat's second pass: the first written bar again.
[[chart]]
at = 4.5
bar = 3
written = 1
pass = 2
section = "VS"

# After the repeat, two bars later than written.
[[chart]]
at = 8.5
bar = 5
written = 3
pass = 1
section = "VS"

# Past the written end: the chorus, still followed.
[[chart]]
at = 13.0
bar = 7
written = 5
pass = 1
section = "CH"
