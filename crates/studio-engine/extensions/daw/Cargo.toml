[package]
name = "daw-extension"
description = "Studio's engine as an Architect extension: the same engine `studio engine` runs (studio-engine, its daw, its Action List), in the extension's process, the song it is asked to open playing. Studio's views (studio.arrangement, studio.mixer) attach to it the way studio-desktop's window does."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "daw-extension"
path = "src/main.rs"

[features]
default = ["tts"]
# Spoken section cues (chatterbox TTS, ONNX Runtime; vendored cbx on ort rc.15,
# its sessions in the process's one environment from onnx-env).
tts = ["engine-domain/tts"]

[dependencies]
architect-extensions = { workspace = true, features = ["linked-core"] }
architect-extensions-dioxus = { workspace = true, features = ["guest"] }
serde_json = { workspace = true }
tracing = { workspace = true }

# The native process: the engine and its launcher (`src/owner.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
architect-extensions = { workspace = true, features = ["guest", "linked-core"] }
studio-engine = { workspace = true, features = ["native"] }
fts-session = { workspace = true }
# The song as one file: its session a part of the store (studio one-file).
song-file = { workspace = true }
session-format = { workspace = true }
daw-ui = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }
# The engine's own log (engine.log): src/owner.rs.
tracing-subscriber = { workspace = true }
# flock (one engine) and setsid (it outlives the window): src/owner.rs.
libc = { workspace = true }
architect-scene = { workspace = true }
daw = { workspace = true }
daw-proto = { workspace = true }
# The output devices this machine has, for DAW_AUDIO (the audio settings).
audio = { workspace = true, features = ["io"] }

# Spoken section cues (`session`: the domain and its TTS, ONNX Runtime)
# where ONNX Runtime has binaries; on a phone or tablet the engine runs
# without them (`native` is the domain), its cues the guide's samples.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
# (the domain's TTS backend, `session/tts`, behind this crate's `tts`; the
# engine is studio-engine).
engine-domain = { workspace = true }

[lints]
workspace = true
