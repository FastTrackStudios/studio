# daw (src/lib.rs): Studio's engine as an Architect extension: the engine
# `studio engine` runs, in this process, serving its window protocol on a
# Unix socket. Studio's views (studio.arrangement, studio.mixer) attach to
# it as studio-desktop's window attaches to a `studio engine`. Draws
# nothing (docs/design/arrangement-mixer-extensions.md).
id = "daw"
name = "Studio engine"
version = "0.2.0"
kind = "process"
api = "0.1"
description = "Studio's engine: plays the song or set it opens; Studio's arrangement and mixer extensions attach to it."
authors = ["FastTrackStudios"]

[entry]
path = "daw-extension"

[provides]
"fts.session" = "0.1.0"

# The app's playhead (`architect.playhead`): the Now Playing bar it
# follows. A use, not a requirement: in a browser the app answers it
# itself (no extension provides it there), as it does for studio-web's
# and the island's views.
[uses]
"architect.playhead" = "^0.1"

[capabilities]
effect = "mutating"
events = ["playhead.changed"]

# fts.session for the song's session document (src/session_doc.rs): a
# service's method m is the provider's action DAW_<M>.
[[actions]]
id = "DAW_READ"
name = "Session: read"
description = "fts.session read: a caller's own data, the timeline (others' payloads left out), the song's structure."
group = "DAW"
effect = "read_only"
params = '{"type":"object","properties":{"doc":{"type":"string"},"request":{}},"required":["doc","request"]}'

[[actions]]
id = "DAW_WRITE"
name = "Session: write"
description = "fts.session write: the caller's own data, lanes and items."
group = "DAW"
effect = "mutating"
params = '{"type":"object","properties":{"doc":{"type":"string"},"request":{}},"required":["doc","request"]}'

[[actions]]
id = "DAW_STRUCTURE"
name = "Session: structure"
description = "fts.session structure: tempo, markers, regions, bar 1."
group = "DAW"
effect = "mutating"
params = '{"type":"object","properties":{"doc":{"type":"string"},"request":{}},"required":["doc","request"]}'

[[actions]]
id = "DAW_STATE"
name = "Studio engine: state"
description = "Whether the engine is up, its socket and its Action List's MCP address; the song's session document (`session`: its path, id and the URL its transport is led from, for KEYFLOW_SESSION_FOLLOW and IGNITION_SESSION_VIZ); the deck."
group = "DAW"
effect = "read_only"

[[actions]]
id = "DAW_OPEN"
name = "Studio engine: open"
description = "Opens a song, a .session or a setlist (SESSION_OPEN)."
group = "DAW"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"}},"required":["path"]}'

[[actions]]
id = "DAW_AUDIO"
name = "Studio engine: audio device"
description = "The output the engine plays through and the outputs this machine has (`devices`: each one's name, channels and own sample rate). `output_device` (part of a name; empty for the system's default), `sample_rate` (Hz; 0 for the device's own) and `buffer_size` (frames; 0 for the default) change it: kept, and the device is opened again (SESSION_AUDIO_DEVICE). What Studio's audio settings set beside the rig engine's."
group = "DAW"
effect = "mutating"
params = '{"type":"object","properties":{"output_device":{"type":"string"},"sample_rate":{"type":"integer"},"buffer_size":{"type":"integer"}}}'

[[actions]]
id = "DAW_RUN"
name = "Studio engine: run an action"
description = "Runs action `id` of the engine's own Action List with `args`. `song` (its number in the set from 1, its title, or its project) runs it on that song of the set without going to it: the window stays on its song, so a script edits every song in one go (DAW_SONGS lists them)."
group = "DAW"
effect = "mutating"
params = '{"type":"object","properties":{"id":{"type":"string"},"args":{},"song":{}},"required":["id"]}'

[[actions]]
id = "DAW_ACTIONS"
name = "Studio engine: its actions"
description = "Every action on the engine's own Action List, as the list describes it (id, name, description, category, group, shortcut, effect, the JSON Schemas of what it takes and gives): what the app puts on its own list, run through DAW_RUN, so one MCP server and one control socket reach the engine too."
group = "DAW"
effect = "read_only"

[[actions]]
id = "DAW_SONGS"
name = "Studio engine: the set's songs"
description = "The open set's songs in order: each one's `number` (from 1), `title` and engine `project`, and which is current (`at`). What DAW_RUN's `song` takes."
group = "DAW"
effect = "read_only"

[[actions]]
id = "DAW_DECK"
name = "Studio engine: follow the playhead"
description = "The app's playhead moved: the engine plays, pauses or seeks with it when it was not the engine's own move (its hook on app:playhead.changed)."
group = "DAW"
effect = "mutating"
params = '{"type":"object"}'

[[hooks]]
on = "app:playhead.changed"
action = "DAW_DECK"
