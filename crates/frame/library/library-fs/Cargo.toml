[package]
name = "library-fs"
version.workspace = true
edition.workspace = true
publish = false
description = "Surface library backed by a folder of `.frame` markup (legacy `.fm` too) and `.frame` bundles (a zip), watched for edits."

[dependencies]
architect = { workspace = true, features = ["vox", "local"] }
library-proto = { path = "../library-proto" }
document-io = { path = "../../document/document-io" }
surface-proto = { path = "../../surface/surface-proto" }
document-proto = { path = "../../document/document-proto", default-features = false }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
facet.workspace = true

[lints]
workspace = true
