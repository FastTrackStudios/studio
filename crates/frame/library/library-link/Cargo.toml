[package]
name = "library-link"
version.workspace = true
edition.workspace = true
publish = false
description = "The surface library over a WebSocket: serve a store, connect to one, and follow a surface's updates from a non-async host."

[dependencies]
architect = { workspace = true, features = ["vox", "platform"] }
library-proto = { path = "../library-proto" }
surface-proto = { path = "../../surface/surface-proto" }
vox-core.workspace = true
vox-websocket.workspace = true
tokio.workspace = true

[dev-dependencies]
library-fs = { path = "../library-fs" }

[lints]
workspace = true
