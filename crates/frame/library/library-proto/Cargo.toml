[package]
name = "library-proto"
version.workspace = true
edition.workspace = true
publish = false
description = "The surface library contract: SurfaceStore (list, get, publish, live updates), metadata, catalog signatures."

[dependencies]
architect.workspace = true
facet.workspace = true
serde.workspace = true
surface-proto = { path = "../../surface/surface-proto", default-features = false }
document-proto = { path = "../../document/document-proto", default-features = false }
# `codec`: surface content ⇄ scene (markup text or a `.frame` bundle).
document-text = { path = "../../document/document-text", optional = true }
document-bundle = { path = "../../document/document-bundle", optional = true }
vox = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["vox", "codec"]
vox = ["dep:vox", "architect/vox", "surface-proto/vox"]
codec = ["dep:document-text", "dep:document-bundle"]

[lints]
workspace = true
