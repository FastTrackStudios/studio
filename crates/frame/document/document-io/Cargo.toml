[package]
name = "document-io"
version.workspace = true
edition.workspace = true
publish = false
description = "Surfaces on disk: one load/save API over `.frame` markup (with its `.frame.assets/` sidecar; legacy `.fm` still read) and `.frame` bundles (a zip; told apart from markup by content)."

[dependencies]
document-proto = { path = "../document-proto", default-features = false }
document-text = { path = "../document-text" }
document-bundle = { path = "../document-bundle" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
