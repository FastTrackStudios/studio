[package]
name = "frame-desktop"
description = "Frame desktop player: runs a control surface live against an engine, hot-reloading its markup."
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "frame"
path = "src/main.rs"

[dependencies]
frame = { path = "../..", features = ["anyrender", "design", "io", "library", "remote", "render", "runtime"] }
serde_json = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
vello = { version = "0.10.0" }  # frame's own version (not the workspace's)
winit = { workspace = true }
pollster = { workspace = true }
image = { version = "0.25" }  # frame's own version (not the workspace's)
# `--engine`: the background runtime that owns the remote engine link.
tokio = { workspace = true }
architect = { workspace = true, features = ["platform"] }

[dev-dependencies]
frame = { path = "../..", features = ["library"] }
architect = { workspace = true, features = ["platform", "vox", "local"] }

[lints]
workspace = true
