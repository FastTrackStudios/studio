[package]
name = "frame-cli"
description = "Frame command-line tools: import, render, diff, diagnostics"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
figma-rest = { path = "../../figma/figma-rest" }
figma-import = { path = "../../figma/figma-import" }
render = { path = "../../render/render" }
document-proto = { path = "../../document/document-proto", default-features = false }
document-text = { path = "../../document/document-text" }
document-io = { path = "../../document/document-io" }
surface-proto = { path = "../../surface/surface-proto" }
surface-runtime = { path = "../../surface/surface-runtime", features = ["remote"] }
tokio = { workspace = true }
architect = { workspace = true, features = ["vox"] }
surface-kit = { path = "../../surface/surface-kit" }
surface-widgets = { path = "../../surface/surface-widgets" }
surface-memory = { path = "../../surface/surface-memory" }
feed-memory = { path = "../../feed/feed-memory" }
serde = { workspace = true }
serde_json = { workspace = true }
roxmltree = "0.20"
kurbo = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
skrifa = { version = "0.26", optional = true }
vello = { version = "0.10.0", optional = true }  # frame's own version (not the workspace's)
winit = { workspace = true, optional = true }
image = { version = "0.25", optional = true }  # frame's own version (not the workspace's)
pollster = { workspace = true, optional = true }

[features]
default = ["anyrender", "svg_export"]
svg_export = ["render/svg_export"]
anyrender = ["render/anyrender", "dep:kurbo", "dep:peniko", "dep:skrifa", "dep:vello", "dep:winit", "dep:image", "dep:pollster", "svg_export"]

[dev-dependencies]
design-lint = { path = "../../design/design-lint" }

[lints]
workspace = true
