[package]
name = "frame-cli"
description = "Frame command-line tools: import, render, diff, diagnostics"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
frame = { path = "../..", features = ["figma", "io", "remote", "render", "runtime"] }
tokio = { workspace = true }
architect = { workspace = true, features = ["vox"] }
serde = { workspace = true }
serde_json = { workspace = true }
roxmltree = "0.20"
kurbo = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
skrifa = { version = "0.26", optional = true }
vello = { version = "0.10.0", optional = true }  # frame's own version (not the workspace's)
winit = { workspace = true, optional = true }
image = { version = "0.25", optional = true }  # frame's own version (not the workspace's)
pollster = { workspace = true, optional = true }

[features]
default = ["anyrender", "svg_export"]
svg_export = ["frame/render", "frame/svg_export"]
anyrender = ["frame/anyrender", "frame/render", "dep:kurbo", "dep:peniko", "dep:skrifa", "dep:vello", "dep:winit", "dep:image", "dep:pollster", "svg_export"]

[dev-dependencies]
frame = { path = "../..", features = ["design"] }

[lints]
workspace = true

[[bin]]
name = "engine_probe"
path = "src/bin/engine_probe.rs"
test = false

[[bin]]
name = "export_markup"
path = "src/bin/export_markup.rs"
test = false

[[bin]]
name = "font_sheet"
path = "src/bin/font_sheet.rs"
test = false

[[bin]]
name = "import_diagnostics"
path = "src/bin/import_diagnostics.rs"
test = false

[[bin]]
name = "kit_sheet"
path = "src/bin/kit_sheet.rs"
test = false

[[bin]]
name = "load_profile"
path = "src/bin/load_profile.rs"
test = false

[[bin]]
name = "mock_engine"
path = "src/bin/mock_engine.rs"
test = false

[[bin]]
name = "render_diagnostics"
path = "src/bin/render_diagnostics.rs"
test = false

[[bin]]
name = "render_png"
path = "src/bin/render_png.rs"
test = false

[[bin]]
name = "render_svg"
path = "src/bin/render_svg.rs"
test = false

[[bin]]
name = "svg_structure_diff"
path = "src/bin/svg_structure_diff.rs"
