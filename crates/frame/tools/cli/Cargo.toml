[package]
name = "frame-cli"
description = "Frame command-line tools: import, render, diff, diagnostics"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
frame = { path = "../..", features = ["figma", "io", "remote", "render", "runtime"] }
tokio = { workspace = true }
architect = { workspace = true, features = ["vox"] }
serde = { workspace = true }
serde_json = { workspace = true }
roxmltree = "0.20"
kurbo = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
skrifa = { version = "0.26", optional = true }
vello = { version = "0.10.0", optional = true }  # frame's own version (not the workspace's)
winit = { workspace = true, optional = true }
image = { version = "0.25", optional = true }  # frame's own version (not the workspace's)
pollster = { workspace = true, optional = true }

[features]
default = ["anyrender", "svg_export"]
svg_export = ["frame/render", "frame/svg_export"]
anyrender = ["frame/anyrender", "frame/render", "dep:kurbo", "dep:peniko", "dep:skrifa", "dep:vello", "dep:winit", "dep:image", "dep:pollster", "svg_export"]

[dev-dependencies]
frame = { path = "../..", features = ["design"] }

[lints]
workspace = true
