[package]
name = "render-canvas"
description = "frame paint primitives painted through a host-agnostic Canvas: into a host's own anyrender scene, a replayable Recording, or a CPU raster."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
document-proto = { path = "../../document/document-proto", default-features = false }
render = { path = "../render", default-features = false }
render-fonts = { path = "../render-fonts" }
kurbo = { workspace = true }
peniko = { workspace = true }
skrifa = "0.26"

anyrender_0_11 = { package = "anyrender", version = "0.11", optional = true }

[features]
anyrender-0-11 = ["dep:anyrender_0_11"]

[lints]
workspace = true
