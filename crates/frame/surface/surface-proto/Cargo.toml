[package]
name = "surface-proto"
version.workspace = true
edition.workspace = true
publish = false
description = "The surface contract: catalogs, controls, bindings, curves, and the engine service."

[dependencies]
architect = { workspace = true, optional = true }
feed-proto = { path = "../../feed/feed-proto" }
facet.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
vox = { workspace = true, optional = true }

# `vox` is the RPC face (on by default); without it the trait is plain.
[features]
default = ["vox"]
# The engine service trait (`engine::SurfaceEngine`). Off, this crate is
# plain data with no architect in the graph: what a host that only reads
# documents (session's mixer) depends on.
rpc = ["dep:architect"]
vox = ["rpc", "dep:vox", "architect/vox"]

[lints]
workspace = true
