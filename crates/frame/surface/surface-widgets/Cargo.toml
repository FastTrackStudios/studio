version.workspace = true
edition.workspace = true
publish = false

[dependencies]
surface-proto = { path = "../surface-proto" }
surface-runtime = { path = "../surface-runtime" }
document-proto = { path = "../../document/document-proto", default-features = false }

[dev-dependencies]
