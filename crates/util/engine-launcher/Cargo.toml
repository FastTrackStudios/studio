[package]
name = "engine-launcher"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
description = "Locate, spawn, and probe FastTrackStudio's headless engines (fasttrackstudio --engine, ...)"

# Shared by the `fts` CLI (`fts signal engine`, `fts status`) and the
# fasttrackstudio app's engine supervisor — one binary-discovery + spawn +
# port-probe implementation instead of two.

[dependencies]

# Process-group teardown for supervised children (kill the engine + any
# grandchildren in one killpg on the app's exit).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

