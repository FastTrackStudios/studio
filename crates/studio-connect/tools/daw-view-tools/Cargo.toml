[package]
name = "daw-view-tools"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "The DAW views' headless tools: the golden session and the theme gallery (`daw-view-tools gallery`), `bench` (the arrangement's and the mixer's frame costs) and `blitz_shot` (the app's own tree, rendered to a PNG or a window), over arrangement-view and mixer-view."
# Tools, not a library anyone depends on: an edit to either view rebuilds
# these, and nothing else waits on them.
publish = false

[dependencies]
daw-theme = { workspace = true }
anyrender_vello_cpu = { workspace = true }
timeline = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
daw-view-kit = { workspace = true, features = ["native"] }
arrangement-view = { workspace = true, features = ["native"] }
mixer-view = { workspace = true, features = ["native"] }
# The Patch List view, rendered to its fixtures (`bench`).
studio-panels = { workspace = true, features = ["native", "engine"] }
# The expression editor and the Editor panel (`bench`), and its theme
# tokens (`theme_export`).
midi-editor = { workspace = true, features = ["native"] }
studio-engine = { workspace = true, features = ["native"] }
dioxus = { workspace = true, features = ["hooks", "signals", "macro", "html"] }
daw-ui = { workspace = true, features = ["studio"] }
blitz-dom = { workspace = true }
blitz-paint = { workspace = true }
blitz-traits = { workspace = true }
dioxus-native-dom = { workspace = true }
dioxus-native = { workspace = true }
daw-control = { workspace = true }
daw-proto = { workspace = true }
session = { workspace = true, features = ["library", "ui", "web"] }
keyflow = { workspace = true, features = ["text", "engraver"] }
dynamic-template = { workspace = true }
editor = { workspace = true, features = ["audio", "audio-daw", "daw", "paint"] }
frame = { workspace = true, features = ["host-scene", "live", "theme"] }
daw = { workspace = true }
studio = { workspace = true }
anyrender = { workspace = true }
anyrender_vello = { workspace = true }
vello = "0.11"
image = { workspace = true }
winit = { version = "0.31.0-beta.4" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
eyre = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
# A sampling profiler on the benchmarks (`--features profile`, with
# `FTS_BLITZ_PROFILE=/tmp/frame.svg`).
pprof = { workspace = true, features = ["flamegraph"], optional = true }

[features]
profile = ["dep:pprof", "daw-view-kit/profile"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "daw-view-tools"
path = "src/bin/daw-view-tools.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "theme_export"
path = "src/bin/theme_export.rs"

[[bin]]
name = "blitz_shot"
path = "src/bin/blitz_shot.rs"

[lints]
workspace = true

[dev-dependencies]
# The window-attach test's arguments (tests/window_attach.rs).
serde_json = { workspace = true }
