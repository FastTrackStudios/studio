[package]
name = "engine-client"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "What a window needs of Session's engine: the engine's shared half (`engine_runtime::client`: the view protocol and its link, the window's queue, the read-back model, the overlays, the plain metadata), re-exported from its old paths, and the few pieces that need Dioxus"

# What this is, and what it is not.
#
# The window's half of `studio-engine`. Everything both sides share moved
# down to `engine-runtime` (`engine_runtime::client`), so the engine
# depends on no UI crate (docs/MONOREPO-MIGRATION.md, "Splitting
# studio-engine"); this crate re-exports it from the paths it always had
# and adds what needs Dioxus (`setlist::ReadOnlySet`,
# `song_modes::use_song_modes`).

[dependencies]
engine-runtime = { workspace = true }
# The song's mode (`song_modes::use_song_modes`).
engine-domain = { workspace = true }
dioxus = { workspace = true, features = ["hooks", "signals", "macro", "html"] }

[features]
default = ["native"]
vox = []
native = ["engine-runtime/native", "vox"]
web = ["engine-runtime/web", "dioxus/web", "vox"]

[lints]
workspace = true
