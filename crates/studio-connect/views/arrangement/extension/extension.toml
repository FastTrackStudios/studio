# studio.arrangement (src/lib.rs): Studio's arrangement view, the one
# studio-desktop shows, in a stock Architect as a process. It is a Studio
# window attached to Studio's engine (the `daw` extension runs it), as
# studio-desktop's window attaches to `studio engine`. It names no other
# view (docs/design/arrangement-mixer-extensions.md).
id = "studio.arrangement"
name = "Arrangement"
version = "0.2.0"
kind = "process"
api = "0.1"
description = "Studio's arrangement: the song's tracks, items, waveforms, ruler rows, track panel and play cursor, as studio-desktop shows them."
authors = ["FastTrackStudios"]

[entry]
path = "studio-arrangement"

# The engine's values: its panes read the shared value table of the
# provider of a service they use (the `daw` extension provides
# fts.session), and the host lights the track panel's mute and solo by it,
# in the same frame as the mixer's.
[uses]
"fts.session" = "^0.1"

[capabilities]
effect = "mutating"
ui = ["engine"]

[[views]]
id = "arrangement"
title = "Arrangement"
icon = "rows-3"

[[actions]]
id = "STUDIO_ARRANGEMENT_STATE"
name = "Arrangement: state"
description = "Whether this window is linked to Studio's engine, the song it shows, the Folded switch, and its pane's frames (how many, how many changed, the view's work)."
group = "Arrangement"
effect = "read_only"

[[actions]]
id = "STUDIO_ARRANGEMENT_PLAY_PAUSE"
name = "Arrangement: play or pause"
description = "Plays or pauses the song (the engine's SESSION_PLAY_PAUSE)."
group = "Arrangement"
effect = "mutating"

[[actions]]
id = "STUDIO_ARRANGEMENT_STOP"
name = "Arrangement: stop"
description = "Stops the song (the engine's SESSION_STOP)."
group = "Arrangement"
effect = "mutating"

[[actions]]
id = "STUDIO_ARRANGEMENT_FOLDED"
name = "Arrangement: fold every top-level folder"
description = "Folds every top-level folder (`on`: true) or opens them all (false); with neither, the other way: the bottom bar's Folded switch."
group = "Arrangement"
effect = "mutating"
params = '{"type":"object","properties":{"on":{"type":"boolean"}}}'

[[actions]]
id = "STUDIO_ARRANGEMENT_PANEL"
name = "Arrangement: expand the track panel"
description = "The track panel compact (`compact`: true: each track's name) or expanded (false: its mute, solo, arm, volume, pan, FX and routing); with neither, the other way: the window's toolbar switch, or a swipe across the panel."
group = "Arrangement"
effect = "mutating"
params = '{"type":"object","properties":{"compact":{"type":"boolean"}}}'
