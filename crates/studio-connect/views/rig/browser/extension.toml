# studio.rig.browser (src/lib.rs): the browser (`guitar::ui::panels::Tones`, the iPad layout's `Browser` with its captures and TONE3000 panels), in an Architect pane: a vox client of
# the rig engine (the studio.rig extension runs it), as every Signal GUI
# is. It names no other view (docs/design/signal-extensions.md).
id = "studio.rig.browser"
name = "Rig browser"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "The rig's browser: blocks, modules and presets by kind, the captures on this device and TONE3000; a pick loads it into the rig."
authors = ["FastTrackStudios"]

[entry]
path = "studio-rig-browser"

# What a press asks of the app: another rig view brought up beside this
# one (the browser on a block's presets, Setup from a status light).
[capabilities]
effect = "mutating"
actions = ["EXT_VIEW_OPEN"]

[[views]]
id = "browser"
title = "Browser"
icon = "library"

[[actions]]
id = "STUDIO_RIG_BROWSER_STATE"
name = "Rig browser: state"
description = "Whether this window's process is connected to the rig engine and where it is, why not when it is not, and what the rig's panes share (the grid's selection, the browser's focus, the part being built)."
group = "Rig"
effect = "read_only"

[[actions]]
id = "STUDIO_RIG_BROWSER_FOCUS"
name = "Rig browser: open on"
description = "Opens the browser on a kind (`kind`: `block:delay`, `module:Amp`, `profiles`, …), at `preset` (and `variation`) inside it; `search`: true opens on the search."
group = "Rig"
effect = "mutating"
params = '{"type":"object","properties":{"kind":{"type":"string"},"preset":{"type":"string"},"variation":{"type":"string"},"search":{"type":"boolean"}},"required":["kind"]}'
