# studio.rig.status (src/lib.rs): the engine's three small readouts (`guitar_ui::panels::{Status, Tuner, DiPlayer}`), in an Architect pane: a vox client of
# the rig engine (the studio.rig extension runs it), as every Signal GUI
# is. It names no other view (docs/design/signal-extensions.md).
id = "studio.rig.status"
name = "Rig status"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "The rig's status bar (the footswitch mode, Panic, the MIDI and audio lights, CPU, the IN, OUT and PHONES meters, Mute), the tuner and the DI player."
authors = ["FastTrackStudios"]

[entry]
path = "studio-rig-status"

# What a press asks of the app: another rig view brought up beside this
# one (the browser on a block's presets, Setup from a status light).
[capabilities]
effect = "mutating"
actions = ["EXT_VIEW_OPEN"]

[[views]]
id = "status"
title = "Rig status"
icon = "activity"

[[views]]
id = "tuner"
title = "Tuner"
icon = "audio-waveform"

[[views]]
id = "player"
title = "DI player"
icon = "disc-3"

[[actions]]
id = "STUDIO_RIG_STATUS_STATE"
name = "Rig status: state"
description = "Whether this window's process is connected to the rig engine and where it is, why not when it is not, and what the rig's panes share (the grid's selection, the browser's focus, the part being built)."
group = "Rig"
effect = "read_only"
