# `cargo xtask boundaries` (FastTrackStudios/architect xtask, STA-268): the
# layer table for architect's docs/content/architecture/layout.md, applied to
# studio (Session + Signal). Run with `just ci-boundaries`.
#
# Each [[row]] is a package + feature set, resolved with `cargo tree -p`:
#   L0  contract: resolved for wasm32; must not reach an engine/storage/host/UI
#       package, a tokio runtime, or a transport-host/server architect feature.
#   L4  ui: must not reach an engine/storage/host package or a server feature.
#   L1  everything else in features/ (engine, storage, glue): recorded, not
#       constrained, until each feature folds into one crate with flags.
# Workspace rules: nothing outside apps/ enables a transport host by default;
# every member has `[lints] workspace = true`; one architect source in
# Cargo.lock; every feature crate has a row.
#
# studio already uses one crate per feature. L0 rows: crates with a `vox`
# flag or a proto crate (their default set is the contract). L4 rows: each
# crate's `ui`/`dioxus` flag and the remaining *-ui crates. L1: engines,
# DSP and REAPER adapters (native by design; recorded, not constrained).
#
# [baseline] is today's count per rule. Above it fails; below it fails until
# you lower it here, so the numbers only go down.

contract-target = "wasm32-unknown-unknown"
host-dirs = ["apps"]
unmapped-ok = ["features/adapters/reaper/tests", "features/adapters/reaper/session-extension/xtask", "features/adapters/reaper/daw-reaper/xtask"]
single-source = ["architect", "architect-*", "auth", "auth-*", "crdt", "crdt-*", "ui-snapshot"]

[forbidden]
engine = [
    "sea-orm", "sea-orm-migration", "sqlx", "rusqlite", "libsql", "turso",
    "axum", "tower-http", "iroh", "tokio-tungstenite",
]
ui = ["dioxus", "dioxus-core", "dioxus-web", "dioxus-desktop", "blitz-dom", "vello"]
tokio-runtime = ["rt", "rt-multi-thread"]
transport-host = ["host", "server", "server-axum", "http", "iroh", "dispatch-tokio"]
architect-server = ["server-seaorm"]

# A hand-written axum route describes a capability a second time; the trait
# (#[architect::service] / #[architect::rpc], mounted by EngineHost) is the
# one description.
[[idiom]]
name = "hand-routes"
pattern = ".route("
instead = "a #[architect::service] trait mounted by EngineHost"

[baseline]
# 2026-10-21 first run (architect xtask d644a04, studio dev 5849ca8), 5m30s.
#   contract-clean 17: tokio/rt 7, tokio/rt-multi-thread 3, dioxus/dioxus-core 6, vello 1.
#   ui-reach 7: comp/drums/editor/guitar/keys/mic/synth `ui` reach tower-http.
#   transport-host 2: session-extension enables architect/iroh + server-axum.
#   lints 22: 9 vendored crates, 13 studio crates (align-dsp, fts-sample, ...).
#   single-source 0, unmapped 0.
#   hand-routes 31: sampler node_render 6, signal-desktop engine_tone3000 4 + engine_watch 4, ...
# ratcheted down 2026-10-22 (STA-356): contract-clean 17 -> 14, ui-reach 7 -> 6 (CI measured 14 and 6).
contract-clean = 14
ui-reach = 6
transport-host = 2
lints = 22
hand-routes = 31

