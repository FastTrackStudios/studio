# The monorepo's layout rules, checked by scripts/boundaries.py
# (`just boundaries`, part of `just check`, `just ci-local` and CI).
# Why the groups exist: crates/studio-*/AGENTS.md and the root AGENTS.md.
#
#   May depend on ->   core   connect   engine
#   studio-core         yes     no        no
#   studio-connect      yes     yes       no
#   studio-engine       yes     no        yes
#   apps/studio         yes     yes       yes
#
# The one exception: the plugin bundles (crates/studio-engine/plugins/*) ship
# their own GUI, so they may use crates/studio-connect/plugin-ui/*. Nothing
# depends on a bundle.
#
# The promise: no core or engine crate (the bundles aside) resolves Dioxus,
# Blitz, app-shell or a studio-connect crate. The engine builds, runs and is
# tested without the UI.
#
# This replaces the layer table for architect's `xtask boundaries`, whose
# rows named the pre-monorepo crates. That tool can't group members by
# directory, and it refuses unknown keys, so the two can't share this file.

# Each member's group is the longest of these directories that holds it.
[groups]
core = "crates/studio-core"
connect = "crates/studio-connect"
engine = "crates/studio-engine"
app = "apps"
# Build tooling (the bundler, the CI generator, dev CLIs) and vendored
# third-party crates.
tools = ["xtask", "vendor"]

# What a member of each group may declare a path dependency on.
[may-depend-on]
core = ["core", "tools"]
connect = ["core", "connect", "tools"]
engine = ["core", "engine", "tools"]
app = ["core", "connect", "engine", "app", "tools"]
tools = ["*"]

[[exception]]
from = "crates/studio-engine/plugins/*"
to = "crates/studio-connect/plugin-ui/*"

[promise]
groups = ["core", "engine"]
exempt = ["crates/studio-engine/plugins"]
forbidden = ["dioxus", "blitz", "app-shell", "studio-connect"]

# Frame's core boundary (frame's scripts/check-core-boundary.sh): plugin GUIs
# and hosts without architect link only the core, and architect never
# depends on Frame.
[[deny]]
package = "frame"
all-features = true
forbidden = ["architect", "vox", "dioxus", "figcraft", "crdt"]
why = "frame's core links no architect, vox, Dioxus, figcraft or crdt"

# `just test <group>` runs every member of the group except these.
[test]
skip = [
    # They drive a real, licensed REAPER.
    "daw-perf-test",
    "daw-reaper-dioxus-ext-test",
    "session-reaper-xtask",
]

