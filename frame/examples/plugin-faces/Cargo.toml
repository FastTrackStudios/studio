[package]
name = "plugin-faces"
description = "Hardware-style plugin faces (compressors, EQs, delays, reverbs, saturation, modulation) built from the surface kit — written out as frame markup + catalogs."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
surface-kit = { path = "../../features/surface/surface-kit" }
surface-widgets = { path = "../../features/surface/surface-widgets" }
surface-proto = { path = "../../features/surface/surface-proto", default-features = false }
document-proto = { path = "../../features/document/document-proto", default-features = false }
document-text = { path = "../../features/document/document-text" }
render-fonts = { path = "../../features/render/render-fonts" }
document-io = { path = "../../features/document/document-io" }
motion-runtime = { path = "../../features/motion/motion-runtime" }
serde_json = { workspace = true }
uuid = { workspace = true }
skrifa = "0.26"

[dev-dependencies]
design-lint = { path = "../../features/design/design-lint" }
surface-runtime = { path = "../../features/surface/surface-runtime" }
# `tests/frame_assets.rs`: a face loaded from disk renders like the one in memory.
render = { path = "../../features/render/render", features = ["anyrender"] }
kurbo = { workspace = true }

[lints]
workspace = true
