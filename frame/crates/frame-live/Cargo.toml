[package]
name = "frame-live"
description = "A frame surface running live inside a host's GPU renderer: loads a page from markup, hot-reloads it as the file changes, runs its controls, and renders through the effects stage on the host's own wgpu device."
version.workspace = true
edition.workspace = true
publish = false

# A `crates/` library like `frame-embed`, for hosts that have a GPU to give:
# signal's Blitz widgets hand over their wgpu device and composite the
# texture this renders. No window, no engine link: the host sends the
# calls where it likes and feeds values back.

[dependencies]
render = { path = "../../features/render/render", features = ["anyrender"] }
document-proto = { path = "../../features/document/document-proto", default-features = false }
document-io = { path = "../../features/document/document-io" }
surface-proto = { path = "../../features/surface/surface-proto", default-features = false }
surface-runtime = { path = "../../features/surface/surface-runtime", default-features = false }
serde_json = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
vello = { version = "0.10.0" }  # frame's own version (not the workspace's)
# Paint a surface's vectors into a host's anyrender 0.11 scene
# (`LiveSurface::paint_vectors`) — for a host whose renderer gives no Vello
# GPU to render with: vello-hybrid on the iOS simulator.
anyrender = { version = "0.11", optional = true }
anyrender_svg = { version = "0.12", optional = true }

[features]
anyrender-0-11 = ["dep:anyrender", "dep:anyrender_svg"]

[dev-dependencies]
wgpu = "29"
pollster = "0.4"

[lints]
workspace = true
