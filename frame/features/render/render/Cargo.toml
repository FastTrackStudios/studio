[package]
name = "render"
description = "Frame renderer — paint primitives, vello GPU backend, SVG export"
version.workspace = true
edition.workspace = true

[dependencies]
document-proto = { path = "../../document/document-proto", default-features = false }
render-fonts = { path = "../render-fonts" }
serde = { workspace = true }
serde_json = { workspace = true }
roxmltree = "0.20"

anyrender = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main", optional = true }  # frame's own version (not the workspace's)
anyrender_svg = { workspace = true, optional = true }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main", optional = true }  # frame's own version (not the workspace's)
vello = { version = "0.10.0", optional = true }  # frame's own version (not the workspace's)
kurbo = { workspace = true }
peniko = { workspace = true, optional = true }
skrifa = { version = "0.26", optional = true }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
taffy = { workspace = true }
winit = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
svg = { version = "0.18", optional = true }
rust_decimal = { version = "1.36", optional = true }
fixed = { version = "1.28", optional = true }

[features]
default = []
svg_export = ["dep:svg", "dep:rust_decimal", "dep:fixed"]
anyrender = ["dep:anyrender", "dep:anyrender_svg", "dep:anyrender_vello", "dep:vello", "dep:peniko", "dep:skrifa", "dep:image", "dep:winit", "dep:pollster", "svg_export"]

[dev-dependencies]
figma-import = { path = "../../figma/figma-import" }

[lints]
workspace = true
