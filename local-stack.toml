# The local stack (docs/local-stack.md): `devenv up` (or `just dev`) runs
# the Architect server, its sign-in, Studio's web client and Studio's
# desktop app on this machine, from these settings, through
# scripts/local-stack.sh. The server and the sign-in are Architect's own
# (`cargo xtask dev`, xtask/src/dev in the Architect checkout the stack
# resolves): nothing here copies them, and nothing of Studio is in them.

# Every process binds 127.0.0.1 (the web front can be opened to the LAN:
# LOCAL_STACK_LAN=on). Clear of Architect's own stack (7410-7414, its
# dev-stack.toml), so both run at once, and of what a fleet machine runs
# (Teley 8787, the collector 4318, `just web` 8080, Task's 9090).
# `LOCAL_STACK_PORT_<NAME>` (MOCK_OAUTH, AUTH, SERVER, WEB, WEB_DX,
# DESKTOP) moves one.
[ports]
mock_oauth = 7420
auth = 7421
# The Architect server (plain `architect-desktop serve`): /health, /vox,
# the org lane, share links (/s/...).
server = 7422
# studio-web, as a browser opens it: the front, which joins dx's dev
# server and the Architect server's paths on one origin.
web = 7423
# dx serve's own port for studio-web, behind the front.
web_dx = 7424
# The desktop app's own node (every Architect app is a peer): its HTTP face.
desktop = 7425

# `local-stack.sh tailnet` (LOCAL_STACK_TAILNET=on: at every start): the web
# client on this machine's tailnet name over HTTPS (`tailscale serve`,
# never funnel), so a phone or another machine on the tailnet opens it.
# Tailscale serves HTTPS on 443, 8443 and 10000; the first two are often
# taken on a fleet machine.
[tailnet]
https_port = 10000

# The other two repos, when they are local (`just dev architect=local`).
# Relative paths are tried from this checkout, then from the main checkout
# of a worktree. `LOCAL_STACK_ARCHITECT_PATH` / `LOCAL_STACK_KEYFLOW_PATH`
# name another.
[sources]
architect = "../architect"
keyflow = "../keyflow"

# The demo vault the server holds: these folders merged into a COPY, in
# order (a later one wins a path both have), made once into the stack's
# state and made again when this list changes (`just dev-reset` drops
# it), so nothing done while testing reaches the sources.
# `LOCAL_STACK_VAULT` names one folder instead. None found: the server
# holds Architect's demo seed (its setlist `Fall Show`, /s/ksqx75iaaaaaaaae/).
[vault]
sources = [
    "../../setlists/merry-and-bright/vault",
    "../../vaults/fasttrackaudio/Vault",
    # JT's Senior Recital ready for the engine (optional; scripts/link-vault.py
    # over link-prepare's renditions of the recital's sessions, with the
    # fasttrackaudio library's notes, charts and lyrics): last, so its song
    # notes, which add each song's session and stems, win.
    "../../vaults/studio-demo/recital-vault",
    # A church's weekly set (Main, Sunday): worship songs with their art,
    # the set's keys, arrangements, vocal and guitar leads, its room and
    # call time (optional; the launcher's week page opens it).
    "../../vaults/studio-demo/church-vault",
]

# A share link per set, each with its songs, for anyone with the link.
# Fixed codes (16 characters of abcdefghijkmnpqrstuvwxyz23456789), so a
# link is the same on every start and machine. `LOCAL_STACK_SETLIST` and
# `LOCAL_STACK_SHARE_CODE` name one instead. `listen` is how far it plays:
# Reference (the default, a listener's link: the arrangement and the
# reference mix) or Full (every stem too, what the engine plays a song's
# tracks from). A set not in the vault gets no link (a NOTICE).
[[vault.shares]]
setlist = "Setlists/Merry & Bright - CBU Christmas 2026.md"
code = "merrybrightstack"

[[vault.shares]]
setlist = "Setlists/JT's Senior Recital.md"
code = "jtrecitasetstack"

[[vault.shares]]
setlist = "Setlists/Main - Sun Nov 22.md"
code = "mainsundaysetxyz"

# The recital in the engine: its sessions and every stem, so the web
# app's engine plays the songs' tracks and the mixer has them. Full is
# safe here: the stack binds 127.0.0.1, the vault is a dev copy of
# material the band already shares with its members, and the link only
# serves the renditions (Ogg Vorbis) the song notes attach, never a master.
[[vault.shares]]
setlist = "Setlists/JT's Senior Recital (Multitracks).md"
code = "jtrecitstemsdeck"
listen = "Full"
