# cargo-rail policy (0.32). Sparse: only what differs from rail's defaults.
# Docs: https://github.com/loadingalias/cargo-rail/blob/v0.32.0/docs/config.md
#
# studio uses rail for two things (fleet release flow v4):
#   - CI change selection (`cargo rail plan`, the `plan` job in
#     .github/workflows/checks.yml);
#   - release intent: every PR that changes a crate carries a change file
#     (`cargo rail change add <crates> --bump <none|patch|minor|major> -m
#     "<note>"`, written to .changes/), checked in CI by `cargo rail change
#     check`. scripts/release.sh builds CHANGELOG.md from them.
# Commands stay in the Justfile; this file only declares inputs.

# The web bundles deploy.yml ships (session-daw-web, session-web,
# signal-web) and the Signal browser remote must stay wasm-clean, so
# target-aware decisions resolve for the browser target too.
targets = ["wasm32-unknown-unknown"]

# Releases go through scripts/release.sh (docs/agents/release-workflow.md):
# rail 0.32 cannot bump crates that inherit `version.workspace = true`,
# which is every app crate here. Its default would publish to crates.io
# and create GitHub releases; make `cargo rail release` inert, and name
# the change files (.changes/, the default change_dir) as the release
# source, which is what release.sh reads.
[release]
publish = "none"
github_release = false
checks = "none"
source = "changes"

# Inputs outside the Cargo graph that change what CI itself does. Any of
# these changing makes the plan job run the FULL set (workflows, the
# Justfile recipes the steps call, the nix CI shell, the scripts the
# steps run). Built-in Cargo work already covers manifests, Cargo.lock,
# .cargo/config.toml and rust-toolchain files; don't repeat them.
[plan.work.ci-infra]
scope = "repository"
paths = [
  ".github/**",
  "Justfile",
  "flake.nix",
  "flake.lock",
  "nix/**",
  "scripts/**",
]

# nextest's own configuration (profiles, slow-timeout overrides): a change
# can alter how every test runs, so it means the full test set.
[plan.work.test-runner]
scope = "repository"
paths = [".config/nextest.toml"]
