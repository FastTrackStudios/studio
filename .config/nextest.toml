[profile.default]
# A test is reported slow at 60 s and killed at 120 s. It was killed at
# 30 s, which only held on an idle box: one CI run on a loaded VM
# (2026-10-23) timed out 16 tests that pass everywhere else — the eq
# screenshots, the guitar rig RPCs, the studio-engine tests, the
# reverb metrics — each a few seconds idle. Overriding them one at a time
# (below) chased load, not code. Two minutes still catches a hang, and a
# test that is merely slow shows up as SLOW in every run, not as red.
slow-timeout = { period = "60s", terminate-after = 2 }

# The suite was cut to a core set (2026-10-24: the DAW core, the session
# format, the DSP math, the timeline and every effect's parameter
# round-trip); the per-test overrides for the screenshot harnesses, the GPU
# frame renders and the long fixture sweeps went with their tests.

# The engine's real-time and lock-timing tests run alone; their overrides
# went with daw-standalone to FastTrackStudios/daw (studio#510).

# The Unbreakable run (daw-extension's tests/unbreakable, `just
# test-unbreakable`) opens the owner's song and renders it whole: minutes.
# Each test runs alone (it times the engine; two at once time each other),
# and its own steps fail on their budgets long before this.
[[profile.default.overrides]]
filter = 'package(daw-extension) & binary(unbreakable) & test(/^(unbreakable|synthetic_song)/)'
slow-timeout = { period = "120s", terminate-after = 15 }
threads-required = "num-test-threads"

# The fixture sessions (daw-extension's tests/fixtures, `just
# test-fixtures`): each starts an engine of its own and plays it in real
# time, so each takes two of the test threads, with room to open on a
# busy runner.
[[profile.default.overrides]]
filter = 'package(daw-extension) & binary(fixtures)'
slow-timeout = { period = "60s", terminate-after = 5 }
threads-required = 2

# The room (daw-extension's tests/room, `just test-room`): two engines of
# its own, a leader and a member, playing in real time.
[[profile.default.overrides]]
filter = 'package(daw-extension) & binary(room)'
slow-timeout = { period = "60s", terminate-after = 5 }
threads-required = 2
