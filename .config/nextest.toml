[profile.default]
# A test is reported slow at 60 s and killed at 120 s. It was killed at
# 30 s, which only held on an idle box: one CI run on a loaded VM
# (2026-10-23) timed out 16 tests that pass everywhere else — the eq
# screenshots, the guitar rig RPCs, the session-engine tests, the
# reverb metrics — each a few seconds idle. Overriding them one at a time
# (below) chased load, not code. Two minutes still catches a hang, and a
# test that is merely slow shows up as SLOW in every run, not as red.
slow-timeout = { period = "60s", terminate-after = 2 }

# The suite was cut to a core set (2026-10-24: the DAW core, the session
# format, the DSP math, the timeline and every effect's parameter
# round-trip); the per-test overrides for the screenshot harnesses, the GPU
# frame renders and the long fixture sweeps went with their tests.

# The run-ahead engine's real-time tests hand the start of a run to the
# ahead worker thread within MAX_PRIME blocks; when the box is too busy to
# schedule that thread in time the window comes up empty and plays as
# silence, by design. Alone they pass every time (18/18, four runs in a
# row); beside a full suite at load ~100 they flaked. They run alone.
[[profile.default.overrides]]
filter = 'package(daw-standalone) & test(/audio_engine::ahead::tests::/)'
threads-required = 'num-test-threads'

# The per-project lock tests time how long one song's readers wait while
# another is edited (a few µs alone). Beside the whole suite on CI's pool
# a busy box let a read wait 5.4 ms against its 5 ms budget: the wait was
# the scheduler's, not a lock's. They run alone.
[[profile.default.overrides]]
filter = 'package(daw-standalone) & test(/sync::daw::tests::/)'
threads-required = 'num-test-threads'
