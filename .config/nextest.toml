[profile.default]
slow-timeout = { period = "30s", terminate-after = 1 }

# The expression editor's screenshot harness paints ~49 scenes through a
# CPU rasterizer in one test, so it is legitimately minutes long rather
# than hung. Without this the suite is red out of the box on a clean
# tree, which trains everyone to ignore a red run.
[[profile.default.overrides]]
filter = 'test(=shoot_every_scene)'
slow-timeout = { period = "60s", terminate-after = 10 }

# A drum slip on a real song, held to a budget (`perf_slip`, run only
# with FTS_PERF_SESSION): opening Unbreakable alone is ~17 s of real work
# (its song document read in full) before the stages it times. Slow
# because the song is big; a hang is still caught.
[[profile.default.overrides]]
filter = 'test(=a_slip_on_a_real_song)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The fill detector's album check decodes six real drum sessions and
# runs detection over each — 55 s measured on a loaded 32-core box — so
# it is slow for the same reason: it does real work, and it finishes.
# Headroom for a slower runner, still short enough to catch a hang.
[[profile.default.overrides]]
filter = 'test(=fills_land_where_a_drummer_puts_them)'
slow-timeout = { period = "60s", terminate-after = 5 }

# Its sibling, which opens one album session and runs the same detector
# over it. Thirteen seconds alone and thirty-one beside the test above,
# because that one now analyses its six songs at once and the two of
# them compete for the same cores. It did fit in the default thirty
# until then — so this override is the cost of that speed-up, and it is
# worth saying so rather than leaving a number that looks arbitrary.
[[profile.default.overrides]]
filter = 'test(=protecting_fills_keeps_them_out_of_the_quantize)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The golden session's eleven scene renders: each is a real GPU frame of
# a 233-track session drawn through the bench binary — about ninety
# seconds for the set, and it grows every time the golden session gains
# a shape. Slow because it draws eleven pictures, not because it is
# stuck; a hang is still caught inside ten minutes.
#
# The period is deliberately well above the measured time rather than
# just above it: on a loaded box this test and the fill detector run
# alongside a full workspace build, and a timeout that only just fits
# on an idle machine goes red under load, which teaches everyone to
# rerun a red suite instead of reading it.
[[profile.default.overrides]]
filter = 'test(=every_scene_renders_to_its_committed_fixture)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The folder-item zoom renders: real GPU frames through the bench, like
# the scenes above and slow for the same reason. It fitted the default
# thirty seconds on an idle box and does not on a busy one — measured at
# 3s idle and 30s while this machine was carrying an unrelated CUDA
# build at load 82 on 32 cores.
#
# Raised on the principle the block above states rather than to make a
# red run green: a timeout that only just fits when nothing else is
# running teaches everyone to rerun a red suite instead of reading it.
# Ten minutes still catches a hang.
[[profile.default.overrides]]
filter = 'test(=every_zoom_renders_to_its_committed_fixture)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The folder-item picture: one more real GPU frame through the bench,
# and the last of that family without a raised timeout — it fitted the
# default thirty seconds until a loaded box (load 107 on 32 cores) took
# it to 30.04. Six seconds idle.
#
# Same principle as its siblings above: a timeout that only just fits on
# an idle machine goes red under load, and a suite that goes red for
# reasons unrelated to the code teaches everyone to rerun it instead of
# reading it.
[[profile.default.overrides]]
filter = 'test(=a_hidden_child_replays_the_picture_and_a_muted_one_changes_it)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The fx editors' screenshot harnesses (delay, modulation, reverb and
# saturate under features/dsp/) are the same shape as `shoot_every_scene`:
# they rasterize the real editor through vello_cpu and, as their own module
# doc says, assert nothing — "a wrong-looking panel is not a failing test,
# it is a picture you have to look at". Measured at 217 s for reverb, and
# it passes; thirty seconds was never going to be enough. Same treatment,
# same reason: a suite that is red out of the box teaches everyone to
# ignore a red run.
[[profile.default.overrides]]
filter = 'test(=every_space)'
slow-timeout = { period = "120s", terminate-after = 4 }

# ── CI on a loaded runner (fix/green-tests, 2026-10) ─────────────────────
#
# The CI tests job runs the whole workspace on one VM with no GPU: every
# frame a test draws goes through lavapipe (software Vulkan), on the same
# cores the other ~10 000 tests are using. Two things follow, and both are
# here so a red run means a broken test, not a busy box.

# Tests that draw real GPU frames, at most two at a time. On a GPU each
# takes a second; on lavapipe each one wants every core, and twelve of them
# at once starved each other past the thirty-second timeout (the plugin-
# faces and session-view runs on main, October 2026).
[test-groups]
gpu-frames = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'binary(golden_scenes) | binary(folder_items) | binary(patch_list_view) | (package(eq) & binary(screenshots))'
test-group = 'gpu-frames'

# The run-ahead engine's real-time tests hand the start of a run to the
# ahead worker thread within MAX_PRIME blocks; when the box is too busy to
# schedule that thread in time the window comes up empty and plays as
# silence, by design. Alone they pass every time (18/18, four runs in a
# row); beside a full suite at load ~100 they flaked. They run alone.
[[profile.default.overrides]]
filter = 'package(daw-standalone) & test(/audio_engine::ahead::tests::/)'
threads-required = 'num-test-threads'

# The plugin faces' tests build and lint frame documents in a dev build:
# 5–22 s each on an idle Mac, measured October 2026 (motion reels 22.2 s,
# spring tank 16.9 s, verb_480 12–16 s). Real work, and the work is the
# point; sixty seconds with room for a loaded runner still catches a hang.
[[profile.default.overrides]]
filter = 'package(plugin-faces)'
slow-timeout = { period = "60s", terminate-after = 2 }

# Generates all 867 faces twice and compares them byte for byte — 1 734
# documents, 30 s+ on its own in a dev build. A smaller sample would
# weaken the one guarantee it gives (no churn in examples/plugins).
[[profile.default.overrides]]
filter = 'package(plugin-faces) & test(=a_second_regeneration_is_byte_identical)'
slow-timeout = { period = "120s", terminate-after = 3 }

# The sampler's live-parameter sweeps: 855 build-and-compare cases, now on
# every core (10–14 s on an idle Mac at load 40). Real work, like the reverb
# stability sweep above; the same room for a loaded runner.
[[profile.default.overrides]]
filter = 'package(sampler) & (test(=a_live_write_sets_every_builtin_effect_as_its_build_does) | test(=a_param_dropped_from_a_preset_is_written_as_its_build_default))'
slow-timeout = { period = "120s", terminate-after = 2 }

# The Velvet reverb sums ~16k sparse taps per sample — a full core per
# instance (studio#182). Its two stability sweeps take 16–17 s on an idle
# Mac and several times that on the CI runner. Room until it is made cheap.
[[profile.default.overrides]]
filter = 'test(=velvet_stays_bounded_across_its_knob_range) | test(=reverb_algorithm_12_at_full_decay_stays_bounded)'
slow-timeout = { period = "60s", terminate-after = 4 }

# Backspace's two presses end to end on the golden session. Under a full
# suite at load ~100 it once lost an item between the quantize's slip and
# the hand placement (studio#183, a real ordering race, not yet found);
# alone it passes every time. Alone until that is fixed.
[[profile.default.overrides]]
filter = 'package(session-daw) & test(=backspace_takes_off_the_automated_edit_then_the_hand_placements)'
threads-required = 'num-test-threads'

# kit-sheet paints every plugin knob on its own panel through the CPU
# rasterizer: 21.4 s on an idle Mac (October 2026), so thirty seconds only
# fit when nothing else ran. Real work; a hang is still caught.
[[profile.default.overrides]]
filter = 'package(kit-sheet) & test(=shot_every_knob_on_the_panel_it_sits_on)'
slow-timeout = { period = "60s", terminate-after = 3 }
