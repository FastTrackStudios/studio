[workspace]
resolver = "3"
members = [
    "crates/dsp-core",
    "crates/dsp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrackStudios"]
license = "GPL-3.0-or-later"
repository = "https://github.com/FastTrackStudios/dsp"

[workspace.dependencies]
dsp = { path = "crates/dsp" }
dsp-core = { path = "crates/dsp-core" }
approx = "0.5.1"
atomic_float = "1.1"
crossbeam-channel = "0.5"
ebur128 = "0.1"
hound = "3.5"
libm = { version = "0.2", default-features = false }
once_cell = "1.20"
parking_lot = "0.12"
realfft = "3.0"
rtrb = "0.3.3"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15.2"
symphonia = { version = "0.5", default-features = false }
test-that = { version = "0.5.2", default-features = false }
thiserror = "2.0"

[workspace.lints.rust]
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("fake"))'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.dsp-core]
opt-level = 3
[profile.dev.package.dsp]
opt-level = 3
