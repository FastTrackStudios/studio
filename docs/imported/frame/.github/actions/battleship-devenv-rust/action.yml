# The build environment for one checks job on THEBATTLESHIP (self-hosted
# NixOS, the `thebattleship` pool). The hosted twin is
# .github/actions/hosted-devenv-rust.
#
# - devenv comes from the host when the runner has devenv 2.4.0 (the version
#   devenv.yaml requires), on PATH or in a nix profile. Otherwise the
#   upstream v2.4.0 tag is built, fetched over git: a `github:` ref is
#   resolved through the GitHub API with no token, which rate-limits a shared
#   runner (HTTP 403). As fts-fx's .github/actions/devenv.
# - The target dir goes under the pool's CI_CACHE_DIR, keyed by job, so the
#   job's builds stay warm from one push to the next.
#
# kache is the host's (RUSTC_WRAPPER on the runner units, passed through the
# devenv shell). Nothing sets RUSTFLAGS, RUSTC_WRAPPER or sccache here.

name: THEBATTLESHIP devenv + warm target
description: Install devenv if the runner lacks it, and point cargo at this job's warm target dir.

inputs:
  job:
    description: The job's name; keys its target dir under CI_CACHE_DIR.
    required: true

runs:
  using: composite
  steps:
    - name: devenv 2.4.0 (the host's, else the tag over git)
      shell: bash
      run: |
        set -euo pipefail
        # A runner service's PATH may leave out the nix profiles.
        for d in /run/current-system/sw/bin /nix/var/nix/profiles/default/bin \
                 "$HOME/.nix-profile/bin" "/etc/profiles/per-user/$USER/bin"; do
          if [ -d "$d" ]; then
            PATH="$PATH:$d"
            echo "$d" >> "$GITHUB_PATH"
          fi
        done
        command -v nix >/dev/null || { echo "::error::no nix on this runner"; exit 1; }
        if command -v devenv >/dev/null && [[ "$(devenv --version)" == "devenv 2.4.0 "* ]]; then
          dirname "$(command -v devenv)" >> "$GITHUB_PATH"
          echo "devenv on PATH: $(devenv --version)"
          exit 0
        fi
        # Over git, not `github:` (see above).
        out="$(nix build --accept-flake-config --no-link --print-out-paths 'git+https://github.com/cachix/devenv?ref=refs/tags/v2.4.0&shallow=1#devenv')"
        echo "$out/bin" >> "$GITHUB_PATH"
        echo "devenv installed: $("$out/bin/devenv" --version) ($out)"
    - name: Target dir (pool)
      shell: bash
      env:
        JOB: ${{ inputs.job }}
      run: |
        set -euo pipefail
        [ -n "${CI_CACHE_DIR:-}" ] || { echo "::error::no CI_CACHE_DIR: not a shared THEBATTLESHIP runner"; exit 1; }
        dir="$CI_CACHE_DIR/frame/$JOB/target"
        mkdir -p "$dir"
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
        echo "$JOB: target $dir"
