# nice-plug bundler metadata for every FTS plugin in this repo:
# `cargo run -p fts-plugin-xtask -- bundle -p <package> --release` (what
# `just plugins-bundle` runs) reads this to name the .clap/.vst3 bundles.
# The packages are under crates/studio-engine/plugins; a plugin added there
# gets a line here and in the Justfile's `plugins` list.

[eq-plugin]
name = "FTS EQ"

[comp-plugin]
name = "FTS Comp"

[reverb-plugin]
name = "FTS Reverb"

[delay-plugin]
name = "FTS Delay"

[modulation-plugin]
name = "FTS Modulation"

[level-plugin]
name = "FTS Level"

[saturate-plugin]
name = "FTS Saturate"

[gate-plugin]
name = "FTS Gate"

[limiter-plugin]
name = "FTS Limiter"

[trigger-plugin]
name = "FTS Trigger"

[meter-plugin]
name = "FTS Meter"

[pitch-plugin]
name = "FTS Pitch"

[unison-plugin]
name = "FTS Unison"

[mic-plugin]
name = "FTS Mic"

[guide-plugin]
name = "FTS Guide"

[nam-plugin]
name = "FTS NAM"

[signal-plugin]
name = "FTS Signal"

[signal-sampler-clap]
name = "Signal Sampler"
