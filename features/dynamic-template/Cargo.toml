[package]
name = "dynamic-template"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Dynamic session templates: organize a project by its tracks' names"

[lints]
workspace = true

[features]
default = ["reaper"]
reaper = ["studio/reaper", "dep:daw-reaper"]

[dependencies]
anyhow = { workspace = true }
architect = { workspace = true }
color-palette = { workspace = true }
daw = { workspace = true }
studio = { workspace = true }
daw-proto = { workspace = true }
daw-reaper = { workspace = true, default-features = true, optional = true }
dawfile-reaper = { workspace = true }
eyre = { workspace = true }
facet = { workspace = true }
monarchy = { workspace = true }
music-catalog = { workspace = true }
num-traits = { version = "0.2" }
serde = { workspace = true }
serde_json = { version = "1.0" }
thiserror = { workspace = true }
tracing = { workspace = true }
vox = { workspace = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
dynamic-template = { path = ".", features = ["reaper"] }
daw-standalone = { workspace = true, features = ["audio"] }
facet-json = { workspace = true }
facet-styx = { workspace = true }
insta = { version = "1.34" }
pretty_assertions = { version = "1.4" }
tempfile = { version = "3.8" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "dynamic-template"
path = "src/main.rs"
required-features = ["reaper"]

[[test]]
name = "multitrack_examples"
path = "tests/multitrack_examples.rs"
required-features = ["reaper"]

[[bin]]
name = "golden-session"
path = "src/bin/golden-session.rs"
test = false
