[package]
name = "dynamic-template"
version.workspace = true
edition = "2021"  # original edition of the dissolved workspace (root is 2024)
authors.workspace = true
license.workspace = true
description = "Dynamic template system using monarchy for hierarchical organization"
keywords = ["template", "dynamic", "hierarchy", "organization", "fasttrack"]
categories = ["template-engine", "web-programming"]

[[bin]]
name = "dynamic-template"
path = "src/main.rs"
required-features = ["reaper"]

[dependencies]
dynamic-template-proto = { workspace = true }
architect = { workspace = true }
daw = { workspace = true }
daw-proto = { workspace = true }
daw-reaper = { workspace = true, default-features = true, optional = true }
dawfile-reaper = { workspace = true }
eyre = { workspace = true }
monarchy = { workspace = true }
color-palette = { workspace = true }
music-catalog = { workspace = true }
facet = { workspace = true }
vox = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
# Float to sample conversions in the performed media, without an `as`.
num-traits = "0.2"
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The integration tests (the former dynamic-template-tests crate).
daw-standalone = { workspace = true, features = ["audio"] }
facet-styx = { workspace = true }
tempfile = "3.8"
pretty_assertions = "1.4"
insta = "1.34"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
facet-json = { workspace = true }

[features]
default = ["reaper"]
# The REAPER side: the live organizer (`apply`), the REAPER actions
# (`daw_module`) and the CLI. Off, what is left is the classification —
# groups, scenes, the visibility grouping, track kinds, the golden
# session's RPP builder — which is pure and builds for wasm32 (the Session
# web demo).
reaper = ["daw/reaper", "dep:daw-reaper"]

[lints]
workspace = true

[[test]]
name = "01_no_unneccesary_folders"
path = "tests/01_no_unneccesary_folders.rs"
required-features = ["reaper"]

[[test]]
name = "02_scoped_resorting"
path = "tests/02_scoped_resorting.rs"
required-features = ["reaper"]

[[test]]
name = "03_assertion_sensitivity"
path = "tests/03_assertion_sensitivity.rs"
required-features = ["reaper"]

[[test]]
name = "04_visibility_classification"
path = "tests/04_visibility_classification.rs"
required-features = ["reaper"]

[[test]]
name = "06_organize_is_lossless"
path = "tests/06_organize_is_lossless.rs"
required-features = ["reaper"]

[[test]]
name = "07_template_group_flags"
path = "tests/07_template_group_flags.rs"
required-features = ["reaper"]

[[test]]
name = "08_golden_session"
path = "tests/08_golden_session.rs"
required-features = ["reaper"]

[[test]]
name = "multitrack_examples"
path = "tests/multitrack_examples.rs"
required-features = ["reaper"]

[[test]]
name = "08_scene_selector"
path = "tests/08_scene_selector.rs"
required-features = ["reaper"]

[[test]]
name = "09_grouping_watcher"
path = "tests/09_grouping_watcher.rs"
required-features = ["reaper"]
