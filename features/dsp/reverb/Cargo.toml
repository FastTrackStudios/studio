[package]
name = "reverb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The reverb: its algorithms, their profiles and its editor"

[lints]
workspace = true

[features]
native = ["dep:architect-ui", "dep:atomic_float", "dep:eq", "dep:fts-plug-ui", "dep:nice-plug", "dep:nice-plug-dioxus", "dep:parking_lot", "dep:preset-browser", "dep:preset-browser-ui", "eq/native", "musical-time/params"]
profiles = []
ui = ["dep:dioxus", "dep:fts-audio-ui", "dep:musical-time", "dep:musical-time-ui", "dep:web-time"]
viz = ["dep:anyrender", "dep:blitz-dom", "dep:bytemuck", "dep:dioxus-native-dom", "dep:vello", "fts-audio-ui/shader"]

[dependencies]
anyrender = { workspace = true, optional = true }
architect-ui = { workspace = true, optional = true }
atomic_float = { workspace = true, optional = true }
audiocore-dsp = { workspace = true }
blitz-dom = { workspace = true, features = ["custom-widget"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
crossbeam-channel = { workspace = true }
dioxus = { workspace = true, optional = true }
dioxus-native-dom = { workspace = true, optional = true }
dsp-core = { workspace = true }
eq = { workspace = true, optional = true, features = ["ui"] }
fts-audio-ui = { workspace = true, optional = true }
fts-modulation = { workspace = true }
fts-plug-ui = { workspace = true, optional = true }
musical-time = { workspace = true, optional = true }
musical-time-ui = { workspace = true, optional = true }
nice-plug = { workspace = true, optional = true }
nice-plug-dioxus = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
pitch = { workspace = true }
preset-browser = { workspace = true, optional = true }
preset-browser-ui = { workspace = true, optional = true }
realfft = { version = "3.4" }
symphonium = { version = "0.6", default-features = false, features = ["wav", "pcm", "fft-resampler"] }
thiserror = { workspace = true }
vello = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }

[dev-dependencies]
bytemuck = { version = "1", features = ["derive"] }
dioxus = { workspace = true }
dioxus-test = { workspace = true }
dsp-golden = { workspace = true }
fts-audio-ui = { workspace = true, features = ["probe"] }
naga = { version = "29", features = ["wgsl-in"] }
png = { version = "0.18" }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "screenshots"
required-features = ["native"]

[[test]]
name = "ir_browser"
required-features = ["native"]

[[test]]
name = "presets"
required-features = ["native"]

[[test]]
name = "knob_readouts"
required-features = ["native"]

[[test]]
name = "param_round_trip"
required-features = ["native"]

[[test]]
name = "tempo_sync"
required-features = ["native"]
