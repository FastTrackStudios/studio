[package]
name = "eq"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The EQ (bands, dynamic, spectral, transient) and its spectrum analyzer: engines, profiles, editors"

[lints]
workspace = true

[features]
analyzer = ["dep:once_cell", "dep:parking_lot", "dep:rtrb"]
analyzer-ui = ["dep:anyrender", "dep:dioxus", "dep:kurbo", "dep:peniko"]
gpu-tests = []
graph = ["analyzer", "analyzer-ui", "dep:architect-ui", "dep:atomic_float", "dep:blitz-traits", "dep:bytemuck", "dep:dioxus-native", "dep:futures-timer", "fts-audio-ui/shader", "graph-paint"]
graph-paint = ["analyzer", "analyzer-ui", "dep:anyrender", "dep:kurbo", "dep:peniko"]
native = ["analyzer", "analyzer-ui", "dep:plugin-core", "plugin-core?/editor", "dep:nice-plug", "dep:nice-plug-dioxus", "dep:preset-browser", "graph", "panel", "profiles"]
panel = ["dep:architect-ui", "dep:plugin-core", "dep:fts-audio-ui", "dep:nice-plug-dioxus"]
profiles = []
ui = ["dep:blitz-dom", "dep:dioxus", "dep:fts-audio-ui", "dep:parking_lot", "dep:web-time", "profiles", "analyzer"]

[dependencies]
anyrender = { workspace = true, optional = true }
architect-ui = { workspace = true, optional = true }
atomic_float = { workspace = true, optional = true }
plugin-core = { workspace = true, optional = true, features = ["editor"] }
dsp-core = { workspace = true, features = ["audio"] }
blitz-dom = { workspace = true, features = ["autofocus"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
dioxus = { workspace = true, optional = true }
fts-audio-ui = { workspace = true, optional = true }
futures-timer = { version = "3", optional = true }
kurbo = { workspace = true, optional = true }
nice-plug = { workspace = true, optional = true }
nice-plug-dioxus = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
parking_lot = { version = "0.12", optional = true }
peniko = { workspace = true, optional = true }
preset-browser = { workspace = true, optional = true, features = ["ui"] }
realfft = { workspace = true }
rtrb = { version = "0.3", optional = true }
smallvec = { version = "1.15.2" }
web-time = { workspace = true, optional = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
eq = { path = ".", features = ["graph", "graph-paint", "native", "ui"] }
blitz-traits = { workspace = true }
dioxus = { workspace = true }
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false }
dioxus-test = { workspace = true }
dsp-core = { workspace = true, features = ["audio", "golden"] }
naga = { version = "29", features = ["wgsl-in"] }
pollster = { version = "0.4" }
test-that = { version = "0.5.2", default-features = false, features = ["regex", "num-traits"] }
tokio = { workspace = true, features = ["macros", "rt"] }
wgpu = { version = "29" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blitz-traits = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }
nice-plug-dioxus = { workspace = true, optional = true }

[[test]]
name = "gui_editor"
required-features = ["graph", "native", "ui"]

[[test]]
name = "screenshots"
required-features = ["native", "ui"]

[[test]]
name = "param_round_trip"
required-features = ["native", "ui"]

[[test]]
name = "gui_headless"
path = "tests/gui_headless.rs"
required-features = ["ui"]

[[test]]
name = "gui_smoke"
path = "tests/gui_smoke.rs"
required-features = ["ui"]

[[test]]
name = "proq_presets"
path = "tests/proq_presets.rs"
required-features = ["native", "ui"]

[[test]]
name = "scene_snapshot"
path = "tests/scene_snapshot.rs"
required-features = ["graph", "graph-paint", "ui"]

[[test]]
name = "ui_overheads_preset"
path = "tests/ui_overheads_preset.rs"
required-features = ["native", "ui"]
