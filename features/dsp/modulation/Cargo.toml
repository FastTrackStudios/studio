[package]
name = "modulation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Modulation: chorus, tremolo and wah engines, their profiles and editors"

[lints]
workspace = true

[features]
default = []
native = ["dep:architect-ui", "dep:atomic_float", "dep:plugin-core", "plugin-core?/editor", "dep:nice-plug", "dep:nice-plug-dioxus", "dep:parking_lot"]
profiles = []
ui = ["dep:dioxus", "dep:fts-audio-ui", "dep:web-time", "profiles"]
viz = ["dep:anyrender", "dep:blitz-dom", "dep:dioxus-native-dom", "dep:vello", "fts-audio-ui/shader"]

[dependencies]
anyrender = { workspace = true, optional = true }
architect-ui = { workspace = true, optional = true }
atomic_float = { workspace = true, optional = true }
dsp-core = { workspace = true, features = ["audio", "modulation"] }
blitz-dom = { workspace = true, features = ["custom-widget"], optional = true }
dioxus = { workspace = true, optional = true }
dioxus-native-dom = { workspace = true, optional = true }
fts-audio-ui = { workspace = true, optional = true }
plugin-core = { workspace = true, optional = true, features = ["editor"] }
nice-plug = { workspace = true, optional = true }
nice-plug-dioxus = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
modulation = { path = ".", features = ["native", "profiles", "ui", "viz"] }
bytemuck = { version = "1", features = ["derive"] }
dioxus = { workspace = true }
dioxus-test = { workspace = true }
fts-audio-ui = { workspace = true, features = ["probe"] }
naga = { version = "29", features = ["wgsl-in"] }
png = { version = "0.18" }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "screenshots"
required-features = ["native", "profiles", "ui"]

[[test]]
name = "engines_differ"
required-features = ["ui", "viz"]

[[example]]
name = "engine_sheet"
path = "examples/engine_sheet.rs"
required-features = ["ui", "viz"]
