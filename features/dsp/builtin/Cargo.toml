[package]
name = "builtin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The FTS processors as engine blocks, and their registration as built-in FX"

[lints]
workspace = true

[features]
engine = ["dep:comp-plugin", "dep:daw-standalone", "dep:delay-plugin", "dep:eq-plugin", "dep:gate-plugin", "dep:level-plugin", "dep:limiter-plugin", "dep:meter-plugin", "dep:mic-plugin", "dep:modulation-plugin", "dep:nice-plug", "dep:num-traits", "dep:pitch-plugin", "dep:reverb-plugin", "dep:saturate-plugin", "dep:serde", "dep:serde_json", "dep:tracing", "dep:tune-plugin", "dep:unison-plugin"]

[dependencies]
dsp = { workspace = true, features = ["comp", "delay", "eq", "level", "modulation", "pitch", "reverb", "saturate", "saturate-analysis", "tune"] }
comp-plugin = { workspace = true, optional = true }
daw = { workspace = true, features = ["standalone"] }
daw-proto = { workspace = true }
daw-standalone = { workspace = true, optional = true }
delay-plugin = { workspace = true, optional = true }
dsp-core = { workspace = true, features = ["audio"] }
eq-plugin = { workspace = true, optional = true }
fts-sample = { workspace = true, features = ["load"] }
gate-plugin = { workspace = true, optional = true }
level-plugin = { workspace = true, optional = true }
limiter-plugin = { workspace = true, optional = true }
meter-plugin = { workspace = true, optional = true }
mic-plugin = { workspace = true, optional = true }
modulation-plugin = { workspace = true, optional = true }
nice-plug = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
pitch-plugin = { workspace = true, optional = true }
reverb-plugin = { workspace = true, optional = true }
saturate-plugin = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tune-plugin = { workspace = true, optional = true }
unison-plugin = { workspace = true, optional = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
builtin = { path = ".", features = ["engine"] }
daw = { workspace = true, features = ["standalone"] }
daw-standalone = { workspace = true, features = ["rpp-project", "decode"] }
midi = { workspace = true }

