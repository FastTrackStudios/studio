[package]
name = "mic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FTS Mic: microphone modelling, and its editor"

[lints]
workspace = true

[features]
ui = ["dep:dioxus", "dep:fts-audio-ui", "dep:plugin-core", "plugin-core?/editor", "dep:nice-plug", "dep:nice-plug-dioxus"]

[dependencies]
dioxus = { workspace = true, optional = true }
dsp-core = { workspace = true }
fts-audio-ui = { workspace = true, optional = true }
plugin-core = { workspace = true, optional = true, features = ["editor"] }
nice-plug = { workspace = true, optional = true }
nice-plug-dioxus = { workspace = true, optional = true }
realfft = { workspace = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
mic = { path = ".", features = ["ui"] }
dioxus-test = { workspace = true }
hound = { version = "3.5" }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "gui_editor"
path = "tests/gui_editor.rs"
required-features = ["ui"]

[[test]]
name = "param_round_trip"
path = "tests/param_round_trip.rs"
required-features = ["ui"]
