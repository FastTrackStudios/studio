[package]
name = "saturate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Saturation: its circuits, their profiles and its editor"

[lints]
workspace = true

[features]
analysis = []
native = ["dep:architect-ui", "dep:atomic_float", "dep:eq", "dep:fts-plug-ui", "dep:nice-plug", "dep:nice-plug-dioxus", "dep:parking_lot", "eq/native"]
profiles = []
ui = ["dep:crossbeam-channel", "dep:dioxus", "dep:fts-audio-ui", "profiles"]
viz = ["analysis", "dep:anyrender", "dep:kurbo", "dep:multiband-dsp", "dep:peniko"]

[dependencies]
anyrender = { workspace = true, optional = true }
architect-ui = { workspace = true, optional = true }
atomic_float = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true }
dsp-core = { workspace = true }
eq = { workspace = true, optional = true, features = ["ui"] }
fts-audio-ui = { workspace = true, optional = true }
fts-plug-ui = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
libm = { version = "0.2" }
multiband-dsp = { workspace = true, optional = true }
nice-plug = { workspace = true, optional = true }
nice-plug-dioxus = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
saturate = { path = ".", features = ["native", "profiles", "ui", "viz"] }
anyrender_vello_cpu = { workspace = true }
approx = { workspace = true }
dioxus = { workspace = true }
dioxus-test = { workspace = true }
dsp-core = { workspace = true, features = ["golden"] }
fx-stack = { workspace = true }
png = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
name = "sat_sheet"
required-features = ["profiles", "ui", "viz"]

[[test]]
name = "screenshots"
required-features = ["native", "profiles", "ui"]

[[test]]
name = "emphasis_eq"
required-features = ["native"]

[[test]]
name = "sat_viz"
required-features = ["profiles", "ui", "viz"]

[[test]]
name = "param_round_trip"
required-features = ["native", "ui"]

[[test]]
name = "gain_comp"
path = "tests/gain_comp.rs"
required-features = ["profiles"]

[[test]]
name = "knob_readouts"
path = "tests/knob_readouts.rs"
required-features = ["native", "ui"]
