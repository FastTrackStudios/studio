[package]
name = "dsp-core"
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
description = "The DSP building blocks every processor uses: filters, buffers, smoothing, modulation, metering, musical time, and the golden-master harness"

[lints]
workspace = true

[features]
default = ["loudness"]
golden = ["std"]
loudness = ["ebur128"]
params = ["dep:nice-plug", "std"]
std = []
audio = ["std"]
modulation = ["audio"]
meter = ["std"]

[dependencies]
atomic_float = { workspace = true }
ebur128 = { workspace = true, optional = true }
nice-plug = { workspace = true, optional = true }
parking_lot = { workspace = true }
realfft = { workspace = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
dsp-core = { path = ".", features = ["audio"] }

[[test]]
name = "loudness"
path = "tests/loudness.rs"
required-features = ["audio"]

[[test]]
name = "oversampling"
path = "tests/oversampling.rs"
required-features = ["audio"]
