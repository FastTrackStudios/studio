[package]
name = "dsp-core"
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
description = "The DSP building blocks every processor uses: filters, buffers, smoothing, modulation, metering, musical time, and the golden-master harness"

[lints]
workspace = true

[features]
default = ["loudness"]
golden = []
loudness = ["ebur128"]
params = ["dep:nice-plug"]
time-ui = ["dep:dioxus", "dep:fts-audio-ui"]

[dependencies]
atomic_float = { workspace = true }
dioxus = { workspace = true, optional = true }
ebur128 = { version = "0.1", optional = true }
fts-audio-ui = { workspace = true, optional = true }
nice-plug = { workspace = true, optional = true }
parking_lot = { version = "0.12" }
realfft = { version = "3" }
