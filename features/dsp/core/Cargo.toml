[package]
name = "dsp-core"
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
description = "The DSP building blocks every processor uses: filters, buffers, smoothing, modulation, metering, musical time, and the golden-master harness"

[lints]
workspace = true

[features]
default = ["loudness"]
golden = ["std"]
loudness = ["ebur128"]
params = ["dep:nice-plug", "std"]
time-ui = ["dep:dioxus", "dep:fts-audio-ui", "std"]
std = []
audio = ["std"]
modulation = ["audio"]
meter = ["std"]

[dependencies]
atomic_float = { workspace = true }
dioxus = { workspace = true, optional = true }
ebur128 = { version = "0.1", optional = true }
fts-audio-ui = { workspace = true, optional = true }
nice-plug = { workspace = true, optional = true }
parking_lot = { version = "0.12" }
realfft = { version = "3" }

[[test]]
name = "loudness"
path = "tests/loudness.rs"
required-features = ["audio"]

[[test]]
name = "oversampling"
path = "tests/oversampling.rs"
required-features = ["audio"]
