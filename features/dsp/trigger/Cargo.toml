[package]
name = "trigger"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Drum trigger: hit detection to MIDI, and its editor"

[lints]
workspace = true

[features]
native = ["dep:architect-ui", "dep:atomic_float", "dep:plugin-core", "dep:fts-audio-ui", "plugin-core?/editor", "dep:nice-plug", "dep:nice-plug-dioxus"]
ui = []

[dependencies]
architect-ui = { workspace = true, optional = true }
atomic_float = { workspace = true, optional = true }
plugin-core = { workspace = true, optional = true, features = ["editor"] }
dsp-core = { workspace = true, features = ["audio"] }
eq = { workspace = true }
fts-audio-ui = { workspace = true, optional = true }
nice-plug = { workspace = true, optional = true }
nice-plug-dioxus = { workspace = true, optional = true }
rustfft = { version = "6.2" }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
trigger = { path = ".", features = ["native"] }
approx = { workspace = true }
dioxus = { workspace = true }
dioxus-test = { workspace = true }
symphonia = { version = "0.5", features = ["wav", "pcm"] }
tokio = { workspace = true, features = ["macros", "rt"] }

