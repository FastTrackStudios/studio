[package]
name = "comp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The compressors (VCA, FET, opto, tube, look-ahead) and the limiter: engines, profiles, editors"

[lints]
workspace = true

[features]
native = ["dep:architect-ui", "dep:fts-audio-ui", "dep:atomic_float", "dep:plugin-core", "dep:eq", "plugin-core?/editor", "dep:nice-plug", "dep:nice-plug-dioxus", "dep:parking_lot", "dep:preset-browser", "eq/native", "dsp-core/params"]
profiles = ["dep:eq"]
# Portable (the browser remote draws these): the profile view, the transfer
# curve, the meters. The nice-plug/Blitz editors, the limiter's included,
# are behind `native`.
ui = ["dep:dioxus", "dep:fts-audio-ui", "dep:web-time", "profiles"]
viz = ["dep:anyrender", "dep:blitz-dom", "dep:bytemuck", "dep:dioxus-native-dom", "dep:vello", "fts-audio-ui/shader"]

[dependencies]
anyrender = { workspace = true, optional = true }
architect-ui = { workspace = true, optional = true }
atomic_float = { workspace = true, optional = true }
plugin-core = { workspace = true, optional = true, features = ["editor"] }
dsp-core = { workspace = true, features = ["audio"] }
blitz-dom = { workspace = true, features = ["custom-widget"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
dioxus = { workspace = true, optional = true }
dioxus-native-dom = { workspace = true, optional = true }
eq = { workspace = true, optional = true, features = ["profiles", "ui"] }
fts-audio-ui = { workspace = true, optional = true }
nice-plug = { workspace = true, optional = true }
nice-plug-dioxus = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
preset-browser = { workspace = true, optional = true, features = ["ui"] }
vello = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
comp = { path = ".", features = ["native", "profiles", "ui", "viz"] }
dioxus = { workspace = true }
dioxus-test = { workspace = true }
dsp-core = { workspace = true, features = ["audio", "golden"] }
fts-audio-ui = { workspace = true, features = ["probe"] }
naga = { version = "29", features = ["wgsl-in"] }
png = { version = "0.18" }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "gui_editor"
required-features = ["native", "profiles", "ui"]

[[test]]
name = "screenshots"
required-features = ["native", "profiles", "ui"]

[[test]]
name = "param_round_trip"
required-features = ["native", "ui"]

[[test]]
name = "tempo_sync"
required-features = ["native", "ui"]

[[test]]
name = "ui_limiter_gui_editor"
path = "tests/ui_limiter_gui_editor.rs"
required-features = ["native", "ui"]

[[example]]
name = "comp_sheet"
path = "examples/comp_sheet.rs"
required-features = ["ui", "viz"]
