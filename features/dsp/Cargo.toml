    "std",
    "eq",
    "dep:num-traits",
    "dep:rayon",
    "trigger",
]
level = ["std", "dep:dsp-core", "dsp-core/audio"]
mic = ["std", "dep:dsp-core", "dep:realfft"]
mic-ui = [
    "mic",
    "dep:dioxus",
    "dep:fts-audio-ui",
    "dep:plugin-core",
    "plugin-core/editor",
    "plugin-core?/editor",
    "dep:nice-plug",
    "dep:nice-plug-dioxus",
]
modulation = [
    "std",
    "dep:dsp-core",
    "dsp-core/audio",
    "dsp-core/modulation",
]
modulation-native = [
    "modulation",
    "dep:architect-ui",
    "dep:atomic_float",
    "dep:plugin-core",
    "plugin-core/editor",
    "plugin-core?/editor",
    "dep:nice-plug",
    "dep:nice-plug-dioxus",
    "dep:parking_lot",
]
modulation-profiles = ["modulation"]
modulation-ui = [
    "modulation",
    "dep:dioxus",
    "dep:fts-audio-ui",
    "dep:web-time",
    "modulation-profiles",
]
modulation-viz = [
    "modulation",
    "dep:anyrender",
    "dep:blitz-dom",
    "blitz-dom/custom-widget",
    "dep:dioxus-native-dom",
    "dep:vello",
    "fts-audio-ui/shader",
    "dep:fts-audio-ui",
]
multiband = ["std"]
pitch = [
    "std",
    "dep:dsp-core",
    "dsp-core/audio",
    "dep:realfft",
    "dep:serde",
]
pitch-rubberband = ["pitch"]
reverb = [
    "std",
    "dep:dsp-core",
    "dsp-core/audio",
    "dsp-core/modulation",
    "dep:crossbeam-channel",
    "pitch",
    "dep:realfft",
    "dep:symphonium",
    "symphonium/wav",
    "symphonium/pcm",
    "symphonium/fft-resampler",
    "dep:thiserror",
]
reverb-native = [
    "stack-host",
    "reverb",
    "dep:architect-ui",
    "dep:atomic_float",
    "eq",
    "eq-ui",
    "dep:plugin-core",
    "plugin-core/editor",
    "plugin-core?/editor",
    "dep:nice-plug",
    "dep:nice-plug-dioxus",
    "dep:parking_lot",
    "dep:preset-browser",
    "preset-browser/ui",
    "eq-native",
    "dsp-core/params",
]
reverb-profiles = ["reverb"]
reverb-ui = [
    "reverb",
    "dep:dioxus",
    "dep:fts-audio-ui",
    "dep:web-time",
    "reverb-profiles",
]
reverb-viz = [
    "reverb",
    "dep:anyrender",
    "dep:blitz-dom",
    "blitz-dom/custom-widget",
    "dep:bytemuck",
    "bytemuck/derive",
    "dep:dioxus-native-dom",
    "dep:vello",
    "fts-audio-ui/shader",
    "dep:fts-audio-ui",
]
saturate = ["dep:dsp-core", "dep:libm"]
saturate-analysis = ["saturate", "std"]
saturate-native = [
    "stack-host",
    "saturate",
    "dep:architect-ui",
    "dep:atomic_float",
    "eq",
    "eq-ui",
    "dep:plugin-core",
    "plugin-core/editor",
    "plugin-core?/editor",
    "dep:nice-plug",
    "dep:nice-plug-dioxus",
    "dep:parking_lot",
    "eq-native",
]
saturate-profiles = ["saturate", "std"]
saturate-ui = [
    "saturate",
    "std",
    "dep:crossbeam-channel",
    "dep:dioxus",
    "dep:fts-audio-ui",
    "saturate-profiles",
]
saturate-viz = [
    "saturate",
    "saturate-analysis",
    "dep:anyrender",
    "dep:kurbo",
    "multiband",
    "dep:peniko",
]
separator = [
    "std",
    "dep:anyhow",
    "dep:reqwest",
    "dep:sha2",
    "dep:tokio",
    "tokio/fs",
    "tokio/process",
    "tokio/rt",
    "tokio/macros",
    "dep:tracing",
]
stack = ["dep:libm"]
# The stack's plugin-shell half (params, focus, strip) — `stack::host`.
stack-host = [
    "stack",
    "std",
    "dep:nice-plug",
    "dep:nice-plug-dioxus",
    "dep:plugin-core",
    "plugin-core/editor",
    "dep:parking_lot",
]
std = []
stretch = ["std", "dep:dsp-core", "dep:realfft"]
trigger = [
    "std",
    "dep:dsp-core",
    "dsp-core/audio",
    "eq",
    "dep:rustfft",
]
trigger-native = [
    "trigger",
    "dep:architect-ui",
    "dep:atomic_float",
    "dep:plugin-core",
    "plugin-core/editor",
    "dep:fts-audio-ui",
    "plugin-core?/editor",
    "dep:nice-plug",
    "dep:nice-plug-dioxus",
]
trigger-ui = ["trigger"]
tune = ["std", "pitch", "dep:realfft"]
tune-basic-pitch = ["tune", "dep:tract-onnx"]
tune-world = ["tune", "dep:world-sys"]

[dependencies]
anyhow = {workspace = true, optional = true}
anyrender = {workspace = true, optional = true}
architect-ui = {workspace = true, optional = true}
atomic_float = {workspace = true, optional = true}
blitz-dom = {workspace = true, optional = true}
bytemuck = { workspace = true, optional = true }
crossbeam-channel = {workspace = true, optional = true}
dioxus = {workspace = true, optional = true}
dioxus-native-dom = {workspace = true, optional = true}
dsp-core = {workspace = true, optional = true}
fts-audio-ui = {workspace = true, optional = true}
futures-timer = { workspace = true, optional = true }
kurbo = {workspace = true, optional = true}
libm = { workspace = true, optional = true }
nice-plug = {workspace = true, optional = true}
nice-plug-dioxus = {workspace = true, optional = true}
num-traits = {workspace = true, optional = true}
once_cell = {workspace = true, optional = true}
parking_lot = {workspace = true, optional = true}
peniko = {workspace = true, optional = true}
plugin-core = {workspace = true, optional = true}
preset-browser = {workspace = true, optional = true}
rayon = {workspace = true, optional = true}
realfft = {workspace = true, optional = true}
reqwest = {workspace = true, optional = true}
rtrb = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }
serde = {workspace = true, optional = true}
sha2 = {workspace = true, optional = true}
smallvec = { workspace = true, optional = true }
symphonium = {version = "0.6", default-features = false, optional = true}
thiserror = {workspace = true, optional = true}
tokio = {workspace = true, optional = true}
tracing = {workspace = true, optional = true}
tract-onnx = {workspace = true, optional = true}
vello = {workspace = true, optional = true}
web-time = {workspace = true, optional = true}
world-sys = {workspace = true, optional = true}

[dev-dependencies]
anyhow = { workspace = true }
anyrender_vello_cpu = {workspace = true}
approx = {workspace = true}
blitz-traits = {workspace = true}
builtin = {workspace = true}
bytemuck = { workspace = true, features = ["derive"] }
criterion = { workspace = true }
daw = {workspace = true, features = ["standalone", "vst3-host"]}
dioxus = {workspace = true}
dioxus-ssr = { workspace = true }
dioxus-test = {workspace = true}
dsp-core = {workspace = true, features = ["audio", "golden", "modulation"]}
fts-audio-ui = {workspace = true, features = ["probe"]}
fts-sample = {workspace = true, features = ["decode-compressed"]}
hound = { workspace = true }
naga = { workspace = true, features = ["wgsl-in"] }
png = {version = "0.18"}
pollster = { workspace = true }
rustfft = { workspace = true }
serde_json = {workspace = true}
signal-import = {workspace = true}
signal-plugin-host = {workspace = true, features = ["clap-host", "vst3-host"]}
symphonia = { workspace = true, features = ["default", "wav", "pcm"] }
test-that = { workspace = true, features = ["regex", "num-traits"] }
tokio = {workspace = true, features = ["macros", "rt"]}
wgpu = {version = "29"}
dsp = {path = ".", features = ["align", "reverb", "eq", "analyzer", "comp", "comp-native", "comp-profiles", "comp-ui", "comp-viz", "delay", "delay-native", "delay-profiles", "delay-ui", "delay-viz", "eq-graph", "eq-graph-paint", "eq-native", "eq-ui", "gate", "hits", "level", "mic", "mic-ui", "modulation", "modulation-native", "modulation-profiles", "modulation-ui", "modulation-viz", "multiband", "pitch", "reverb-native", "reverb-profiles", "reverb-ui", "reverb-viz", "saturate", "saturate-native", "saturate-profiles", "saturate-ui", "saturate-viz", "stack", "separator", "stretch", "trigger", "trigger-native", "tune"]}

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
blitz-traits = {workspace = true, optional = true}
dioxus-native = {workspace = true, optional = true}
nice-plug-dioxus = {workspace = true, optional = true}

