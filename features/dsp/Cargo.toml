[package]
name = "dsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The FTS effects and their engines — one crate, one module (and one cargo feature) per effect"
# Every target is listed below, each behind its module's feature.
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lints]
workspace = true

[features]
default = ["std"]
align = [
    "std",
    "dep:realfft",
    "dep:dsp-core",
    "dsp-core/audio",
]
analyzer = [
    "std",
    "dep:dsp-core",
    "dsp-core/audio",
    "dep:realfft",
    "dep:serde",
]
comp = ["std", "dep:dsp-core", "dsp-core/audio"]
comp-native = [
    "comp",
    "dep:architect-ui",
    "dep:fts-audio-ui",
    "dep:atomic_float",
    "dep:plugin-core",
    "plugin-core/editor",
    "eq",
    "eq-profiles",
    "eq-ui",
    "plugin-core?/editor",
    "dep:nice-plug",
    "dep:nice-plug-dioxus",
    "dep:parking_lot",
    "dep:preset-browser",
    "preset-browser/ui",
    "eq-native",
    "dsp-core/params",
]
comp-profiles = [
    "comp",
    "eq",
    "eq-profiles",
    "eq-ui",
]
comp-ui = [
    "comp",
    "dep:dioxus",
    "dep:fts-audio-ui",
    "dep:web-time",
    "comp-profiles",
]
comp-viz = [
    "comp",
    "dep:anyrender",
    "dep:blitz-dom",
    "blitz-dom/custom-widget",
    "dep:bytemuck",
    "bytemuck/derive",
    "dep:dioxus-native-dom",
    "dep:vello",
    "fts-audio-ui/shader",
    "dep:fts-audio-ui",
]
delay = [
    "std",
    "dep:dsp-core",
    "dsp-core/audio",
    "pitch",
]
delay-native = [
    "stack-host",
    "delay",
    "dep:architect-ui",
    "dep:atomic_float",
    "dep:plugin-core",
    "plugin-core/editor",
    "plugin-core?/editor",
    "dep:nice-plug",
    "dep:nice-plug-dioxus",
    "dep:parking_lot",
    "dsp-core/params",
]
delay-profiles = ["delay"]
delay-ui = [
    "delay",
    "dep:crossbeam-channel",
    "dep:dioxus",
    "dep:fts-audio-ui",
    "dep:web-time",
    "delay-profiles",
]
delay-viz = [
    "delay",
    "dep:anyrender",
    "dep:blitz-dom",
    "blitz-dom/custom-widget",
    "dep:bytemuck",
    "bytemuck/derive",
    "dep:dioxus-native-dom",
    "dep:vello",
    "fts-audio-ui/shader",
    "dep:fts-audio-ui",
]
eq = [
    "std",
    "dep:dsp-core",
    "dsp-core/audio",
    "dep:realfft",
    "dep:smallvec",
]
eq-analyzer = [
    "eq",
    "dep:once_cell",
    "dep:parking_lot",
    "dep:rtrb",
]
eq-analyzer-ui = [
    "eq",
    "dep:anyrender",
    "dep:dioxus",
    "dep:kurbo",
    "dep:peniko",
]
eq-gpu-tests = ["eq"]
eq-graph = [
    "eq",
    "eq-analyzer",
    "eq-analyzer-ui",
    "dep:architect-ui",
    "dep:atomic_float",
    "dep:blitz-traits",
    "dep:bytemuck",
    "bytemuck/derive",
    "dep:dioxus-native",
    "dep:futures-timer",
    "fts-audio-ui/shader",
    "dep:fts-audio-ui",
    "eq-graph-paint",
]
eq-graph-paint = [
    "eq",
    "eq-analyzer",
    "eq-analyzer-ui",
    "dep:anyrender",
    "dep:kurbo",
    "dep:peniko",
]
eq-native = [
    "stack-host",
    "eq",
    "eq-analyzer",
    "eq-analyzer-ui",
    "dep:plugin-core",
    "plugin-core/editor",
    "plugin-core?/editor",
    "dep:nice-plug",
    "dep:nice-plug-dioxus",
    "dep:preset-browser",
    "preset-browser/ui",
    "eq-graph",
    "eq-panel",
    "eq-profiles",
]
eq-panel = [
    "eq",
    "dep:architect-ui",
    "dep:plugin-core",
    "plugin-core/editor",
    "dep:fts-audio-ui",
    "dep:nice-plug-dioxus",
]
