[package]
name = "audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Audio devices, sample IO and the core audio types"

[lints]
workspace = true

[features]
io = ["dep:cpal", "dep:facet"]
jack = ["cpal/jack"]
monitor = ["dep:rtrb"]
pipewire = []

[dependencies]
anyhow = { workspace = true }
atomic_float = { workspace = true }
cpal = { version = "0.18", optional = true }
facet = { workspace = true, optional = true }
rtrb = { version = "0.3", optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6" }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire"] }
libc = { workspace = true }
libspa = { version = "0.10" }
pipewire = { version = "0.10" }

[[example]]
name = "duplex_probe"
path = "examples/duplex_probe.rs"
required-features = ["io"]
