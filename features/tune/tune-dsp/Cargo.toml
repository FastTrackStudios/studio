[package]
name = "tune-dsp"
version.workspace = true
edition = "2021"          # matches sibling fx DSP crates (comp-dsp, pitch-dsp)
authors.workspace = true
license.workspace = true
description = "tune-dsp — monophonic pitch detection (YIN), note extraction, and scale-snap correction driving pitch-dsp. Foundation for the Melodyne-style tune FX."

[dependencies]
pitch-dsp = { workspace = true }
# Real-FFT STFT/ISTFT for the polyphonic Direct-Note-Access engine (dna.rs).
realfft = { workspace = true }
# Optional: Basic Pitch (Spotify) polyphonic note transcription via pure-Rust
# ONNX inference. Off by default so the core stays light and dependency-free.
tract-onnx = { workspace = true, optional = true }
# Optional: vendored WORLD vocoder for the formant-preserving committed
# render of the offline pitch editor (spec/autotune-plan.md).
world-sys = { workspace = true, optional = true }

[features]
world = ["dep:world-sys"]
default = []
# Enables the `basic_pitch` module (bundled ~230 KB Apache-2 model + tract).
basic-pitch = ["dep:tract-onnx"]
