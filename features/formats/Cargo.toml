[package]
name = "formats"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Project files: REAPER, Pro Tools, Ableton Live, Logic, AAF and DAWproject import and export, and Session's own file and store"

[lints]
workspace = true

[features]
aaf = ["dep:cfb", "dep:daw-proto", "dep:thiserror"]
ableton = ["dep:daw-proto", "dep:flate2", "dep:quick-xml", "dep:roxmltree", "dep:thiserror"]
dawproject = ["dep:daw-proto", "dep:roxmltree", "dep:thiserror", "dep:zip"]
logic = ["dep:daw-proto", "dep:plist", "dep:thiserror"]
protools = ["dep:daw-proto", "dep:thiserror"]
session = ["dawproject", "dep:daw-proto", "dep:dawfile-reaper", "dep:facet", "dep:facet-styx", "dep:loro", "dep:sha2", "dep:styx-format", "dep:thiserror", "dep:uuid"]
store = ["dep:loro", "dep:pollster", "dep:sha2", "dep:thiserror", "dep:turso", "dep:zstd", "session"]

[dependencies]
cfb = { version = "0.10", optional = true }
daw-proto = { workspace = true, optional = true }
dawfile-reaper = { workspace = true, optional = true }
facet = { workspace = true, optional = true }
facet-styx = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }
loro = { workspace = true, optional = true }
plist = { version = "1", optional = true }
pollster = { workspace = true, optional = true }
quick-xml = { version = "0.37", optional = true }
roxmltree = { version = "0.20", optional = true }
sha2 = { workspace = true, optional = true }
styx-format = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
turso = { version = "0.8.2", default-features = false, optional = true }
uuid = { workspace = true, optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
formats = { path = ".", features = ["aaf", "ableton", "dawproject", "logic", "protools", "session", "store"] }
daw-proto = { workspace = true }
dawfile-reaper = { workspace = true }
loro = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

