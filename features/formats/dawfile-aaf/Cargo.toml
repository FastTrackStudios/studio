[package]
name = "dawfile-aaf"
version = "0.1.0"
edition = "2024"
description = "AAF (Advanced Authoring Format) session file parser — pure Rust, no C dependencies"
license = "GPL-3.0-or-later"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
# Compound File Binary (CFB / OLE Structured Storage) container layer.
# AAF files use CFB as their container format (SMPTE 429-12M).
cfb = "0.10"

thiserror = { workspace = true }

# Domain types for conversion to daw-proto
daw-proto = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
