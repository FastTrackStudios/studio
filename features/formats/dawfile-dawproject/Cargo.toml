[package]
name = "dawfile-dawproject"
version = "0.1.0"
edition = "2024"
description = "DawProject file parser (.dawproject) — open exchange format by Bitwig"
license = "GPL-3.0-or-later"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
thiserror = { workspace = true }

# Domain types for conversion to daw-proto
daw-proto = { workspace = true }

# Fast, zero-allocation XML DOM parser
roxmltree = "0.20"

# ZIP archive extraction (.dawproject files are ZIP containers)
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
daw-proto = { workspace = true }

[lints]
workspace = true
