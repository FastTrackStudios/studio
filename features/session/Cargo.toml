[package]
name = "session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Session: setlists, songs, the live session's sync, the song library and the guide"

[lints]
workspace = true

[features]
# Task vault notes and live-setlist projects from the Song Library
# (session::vault_sync; native only).
vault-sync = ["dep:serde_json"]
default = ["vox"]
collab = ["engine", "net"]
desktop = ["dioxus", "dock/ui", "dock/web"]
engine = ["dep:daw-control", "dep:daw-standalone"]
library = ["dep:collection-proto", "dep:files-client", "dep:files-proto", "dep:futures-util", "dep:links-proto", "dep:resources-proto", "dep:task-dial", "dep:vox-core"]
net = ["dep:crdt", "dep:futures"]
reaper = ["studio/reaper", "dep:daw-actions", "dep:daw-reaper", "dep:daw-sync", "dep:reaper-high", "dep:reaper-low", "dep:reaper-medium"]
tts = ["dep:chatterbox-rs", "dep:ort", "ort/load-dynamic"]
ui = ["dep:architect-ui", "dep:dock", "dock?/ui", "dep:lucide-dioxus", "web"]
vox = []
web = ["dioxus", "dock/ui", "dock/web"]

[dependencies]
serde_json = { workspace = true, optional = true }
architect = { workspace = true, features = ["local", "platform", "vox"] }
architect-ui = { workspace = true, optional = true }
chatterbox-rs = { git = "https://github.com/bearcove/cbx", optional = true }
chrono = { version = "0.4" }
collection-proto = { workspace = true, features = ["vox"], optional = true }
color-palette = { workspace = true }
crdt = { workspace = true, optional = true, features = ["vox"] }
daw = { workspace = true }
daw-control = { workspace = true, optional = true }
daw-proto = { workspace = true }
daw-standalone = { workspace = true, optional = true }
daw-transport-sync = { workspace = true }
dawfile-reaper = { workspace = true }
dioxus = { workspace = true, optional = true }
dock = { workspace = true, optional = true, features = ["ui"] }
eyre = { workspace = true }
facet = { workspace = true }
files-client = { workspace = true, optional = true }
files-proto = { workspace = true, optional = true }
fts-sample = { workspace = true, features = ["load"] }
futures = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
hound = { version = "3.5" }
keyflow = { workspace = true, features = ["text"] }
keyflow-daw-analysis = { workspace = true }
links-proto = { workspace = true, optional = true }
loro = { workspace = true }
lucide-dioxus = { workspace = true, optional = true }
monarchy = { workspace = true }
music-catalog = { workspace = true }
num-traits = { workspace = true }
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false }
resources-proto = { workspace = true, optional = true }
rustc-hash = { version = "2" }
serde = { workspace = true }
sha2 = { workspace = true }
smallvec = { version = "1.13" }
task-dial = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { version = "1.48", features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
utils = { workspace = true }
uuid = { version = "1", features = ["js", "serde", "v4", "v7"] }
vox = { workspace = true }
vox-core = { workspace = true, optional = true }
vox-types = { workspace = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
session = { path = ".", features = ["engine", "net", "tts", "ui"] }
architect = { workspace = true, features = ["local", "platform", "vox"] }
crdt = { workspace = true, features = ["vox"] }
daw = { workspace = true, features = ["standalone"] }
studio = { workspace = true, features = ["file", "test-harness"] }
daw-control = { workspace = true }
daw-proto = { workspace = true }
daw-standalone = { workspace = true, features = ["audio", "bootstrap", "decode", "rpp-project", "session-file"] }
daw-sync = { workspace = true }
dioxus-test = { workspace = true }
# `open_link`'s empty-state test renders the component to HTML.
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false }
eyre = { workspace = true }
facet-postcard = { workspace = true }
session-format = { workspace = true, features = ["store"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
vox = { workspace = true }
vox-stream = { workspace = true }
vox-websocket = { workspace = true }
zstd = { version = "0.13" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
daw = { workspace = true }
studio = { workspace = true, features = ["file"] }
daw-actions = { workspace = true, optional = true }
daw-reaper = { workspace = true, optional = true }
daw-sync = { workspace = true, optional = true }
dynamic-template = { workspace = true, features = ["reaper"] }
reaper-high = { workspace = true, optional = true }
reaper-low = { workspace = true, optional = true }
reaper-medium = { workspace = true, optional = true }
vox = { workspace = true, features = ["transport-local"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = { workspace = true }
web-sys = { version = "0.3", features = ["Window", "Performance"] }

[[bin]]
name = "session"
path = "src/main.rs"

[[example]]
name = "tts_smoke"
required-features = ["tts"]

[[example]]
name = "doc_edit"
path = "examples/doc_edit.rs"
required-features = ["engine"]

[[example]]
name = "doc_scale"
path = "examples/doc_scale.rs"
required-features = ["engine"]
