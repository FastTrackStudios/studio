[package]
name = "editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The expression editor: piano roll, drum lanes and curves over one document, with its tools, audio, host, painter and panels"

[lints]
workspace = true

[features]
audio = ["dep:align-dsp", "dep:realfft", "dep:tune", "ops", "pitch"]
audio-daw = ["dep:daw", "dep:studio", "dep:fts-sample"]
chords = ["dep:architect-ui", "dep:dioxus", "dep:keyflow", "dep:tracing"]
corpus = ["audio", "dep:clap", "dep:fts-sample", "dep:hound", "dep:midly"]
daw = ["dep:daw", "dep:daw-proto", "dep:studio", "dep:facet-styx", "dep:level", "ops"]
demo = ["dep:daw-proto", "dep:session-format", "guitarpro"]
guitarpro = ["dep:guitarpro"]
host = ["audio", "audio-daw", "dep:daw", "dep:studio", "dep:tracing", "ops"]
host-standalone = ["daw/standalone-save"]
ops = ["dep:rand", "dep:tracing"]
paint = ["dep:anyrender", "dep:daw-ui", "dep:architect-input", "dep:keybinds", "dep:kurbo", "dep:parley", "dep:peniko", "dep:tracing"]
pitch = ["dep:tune"]
reaper = ["audio", "audio-daw", "daw", "dep:daw", "dep:studio", "studio/reaper", "studio/reaper-ui", "dep:dioxus", "dep:tracing", "host", "render", "ui", "ui-host"]
render = ["tune/world"]
standalone = ["audio", "audio-daw", "daw", "dep:daw", "dep:studio", "dep:daw-control", "dep:daw-ui", "dep:dioxus", "dep:dioxus-mcp-probe", "dep:dioxus-native", "dep:eyre", "dep:futures-timer", "dep:regex", "dep:serde_json", "dep:tempfile", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "guitarpro", "host", "host-standalone", "render", "ui", "ui-host"]
ui = ["dep:anyrender", "dep:daw-ui", "dep:dioxus", "dep:architect-input", "dep:keybinds", "dep:kurbo", "dep:level", "dep:parley", "dep:peniko", "dep:tracing", "host", "ops", "paint"]
ui-host = ["host"]
ui-webview = ["dep:anyrender_vello_cpu", "dep:base64", "dep:futures-timer", "dep:png", "dep:serde_json", "dioxus/desktop"]
webview = ["dioxus/desktop", "dioxus/launch", "ui", "ui-webview"]

[dependencies]
timeline = { workspace = true, features = ["actions"] }
align-dsp = { workspace = true, optional = true }
anyrender = { workspace = true, optional = true }
anyrender_vello_cpu = { workspace = true, optional = true }
architect = { workspace = true }
architect-action-derive = { workspace = true }
architect-ui = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
daw = { workspace = true, optional = true, features = ["standalone", "standalone-bootstrap", "standalone-rpp", "standalone-save"] }
studio = { workspace = true, optional = true }
daw-control = { workspace = true, optional = true }
daw-proto = { workspace = true, optional = true }
daw-ui = { workspace = true, optional = true, features = ["web"] }
dioxus = { workspace = true, optional = true }
dioxus-mcp-probe = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }
eyre = { workspace = true, optional = true }
facet = { workspace = true }
facet-styx = { workspace = true, optional = true }
session-format = { workspace = true, optional = true }
fts-sample = { workspace = true, features = ["write"], optional = true }
futures-timer = { workspace = true, optional = true }
guitarpro = { workspace = true, optional = true }
hound = { workspace = true, optional = true }
architect-input = { workspace = true, optional = true }
keybinds = { workspace = true, optional = true }
keyflow = { workspace = true, optional = true }
keyflow-proto = { workspace = true }
kurbo = { workspace = true, optional = true }
level = { workspace = true, optional = true }
midly = { workspace = true, optional = true }
parley = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
png = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
realfft = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tune = { workspace = true, optional = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
editor = { path = ".", features = ["audio", "audio-daw", "chords", "corpus", "daw", "demo", "guitarpro", "host", "ops", "render", "standalone", "ui", "ui-host"] }
anyrender_vello_cpu = { workspace = true }
base64 = { workspace = true }
blitz-traits = { workspace = true }
daw = { workspace = true, features = ["standalone", "standalone-audio"] }
daw-proto = { workspace = true }
studio = { workspace = true, features = ["reaper", "reaper-ui", "test-harness"] }
daw-test-macro = { workspace = true }
dawfile-reaper = { workspace = true }
dioxus = { workspace = true, default-features = true, features = ["desktop", "launch"] }
dioxus-ssr = { workspace = true }
dioxus-test = { workspace = true }
eyre = { workspace = true }
facet-styx = { workspace = true }
keyflow = { workspace = true }
session-format = { workspace = true }
guitarpro = { workspace = true }
hound = { workspace = true }
image = { workspace = true, default-features = false, features = ["bmp"] }
level = { workspace = true }
midly = { workspace = true }
png = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blitz-dom = { workspace = true, features = ["custom-widget"] }
dioxus-native-dom = { workspace = true }

[[bin]]
name = "drum-corpus"
path = "src/bin/expression-editor-corpus.rs"
required-features = ["corpus"]

[[example]]
name = "webview"
required-features = ["standalone", "webview"]

[[example]]
name = "gen_reaper"
path = "examples/gen_reaper.rs"
required-features = ["daw", "demo", "guitarpro"]

[[example]]
name = "calibrate"
path = "examples/calibrate.rs"
required-features = ["audio", "standalone", "ui"]

[[example]]
name = "editor"
path = "examples/editor.rs"
required-features = ["standalone", "ui"]

[[example]]
name = "practice"
path = "examples/practice.rs"
required-features = ["standalone"]

[[example]]
name = "serve"
path = "examples/serve.rs"
required-features = ["standalone", "ui"]

[[example]]
name = "shot"
path = "examples/shot.rs"
required-features = ["standalone"]

[[example]]
name = "stress"
path = "examples/stress.rs"
required-features = ["standalone"]

[[example]]
name = "workstation"
path = "examples/workstation.rs"
required-features = ["standalone"]

[[example]]
name = "workstation_shot"
path = "examples/workstation_shot.rs"
required-features = ["standalone"]

[[example]]
name = "chords_panel"
path = "examples/chords_panel.rs"
required-features = ["chords"]

