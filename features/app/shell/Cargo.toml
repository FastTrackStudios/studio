[package]
name = "app-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "What every FTS app shares around its UI: the in-memory log ring (with the crash log and the flight log), the update check (architect::release), and (feature ui) the studio shell: frame, regions, saved layout, panel registry"

[features]
# The shared studio shell (src/ui): ShellFrame, ShellState, PanelRegistry.
# Renderer-agnostic Dioxus with inline styles only, so it runs on Blitz, a
# WebView and the web alike; the app picks the renderer.
ui = ["dep:dioxus", "dep:dock", "dep:utils"]
# The form factor's publisher on dioxus-native (`ui::form::use_window_screen`):
# the window measured from its own events. Only the Blitz apps turn it on.
native = ["ui", "dep:dioxus-native", "dep:futures-timer"]
# The web apps' runtime config (`web_config`): the fetch of /config.json
# in a page. The parsing is always compiled (and tested natively).
web-config = ["dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dioxus = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }
futures-timer = { workspace = true, optional = true }
# Only the pure registry types (PanelConstraints): no dock features, so no
# WebView, serde or tokio come with it.
dock = { workspace = true, optional = true }
# facet + facet-json: the web config's file (`web_config`), and the shell's
# saved layout (`ui`).
facet = { workspace = true }
facet-json = { workspace = true }
utils = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, optional = true, features = ["Window", "Location", "Request", "RequestInit", "RequestCache", "Response"] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = { workspace = true }
# The flight recorder (ring, crash log, flight log): native only.
architect-telemetry = { workspace = true, features = ["flight"] }

# The update check and install (`updates`): architect's signed self-update
# against the studio repo's GitHub Releases. Desktop only: the web build is
# its deployment and iOS updates through the App Store.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
architect = { workspace = true, features = ["release"] }
# The check runs on its own small runtime (reqwest needs tokio), whatever
# executor the app's UI is on.
tokio = { workspace = true }

# The UIScene lifecycle (`ios_scene`): the objc2 winit itself is built on.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
objc2-ui-kit = { workspace = true, features = ["UIApplication", "UIResponder", "UIScene", "UISceneOptions", "UISceneSession", "UIWindowScene", "UIWindow", "UIView", "UIViewController", "UIScreen", "UIPasteboard", "UIOrientation", "block2"] }
objc2-foundation = { workspace = true, features = ["default", "NSArray", "NSSet", "NSDictionary", "NSString", "NSURL"] }

[dev-dependencies]
# Headless layout + screenshot of the performer screen on blitz-dom
# (tests/performer_screen.rs).
dioxus-test.workspace = true

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dev-dependencies]
# tests/updates.rs: a fake releases feed on 127.0.0.1.
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
# ui::layout's tests: the saved layout's round trip through the prefs format.
facet-styx = { workspace = true }

[[test]]
name = "performer_mounts"
required-features = ["ui"]

[lints]
workspace = true
