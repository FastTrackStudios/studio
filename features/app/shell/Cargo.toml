[package]
name = "app-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "What every FTS app shares around its UI: the in-memory log ring (with the crash log and the flight log), the update check (architect::release), and (feature ui) the studio shell: frame, regions, saved layout, panel registry"

[features]
# The shared studio shell (src/ui): ShellFrame, ShellState, PanelRegistry.
# Renderer-agnostic Dioxus with inline styles only, so it runs on Blitz, a
# WebView and the web alike; the app picks the renderer.
ui = ["dep:dioxus", "dep:dock", "dep:facet", "dep:utils"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dioxus = { workspace = true, optional = true }
# Only the pure registry types (PanelConstraints): no dock features, so no
# WebView, serde or tokio come with it.
dock = { workspace = true, optional = true }
facet = { workspace = true, optional = true }
utils = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
# The flight recorder (ring, crash log, flight log): native only.
architect-telemetry = { workspace = true, features = ["flight"] }

# The update check and install (`updates`): architect's signed self-update
# against the studio repo's GitHub Releases. Desktop only: the web build is
# its deployment and iOS updates through the App Store.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
architect = { workspace = true, features = ["release"] }
# The check runs on its own small runtime (reqwest needs tokio), whatever
# executor the app's UI is on.
tokio = { workspace = true }

# The UIScene lifecycle (`ios_scene`): the objc2 winit itself is built on.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", features = [
    "UIApplication", "UIResponder", "UIScene", "UISceneOptions", "UISceneSession",
    "UIWindowScene", "UIWindow", "UIView", "UIViewController", "UIScreen", "UIPasteboard",
    "UIOrientation", "block2",
] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSSet", "NSDictionary", "NSString", "NSURL"] }

[dev-dependencies]
# Headless layout + screenshot of the performer screen on blitz-dom
# (tests/performer_screen.rs).
dioxus-test.workspace = true

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dev-dependencies]
# tests/updates.rs: a fake releases feed on 127.0.0.1.
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
