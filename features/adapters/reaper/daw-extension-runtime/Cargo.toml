[package]
name = "daw-extension-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Integrated REAPER extension runtime helpers"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
# Depend on internal crates directly so `daw` can re-export this crate
# under `daw::extension_runtime` without a dependency cycle.
# `platform::spawn` — the wasm-cfg-split task seam, used to park the
# action-broadcast bridge for the life of the extension.
architect = { workspace = true }
daw-control = { workspace = true }
daw-module = { workspace = true }
daw-proto = { workspace = true }
daw-reaper = { workspace = true, default-features = true }
vox.workspace = true
eyre = "0.6"
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
crossbeam-channel.workspace = true
reaper-high.workspace = true
reaper-low.workspace = true
reaper-medium.workspace = true

[lints]
workspace = true
