[package]
name = "signal-extension"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Signal domain in-process REAPER extension (cdylib)"

[lib]
crate-type = ["cdylib", "rlib"]
name = "reaper_signal_extension"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Signal's commands on an Action List (src/commands.rs).
architect = { workspace = true, features = ["action-list"] }
daw = { workspace = true }
studio = { workspace = true, features = ["reaper"] }
daw-extension-runtime.workspace = true
signal-macromod.workspace = true
signal.workspace = true
fragile = { workspace = true }
# reaper-rs (GitHub, the workspace entry) — must match daw's source so the
# graph has ONE reaper_low instance. (Was starcommand.live → two copies → type
# mismatch in `daw[reaper]` + this crate's reaper_low.)
reaper-low = { workspace = true }
reaper-macros = { workspace = true }
tokio = { workspace = true, features = ["time", "net", "rt"] }
eyre.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
signal = { workspace = true, features = ["daw"] }
daw = { workspace = true }
studio = { workspace = true, features = ["file", "test-harness"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
eyre.workspace = true
