[package]
name = "swell-ui"
version = "0.1.0"
authors = ["Benjamin Klum <benjamin.klum@helgoboss.org>", "FastTrack Studio"]
edition = "2021"
publish = false
# Kept from reaper-lib, where it lived until 2026-10 (see README.md).
license = "MIT OR Apache-2.0"
description = "Typed Window/Hwnd wrappers around REAPER's SWELL"

[dependencies]
reaper-medium.workspace = true
reaper-low.workspace = true
reaper-common-types = { git = "https://github.com/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes", features = ["palette"] }
rxrust = { git = "https://github.com/rxRust/rxRust", rev = "349e50b3197e05926e2378ef8fc45cb67ad43b83" }
scopeguard = "1.1.0"
raw-window-handle = "0.4.2"
tracing.workspace = true
fragile.workspace = true
palette.workspace = true

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "uxtheme"] }
libloading = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
