[package]
name = "reaper-dioxus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Dioxus-native overlay rendering for REAPER extensions (internal — access via daw facade with reaper-ui feature)"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
reaper-embed = { workspace = true }

# Module-system primitives (PanelDef, DockPosition). Leaf crate — does NOT
# pull in the daw facade, avoiding the daw <-> reaper-dioxus cycle.
daw-module = { workspace = true }

# DockHostService trait + DockHandle/DockEvent types
daw-proto = { workspace = true }
architect = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
thiserror.workspace = true

# REAPER API access
reaper-low.workspace = true
reaper-medium.workspace = true
reaper-high.workspace = true

# Dioxus-native with blitz rendering
dioxus-native.workspace = true
blitz-dom.workspace = true
blitz-paint.workspace = true
blitz-traits.workspace = true

# Rendering pipeline
anyrender_vello.workspace = true
vello.workspace = true

# Hot reload (enabled by default for dev, disable for release)
dioxus-devtools = { workspace = true, optional = true }

# Event types for forwarding input to Blitz
keyboard-types = { workspace = true }

# Utilities
futures-util = "0.3"
crossbeam = { workspace = true }
raw-window-handle = { workspace = true }
tracing.workspace = true

[features]
default = ["hot-reload"]
hot-reload = ["dep:dioxus-devtools"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
x11-dl = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa.workspace = true
objc.workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "allow"


[lints.rustdoc]
broken_intra_doc_links = "allow"
