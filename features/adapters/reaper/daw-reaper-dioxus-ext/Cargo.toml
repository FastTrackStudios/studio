[package]
name = "daw-reaper-dioxus-ext"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "REAPER extension providing reaper-dioxus rendering as a service (cdylib loaded into REAPER as `reaper_daw_dioxus.so`)"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
crate-type = ["cdylib"]
name = "reaper_daw_dioxus"
path = "src/lib.rs"
test = false

[dependencies]
daw = { workspace = true }
studio = { workspace = true, features = ["reaper", "reaper-ui"] }
daw-extension-runtime.workspace = true
daw-module = { workspace = true }
reaper-dioxus = { workspace = true }
daw-ui = { workspace = true, features = ["reaper-test-panels"] }
crossbeam-channel = "0.5"
eyre = "0.6"
fragile.workspace = true
vox.workspace = true
reaper-low.workspace = true
reaper-high.workspace = true
reaper-macros = { git = "https://codeberg.org/FastTrackStudios/reaper-rs.git", branch = "feat/reaper-763-ruler-lanes" }
# The action-dispatch channel's receiver type.
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "allow"


[lints.rustdoc]
broken_intra_doc_links = "allow"
