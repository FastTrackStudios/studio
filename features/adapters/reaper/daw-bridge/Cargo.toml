[package]
name = "daw-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
crate-type = ["cdylib"]
name = "reaper_daw_bridge"
path = "src/lib.rs"

[dependencies]
# DAW facade (REAPER impl). The UI host is provided by the pinned direct
# reaper-dioxus dependency below so local dioxus work cannot break bridge.
daw = { workspace = true }
studio = { workspace = true, features = ["reaper"] }
# Direct dep so we can construct ReaperDockHost in plugin_main.
reaper-dioxus = { workspace = true }
daw-proto = { workspace = true }
daw-audio-sync = { workspace = true }
uuid = { workspace = true }

# RT-aware allocator
daw-allocator.workspace = true

# ROAM service framework
vox.workspace = true
vox-stream.workspace = true
architect = { workspace = true, features = ["vox"] }

# Async runtime
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }

# REAPER bindings
reaper-high.workspace = true
reaper-medium.workspace = true
reaper-low.workspace = true
reaper-macros.workspace = true

# Main thread dispatch
crossbeam-channel.workspace = true
fragile.workspace = true

# Project file import (Ableton/ProTools/AAF/DAWproject → REAPER conversion)
protools = { workspace = true }
ableton = { workspace = true }
interchange = { workspace = true, features = ["aaf", "dawproject"] }
dawfile-reaper = { workspace = true }

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
eyre = "0.6"

# Sync stack — engine + peer mesh. Default-on so reaper-test multi-instance
# tests have the runtime available; production users that don't want it can
# disable the feature.
daw-sync = { workspace = true, optional = true, features = ["network"] }

[features]
default = ["sync"]
sync = ["dep:daw-sync", "daw-sync?/network"]

[dev-dependencies]
eyre = "0.6"
# Integration-test harness via the daw facade's `test-harness` feature
# (replaces the former `reaper-test` crate).
daw = { workspace = true }
studio = { workspace = true, features = ["reaper", "test-harness"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
