[package]
name = "logic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Logic Pro projects (.logicx): reading them into the daw's project model"

[lints]
workspace = true

[dependencies]
daw-proto = { workspace = true }
plist = { version = "1" }
