[package]
name = "midicore-ui"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true

# midicore's Dioxus display half: a reusable MIDI-monitor panel that renders
# `midicore::MidiEvent`s (colour-coded by `MidiKind`, formatted via their
# `Display`). wasm-clean — no audio backend, no platform I/O — so any rig's
# remote GUI (guitar, drums, …) can drop it in.

[dependencies]
dioxus.workspace = true
midicore-proto.workspace = true
