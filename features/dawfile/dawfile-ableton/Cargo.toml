[package]
name = "dawfile-ableton"
version = "0.1.0"
edition = "2024"
description = "Ableton Live set file parser (.als, .adg) — pure Rust, cross-platform"
license = "GPL-3.0-or-later"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
thiserror = { workspace = true }

# Domain types for conversion to daw-proto
daw-proto = { workspace = true }

# Gzip decompression (Ableton files are gzipped XML)
flate2 = "1"

# Fast, zero-allocation XML DOM parser (read path)
roxmltree = "0.20"

# XML writer (write path)
quick-xml = "0.37"

[lints]
workspace = true
