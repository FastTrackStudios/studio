[package]
name = "daw-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Keeping DAWs in sync: the backend-agnostic sync engine and drift corrector, the TCP peer mesh (network) and the Ableton Link adapter (link)"

[lints]
workspace = true

[features]
link = ["dep:rusty_link"]
network = ["dep:facet-postcard", "tokio/io-util", "tokio/net"]

[dependencies]
daw = { workspace = true }
facet = { workspace = true }
facet-postcard = { workspace = true, optional = true }
rusty_link = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7" }
tracing = { workspace = true }

[dev-dependencies]
# Its own tests, with the features they need: a plain `cargo test` of the
# workspace builds them all.
daw-sync = { path = ".", features = ["link", "network"] }
daw = { workspace = true }
eyre = { workspace = true }
studio = { workspace = true, features = ["reaper", "test-harness"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

