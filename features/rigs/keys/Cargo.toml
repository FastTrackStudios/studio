[package]
name = "keys"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The keys rig: pianos, organs, keyboards, and its editor"

[lints]
workspace = true

[features]
default = ["vox"]
pipewire = []
ui = ["dep:dioxus", "dep:fts-audio-ui", "midi/ui", "dep:signal-browser", "signal-widgets/piano", "dep:signal-widgets", "architect/atom", "architect/platform"]
vox = ["architect/vox", "dep:vox"]

[dependencies]
architect = { workspace = true, features = ["rig", "vox"] }
architect-telemetry = { workspace = true }
daw = { workspace = true }
audio = { workspace = true, features = ["io", "monitor"] }
dioxus = { workspace = true, optional = true }
eyre = { workspace = true }
facet = { workspace = true }
facet-json = { workspace = true }
facet-styx = { workspace = true }
fts-audio-ui = { workspace = true, optional = true }
midi = { workspace = true, features = ["midir", "ui", "vox"] }
signal-browser = { workspace = true, default-features = false, optional = true }
signal-plugin-host = { workspace = true }
signal-proto = { workspace = true }
signal-rig-host = { workspace = true }
signal-rigs-proto = { workspace = true }
sampler = { workspace = true }
synth = { workspace = true }
signal-widgets = { workspace = true, optional = true }
tracing = { workspace = true }
vox = { workspace = true, optional = true }

# The workspace tokio is `full`; on wasm only sync/macros/io-util/rt/time
# exist (mio has no wasm backend), so the browser keys rig gets its own line.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.48", default-features = false, features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
eyre = { workspace = true }
fts-sample = { workspace = true }
libc = { workspace = true }
ratatui = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { workspace = true }
vox-core = { workspace = true }
vox-websocket = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
midi = { workspace = true, features = ["midir", "pipewire", "vox"] }
