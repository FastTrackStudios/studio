[package]
name = "keys"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The keys rig: pianos, organs, keyboards, and its editor"

[lints]
workspace = true

[features]
default = ["vox"]
pipewire = []
ui = ["dep:dioxus", "dep:fts-chrome", "dep:midicore-ui", "dep:signal-browser", "dep:signal-ui", "dep:signal-widgets"]
vox = ["architect/vox", "dep:vox"]

[dependencies]
architect = { workspace = true, features = ["atom", "platform", "rig", "vox"] }
architect-telemetry = { workspace = true }
daw = { workspace = true }
audio = { workspace = true, features = ["io", "monitor"] }
dioxus = { workspace = true, optional = true }
eyre = { workspace = true }
facet = { workspace = true }
facet-json = { workspace = true }
facet-styx = { workspace = true }
fts-chrome = { workspace = true, optional = true }
midicore = { workspace = true, features = ["vox", "midir"] }
midicore-proto = { workspace = true }
midicore-ui = { workspace = true, optional = true }
signal-browser = { workspace = true, default-features = false, optional = true }
signal-plugin-host = { workspace = true }
signal-proto = { workspace = true }
signal-rig-host = { workspace = true }
signal-rigs-proto = { workspace = true }
sampler = { workspace = true }
signal-synth = { workspace = true }
signal-ui = { workspace = true, features = ["web"], optional = true }
signal-widgets = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
vox = { workspace = true, optional = true }

[dev-dependencies]
eyre = { workspace = true }
fts-sample = { workspace = true }
libc = { version = "0.2" }
ratatui = { version = "0.30" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { workspace = true }
vox-core = { workspace = true }
vox-websocket = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
midicore = { workspace = true, features = ["vox", "midir", "pipewire"] }
