[package]
name = "synth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The synth rig: its engines and its editor"

[lints]
workspace = true

[features]
default = ["vox"]
ui = ["dep:dioxus", "dep:fts-chrome", "midi/ui", "dep:signal-ui", "dep:signal-widgets"]
vox = ["architect/vox", "dep:vox"]

[dependencies]
architect = { workspace = true, features = ["atom", "platform", "vox"] }
dioxus = { workspace = true, optional = true }
facet = { workspace = true }
facet-styx = { workspace = true }
flate2 = { version = "1" }
fts-chrome = { workspace = true, optional = true }
midi = { workspace = true, features = ["ui"] }
sampler = { workspace = true }
signal-proto = { workspace = true }
signal-ui = { workspace = true, features = ["web"], optional = true }
signal-widgets = { workspace = true, optional = true }
tracing = { workspace = true }
vox = { workspace = true, optional = true }

[dev-dependencies]
daw = { workspace = true }
facet-styx = { workspace = true }
signal-plugin-host = { workspace = true }
song = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
