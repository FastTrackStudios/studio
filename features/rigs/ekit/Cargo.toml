[package]
name = "ekit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The electronic-kit rig, and its editor"

[lints]
workspace = true

[features]
default = ["vox"]
pipewire = []
ui = ["dep:dioxus", "architect/atom", "architect/platform"]
vox = ["architect/vox", "dep:vox"]

[dependencies]
architect = { workspace = true, features = ["rig", "vox"] }
daw = { workspace = true }
dioxus = { workspace = true, optional = true }
facet = { workspace = true }
midi = { workspace = true, features = ["midir", "vox"] }
signal-rigs-proto = { workspace = true }
# Its own saved kits, profiles, songs and setlists (apart from the other
# rigs'), and the shared performance surface answered from them.
signal-rig-perform-store = { workspace = true }
signal-rig-host = { workspace = true }
sampler = { workspace = true }
signal-space = { workspace = true, features = ["engine"] }
tracing = { workspace = true }
vox = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
# perform_rpc: the shared performance surface served in-process.
architect = { workspace = true, features = ["vox", "local"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
midi = { workspace = true, features = ["midir", "pipewire", "vox"] }

[lib]
# No #[test] in it: skip building and linking an empty test harness.
test = false
