[package]
name = "ekit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The electronic-kit rig, and its editor"

[lints]
workspace = true

[features]
default = ["vox"]
pipewire = []
ui = ["dep:dioxus"]
vox = ["architect/vox", "dep:vox"]

[dependencies]
architect = { workspace = true, features = ["atom", "platform", "rig", "vox"] }
daw = { workspace = true }
dioxus = { workspace = true, optional = true }
facet = { workspace = true }
midicore = { workspace = true, features = ["vox", "midir"] }
signal-rigs-proto = { workspace = true }
signal-sampler = { workspace = true }
signal-space = { workspace = true }
tracing = { workspace = true }
vox = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
midicore = { workspace = true, features = ["vox", "midir", "pipewire"] }
