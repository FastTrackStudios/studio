[package]
name = "ekit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The electronic-kit rig, and its editor"

[lints]
workspace = true

[features]
default = ["vox"]
pipewire = []
ui = ["dep:dioxus", "architect/atom", "architect/platform"]
vox = ["architect/vox", "dep:vox"]

[dependencies]
architect = { workspace = true, features = ["rig", "vox"] }
daw = { workspace = true }
dioxus = { workspace = true, optional = true }
facet = { workspace = true }
midi = { workspace = true, features = ["midir", "vox"] }
signal-rigs-proto = { workspace = true }
sampler = { workspace = true }
signal-space = { workspace = true, features = ["engine"] }
tracing = { workspace = true }
vox = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
midi = { workspace = true, features = ["midir", "pipewire", "vox"] }
