[package]
name = "drums"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The drum rig: kits, samples, triggers, and its editor"

[lints]
workspace = true

[features]
default = ["vox"]
pipewire = []
ui = ["dep:dioxus", "dep:midicore-ui", "dep:signal-ui"]
vox = ["architect/vox", "dep:vox"]

[dependencies]
architect = { workspace = true, features = ["atom", "platform", "rig", "vox"] }
control-surfaces = { workspace = true, features = ["kontrol"] }
daw = { workspace = true }
dioxus = { workspace = true, optional = true }
facet = { workspace = true }
builtin = { workspace = true }
midicore = { workspace = true, features = ["vox", "midir", "native"] }
midicore-proto = { workspace = true }
midicore-ui = { workspace = true, optional = true }
signal-plugin-host = { workspace = true }
signal-rig-host = { workspace = true }
signal-rigs-proto = { workspace = true }
signal-sampler = { workspace = true }
signal-space = { workspace = true }
signal-ui = { workspace = true, features = ["web"], optional = true }
tracing = { workspace = true }
vox = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
midicore = { workspace = true, features = ["vox", "midir", "pipewire"] }
