[package]
name = "themer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The theme editor"

[lints]
workspace = true

[features]
default = ["cli"]
apply = ["fs"]
cli = ["apply", "dep:clap", "fs", "generate", "shot"]
fs = ["dep:image"]
generate = ["apply", "daw-ui/render", "dep:dioxus"]
shot = ["studio/test-harness", "dep:daw", "dep:studio", "fs"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, optional = true }
daw = { workspace = true, optional = true }
studio = { workspace = true, optional = true }
daw-ui = { workspace = true }
dioxus = { workspace = true, optional = true, features = ["lib"] }
image = { workspace = true, optional = true }
palette = { workspace = true }
serde = { workspace = true }

[[bin]]
name = "fts-themer"
path = "src/bin/fts-themer.rs"
required-features = ["cli"]
