[package]
name = "plugin-faces"
description = "Hardware-style plugin faces (compressors, EQs, delays, reverbs, saturation, modulation) built from the surface kit — written out as frame markup + catalogs."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
frame = { path = "../../../crates/frame", features = ["io", "render", "runtime"] }
serde_json = { workspace = true }
uuid = { workspace = true }
# frame's skrifa, not the workspace's: the font handles come from frame
# (`Face::font`), which is on the vello 0.10 stack.
skrifa = "0.26"

[dev-dependencies]
frame = { path = "../../../crates/frame", features = ["anyrender", "design", "render", "runtime"] }
# `tests/frame_assets.rs`: a face loaded from disk renders like the one in memory.
kurbo = { workspace = true }

[lints]
workspace = true
