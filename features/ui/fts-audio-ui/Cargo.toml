[package]
name = "fts-audio-ui"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
description = "FastTrack Studio audio widget kit — Dioxus port of iced_audio (knobs, sliders, XY pads, meters)"

[lints]
workspace = true

[features]
default = []
nih-plug = []
probe = ["dep:pollster", "shader"]
shader = ["dep:bytemuck", "dep:vello", "dep:wgpu", "dep:wgpu-context-06", "dep:wgpu-context-07"]

[dependencies]
anyrender = { workspace = true }
architect-ui = { workspace = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
dioxus = { workspace = true }
dsp-core = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
pollster = { version = "0.4", optional = true }
tracing = { workspace = true }
vello = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
wgpu-context-06 = { package = "wgpu_context", version = "0.6", optional = true }
wgpu-context-07 = { package = "wgpu_context", version = "0.7", optional = true }

[dev-dependencies]
dioxus-test = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyrender_vello = { workspace = true }
blitz-dom = { workspace = true, features = ["custom-widget"] }
blitz-traits = { workspace = true }
dioxus-native-dom = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
anyrender_vello = { workspace = true }
gloo-timers = { workspace = true, features = ["futures"] }
vello = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "HtmlCanvasElement", "Performance", "Window"] }
wgpu = { workspace = true }
wgpu-context-07 = { package = "wgpu_context", version = "0.7" }
