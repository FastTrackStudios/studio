[package]
name = "daw-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The DAW's views: mixer, track panel, arrangement, FX browser, and their theme"

[lints]
workspace = true

[features]
default = ["render", "web"]
hierarchy = ["web", "audio-controls/hierarchy"]
native = ["dep:dioxus-native", "audio-controls/native"]
playground = ["dioxus/launch", "dioxus/web", "reaper-theme", "web"]
reaper-test-panels = ["dep:architect-ui", "dep:daw-module", "dep:reaper-dioxus", "web"]
reaper-theme = ["dep:image", "dep:thiserror"]
render = ["dep:dioxus-ssr", "dep:image", "dep:resvg"]
studio = ["web"]
web = ["dep:architect-input", "dep:keybinds", "dep:tracing", "dock/ui", "dock/web"]

[dependencies]
# The widgets, layout core and theme model (re-exported as daw_ui::{core,
# widgets, theming}).
audio-controls = { workspace = true }
architect = { workspace = true }
architect-ui = { workspace = true, optional = true }
daw-control = { workspace = true }
daw-module = { workspace = true, optional = true }
daw-proto = { workspace = true }
reaper-dioxus = { workspace = true, optional = true }
dioxus = { workspace = true, features = ["lib"] }
dioxus-native = { workspace = true, optional = true }
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false, optional = true }
dock = { workspace = true, features = ["ui"] }
eyre = { workspace = true }
facet = { workspace = true }
facet-styx = { workspace = true }
futures-timer = { version = "3" }
image = { workspace = true, optional = true, features = ["png"] }
architect-input = { workspace = true, optional = true, features = ["dioxus"] }
keybinds = { workspace = true, optional = true }
resvg = { version = "0.45", optional = true }
thiserror = { workspace = true, optional = true }
tokio = { version = "1", features = ["time"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
daw-ui = { path = ".", features = ["reaper-theme", "render"] }
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false }
dioxus-test = { workspace = true }
image = { workspace = true }
resvg = { version = "0.45" }
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2" }
web-sys = { version = "0.3", features = ["Window", "Document", "MouseEvent", "EventTarget", "Location"] }

[[example]]
name = "playground"
required-features = ["playground"]

[[example]]
name = "contact"
required-features = ["render"]

[[example]]
name = "fidelity"
required-features = ["render"]

[[example]]
name = "analyse"
required-features = ["render"]

[[example]]
name = "codegen"
required-features = ["render"]

[[example]]
name = "diffone"
required-features = ["render"]

[[example]]
name = "controls"
required-features = ["render"]

[[example]]
name = "vectors"
required-features = ["render"]

[[example]]
name = "compare_sheet"
required-features = ["render"]

[[example]]
name = "roundtrip"
required-features = ["render"]

[[test]]
name = "antitheme"
path = "tests/antitheme.rs"
required-features = ["reaper-theme"]

[[test]]
name = "corpus"
path = "tests/corpus.rs"
required-features = ["reaper-theme"]

[[example]]
name = "audit_markers"
path = "examples/audit_markers.rs"
required-features = ["reaper-theme"]

[[example]]
name = "dump_margins"
path = "examples/dump_margins.rs"
required-features = ["reaper-theme"]

[[example]]
name = "dump_slices"
path = "examples/dump_slices.rs"
required-features = ["reaper-theme"]

[[example]]
name = "eval_antitheme"
path = "examples/eval_antitheme.rs"
required-features = ["reaper-theme"]

[[example]]
name = "eval_snippet"
path = "examples/eval_snippet.rs"
