[package]
name = "plugin-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "What every FTS plugin is built on: nice-plug's prelude, the editor state, and the shared plugin UI"

[lints]
workspace = true

[features]
default = ["gui"]
editor = ["gui", "dep:architect-ui", "dep:atomic_float", "dep:dioxus", "dep:fts-audio-ui", "dep:nice-plug-dioxus"]
gui = ["dep:nice-plug-dioxus", "dep:parking_lot"]
meters = ["dep:dsp-core", "dep:nice-plug-dioxus", "dep:parking_lot"]

[dependencies]
architect-ui = { workspace = true, optional = true }
atomic_float = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true }
dsp-core = { workspace = true, features = ["meter"], optional = true }
fts-audio-ui = { workspace = true, optional = true }
nice-plug = { workspace = true }
nice-plug-dioxus = { workspace = true, optional = true }
parking_lot = { version = "0.12", optional = true }

[lib]
# No #[test] in it: skip building and linking an empty test harness.
test = false
