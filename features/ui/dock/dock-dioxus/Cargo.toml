[package]
name = "dock-dioxus"
description = "Dock Dioxus — modular docking layout UI components"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move workspace edition; migrate deliberately
license.workspace = true

[dependencies]
dock-proto.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tracing = { workspace = true, optional = true }
tokio = { version = "1.48", features = ["time"] }

# UI framework (conditional on feature)
dioxus = { workspace = true, optional = true }

[features]
default = ["web"]
web = ["dep:dioxus", "dep:tracing"]
native = ["dioxus/desktop"]

[lints]
workspace = true
