[package]
name = "lyrics-ui"
description = "Session's lyrics panel (Audience, Performer and Confidence Monitor views) and the lyrics model it draws (lines against the song's sections, slides): Dioxus only, so Session's window, the setlists song workspace and Studio's share-page island draw the same view from one source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The panel (`view`): Dioxus. Without it, the model alone (Session's
# engine reads and stamps lyrics with no UI).
view = ["dep:dioxus", "dep:futures-channel", "dep:futures-util", "dep:web-time", "dep:wasm-bindgen-futures", "dep:gloo-timers"]
# `Lyrics::from_lrc`: timed lines from a synced `.lrc`, read by Keyflow's
# parser (Session's; the share-page island is handed lines, not a file).
lrc = ["dep:keyflow"]

[dependencies]
dioxus = { workspace = true, optional = true }
futures-channel = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }
keyflow = { workspace = true, optional = true, features = ["text", "engraver"] }

# The panel's tick on a page (no threads there): the browser's timer.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }

[lints]
workspace = true
