[package]
name = "song-file"
description = "A song as one file, `<Title>.session`: the engine's project, the session's timing, charts, cues and patch changes, and arrangements as branches, in one Turso store; and the converter that folds the old pair (`.session` + `.fts-session`) into it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
# `song-file convert <folder>…`, `song-file inspect <file>`.
name = "song-file"
path = "src/main.rs"

[dependencies]
session-format = { workspace = true, features = ["store", "sync", "read"] }
fts-session = { workspace = true }
crdt = { workspace = true }
loro = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
# The old pair goes to the desktop's Trash (freedesktop on Linux), never
# deleted.
trash = "5"

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
