[package]
name = "expression-editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The expression editor: piano roll, drum lanes and curves over one document, with its tools, audio, host, painter and panels"

[lints]
workspace = true

[features]
audio = ["dep:align-dsp", "dep:realfft", "dep:tune", "ops", "pitch"]
audio-daw = ["dep:daw", "dep:fts-sample"]
corpus = ["audio", "dep:clap", "dep:fts-sample", "dep:hound", "dep:midly"]
daw = ["dep:daw", "dep:facet-styx", "dep:level", "ops"]
demo = ["dep:daw-proto", "dep:formats", "guitarpro"]
guitarpro = ["dep:guitarpro"]
host = ["audio", "audio-daw", "dep:daw", "dep:tracing", "ops"]
host-standalone = ["daw/standalone-save"]
ops = ["dep:rand", "dep:tracing"]
paint = ["dep:anyrender", "dep:daw-ui", "dep:input", "dep:kurbo", "dep:parley", "dep:peniko", "dep:tracing"]
pitch = ["dep:tune"]
reaper = ["audio", "audio-daw", "daw", "dep:daw", "dep:dioxus", "dep:tracing", "host", "render", "ui", "ui-host"]
render = ["tune/world"]
standalone = ["audio", "audio-daw", "daw", "dep:daw", "dep:daw-control", "dep:daw-ui", "dep:dioxus", "dep:dioxus-mcp-probe", "dep:dioxus-native", "dep:eyre", "dep:futures-timer", "dep:regex", "dep:serde_json", "dep:tempfile", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "guitarpro", "host", "host-standalone", "render", "ui", "ui-host"]
ui = ["dep:anyrender", "dep:daw-ui", "dep:dioxus", "dep:input", "dep:kurbo", "dep:level", "dep:parley", "dep:peniko", "dep:tracing", "host", "ops", "paint"]
ui-host = ["host"]
ui-webview = ["dep:anyrender_vello_cpu", "dep:base64", "dep:futures-timer", "dep:png", "dep:serde_json", "dioxus/desktop"]
webview = ["dioxus/desktop", "dioxus/launch", "ui", "ui-webview"]

[dependencies]
adaptive-grid = { workspace = true }
align-dsp = { workspace = true, optional = true }
anyrender = { workspace = true, optional = true }
anyrender_vello_cpu = { workspace = true, optional = true }
architect = { workspace = true }
architect-action-derive = { workspace = true }
base64 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
daw = { workspace = true, optional = true, features = ["reaper", "reaper-ui", "standalone", "standalone-bootstrap", "standalone-rpp", "standalone-save"] }
daw-control = { workspace = true, optional = true }
daw-proto = { workspace = true, optional = true }
daw-ui = { workspace = true, optional = true, features = ["web"] }
dioxus = { workspace = true, optional = true }
dioxus-mcp-probe = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }
eyre = { workspace = true, optional = true }
facet = { workspace = true }
facet-styx = { workspace = true, optional = true }
formats = { workspace = true, features = ["session"], optional = true }
fts-sample = { workspace = true, features = ["write"], optional = true }
futures-timer = { version = "3", optional = true }
guitarpro = { version = "=0.4.2", optional = true }
hound = { version = "3.5", optional = true }
input = { workspace = true, optional = true }
keyflow-proto = { workspace = true }
kurbo = { workspace = true, optional = true }
level = { workspace = true, optional = true }
midly = { version = "0.5", optional = true }
parley = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
png = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
razor = { workspace = true }
realfft = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tune = { workspace = true, optional = true }
view-gestures = { workspace = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
expression-editor = { path = ".", features = ["audio", "audio-daw", "corpus", "daw", "demo", "guitarpro", "host", "ops", "render", "standalone", "ui", "ui-host"] }
anyrender_vello_cpu = { workspace = true }
base64 = { workspace = true }
blitz-traits = { workspace = true }
daw = { workspace = true, features = ["reaper", "reaper-ui", "standalone", "standalone-audio", "test-harness"] }
daw-test-macro = { workspace = true }
dawfile-reaper = { workspace = true }
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false }
dioxus-test = { workspace = true }
eyre = { workspace = true }
facet-styx = { workspace = true }
formats = { workspace = true, features = ["session"] }
guitarpro = { version = "=0.4.2" }
hound = { version = "3.5" }
image = { workspace = true, default-features = false, features = ["bmp"] }
level = { workspace = true }
midly = { version = "0.5" }
png = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blitz-dom = { workspace = true, features = ["custom-widget"] }
dioxus-native-dom = { workspace = true }

