[package]
name = "arrangement-view"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Studio's arrangement, a view only: the recorded scene, its widget and panel, the editing, the ruler, the automation lanes and the Organize tools over daw-view-kit's base."

[dependencies]
# The kit the arrangement is drawn with (`crate::tcp`, `crate::skin`, …,
# re-exported at this crate's root).
session-ui = { workspace = true }
session-engine-client = { workspace = true }
session-engine = { workspace = true, optional = true }
dioxus = { workspace = true, features = ["hooks", "signals", "macro", "html"] }
daw-ui = { workspace = true, features = ["studio"] }
blitz-dom = { workspace = true }
blitz-traits = { workspace = true }
dioxus-native-dom = { workspace = true }
dioxus-native = { workspace = true, optional = true }
daw-control = { workspace = true }
daw-proto = { workspace = true }
session = { workspace = true, features = ["library", "ui", "web"] }
# The chord items' numbers and names — `arrangement::Lettering`.
keyflow = { workspace = true, features = ["text", "engraver"] }
dynamic-template = { workspace = true }
# The rides an automation lane edits (`automation_edit`).
dsp = { workspace = true, features = ["level"] }
# The album's plan and the room's profile, behind the Patch List view.
patch-list = { workspace = true, optional = true }
architect-input = { workspace = true }
keybinds = { workspace = true }
editor = { workspace = true, features = ["audio", "audio-daw", "daw", "paint"] }
frame = { workspace = true, features = ["host-scene", "live", "theme"] }
daw = { workspace = true }
studio = { workspace = true }
anyrender = { workspace = true }
# The Patch List's picture (`patch_list::shot`).
anyrender_vello = { workspace = true, optional = true }
vello = "0.11"
timeline = { workspace = true, features = ["actions"] }
winit = { version = "0.31.0-beta.4", optional = true }
web-time = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }
web-sys = { workspace = true, optional = true, features = ["Window", "HtmlElement", "CssStyleDeclaration"] }
wasm-bindgen-futures = { workspace = true, optional = true }
rustc-hash = { workspace = true }
num-traits = { workspace = true }
editing = { workspace = true }
serde_json = { workspace = true }
facet-json = { workspace = true }

[features]
default = ["native"]
# session-ui's features, forwarded, with what the arrangement's own code
# needs.
native = ["session-ui/native", "session-engine-client/native", "dep:dioxus-native", "dep:winit", "dep:anyrender_vello", "dep:patch-list"]
web = ["session-ui/web", "session-engine-client/web", "dioxus/web", "dep:web-sys", "dep:wasm-bindgen-futures"]
engine = ["session-ui/engine", "dep:session-engine"]
signal = ["native", "session-ui/signal"]

[dev-dependencies]
session-ui = { workspace = true, features = ["test-support"] }
session-engine = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
