[package]
name = "preset-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Presets: storage, browsing, and its panel"

[lints]
workspace = true

[features]
ui = ["dep:dioxus", "dep:fts-audio-ui"]

[dependencies]
dioxus = { workspace = true, optional = true }
fts-audio-ui = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Its own tests and examples, with the features they need (see their
# required-features): a plain `cargo test` of the workspace builds them all.
preset-browser = { path = ".", features = ["ui"] }
dioxus = { workspace = true }
dioxus-test = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

