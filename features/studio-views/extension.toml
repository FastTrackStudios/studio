# Studio's views in Architect (src/lib.rs, studio#409): the Views
# toolbar at the bottom of the window, as the Studio iPad app's bottom bar
# has it. Each button is an action of this extension: it opens or focuses
# its view as a pane of the workspace and is lit while that view is
# focused (a toggle; STUDIO_VIEWS_FOLLOW writes its state on every
# workspace.changed). A view that is not there yet keeps its button and
# refuses with the reason. One Rust value (`studio_views::ext::StudioViews`)
# runs it two ways: compiled into Studio Architect (the `studio` bundle),
# and as the program the Architect app runs (src/main.rs, [entry]).
id = "studio-views"
name = "Studio"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "Studio's views and the toolbar that opens them: Arrangement, Mixer, Chart, Chart Editor, Progress Bar and Editor, as the buttons of a bar at the bottom of the window, each lit while its view is focused."
authors = ["FastTrackStudios"]

[entry]
# The program: bin/<target-triple>/studio-views in a released archive
# (unpacked to bin/ for this platform); for a development copy, put a
# build there (`cargo build -p studio-views --features extension --bin
# studio-views`).
path = "bin/studio-views"

[source]
git = "https://github.com/FastTrackStudios/studio"
rev = "main"
path = "features/studio-views"

[capabilities]
# Opening a view; which view is focused, to light its button; a
# notification saying why a view is not there.
actions = ["EXT_VIEW_OPEN"]
effect = "mutating"
reads = ["selection"]
ui = ["notify"]

[[actions]]
id = "STUDIO_VIEWS_ARRANGEMENT"
name = "Show Arrangement"
description = "The Arrangement, with its track control panel: opened or focused as a pane. Needs Studio's engine (the Full layer); until it runs here, it refuses and says so."
group = "Views"
effect = "mutating"
toggle = true

[[actions]]
id = "STUDIO_VIEWS_MIXER"
name = "Show Mixer"
description = "The Mixer: opened or focused as a pane. Needs Studio's engine (the Full layer); until it runs here, it refuses and says so."
group = "Views"
effect = "mutating"
toggle = true

[[actions]]
id = "STUDIO_VIEWS_CHART"
name = "Show Chart"
description = "The song's engraved chart: opened or focused as a pane. A panel of the song workspace (studio#408) until it is a view of its own; until then it refuses and says so."
group = "Views"
effect = "mutating"
toggle = true

[[actions]]
id = "STUDIO_VIEWS_CHART_EDITOR"
name = "Show Chart Editor"
description = "The chart's Keyflow source in the editor: opened or focused as a pane. A panel of the song workspace (studio#408) until it is a view of its own; until then it refuses and says so."
group = "Views"
effect = "mutating"
toggle = true

[[actions]]
id = "STUDIO_VIEWS_PROGRESS"
name = "Show Progress Bar"
description = "The song's progress bar: its sections and the playhead. A panel of the song workspace (studio#408) until it is a view of its own; until then it refuses and says so."
group = "Views"
effect = "mutating"
toggle = true

[[actions]]
id = "STUDIO_VIEWS_EDITOR"
name = "Show Editor"
description = "The MIDI editor: opened or focused as a pane. Needs Studio's engine (the Full layer); until it runs here, it refuses and says so."
group = "Views"
effect = "mutating"
toggle = true

[[actions]]
id = "STUDIO_VIEWS_FOLLOW"
name = "Views: follow the focus"
description = "Lights the Views toolbar's button of the view the workspace has focused (and only it): run on every workspace.changed. Answers the focused view and the button lit."
group = "Views"
effect = "read_only"

# The Views toolbar: the bottom of the window (the owner's placement,
# studio#409): the owner's six, and no others.
[[toolbars]]
id = "views"
title = "Views"
where = "dock:bottom"

[[toolbars.items]]
action = "STUDIO_VIEWS_ARRANGEMENT"
icon = "layout-dashboard"
label = "Arrangement"

[[toolbars.items]]
action = "STUDIO_VIEWS_MIXER"
icon = "sliders-horizontal"
label = "Mixer"

[[toolbars.items]]
action = "STUDIO_VIEWS_CHART"
icon = "file"
label = "Chart"

[[toolbars.items]]
action = "STUDIO_VIEWS_CHART_EDITOR"
icon = "code"
label = "Chart Editor"

[[toolbars.items]]
action = "STUDIO_VIEWS_PROGRESS"
icon = "clock"
label = "Progress Bar"

[[toolbars.items]]
action = "STUDIO_VIEWS_EDITOR"
icon = "music"
label = "Editor"

# Which button is lit follows the workspace's focus.
[[hooks]]
on = "workspace.changed"
action = "STUDIO_VIEWS_FOLLOW"

[[hooks]]
on = "startup"
action = "STUDIO_VIEWS_FOLLOW"
