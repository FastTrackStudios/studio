[package]
name = "kontrol"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Native Instruments Komplete Kontrol keyboard driver — MIDI output helpers and Light Guide (per-key RGB LED) control on Linux. Native-only hardware I/O; speaks midicore MidiEvent types over a midir output port."

[dependencies]
# MidiEvent types + byte codec AND the OS MIDI backend for OUTPUT, via the
# `midir` feature (`midicore::midir::MidiOutput`). midicore owns the raw midir
# plumbing now, so this crate no longer depends on midir directly. midicore
# pins the same workspace midir (0.11, default ALSA backend), so only one midir
# / alsa-sys shows up here; pipewire hosts see the ALSA-seq ports via the
# pipewire ALSA-seq bridge.
midicore = { workspace = true, features = ["midir"] }
# The Light Guide is a HID output report (report 0x82 on the MK3's HID
# interface), NOT bulk USB or MIDI — CONFIRMED on an S88 MK3, see
# docs/protocol.md. hidapi (hidraw on Linux) is the path to the LEDs; it
# coexists with the kernel usbhid/audio drivers so MIDI is undisturbed.
hidapi.workspace = true
# Raw USB bulk — the two color SCREENS are driven by bulk transfer on the
# vendor interface (endpoint 0x04), a separate path from the HID Light Guide.
rusb.workspace = true
eyre.workspace = true
tracing.workspace = true

[features]
default = []
