[package]
name = "fts-launcher"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "FastTrackStudios launcher for Reaper — audio production workflow launcher"
repository = "https://github.com/FastTrackStudios/FastTrackStudio"

[lib]
name = "fts_launcher"
path = "src/lib.rs"

[[bin]]
name = "fts-launcher-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["native"]
native = ["daw/reaper-ui"]
desktop = []
standalone = ["native", "dep:winit", "dep:tracing-subscriber"]

[dependencies]
# Core launcher engine and UI, vendored into the architect repo as
# architect-launcher-* (was launcher-core / launcher-ui / providers on
# dioxus-launcher.git). This crate is now just the REAPER DawModule glue.
#
# The old git deps were unfixable after the four-repo split: launcher-ui
# wanted a crate literally named `fts-ui`, and a [patch] cannot rename a
# crate, so it pulled a stale Codeberg fts-ui with its own dioxus.
architect-launcher-core = { workspace = true }
architect-launcher-ui = { workspace = true }
architect-launcher-providers = { workspace = true }
architect-ui = { workspace = true }

# Dioxus native renderer (Blitz) — workspace-pinned rev (one blitz tree-wide)
dioxus-native = { workspace = true }

# DAW API (safe Rust, async, generic)
daw = { workspace = true }
reaper-high = { workspace = true }
reaper-medium = { workspace = true }

# Standalone binary deps (optional)
winit = { version = "=0.31.0-beta.2", optional = true }
tracing-subscriber = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
facet = { workspace = true }
facet-styx = { workspace = true }

# Logging
tracing = { workspace = true }

[lints]
workspace = true
