[package]
name = "signal-widgets"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared Blitz-safe Dioxus widgets for signal rig UIs — knob, arc geometry"

[lints]
workspace = true

[dependencies]
signal-proto.workspace = true
dioxus.workspace = true
# `platform::sleep` — the switches' hold timer, native and wasm alike.
architect = { workspace = true, features = ["platform"] }

# The piano's native paint (Vello through baseview); on wasm it draws without.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plugin-core = { workspace = true, optional = true, features = ["gui"] }
nice-plug-dioxus = { workspace = true, optional = true }

[features]
# The piano keyboard + waterfall the rigs share (signal_widgets::piano).
piano = ["dep:plugin-core", "plugin-core?/gui", "dep:nice-plug-dioxus"]

[dev-dependencies]
# Headless Blitz: presses hit-tested and delivered as the app gets them.
dioxus-test.workspace = true
tokio.workspace = true
