[package]
name = "signal-space"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The sound space: its wire types (always) and the analysis engine that lays sounds out by similarity (`engine`)"

[lints]
workspace = true

[features]
default = ["vox"]
engine = ["architect/rig", "architect/vox", "dep:bhtsne", "dep:fts-sample", "dep:rayon", "dep:realfft", "dep:serde", "dep:serde_json", "dep:tracing", "dep:walkdir", "vox"]
vox = ["architect/vox", "dep:vox"]

[dependencies]
architect = { workspace = true }
bhtsne = { version = "0.5", optional = true }
facet = { workspace = true }
fts-sample = { workspace = true, features = ["load"], optional = true }
rayon = { version = "1.10", optional = true }
realfft = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tracing = { workspace = true, optional = true }
vox = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[[example]]
name = "disc"
path = "examples/disc.rs"
required-features = ["engine"]

[[example]]
name = "space_cli"
path = "examples/space_cli.rs"
required-features = ["engine"]
