[package]
name = "input-config-proto"
version = "0.1.0"
edition = "2024"
license.workspace = true

# Wire contract for keybind/workflow configuration: the facet/styx config
# types (profiles, sections, overlays, workflows) extracted from
# reaper-input, plus the InputConfigService vox trait that exposes config
# editing over RPC. wasm-clean — web editors, the site, and the hub all
# depend on this crate, never on reaper-input.

[dependencies]
facet.workspace = true
vox.workspace = true

[lints]
workspace = true
